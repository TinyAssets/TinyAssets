name: rclone
description: >-
  rclone, pinned by its release zip's SHA-256, checked before it is unzipped, and put on the
  job's PATH: for the off-account copy's nights and drills (offsite-copy.yml) and its copy back
  (platform-deploy.yml, mode copyback). The one pin of it (platform/deploy/offsite.ts).
runs:
  using: composite
  steps:
    - name: Install rclone, pinned by its digest
      shell: bash
      env:
        RCLONE: v1.75.2
        RCLONE_SHA256: 349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702
      run: |
        set -euo pipefail
        zip="rclone-${RCLONE}-linux-amd64.zip"
        curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${zip}" "https://downloads.rclone.org/${RCLONE}/${zip}"
        echo "${RCLONE_SHA256}  ${RUNNER_TEMP}/${zip}" | sha256sum -c -
        unzip -q -j -d "${RUNNER_TEMP}/rclone" "${RUNNER_TEMP}/${zip}" "rclone-${RCLONE}-linux-amd64/rclone"
        echo "${RUNNER_TEMP}/rclone" >> "${GITHUB_PATH}"
