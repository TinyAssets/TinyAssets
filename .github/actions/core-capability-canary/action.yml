name: Core capability canary
description: Observe production capabilities. Not-provisioned warns and does not roll back; deploy_fail_safe refuses a data-moving deploy when the canary is not provisioned. Other rows stay advisory. A red public canary still rolls back.
inputs:
  email:
    description: Canary owner sign-in email
    required: false
  password:
    description: Canary owner password
    required: false
  hmac-key:
    description: Key of the canary signing service, to check its replies
    required: false
  service-url:
    description: Canary signing service base URL (repo variable; not a secret)
    required: false
  health-token:
    description: Protected pulse token
    required: false
  github-token:
    description: Incident writer token
    required: false
  pushover-user:
    description: Notification recipient
    required: false
  pushover-token:
    description: Notification application token
    required: false
runs:
  using: composite
  steps:
    - name: Install pinned canary client
      shell: bash
      run: pip install fastmcp==3.2.0 httpx==0.28.1 pillow==12.1.1 playwright==1.58.0
    # Until the dedicated owner is provisioned the probe only reports
    # canary_not_provisioned, so skip the browser install (~1.5 runner-minutes a run).
    - name: Install browser
      if: inputs.email != ''
      shell: bash
      run: python -m playwright install --with-deps chromium
    - name: Probe all capabilities and daemon failure rates
      id: probe
      shell: bash
      env:
        TINYASSETS_CANARY_EMAIL: ${{ inputs.email }}
        TINYASSETS_CANARY_PASSWORD: ${{ inputs.password }}
        TINYASSETS_CANARY_HMAC_KEY: ${{ inputs.hmac-key }}
        TINYASSETS_CANARY_SERVICE_URL: ${{ inputs.service-url }}
        TINYASSETS_WIKI_CANARY_TOKEN: ${{ inputs.health-token }}
      run: python scripts/core_capability_live.py --report core-capabilities-live.json
    - name: Reconcile incident and notification
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PUSHOVER_USER_KEY: ${{ inputs.pushover-user }}
        PUSHOVER_APP_TOKEN: ${{ inputs.pushover-token }}
      run: python scripts/core_capability_alert.py core-capabilities-live.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: core-capabilities-live
        path: core-capabilities-live.json
        if-no-files-found: warn
