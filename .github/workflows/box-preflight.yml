name: Box preflight on production

# Manual quiet-window host measurement. Uses the deploy SSH secret from the
# main-only `production` environment, creates no cloud resource, and publishes
# aggregate gate numbers only.
#
# Host contract: this job opens one ssh connection whose remote command is a
# fixed literal: signal the harness deploy-prod installed (boxhostd.service, which
# runs the gates from /opt/tinyassets), wait for its result file and print it.
# Nothing from this checkout reaches the host, so a dispatch from a branch can
# execute nothing but what main already shipped.
# tests/test_workflow_production_environment.py enforces both halves.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-host-mutation
  cancel-in-progress: false

jobs:
  measure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      DO_DROPLET_HOST: ${{ secrets.DO_DROPLET_HOST }}
      DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${DO_DROPLET_HOST:?}"
          : "${DO_SSH_USER:?}"
          : "${SSH_KEY:?}"
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/do_deploy
          chmod 600 ~/.ssh/do_deploy
          ssh-keyscan -t ed25519,rsa "$DO_DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run G1 G3 G4 G6 inside boxhostd
        id: gates
        timeout-minutes: 40
        run: |
          set -euo pipefail
          # One connection, one single-quoted literal: nothing from this checkout can
          # reach the host. The remote side signals boxhostd.service, waits for its
          # result file and prints it; that file is the only thing that comes back.
          status=0
          ssh -n -i ~/.ssh/do_deploy -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6 "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
              'sudo systemctl is-active --quiet boxhostd.service && sudo rm -f /run/tinyassets-boxhostd/preflight.json && sudo systemctl kill --kill-who=main -s USR1 boxhostd.service && for _ in $(seq 1 240); do sudo test -s /run/tinyassets-boxhostd/preflight.json && break; sleep 10; done && sudo cat /run/tinyassets-boxhostd/preflight.json' > box-preflight-results.json || status=$?
          if [ ! -s box-preflight-results.json ]; then
            printf '%s\n' "{\"pass\":false,\"reason\":\"boxhostd.service inactive or no result within 40 minutes; exit ${status}\"}" > box-preflight-results.json
            exit 1
          fi
          python3 -m json.tool box-preflight-results.json >/dev/null
          python3 -c 'import json; assert json.load(open("box-preflight-results.json"))["pass"] is True'

      - name: Gate summary
        if: always()
        run: |
          python3 scripts/box_preflight_summary.py box-preflight-results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: box-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: box-preflight-results.json
          if-no-files-found: warn
          retention-days: 30
