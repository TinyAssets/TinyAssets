name: iOS build

# Compile-checks the iOS Capacitor app on a macOS runner. Like the web app,
# product logic lives in the live SPA the shell
# wraps, so a new build is only needed when the native shell/config changes.
#
# This builds UNSIGNED for the simulator to verify the project compiles — no
# Apple credentials required. A signed .ipa for TestFlight / App Store is a
# separate step that needs the founder's Apple Developer signing assets
# (certificate + provisioning profile) and App Store Connect API key; see
# docs/ops/app-store-launch.md. Mirrors android-build.yml's read-only shape.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to compile (use the shipped build SHA for store screenshots)
        required: false
        type: string
      capture_store_screenshots:
        description: Capture and validate required App Store screenshots
        required: false
        default: false
        type: boolean
      review_video_proof:
        description: Build review packages and run the production UI journey (no AWS calls)
        type: boolean
        default: false
      review_video_compile_only:
        description: Compile review UI tests without accessing app-store or running AWS
        type: boolean
        default: false
  push:
    branches: [main, feat/ios-app]
    paths:
      - "mobile/**"
      - ".github/workflows/ios-build.yml"
      - ".github/workflows/ios-release.yml"
  # No `pull_request` trigger (2026-09-27 lean pipeline): no platform builds on
  # PRs. The main push above still builds every change that lands; a PR that
  # changes the native shell can run this via workflow_dispatch on its branch.
  # docs/design-notes/2026-09-27-lean-ci-pipeline.md

permissions:
  contents: read

jobs:
  review-video-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.review_video_proof && !inputs.review_video_compile_only
    uses: ./.github/workflows/ios-review-video.yml
    with:
      dry_run: true
    secrets: inherit

  build-ios:
    if: ${{ !inputs.review_video_proof || inputs.review_video_compile_only }}
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Check out screenshot tooling separately from the app source
        if: github.event_name == 'workflow_dispatch' && inputs.capture_store_screenshots
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          path: .capture-tools
          sparse-checkout: mobile/scripts/capture_ios_store_screenshots.sh
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Select App Store-required Xcode 26
        run: |
          set -euo pipefail
          developer_dir="/Applications/Xcode_26.3.app/Contents/Developer"
          test -d "$developer_dir" || {
            echo "::error::required Xcode 26.3 is not installed on the macos-15 runner"
            exit 1
          }
          sudo xcode-select -s "$developer_dir"
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          [[ "$sdk_version" == 26.* ]] || {
            echo "::error::App Store uploads require the iOS 26 SDK; selected $sdk_version"
            exit 1
          }
          xcodebuild -version

      - name: Install JS deps (lockfile-pinned)
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Add + sync iOS platform
        working-directory: mobile
        run: |
          npx --no-install cap add ios
          npx --no-install cap sync ios

      - name: Register iOS OAuth return + microphone purpose
        working-directory: mobile
        run: |
          python3 scripts/add_ios_scheme.py
          grep -q "<string>tinyassets</string>" ios/App/App/Info.plist
          grep -q "<key>NSMicrophoneUsageDescription</key>" ios/App/App/Info.plist
          grep -q "<key>ITSAppUsesNonExemptEncryption</key>" ios/App/App/Info.plist

      - name: Install the app icon + splash (fail closed on template drift)
        working-directory: mobile
        run: python3 scripts/add_ios_assets.py

      - name: Compile-check (unsigned, simulator)
        working-directory: mobile/ios/App
        run: |
          set -euo pipefail
          # Capacitor 8 wires plugins through Swift Package Manager whenever
          # every plugin ships a Package.swift, so `cap sync ios` writes
          # Package.swift and never runs `pod install` -- there is no
          # .xcworkspace to build. Prefer the project, and fall back to a
          # workspace only if a CocoaPods integration reappears.
          target=(-project App.xcodeproj)
          if [ -d App.xcworkspace ]; then target=(-workspace App.xcworkspace); fi
          xcodebuild \
            "${target[@]}" \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/TinyAssetsDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -40

      - name: Compile the review UI test for Simulator and physical iPhone
        if: github.event_name == 'workflow_dispatch' && inputs.review_video_compile_only
        run: bash mobile/scripts/build_review_tests.sh

      - name: Verify signed-out Simulator launch without reviewer credentials
        if: github.event_name == 'workflow_dispatch' && inputs.review_video_compile_only
        run: |
          bash mobile/scripts/run_review_simulator.sh --launch-only
          python3 -m pip install --disable-pip-version-check 'opencv-python-headless==4.11.0.86'
          python3 mobile/scripts/verify_review_video.py "$RUNNER_TEMP/review-simulator/simulator-proof.mp4" "$RUNNER_TEMP/review-simulator"

      - name: Capture authentic App Store screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.capture_store_screenshots
        run: |
          .capture-tools/mobile/scripts/capture_ios_store_screenshots.sh \
            "$RUNNER_TEMP/TinyAssetsDerivedData/Build/Products/Debug-iphonesimulator/App.app" \
            "$RUNNER_TEMP/ios-store-screenshots"

      - name: Upload validated App Store screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.capture_store_screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-store-screenshots-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-store-screenshots/*.jpg
          if-no-files-found: error
          retention-days: 7
