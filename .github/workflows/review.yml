name: review

# The `review` check: the latest trusted PR review's verdict, on the PR's head.
#
# The reviewer posts a PR review on the commit it read (`commit_id`, event COMMENT),
# its body's first non-blank line exactly `APPROVE` or `BLOCK`, the evidence below.
# This workflow turns that into a check run named `review` on the head
# (scripts/drain_review_gate.py `review_check`):
#
#   no verdict                         -> in progress, "waiting for review of <head>"
#   BLOCK that carries to the head     -> failure
#   APPROVE at A, carries(A, head)     -> success, naming A and why it carries
#   anything else                      -> in progress: the delta needs a review
#
# `carries` is the same change, or a delta of Markdown prose only. Only reviews
# submitted after the PR's last base change count: a retarget changes what was read.
#
# WHO MAY POST IT. Any workflow job's own check run reports as the GitHub Actions
# app, so a PR adding a job named `review` would satisfy a context pinned to it. The
# check is therefore created only by the review GitHub App (`vars.REVIEW_APP_ID`),
# whose private key is a secret of the `review` environment, deployable from `main`
# alone; the ruleset pins the `review` context to that App as its expected source,
# which GitHub enforces. pull_request_target and workflow_run both run on the
# default branch, so they reach the environment; no PR's own workflow can. Every run
# names its PR (`external_id`), since a check run lives on a commit two PRs may share.
#
# Triggers, all the default branch's copy of this file:
#   * pull_request_target on a new head, or an edit (a retarget among them);
#   * workflow_run of review-signal.yml (a review; that file has no permissions,
#     because pull_request_review runs the PR's own copy), checked against the
#     signal run's own branch so one PR's copy cannot decide another PR;
#   * workflow_run of review-queue.yml (a merge group; same reason): the group's
#     `review` is its PR decided afresh at its head, posted on the group.
# Nothing here checks out or executes the PR's code: the checkout is the default
# branch, and the PR's commits are only read as git objects for `carries`.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  workflow_run:
    workflows: [review-signal, "review (merge queue)"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  # The signals' artifacts.
  actions: read

jobs:
  resolve:
    name: resolve the PR
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'pull_request_review' ||
        github.event.workflow_run.event == 'merge_group'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      kind: ${{ steps.pr.outputs.kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Read which PR was reviewed
        if: github.event.workflow_run.event == 'pull_request_review'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: review-signal
          path: ${{ runner.temp }}/signal
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: The PR, from the event or a verified signal
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${EVENT_PR:-}" ]; then
            PR="$EVENT_PR"; KIND="pr"
          elif [ "$RUN_EVENT" = merge_group ]; then
            PR="$(python -c 'import sys; from scripts.drain_review_gate import queued_pr; print(queued_pr(sys.argv[1]) or "")' "$RUN_BRANCH")"
            KIND="queue"
          else
            PR="$(python scripts/drain_review_gate.py --signal-pr \
              --signal-file "$RUNNER_TEMP/signal/pr" --repo "$REPO" \
              --run-repo "$RUN_REPO" --run-branch "$RUN_BRANCH")"
            KIND="pr"
          fi
          if ! [[ "$PR" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "::error::no PR to decide"
            exit 1
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

  decide:
    name: decide review
    needs: resolve
    # Until the founder has made the review App, there is no key to mint a token with:
    # decide nothing, and name no environment, which GitHub would otherwise make with
    # no branch policy.
    if: vars.REVIEW_APP_ID != ''
    environment: review
    # One decision at a time per PR and kind. A running decision is never cancelled,
    # but GitHub replaces a pending one in the same group with the newest: safe within
    # a kind, since the newest reads the PR as it is then. The kind is in the group so
    # that a merge group's decision never replaces a pending decision of the PR's head
    # (a BLOCK's, say), and the reverse.
    concurrency:
      group: review-${{ github.repository }}-${{ needs.resolve.outputs.kind }}-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the trusted decision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # Commits and trees, no file contents: enough for merge bases and
          # `git diff --raw`, which is all `carries` reads.
          fetch-depth: 0
          filter: blob:none

      - name: The review App's token (the only identity that may post `review`)
        id: app
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Decide and post the review check
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          REVIEW_APP_ID: ${{ vars.REVIEW_APP_ID }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.resolve.outputs.pr }}
          KIND: ${{ needs.resolve.outputs.kind }}
          GROUP_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # One App run per (commit, PR) while it is in progress: a decision takes the
          # App's newest `review` run for this PR on this commit back to "deciding" when
          # that run is still in progress (waiting or deciding), and POSTs a new run
          # otherwise. A completed run is never PATCHed: GitHub does not document
          # reopening one, and if it answers 200 while leaving it frozen, an APPROVE's
          # pass would outlive a later BLOCK. Readers take the highest id, so the new
          # run is the one that counts. That same run (RUN_ID) then takes the verdict.
          # Every PATCH is checked against GitHub's answer: a reopen that did not take
          # posts a new run; a verdict that did not take fails the decision, and the
          # trap completes the run as a failure on any exit before the verdict.
          as_app() { GH_TOKEN="$APP_TOKEN" gh api "$@"; }
          if ! [[ "$REVIEW_APP_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::REVIEW_APP_ID is not an App id"
            exit 1
          fi
          # PATCH run $1 with file $2; succeed only if GitHub's answer has the status
          # and conclusion that were sent.
          patch_run() {
            local want got
            want="$(jq -r '"\(.status) \(.conclusion // "")"' "$2")"
            got="$(as_app -X PATCH "repos/${REPO}/check-runs/$1" --input "$2" \
              --jq '"\(.status) \(.conclusion // "")"')" || return 1
            [ "$got" = "$want" ]
          }
          RUN_ID=""
          DONE=0
          on_exit() {
            local status=$?
            if [ "$DONE" != 1 ] && [ -n "$RUN_ID" ]; then
              [ "$status" != 0 ] || status=1
              jq -n '{status: "completed", conclusion: "failure", output: {title: "could not decide",
                summary: "review.yml stopped before its verdict; see its log, then rerun it."}}' \
                > "$RUNNER_TEMP/failed.json"
              patch_run "$RUN_ID" "$RUNNER_TEMP/failed.json" \
                || echo "::error::could not complete check run ${RUN_ID} as a failure"
            fi
            exit "$status"
          }
          trap on_exit EXIT
          # The App's newest `review` run for external id $2 on commit $1 when it is
          # still in progress; nothing when there is none or it has completed.
          existing() {
            as_app --paginate "repos/${REPO}/commits/$1/check-runs?check_name=review&filter=all&per_page=100" \
                --jq '.check_runs[]' \
              | jq -rs --argjson app "$REVIEW_APP_ID" --arg ext "$2" \
                  'map(select(.app.id == $app and .external_id == $ext)) | max_by(.id)
                   | select(. != null and .status != "completed") | .id'
          }
          start() {
            if ! [[ "$1" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::not a commit: $1"
              exit 1
            fi
            jq -n --arg sha "$1" --arg id "$2" '{name: "review", head_sha: $sha,
              external_id: $id, status: "in_progress",
              output: {title: "deciding", summary: "review.yml is reading the reviews."}}' \
              > "$RUNNER_TEMP/deciding.json"
            jq 'del(.name, .head_sha)' "$RUNNER_TEMP/deciding.json" > "$RUNNER_TEMP/reopen.json"
            local found=""
            if ! found="$(existing "$1" "$2")"; then
              # Unknown is not none, but a stale pass must not stand: post a fresh run,
              # which readers take as the newest.
              echo "::warning::could not list the review runs on $1; posting a new one"
              found=""
            fi
            if [[ "$found" =~ ^[1-9][0-9]*$ ]] && patch_run "$found" "$RUNNER_TEMP/reopen.json"; then
              RUN_ID="$found"
              return 0
            fi
            [ -z "$found" ] || echo "::warning::check run ${found} did not take \"deciding\"; posting a new one"
            # A failed POST is retried; if it still fails there is no run to fail, so
            # the decision exits non-zero; the next event decides again, and a merge
            # group decides the PR afresh whatever its own runs say.
            local attempt
            for attempt in 1 2 3; do
              if RUN_ID="$(as_app -X POST "repos/${REPO}/check-runs" --input "$RUNNER_TEMP/deciding.json" --jq .id)" \
                  && [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
                return 0
              fi
              RUN_ID=""
              echo "::warning::posting the deciding check run failed (attempt ${attempt} of 3)"
              [ "$attempt" = 3 ] || sleep "$attempt"
            done
            echo "::error::could not post the deciding check run"
            exit 1
          }
          finish() {
            jq 'del(.name, .head_sha)' "$RUNNER_TEMP/run.json" > "$RUNNER_TEMP/verdict.json"
            if ! patch_run "$RUN_ID" "$RUNNER_TEMP/verdict.json"; then
              echo "::error::check run ${RUN_ID} did not take the verdict"
              exit 1
            fi
            DONE=1
          }

          # The PR's head and base as they are now, from the API, never from the event.
          read -r HEAD BASE < <(gh api "repos/${REPO}/pulls/${PR}" --jq '"\(.head.sha) \(.base.sha)"')
          if ! [[ "$HEAD" =~ ^[0-9a-f]{40}$ && "$BASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::PR #${PR} has no head or base"
            exit 1
          fi
          if [ "$KIND" = queue ]; then
            # A merge group's `review` decides the PR afresh, from its reviews and
            # timeline at its current head, never from the PR's own `review` runs: a
            # BLOCK whose own decision has not landed, or never could, still fails it.
            start "$GROUP_SHA" "queue-pr-${PR}"
            GROUP=(--group-sha "$GROUP_SHA")
          else
            start "$HEAD" "pr-${PR}"
            GROUP=()
          fi

          gh api --paginate "repos/${REPO}/pulls/${PR}/reviews?per_page=100" --jq '.[]' \
            | jq -s . > "$RUNNER_TEMP/reviews.json"
          gh api --paginate "repos/${REPO}/issues/${PR}/timeline?per_page=100" --jq '.[]' \
            | jq -s . > "$RUNNER_TEMP/timeline.json"

          # The base, the head and every commit a review names, as git objects only.
          # One that cannot be fetched does not carry.
          for sha in "$BASE" "$HEAD" $(jq -r '.[].commit_id // empty' "$RUNNER_TEMP/reviews.json" | sort -u); do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || continue
            git cat-file -e "${sha}^{commit}" 2> /dev/null \
              || git fetch -q --no-tags --filter=blob:none origin "$sha" \
              || echo "::warning::could not fetch ${sha}"
          done

          python scripts/drain_review_gate.py --review-check \
            --reviews-file "$RUNNER_TEMP/reviews.json" \
            --timeline-file "$RUNNER_TEMP/timeline.json" --pr "$PR" \
            --base "$BASE" --head "$HEAD" "${GROUP[@]}" > "$RUNNER_TEMP/run.json"
          finish
          jq -r '"review for #'"$PR"' at \(.head_sha): \(.status) \(.conclusion // "") \(.output.title)"' \
            "$RUNNER_TEMP/run.json" | tee -a "$GITHUB_STEP_SUMMARY"
