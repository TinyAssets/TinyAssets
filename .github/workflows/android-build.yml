name: Android debug APK

# Builds a sideloadable debug APK on GitHub's runners (JDK 17 + Android SDK
# pre-installed) and, on main, publishes it to the android-latest GitHub release
# as a DEVELOPER build (releases/download/android-latest/app-debug.apk). The
# website sends people to Google Play, not here. (The Play-store .aab is a
# separate, release-keystore-signed build - see mobile/README.md.)
#
# Identity: this APK installs as io.tinyassets.app.debug, "TinyAssets (debug)"
# (configure_android_release.py). It is signed with a development key, so if it
# shared the Play package every Play update would fail with "Can't install" on
# any phone that sideloaded it (2026-10-01). The badging step below fails the
# build if the APK ever carries the Play package again.
#
# Shape (Codex review 2026-08-21): the build job is READ-ONLY - no git
# credentials persist into the checkout, dependencies come from the lockfile
# via `npm ci`, and repository write authority exists only in the small publish
# job that merely uploads the already-built artifact. Signing uses a STABLE
# debug keystore restored from a secret: with the runner's throwaway debug key
# every build would carry a different signature and a new APK could not install
# over the previous one (the user would have to uninstall first).

on:
  push:
    branches: [main, feat/android-app]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  # No `pull_request` trigger (2026-09-27 lean pipeline): no platform builds on
  # PRs. The main push above still builds every change that lands; a PR that
  # changes the native shell can run this via workflow_dispatch on its branch.
  # docs/decisions/ADR-020-lean-ci-successor.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JS deps (lockfile-pinned)
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Add + sync Android platform
        working-directory: mobile
        run: |
          npx --no-install cap add android
          npx --no-install cap sync android

      - name: Register the tinyassets:// deep link (in-app OAuth return)
        working-directory: mobile
        run: |
          python3 scripts/add_app_scheme.py
          grep -n 'android:scheme="tinyassets"' android/app/src/main/AndroidManifest.xml
          grep -n 'LocalCallbackService' android/app/src/main/AndroidManifest.xml
          grep -n 'FOREGROUND_SERVICE_DATA_SYNC' android/app/src/main/AndroidManifest.xml

      - name: Install the launcher icon + splash (pre-rendered, no image toolchain in CI)
        working-directory: mobile
        run: python3 scripts/add_app_icons.py

      - name: Apply version + verify Android release identity, SDK, manifest and artwork
        working-directory: mobile
        run: |
          python3 scripts/configure_android_release.py
          python3 scripts/verify_android_release.py

      - name: Restore the stable debug signing key (main only)
        # Android's debug signing config reads ~/.android/debug.keystore
        # (alias androiddebugkey, store/key password "android"). Restoring the
        # same keystore every build keeps the APK signature constant so updates
        # install over prior installs. The key is exposed ONLY to main builds
        # (feature-branch builds sign with the runner's throwaway key and are
        # never published), and a main build FAILS CLOSED if the secret is
        # missing or the restored certificate is not the expected one - a
        # throwaway-signed APK must never reach the release asset.
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
          EXPECTED_SHA256: "9E:DF:90:E1:83:8A:89:52:F1:B4:1B:3B:36:16:72:20:70:96:27:E9:52:8D:43:E7:94:41:DE:09:F1:F8:50:96"
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_B64 is not set - refusing to publish a throwaway-signed APK"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          actual="$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/ {print $2; exit}')"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::restored keystore certificate fingerprint mismatch ($actual)"
            exit 1
          fi
          echo "stable debug keystore restored (fingerprint verified)"

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify the APK is a separate install from the Play app
        working-directory: mobile
        run: |
          set -euo pipefail
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          [ -n "$aapt2" ] || { echo "::error::no aapt2 under $ANDROID_HOME/build-tools"; exit 1; }
          "$aapt2" dump badging android/app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/badging.txt"
          grep -E "^(package|application-label):" "$RUNNER_TEMP/badging.txt"
          python3 scripts/verify_android_release.py --apk-badging "$RUNNER_TEMP/badging.txt" --variant debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tinyassets-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish-apk:
    # Only the built artifact crosses into this job; the checkout, node_modules
    # and Gradle never run with write authority.
    if: github.ref == 'refs/heads/main'
    needs: build-debug-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: android-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tinyassets-android-debug-apk
          path: dist

      - name: Publish APK to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: >-
            Developer build from main: installs as io.tinyassets.app.debug ("TinyAssets (debug)"),
            separately from the Google Play app. To use TinyAssets on Android, install it from
            Google Play: https://play.google.com/apps/testing/io.tinyassets.app
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "TinyAssets Android (debug)" --notes "$NOTES"
          fi
          # Notes only: the release also carries the Play foreground-service
          # evidence video, which Play's declaration links - never touch assets
          # other than app-debug.apk here.
          gh release edit "$RELEASE_TAG" --notes "$NOTES"
          gh release upload "$RELEASE_TAG" dist/app-debug.apk --clobber
          echo "published app-debug.apk to release $RELEASE_TAG"
