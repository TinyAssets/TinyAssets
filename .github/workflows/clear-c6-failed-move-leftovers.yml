name: Clear C6 failed-move leftovers (one-shot)

# Founder-approved 2026-10-16: delete the two leftovers of the failed C6 box
# moves (2026-10-16 ~02:10Z and ~05:00Z, both restored):
#   1. /var/lib/boxhostd/owners/300001: a 1.4 GB partial owner tree the
#      restore retained in the box store. The clean-shape cutover requires an
#      empty store.
#   2. /var/lib/docker/volumes/tinyassets-data/.tinyassets-restore-old.YGbAUk:
#      the 3.7 GB pre-restore copy backup-restore.sh kept, on a root disk at
#      89% that the cutover needs for its image pull.
# Production serves the restored _data volume and has never committed a box
# move (layout marker: owner-split, no box_layout), so neither path is live.
#
# Precondition: deploy-prod.yml is disabled. Today these two leftovers are what
# stop an automatic deploy of main from applying the live box move (the
# non-empty store refuses it; the full disk fails pull headroom). Deleting them
# without an explicit hold would arm the next merge to deploy C6 live.
# Safe to re-run: it refuses unless the marker parses as stable owner-split,
# uid 300001 has no box_records row, the store is the XFS mount and no path
# component is a link. A follow-up PR deletes it right after the run.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: delete-c6-failed-move-leftovers'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-host-mutation
  cancel-in-progress: false

jobs:
  clear:
    # The lead dispatches from the founder's account.
    if: >-
      github.ref == 'refs/heads/main' && github.actor == 'Jonnyton'
      && inputs.confirm == 'delete-c6-failed-move-leftovers'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      DO_DROPLET_HOST: ${{ secrets.DO_DROPLET_HOST }}
      DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
    steps:
      - name: Require the deploy hold
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/${REPO}/actions/workflows/deploy-prod.yml" --jq .state)"
          if [ "$state" != "disabled_manually" ]; then
            echo "::error::deploy-prod.yml is '${state}'; disable it first so no deploy can apply the box move once the store is empty"
            exit 2
          fi

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${DO_DROPLET_HOST:?}"
          : "${DO_SSH_USER:?}"
          : "${SSH_KEY:?}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/do_deploy
          chmod 600 ~/.ssh/do_deploy
          ssh-keyscan -t ed25519,rsa "$DO_DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Delete exactly the two leftovers, after checking each one
        run: |
          set -euo pipefail
          # One connection under the deploy's own host-mutation flock. The
          # script is a quoted literal: nothing from the workflow inputs or the
          # checkout reaches the host.
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
            'sudo flock -w 60 /var/lock/tinyassets-host-mutation.lock bash -s' <<'HOST'
          set -euo pipefail
          VOLUME=/var/lib/docker/volumes/tinyassets-data
          STORE=/var/lib/boxhostd/owners
          MARKER="$VOLUME/_data/.layout.json"
          IDENTITIES="$VOLUME/_data/.broker/state/owner-identities.db"
          TREE="$STORE/300001"
          OLD="$VOLUME/.tinyassets-restore-old.YGbAUk"
          refuse() { echo "refuse: $*"; exit 2; }
          # Production still serves stable owner-split data: parsed, not grepped.
          python3 -c 'import json, sys
          doc = json.load(open(sys.argv[1]))
          ok = (isinstance(doc, dict) and doc.get("state") == "stable"
                and doc.get("box_layout", "owner-split") == "owner-split")
          sys.exit(0 if ok else 1)' "$MARKER" \
            || refuse "layout marker is not stable owner-split"
          # A real box always has a box_records row; the leftover never got one.
          python3 -c 'import sqlite3, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if not path.exists():
              sys.exit(0)
          db = sqlite3.connect(path.as_uri() + "?mode=ro", uri=True)
          table = db.execute("SELECT 1 FROM sqlite_master WHERE name=?", ("box_records",)).fetchone()
          row = table and db.execute("SELECT 1 FROM box_records WHERE machine=?", (300001,)).fetchone()
          sys.exit(1 if row else 0)' "$IDENTITIES" \
            || refuse "uid 300001 has a box_records row; that tree is a real box"
          # No component of either path may be a link, and each must sit on
          # the file system it is expected on.
          [ "$(findmnt -n -o FSTYPE --mountpoint "$STORE")" = xfs ] \
            || refuse "$STORE is not the XFS box-store mount"
          for target in "$TREE" "$OLD"; do
            if ! test -e "$target" && ! test -L "$target"; then
              echo "absent (already cleared?): $target"; continue
            fi
            [ "$(realpath -e -- "$target")" = "$target" ] || refuse "$target resolves through a link"
            test -d "$target" || refuse "$target is not a directory"
            echo "size: $(du -sh --one-file-system "$target" | cut -f1) $target"
          done
          if test -d "$TREE"; then
            [ "$(findmnt -n -o TARGET -T "$TREE")" = "$STORE" ] || refuse "$TREE is not on the box store"
          fi
          if test -d "$OLD"; then
            [ "$(dirname -- "$(realpath -e -- "$OLD")")" = "$VOLUME" ] \
              || refuse "$OLD is not directly in the tinyassets-data volume"
          fi
          echo "--- free space before"; df -h / "$STORE"
          for target in "$TREE" "$OLD"; do
            if test -d "$target" && ! test -L "$target"; then
              rm -rf --one-file-system -- "$target"
              if test -e "$target"; then echo "FAILED to remove $target"; exit 3; fi
              echo "removed: $target"
            fi
          done
          echo "--- free space after"; df -h / /var/lib/boxhostd/owners
          echo "--- box store now:"; ls -la /var/lib/boxhostd/owners
          HOST
