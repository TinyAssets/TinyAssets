name: Clear C6 failed-move leftovers (one-shot)

# Founder-approved 2026-10-16: delete the two leftovers of the failed C6 box
# moves (2026-10-16 ~02:10Z and ~05:00Z, both restored):
#   1. /var/lib/boxhostd/owners/300001: a 1.4 GB partial owner tree the
#      restore retained in the box store. The clean-shape cutover requires an
#      empty store.
#   2. /var/lib/docker/volumes/tinyassets-data/.tinyassets-restore-old.YGbAUk:
#      the 3.7 GB pre-restore copy backup-restore.sh kept, on a root disk at
#      89% that the cutover needs for its image pull.
# Production serves the restored _data volume and has never committed a box
# move (layout marker: owner-split, no box_layout), so neither path is live.
# This workflow is deleted once it has run.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: delete-c6-failed-move-leftovers'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-host-mutation
  cancel-in-progress: false

jobs:
  clear:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'delete-c6-failed-move-leftovers'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      DO_DROPLET_HOST: ${{ secrets.DO_DROPLET_HOST }}
      DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
    steps:
      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${DO_DROPLET_HOST:?}"
          : "${DO_SSH_USER:?}"
          : "${SSH_KEY:?}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/do_deploy
          chmod 600 ~/.ssh/do_deploy
          ssh-keyscan -t ed25519,rsa "$DO_DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Delete exactly the two leftovers, after checking each one
        run: |
          set -euo pipefail
          # One connection, one single-quoted literal: nothing from the
          # workflow inputs or the checkout reaches the host.
          ssh -n -i ~/.ssh/do_deploy -o BatchMode=yes "${DO_SSH_USER}@${DO_DROPLET_HOST}" '
            set -euo pipefail
            MARKER=/var/lib/docker/volumes/tinyassets-data/_data/.layout.json
            TREE=/var/lib/boxhostd/owners/300001
            OLD=/var/lib/docker/volumes/tinyassets-data/.tinyassets-restore-old.YGbAUk
            sudo test -f "$MARKER" || { echo "refuse: no layout marker"; exit 2; }
            if sudo grep -q "\"box_layout\"[[:space:]]*:[[:space:]]*\"owner-box\"" "$MARKER"; then
              echo "refuse: production has committed a box move; the owner tree may be live"; exit 2
            fi
            for target in "$TREE" "$OLD"; do
              if sudo test -L "$target"; then echo "refuse: $target is a symlink"; exit 2; fi
              if ! sudo test -d "$target"; then echo "absent (already cleared?): $target"; continue; fi
              echo "size: $(sudo du -sh --one-file-system "$target" | cut -f1) $target"
            done
            echo "--- free space before"; df -h / /var/lib/boxhostd/owners
            for target in "$TREE" "$OLD"; do
              if sudo test -d "$target" && ! sudo test -L "$target"; then
                sudo rm -rf --one-file-system -- "$target"
                if sudo test -e "$target"; then echo "FAILED to remove $target"; exit 3; fi
                echo "removed: $target"
              fi
            done
            echo "--- free space after"; df -h / /var/lib/boxhostd/owners
            echo "--- box store now:"; sudo ls -la /var/lib/boxhostd/owners
          '
