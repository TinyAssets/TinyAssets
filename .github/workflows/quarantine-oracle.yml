name: Quarantine oracle

# Why this exists
# ---------------
# `.github/known-failing-tests.txt` is written from Linux CI but drained from
# developer machines, and on Windows the local result is not evidence in EITHER
# direction:
#
#   - A test can SKIP locally (symlink creation needs a privilege Windows does
#     not grant) and FAIL on Linux. Reading the skip as "fine" put two real
#     bugs into an earlier wave of this drain.
#   - A test can PASS locally and still be a genuine Linux failure, because the
#     ledger is a Linux artifact. Unquarantining on a local green hands `main`
#     a red required gate — which blocks every open PR, not just yours.
#
# Both failure modes are silent. This job gives the drain a Linux oracle it can
# ask directly, instead of guessing and finding out at merge time.
#
# It is REPORT-ONLY and deliberately not required. It answers "what does this
# entry do on Linux?", which is a question, not a gate. `required-tests` remains
# the gate.
#
# Weekly it also runs the test inventory (scripts/test_inventory.py) against
# the latest CI junit and rewrites ONE issue, "Test suite inventory": expired or
# soon-expiring skips, ledger lines that pass or name deleted tests, dead
# imports, and what CI never executes. Dates are reported here and never
# enforced at merge time, so a calendar day cannot block an unrelated PR. An
# issue, not a docs/concerns file: a commit or PR authored by GITHUB_TOKEN
# triggers no workflows here, so it could never pass the required checks.

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      filter:
        description: 'Only entries whose node id contains this (blank = all)'
        required: false
        default: ''

permissions:
  contents: read
  # The weekly inventory reads other runs' junit and rewrites one issue.
  actions: read
  issues: write

concurrency:
  group: quarantine-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    name: Quarantine oracle
    runs-on: ubuntu-latest
    # Runs only the files holding ledger entries — a small fraction of the
    # ~12.8k-test surface — so this is minutes, not the 50 that `required-tests`
    # budgets. That speed is the point: it makes fix -> verify a loop the drain
    # can actually run, rather than one full-suite round trip per attempt.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          # The inventory dates every skip by git blame.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ask the oracle
        env:
          # Same isolation as the other test jobs: keep the suite off the real
          # repo tree and off any host state.
          TINYASSETS_DATA_DIR: ${{ runner.temp }}/ta-data-oracle
          FILTER: ${{ inputs.filter }}
        run: |
          mkdir -p "$TINYASSETS_DATA_DIR"
          # --run executes the quarantined files HERE rather than reading a CI
          # artifact, so this reports on the CURRENT branch. The script owns the
          # pytest invocation and the report.
          #
          # No `|| true` needed: the script exits 0 by design. A still-failing
          # quarantined test is the expected state, not an error — the report is
          # the deliverable, and making it fail the job would train people to
          # ignore it.
          python scripts/quarantine_oracle.py \
            --run \
            --filter "$FILTER" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Weekly test inventory
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.filter == '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p inv/junit
          # Evidence comes from MAIN only: the latest scheduled run carries
          # heavy-tests, the latest push run the six required shards. A
          # merge-group run may test a tree that never landed.
          pick() {
            gh run list -R "$REPO" --workflow tests.yml --branch main --event "$1" \
              --status completed --limit 1 --json databaseId,headSha,conclusion \
              -q '.[0] | "\(.databaseId) \(.headSha) \(.conclusion)"'
          }
          read -r heavy heavy_sha heavy_end <<< "$(pick schedule)" || true
          read -r push push_sha push_end <<< "$(pick push)" || true
          evidence=""
          if [ -n "${heavy:-}" ] && gh run download "$heavy" -R "$REPO" \
              -n junit-heavy-tests -D inv/junit/heavy; then
            evidence="heavy-tests run ${heavy} at ${heavy_sha} (${heavy_end})"
          else
            evidence="heavy-tests junit MISSING"
          fi
          if [ -n "${push:-}" ] && gh run download "$push" -R "$REPO" \
              -p 'junit-required-shard-*' -D inv/junit/required; then
            evidence="${evidence}; required shards run ${push} at ${push_sha} (${push_end})"
          else
            evidence="${evidence}; required-shard junit MISSING"
          fi
          echo "$evidence"
          python scripts/test_inventory.py --junit-dir inv/junit \
            --json inv/inventory.json --markdown inv/inventory.md
          {
            echo "Rewritten weekly by quarantine-oracle.yml (run ${GITHUB_RUN_ID}, tree ${GITHUB_SHA})."
            echo "CI evidence: ${evidence}. \"PASSES in CI\" below is from those runs,"
            echo "which may trail this tree; confirm before deleting a ledger line."
            echo
            head -c 60000 inv/inventory.md
          } > inv/issue.md
          title="Test suite inventory"
          number="$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" \
            --json number,title -q ".[] | select(.title == \"$title\") | .number" | head -1)"
          if [ -n "$number" ]; then
            gh issue edit "$number" -R "$REPO" --body-file inv/issue.md
          else
            gh issue create -R "$REPO" --title "$title" --body-file inv/issue.md
          fi
          cat inv/inventory.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-quarantine-oracle
          path: junit-quarantine.xml
          if-no-files-found: ignore

# Reading the result
# ------------------
#   FAILED   still failing on Linux — the entry is earning its place, and the
#            message is the one to fix against.
#   PASSED   STALE. `required-tests` fails the gate on a quarantined test that
#            passes, so these must come out of the ledger.
#   SKIPPED  skipped on Linux too — this oracle cannot decide it either.
#   NOT RUN  the node id no longer resolves (renamed or deleted test).
#
# For entries `required-tests` never runs at all, read the `junit-heavy-tests`
# artifact instead:
#     python scripts/quarantine_oracle.py --artifact junit-heavy-tests
