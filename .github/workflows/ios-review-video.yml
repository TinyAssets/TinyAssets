name: iOS App Review video

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build signed IPA and tests, prove on Simulator, stop before AWS
        type: boolean
        default: true
      marketing_version:
        type: string
        default: "1.0.0"
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: true
      marketing_version:
        type: string
        default: "1.0.0"

permissions:
  contents: read

concurrency:
  group: ios-review-video
  cancel-in-progress: false

jobs:
  signed-app:
    uses: ./.github/workflows/ios-release.yml
    with:
      marketing_version: ${{ inputs.marketing_version }}
      upload_to_testflight: false
    secrets: inherit

  build-runners:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Select release Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Generate the real Capacitor app
        working-directory: mobile
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install cap add ios
          npx --no-install cap sync ios
          python3 scripts/add_ios_scheme.py
          python3 scripts/add_ios_assets.py
      - name: Build Simulator and physical-device XCUITest runners
        run: bash mobile/scripts/build_review_tests.sh
      - name: Save credential-free Device Farm package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-review-tests
          path: ${{ runner.temp }}/review-tests.zip
          if-no-files-found: error
          retention-days: 7
      - name: Package Simulator build products
        run: |
          cd "$RUNNER_TEMP/review-iphonesimulator/Build/Products"
          zip -qry "$RUNNER_TEMP/review-simulator-products.zip" .
      - name: Save credential-free Simulator build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-review-simulator-products
          path: ${{ runner.temp }}/review-simulator-products.zip
          if-no-files-found: error
          retention-days: 1

  simulator:
    needs: build-runners
    runs-on: macos-15
    timeout-minutes: 35
    environment: app-store
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select release Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-review-simulator-products
          path: ${{ runner.temp }}/simulator-download
      - name: Restore Simulator build products
        run: |
          mkdir -p "$RUNNER_TEMP/review-iphonesimulator/Build/Products"
          unzip -q "$RUNNER_TEMP/simulator-download/review-simulator-products.zip" -d "$RUNNER_TEMP/review-iphonesimulator/Build/Products"
      - name: Exercise production on a fresh Simulator
        env:
          APP_STORE_REVIEW_USERNAME: ${{ secrets.APP_STORE_REVIEW_USERNAME }}
          APP_STORE_REVIEW_PASSWORD: ${{ secrets.APP_STORE_REVIEW_PASSWORD }}
        run: bash mobile/scripts/run_review_simulator.sh
      - name: Verify native splash appears in the recording
        run: |
          python3 -m pip install --disable-pip-version-check 'opencv-python-headless==4.11.0.86'
          python3 mobile/scripts/verify_review_video.py "$RUNNER_TEMP/review-simulator/simulator-proof.mp4" "$RUNNER_TEMP/review-simulator"
      - name: Save Simulator evidence (not Apple's physical-device proof)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-review-simulator-${{ github.run_id }}
          path: ${{ runner.temp }}/review-simulator/
          if-no-files-found: warn
          retention-days: 7

  devicefarm:
    needs: [signed-app, simulator]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: app-store
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tinyassets-ios-*
          path: ${{ runner.temp }}/ipa
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-review-tests
          path: ${{ runner.temp }}/tests
      - name: Install orchestration dependencies
        run: python -m pip install --disable-pip-version-check 'boto3==1.43.111' 'opencv-python-headless==4.11.0.86'
      - name: Validate packages, then stop before AWS or record on one physical iPhone
        env:
          REVIEW_DRY_RUN: ${{ inputs.dry_run }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DEVICEFARM_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DEVICEFARM_SECRET_ACCESS_KEY }}
          AWS_DEVICEFARM_PROJECT_ARN: ${{ secrets.AWS_DEVICEFARM_PROJECT_ARN }}
          APP_STORE_REVIEW_USERNAME: ${{ secrets.APP_STORE_REVIEW_USERNAME }}
          APP_STORE_REVIEW_PASSWORD: ${{ secrets.APP_STORE_REVIEW_PASSWORD }}
        run: |
          python mobile/scripts/devicefarm_review.py \
            --ipa-dir "$RUNNER_TEMP/ipa" --tests "$RUNNER_TEMP/tests/review-tests.zip" \
            --output "$RUNNER_TEMP/review-devicefarm"
      - name: Save physical-device video and step screenshots
        if: always() && !inputs.dry_run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-review-physical-iphone-${{ github.run_id }}
          path: ${{ runner.temp }}/review-devicefarm/
          if-no-files-found: error
          retention-days: 14
