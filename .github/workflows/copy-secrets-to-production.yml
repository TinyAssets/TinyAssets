name: Copy secrets to production (one-time)

# One-time move of the production secrets from repository scope into the
# main-only `production` environment (founder-approved 2026-10-13). Each value
# is read as a masked env var and piped on stdin to `gh secret set --env`; no
# value is written to code, logs or artifacts. The temporary
# SECRET_COPY_PAT deletes itself at the end of the run. Delete this workflow
# once the copy is verified.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copy-secrets-to-production
  cancel-in-progress: false

jobs:
  copy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Copy repository secrets into the production environment
        env:
          GH_TOKEN: ${{ secrets.SECRET_COPY_PAT }}
          V_DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          V_DO_DROPLET_HOST: ${{ secrets.DO_DROPLET_HOST }}
          V_DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
          V_DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          V_DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          V_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          V_CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          V_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          V_PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          V_PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          V_TINYASSETS_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.TINYASSETS_OAUTH_GOOGLE_CLIENT_SECRET }}
          V_TINYASSETS_WIKI_CANARY_TOKEN: ${{ secrets.TINYASSETS_WIKI_CANARY_TOKEN }}
          V_TINYASSETS_REQUEST_IDEMPOTENCY_HMAC_KEY: ${{ secrets.TINYASSETS_REQUEST_IDEMPOTENCY_HMAC_KEY }}
          V_TINYASSETS_AGENT_INTERCHANGE_HMAC_KEY: ${{ secrets.TINYASSETS_AGENT_INTERCHANGE_HMAC_KEY }}
          V_OFFREGION_BACKUP_REMOTE: ${{ secrets.OFFREGION_BACKUP_REMOTE }}
          V_OFFREGION_BACKUP_RCLONE_CONFIG: ${{ secrets.OFFREGION_BACKUP_RCLONE_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "SECRET_COPY_PAT is not set; nothing copied." >&2
            exit 1
          fi
          copied=0
          for name in DO_SSH_KEY DO_DROPLET_HOST DO_SSH_USER DIGITALOCEAN_TOKEN DO_API_TOKEN \
              CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_ID CLOUDFLARE_ACCOUNT_ID \
              PUSHOVER_APP_TOKEN PUSHOVER_USER_KEY TINYASSETS_OAUTH_GOOGLE_CLIENT_SECRET \
              TINYASSETS_WIKI_CANARY_TOKEN TINYASSETS_REQUEST_IDEMPOTENCY_HMAC_KEY \
              TINYASSETS_AGENT_INTERCHANGE_HMAC_KEY OFFREGION_BACKUP_REMOTE \
              OFFREGION_BACKUP_RCLONE_CONFIG; do
            var="V_${name}"
            if [ -z "${!var:-}" ]; then
              echo "skip ${name}: not set at repository scope"
              continue
            fi
            printf '%s' "${!var}" | gh secret set "${name}" --env production --repo "${GITHUB_REPOSITORY}"
            echo "copied ${name}"
            copied=$((copied + 1))
          done
          echo "copied ${copied} secret(s) into production"

      - name: List production environment secret names
        env:
          GH_TOKEN: ${{ secrets.SECRET_COPY_PAT }}
        run: gh secret list --env production --repo "${GITHUB_REPOSITORY}" | awk '{print $1}'

      - name: Delete the temporary copy token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SECRET_COPY_PAT }}
        run: |
          set -euo pipefail
          if [ -n "${GH_TOKEN:-}" ]; then
            if ! gh secret delete SECRET_COPY_PAT --repo "${GITHUB_REPOSITORY}"; then
              echo "::error::SECRET_COPY_PAT was not deleted; delete it by hand in Settings > Secrets." >&2
              exit 1
            fi
          fi
