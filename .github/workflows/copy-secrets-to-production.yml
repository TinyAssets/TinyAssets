name: Copy secrets to production (one-time)

# One-time move of the secrets that still exist only at repository scope into
# the main-only `production` environment (#5597's founder step 2; the first
# batch was copied 2026-10-13). Each value is read as a masked env var and piped
# on stdin to `gh secret set --env`; no value is written to code, logs or
# artifacts. The temporary SECRET_COPY_PAT is stored in `production` too
# (`gh secret set SECRET_COPY_PAT --env production`), so no branch's run can
# read it, and the run deletes it there at the end. Delete this workflow once
# the copy is verified.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: copy-secrets-to-production
  cancel-in-progress: false

jobs:
  copy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Copy repository secrets into the production environment
        env:
          GH_TOKEN: ${{ secrets.SECRET_COPY_PAT }}
          V_MERGE_ATTRIBUTION_TOKEN: ${{ secrets.MERGE_ATTRIBUTION_TOKEN }}
          V_ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          V_ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          V_ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          V_ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          V_ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
          V_ANDROID_GOOGLE_SERVICES_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}
          V_TINYASSETS_CANARY_HMAC_KEY: ${{ secrets.TINYASSETS_CANARY_HMAC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "SECRET_COPY_PAT is not set; nothing copied." >&2
            exit 1
          fi
          copied=0
          for var in "${!V_@}"; do
            name="${var#V_}"
            if [ -z "${!var:-}" ]; then
              echo "::error::${name} is not set at repository scope; nothing to copy." >&2
              exit 1
            fi
            printf '%s' "${!var}" | gh secret set "${name}" --env production --repo "${GITHUB_REPOSITORY}"
            echo "copied ${name}"
            copied=$((copied + 1))
          done
          echo "copied ${copied} secret(s) into production"

      - name: List production environment secret names
        env:
          GH_TOKEN: ${{ secrets.SECRET_COPY_PAT }}
        run: gh secret list --env production --repo "${GITHUB_REPOSITORY}" | awk '{print $1}'

      - name: Delete the temporary copy token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SECRET_COPY_PAT }}
        run: |
          set -euo pipefail
          if [ -n "${GH_TOKEN:-}" ]; then
            if ! gh secret delete SECRET_COPY_PAT --env production --repo "${GITHUB_REPOSITORY}"; then
              echo "::error::SECRET_COPY_PAT was not deleted; delete it by hand in Settings > Environments > production." >&2
              exit 1
            fi
          fi
