name: okf-watch

# The OKF watcher (platform/starter/okf-watch.ts; okf_update_research.md section 5).
#
# The starter's `knowledge` skill vendors the Open Knowledge Format spec, pinned to one
# commit of its canonical repository. Daily, `watch` compares that pin with the repository
# by content: SPEC.md's blob, the README (the spec moved once already), and its tags; and
# checks everything upstream it would quote for characters a reviewer cannot see. A change
# opens ONE draft pull request with the pin moved; only new spec bytes vendor the new spec
# and raise the starter's version. A newer upstream closes the older proposal.
#
# `cooldown` waits about 7 days from the pull request's opening (Renovate's
# minimumReleaseAge), so a bad upstream commit can be caught first. Then it marks the pull
# request ready, which starts its checks and auto-enrolment like any pull request's, and asks
# for the review every pull request needs; a change that could widen what agents do (hidden
# text, `needs-founder`) asks the founder instead and stays a draft.
#
# The pull request is pushed, opened and readied with MERGE_ATTRIBUTION_TOKEN, a user token,
# as main-red.yml opens its revert pull requests: events GITHUB_TOKEN causes start no
# workflow, so its checks and enrolment would never run. With the secret unset, the job
# fails loudly and nothing is proposed (fail loudly, never fall back to GITHUB_TOKEN).
#
# Nothing here merges. Drafts are not auto-enrolled (auto-enroll-merge.yml), and a ready
# pull request merges only with the review receipt every pull request needs
# (drain_review_gate.py): an approving `Drain-Review-Verdict` comment by a trusted author.
# No workflow writes that receipt; the review is an agent review session's, as for every
# pull request. A version number never decides anything.

on:
  schedule:
    - cron: '41 4 * * *'   # 04:41 UTC daily
  workflow_dispatch:

permissions: {}

concurrency:
  group: okf-watch
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/GoogleCloudPlatform/open-knowledge-format.git
  COOLDOWN_DAYS: '7'
  # The founder's own login (.github/CODEOWNERS): an organization cannot be asked to review.
  FOUNDER: Jonnyton

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # every write is the user token's, below
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Clone the canonical OKF repository
        run: git clone --quiet "$UPSTREAM" "$RUNNER_TEMP/okf"

      - name: Compare it with the pin
        id: check
        run: |
          set -euo pipefail
          node platform/starter/okf-watch.ts check --upstream "$RUNNER_TEMP/okf" \
            --out "$RUNNER_TEMP/report.json"
          cat "$RUNNER_TEMP/report.json"
          {
            echo "changed=$(jq -r .changed "$RUNNER_TEMP/report.json")"
            echo "spec=$(jq -r .spec_changed "$RUNNER_TEMP/report.json")"
            echo "widens=$(jq -r .widens "$RUNNER_TEMP/report.json")"
            echo "commit=$(jq -r .commit "$RUNNER_TEMP/report.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Require the user token
        if: steps.check.outputs.changed == 'true'
        env:
          TOKEN_PRESENT: ${{ secrets.MERGE_ATTRIBUTION_TOKEN != '' }}
        run: |
          if [ "$TOKEN_PRESENT" != "true" ]; then
            echo "::error::MERGE_ATTRIBUTION_TOKEN is empty or unset: a proposal opened with GITHUB_TOKEN would start no checks and never be reviewed, so none is opened."
            exit 1
          fi

      - name: Open the draft proposal
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.MERGE_ATTRIBUTION_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ steps.check.outputs.commit }}
          SPEC: ${{ steps.check.outputs.spec }}
          WIDENS: ${{ steps.check.outputs.widens }}
        run: |
          set -euo pipefail
          branch="okf-watch/${COMMIT:0:12}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "The upstream at ${COMMIT:0:12} is already proposed."
            exit 0
          fi
          git switch -c "$branch"
          node platform/starter/okf-watch.ts apply --upstream "$RUNNER_TEMP/okf" \
            --body "$RUNNER_TEMP/body.md"
          if [ "$SPEC" = "true" ]; then
            title="OKF watcher: the starter's vendored spec at upstream ${COMMIT:0:12}"
          else
            title="OKF watcher: the pin's README and tags at upstream ${COMMIT:0:12}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/starter
          git commit -m "$title"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" \
            "HEAD:refs/heads/$branch"
          gh label create okf-watch --color 0e8a16 \
            --description "The OKF watcher's proposals" --force
          gh label create needs-founder --color d93f0b \
            --description "Could widen what agents do: the founder reviews it" --force
          labels="okf-watch"
          if [ "$WIDENS" = "true" ]; then labels="okf-watch,needs-founder"; fi
          for n in $(gh pr list --label okf-watch --state open --json number --jq '.[].number'); do
            gh pr close "$n" --delete-branch \
              --comment "Superseded: the upstream moved on to ${COMMIT:0:12}."
          done
          gh pr create --draft --base main --head "$branch" --label "$labels" \
            --title "$title" --body-file "$RUNNER_TEMP/body.md"

  cooldown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}   # every write is the user token's
    steps:
      - name: Require the user token
        env:
          TOKEN_PRESENT: ${{ secrets.MERGE_ATTRIBUTION_TOKEN != '' }}
        run: |
          if [ "$TOKEN_PRESENT" != "true" ]; then
            echo "::error::MERGE_ATTRIBUTION_TOKEN is empty or unset: a proposal readied with GITHUB_TOKEN would start no checks, so none is readied."
            exit 1
          fi

      - name: Ready the proposals past their cooldown
        env:
          GH_TOKEN: ${{ secrets.MERGE_ATTRIBUTION_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "-${COOLDOWN_DAYS} days" +%s)
          gh label create okf-review-due --color fbca04 \
            --description "Past its cooldown: ready for review" --force
          gh label create founder-asked --color d93f0b \
            --description "The founder was asked to review" --force
          gh pr list --label okf-watch --state open --json number,createdAt,isDraft,labels \
            --jq '.[] | select(.isDraft) | [.number, .createdAt, ([.labels[].name] | join(","))] | @tsv' |
          while IFS=$'\t' read -r number created labels; do
            if [ "$(date -u -d "$created" +%s)" -gt "$cutoff" ]; then
              continue
            fi
            case ",$labels," in
              *,founder-asked,*) ;;
              *,needs-founder,*)
                gh pr edit "$number" --add-reviewer "$FOUNDER" --add-label founder-asked
                gh pr comment "$number" --body "The cooldown is over. This change carries text no reviewer can see, which could widen what every owner's agent does, so the founder reviews it before it is marked ready." ;;
              *)
                gh pr ready "$number"
                gh pr edit "$number" --add-label okf-review-due
                gh pr comment "$number" --body "The cooldown is over: ready for review. Read the spec diff, not the version line; the checks are in the description. It merges only with an approving review receipt." ;;
            esac
          done
