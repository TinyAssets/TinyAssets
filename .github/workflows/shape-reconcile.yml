name: Shape reconciliation

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: shape-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reconcile registry and queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.shape_reconcile
