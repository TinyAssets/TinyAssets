name: Enqueue merge

# Why this exists
# ---------------
# `gh pr merge --auto` enables auto-merge. With a merge queue, GitHub admits
# that PR only when a person armed it. A GitHub App or GITHUB_TOKEN sets the
# flag and the queue stays empty. Some apps are GraphQL type User
# (`cursor[bot]`), so auto-enroll's `User:*` check keeps the arm, and
# enabling auto-merge is not a pull_request event, so the enroll workflow
# does not run again to replace it.
#
# Measured 2026-10-12: #4658, armed by the user PAT, entered the queue two
# seconds after required-tests passed. #4649 was re-armed by cursor[bot] and
# never entered the queue.
#
# This calls enqueuePullRequest once a Jonnyton comment opens with
# Drain-Review-Verdict: APPROVE and Drain-Review-Head for this change, the
# body cites that comment, required checks have passed, and a release-critical
# diff carries the infra-change label. The actor is MERGE_ATTRIBUTION_TOKEN.
# If that token lacks Merge queues: Read and write, the job logs the owner
# step and exits 0. It never uses GITHUB_TOKEN.
#
# A receipt or an infra-change label does not rerun Tests. pr-scope-guard
# re-reads both, on pull_request_target. This job runs when that guard, Tests,
# or invariants succeeds for a pull request. It does not listen to edited or
# labeled itself: those events must not start another copy of the test jobs.

on:
  workflow_run:
    workflows: ["Tests", "invariants", "PR scope guard"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: enqueue-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  enqueue:
    name: Enqueue for merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # pull_request_target is the scope guard (receipt and label). pull_request
    # is Tests and invariants. merge_group is excluded: the queue already has
    # the pull request, and a success there must not enqueue it again.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'pull_request_target')
    steps:
      - name: Check out trusted enqueue policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Require the merge-attribution token
        env:
          TOKEN_PRESENT: ${{ secrets.MERGE_ATTRIBUTION_TOKEN != '' }}
        shell: bash
        run: |
          if [ "$TOKEN_PRESENT" != "true" ]; then
            echo "::error::MERGE_ATTRIBUTION_TOKEN is empty or unset. enqueuePullRequest needs the user-owned fine-grained PAT (Merge queues: Read and write, plus Contents and Pull requests read/write). GITHUB_TOKEN-armed auto-merge never enters the merge queue."
            exit 1
          fi

      - name: Enqueue when the receipt and required checks have passed
        env:
          GH_TOKEN: ${{ secrets.MERGE_ATTRIBUTION_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD: ${{ github.event.workflow_run.head_sha }}
          PR_LIST: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--repo "$REPO")
          list="${PR_LIST:-[]}"
          if [ -z "$list" ] || [ "$list" = "null" ]; then
            list='[]'
          fi
          numbers="$(jq -r '.[]?.number // empty' <<<"$list")"
          if [ -z "$numbers" ] && [ -n "${HEAD:-}" ]; then
            if ! numbers="$(gh api -H "Accept: application/vnd.github+json" \
                "repos/${REPO}/commits/${HEAD}/pulls" --jq '.[].number')"; then
              echo "::error::could not list pull requests for ${HEAD}"
              exit 1
            fi
          fi
          found=0
          while IFS= read -r n; do
            if [ -n "$n" ]; then
              args+=(--pr "$n")
              found=1
            fi
          done <<<"$numbers"
          if [ "$found" -eq 0 ]; then
            echo "No pull request on this workflow_run."
            exit 0
          fi
          if [ -n "${HEAD:-}" ]; then
            args+=(--head "$HEAD")
          fi
          python scripts/enqueue_merge.py "${args[@]}"
