name: Handles canary (manual, read-only)

# Fact 11's handles canary for the old stack, run by hand until the cutover's
# hold ends (d3 §A7, platform/cutover.json): the old stack's own check,
# mcp_public_canary.py --assert-handles, as the canary principal
# (TINYASSETS_WIKI_CANARY_TOKEN): the anonymous challenge, exactly the old
# handle set (scripts/canary_handles.json's old record), converse refused at
# both boundaries, and get_status's uptime fields. The window runs it after a
# `handback` and the old stack's restart (platform/deploy/checklist.md). It
# changes nothing. Its token is a production secret, so the job runs there,
# from main. Each request has 30 s: from GitHub's runners the old stack's
# anonymous answers take close to 10 s (run 42583772556).
#
# The doors' side is the platform canary's (platform-canary.yml,
# platform/deploy/canary.ts), and uptime-canary.yml stays the old stack's
# pager until `routes` disables it.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handles-canary
  cancel-in-progress: false

jobs:
  canary:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: The old stack's handles canary (changes nothing)
        env:
          TINYASSETS_WIKI_CANARY_TOKEN: ${{ secrets.TINYASSETS_WIKI_CANARY_TOKEN }}
        run: python scripts/mcp_public_canary.py --timeout 30 --assert-handles --verbose
