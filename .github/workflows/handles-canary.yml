name: Handles canary (manual, read-only)

# Fact 11's handles canary, run by hand across the cutover
# (scripts/cutover_handles_canary.py): which side serves tinyassets.io/mcp,
# and that side's handle set (scripts/canary_handles.json).
#   old  - the old stack: mcp_public_canary.py --assert-handles, as the
#          canary principal (TINYASSETS_WIKI_CANARY_TOKEN).
#   new  - the doors: the anonymous challenge, their resource document, and
#          their handle set by one read-only GET a name on /api/tools/<name>
#          with the probe owner's API key (TA_PROBE_KEY).
#   auto - the side the public resource document names.
# It changes nothing: every request is an MCP read, an anonymous initialize,
# a document GET or an /api GET, which never reaches an owner door. The
# window runs it after `routes` (side new), and after `handback` and the old
# stack's restart (side old) (platform/deploy/checklist.md). Its two secrets
# are the production environment's, so the job runs there, from main.
#
# Dispatch only: uptime-canary.yml stays the five-minute pager, whose other
# layers (the tool, core-capability and disk probes) are the old stack's.

on:
  workflow_dispatch:
    inputs:
      side:
        description: 'auto | old | new'
        required: true
        default: auto
        type: choice
        options: [auto, old, new]

permissions:
  contents: read

concurrency:
  group: handles-canary
  cancel-in-progress: false

jobs:
  canary:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: The handles canary (changes nothing)
        env:
          SIDE: ${{ inputs.side }}
          TINYASSETS_WIKI_CANARY_TOKEN: ${{ secrets.TINYASSETS_WIKI_CANARY_TOKEN }}
          TA_PROBE_KEY: ${{ secrets.TA_PROBE_KEY }}
        run: python scripts/cutover_handles_canary.py --side "${SIDE}" --verbose
