name: Platform deploy (manual, founder-approved)

# The platform's deploy kit (platform/deploy/deploy.ts), run by hand from
# `main`, the dispatch's mode passed to it whole (`--mode`, the kit's mode
# table, MODES), in three jobs:
#   plan   - the mode's plan (`--public`), to the job summary. It holds only the
#            Cloudflare token (not a production secret) and the repo's
#            variables, and changes nothing.
#   pair   - (dark, routes) after the plan, in the `production` environment
#            with the E2B key alone: the sandbox's template and the runner
#            this commit ships checked together on throwaway sandboxes,
#            unless E2B already holds their pair's tag (`--mode pair`).
#   apply  - needs the plan and the pair (none for probe, h2 and handback,
#            which deploy nothing), in the main-only `production` environment:
#            the mode with `--yes`, which stops a deploy unless the pair's tag
#            is at E2B. The founder's dispatch is the approval: a
#            required reviewer on `production` would hold every scheduled job
#            there too (platform/deploy/checklist.md).
#
# The apply job's secrets come from the `production` environment's store, so
# a branch's copy of this file never reaches them
# (platform/ci/guards/environment.test.ts), and never from a host
# (Direction 8). The kit never prints a value and never makes one in a
# deploy; each keyring is made once with `keyring-new` (scripts/platform_setup.py
# makes the same in memory) and rotated with `keyring-add`, then stored here.
#
# The modes are the kit's own (deploy.ts says what each does): plan, dark,
# probe, routes, h2 and handback here; pair is its own job. `routes` keeps a
# record of what it changes (the zone's routes, the egress custom domain, E2B's
# lifecycle webhook) before any change, and its job summary names the record's
# id (the run's); `handback` takes that id as `record` and puts each back as the
# record has it (the cutover's rollback).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan | dark | probe | routes | h2 | handback'
        required: true
        default: plan
        type: choice
        options: [plan, dark, probe, routes, h2, handback]
      rotate:
        description: 'Secrets to set again, comma-separated (a keyring only as an addition)'
        required: false
        default: ''
        type: string
      migrate:
        description: 'Workers with a pending Durable Object migration to deploy whole'
        required: false
        default: ''
        type: string
      record:
        description: 'handback: the route record to hand back (the routes run id its summary names)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: platform-deploy
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
      OWNER_ISSUER: ${{ vars.OWNER_ISSUER }}
      MODE: ${{ inputs.mode }}
      ROTATE: ${{ inputs.rotate }}
      MIGRATE: ${{ inputs.migrate }}
      RECORD: ${{ inputs.record }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the platform's pinned tools
        working-directory: platform
        run: npm ci

      - name: The plan (changes nothing)
        run: |
          set -euo pipefail
          args=(--mode "${MODE}" --public)
          if [ -n "${ROTATE}" ]; then args+=(--rotate "${ROTATE}"); fi
          if [ -n "${MIGRATE}" ]; then args+=(--migrate "${MIGRATE}"); fi
          if [ -n "${RECORD}" ]; then args+=(--record "${RECORD}"); fi
          node --experimental-strip-types platform/deploy/deploy.ts "${args[@]}"

  # The pair check, in a job of its own before apply: the pinned E2B template, the runner
  # this commit's sandbox Worker ships and the probes beside it, unless E2B already holds
  # their pair's tag (deploy.ts --mode pair runs sandbox/template/checks.ts pair: the
  # probes' plan's throwaway sandboxes, one after another). It holds only the E2B key.
  pair:
    needs: plan
    if: github.ref == 'refs/heads/main' && (inputs.mode == 'dark' || inputs.mode == 'routes')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the platform's pinned tools
        working-directory: platform
        run: npm ci

      - name: The pair check
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: node --experimental-strip-types platform/deploy/deploy.ts --mode pair

  apply:
    needs: [plan, pair]
    if: >-
      always() && github.ref == 'refs/heads/main' && inputs.mode != 'plan'
      && needs.plan.result == 'success'
      && (needs.pair.result == 'success'
          || ((inputs.mode == 'h2' || inputs.mode == 'probe' || inputs.mode == 'handback')
              && needs.pair.result == 'skipped'))
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
      WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
      OWNER_ISSUER: ${{ vars.OWNER_ISSUER }}
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      ROUTING_MAC_KEY: ${{ secrets.ROUTING_MAC_KEY }}
      GATEWAY_KEYRING: ${{ secrets.GATEWAY_KEYRING }}
      FILES_KEYRING: ${{ secrets.FILES_KEYRING }}
      E2B_WEBHOOK_SECRET: ${{ secrets.E2B_WEBHOOK_SECRET }}
      INBOUND_SLACK_SIGNING_SECRET: ${{ secrets.INBOUND_SLACK_SIGNING_SECRET }}
      TINYASSETS_WIKI_CANARY_TOKEN: ${{ secrets.TINYASSETS_WIKI_CANARY_TOKEN }}
      TA_PROBE_KEY: ${{ secrets.TA_PROBE_KEY }}
      TA_PROBE_KEY_B: ${{ secrets.TA_PROBE_KEY_B }}
      TA_PROBE_APP_TOKEN: ${{ secrets.TA_PROBE_APP_TOKEN }}
      TA_PROBE_KEY_ID: ${{ secrets.TA_PROBE_KEY_ID }}
      MODE: ${{ inputs.mode }}
      ROTATE: ${{ inputs.rotate }}
      MIGRATE: ${{ inputs.migrate }}
      RECORD: ${{ inputs.record }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the platform's pinned tools
        working-directory: platform
        run: npm ci

      - name: Apply
        run: |
          set -euo pipefail
          args=(--mode "${MODE}" --yes)
          if [ -n "${ROTATE}" ]; then args+=(--rotate "${ROTATE}"); fi
          if [ -n "${MIGRATE}" ]; then args+=(--migrate "${MIGRATE}"); fi
          if [ -n "${RECORD}" ]; then args+=(--record "${RECORD}"); fi
          node --experimental-strip-types platform/deploy/deploy.ts "${args[@]}"
