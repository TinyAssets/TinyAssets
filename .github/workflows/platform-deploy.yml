name: Platform deploy (manual, founder-approved)

# The platform's deploy kit (platform/deploy/deploy.ts), run by hand from
# `main`, the dispatch's inputs passed to it as they are (an empty one names
# nothing; `--mode` is a row of the kit's mode table, MODES), in three jobs:
#   plan   - the mode's plan (`--public`), to the job summary and to the file
#            `--plan` names, which the run keeps as its artifact `deploy-plan`.
#            In the main-only `production` environment, it holds only the
#            Cloudflare token and the repo's variables, and changes nothing.
#   pair   - (dark, routes) after the plan, in the `production` environment
#            with the E2B key alone: the sandbox's template and the runner
#            this commit ships checked together on throwaway sandboxes,
#            unless E2B already holds their pair's tag (`--mode pair`).
#   apply  - needs the plan and, for dark and routes, the pair, in the
#            main-only `production` environment:
#            the mode with `--yes`, held to this run's `deploy-plan`: before
#            any change the kit makes the plan job's plan again from the live
#            state and stops on any difference from it (the pair job can take
#            most of an hour between the two), and it stops a deploy unless the
#            pair's tag is at E2B. The founder's dispatch is the approval: a
#            required reviewer on `production` would hold every scheduled job
#            there too (platform/deploy/checklist.md).
#
# The apply job's secrets come from the `production` environment's store, so
# a branch's copy of this file never reaches them
# (platform/ci/guards/environment.test.ts), and never from a host
# (Direction 8). The kit never prints a value and never makes one in a
# deploy; each keyring is made once with `keyring-new` (scripts/platform_setup.py
# makes the same in memory) and rotated with `keyring-add`, then stored here.
#
# The modes are the kit's own (deploy.ts says what each does): plan, dark,
# routes, h2, handback, rollback, control, owner, restore, copyback, recover,
# erase, rotation and retire here; pair is its own job.
# `routes` keeps a record of what it changes (the zone's routes, the egress
# custom domain, E2B's lifecycle webhook) before any change, or keeps the
# host's record while one stands, and its plan names the record's id (the
# host's first routes run's); `handback` takes that id as `record` and puts
# each back as the record has it (the cutover's rollback).
# `dark` and `routes` keep a rollout record too, each Worker's version before
# their first deploy, under the run's id; `rollback` takes that id as
# `record` and takes the run's Workers back to those versions, callers first,
# stopping at a Worker the run made forward-only (its migrations, its secrets,
# a whole deploy, its forward mark).
# The operator path (deploy/operator.ts): `control` edits the control record
# in KV itself (`set`, from `replace` in place of the live one), never through
# the doors; `owner` asks the doors `act` for `owner` through the operator
# channel; `restore` restores `owner` from `generation` through it (a live
# owner's object wiped only once `confirm` names the generation its pin wrote),
# or with no `generation` asks the owner's namespace and finished generations
# (`confirm` release-<owner> gives a pin up); `copyback` writes back from the
# off-account copy, as it stood at `at` (none: as it stands), the objects of
# `owner`'s namespace that R2 lacks, the namespace as the owner's object names
# it and the copy's restore record written first (deploy/offsite.ts
# `copyBack`; checklist.md, "A restore from the copy"); `recover`, after an
# account's loss, writes back every namespace of the copy as it stood at `at`
# that no erasure mark names, the marks first, and begins each one's owner's
# restore (deploy/offsite.ts `recover`; checklist.md, "A restore after the
# account's loss"); `erase` erases `owner`
# as its own door does, for an owner who asked by other means, only once `confirm` is
# erase-<owner> (a run without it names the words); `rotation` asks every
# owner the directory lists to bring its blobs under `keyring`'s active kid,
# its progress kept in the control namespace; `retire` sets `keyring` with its
# old kids gone, only once `confirm` is the words its apply job names. Each shares
# this file's concurrency group, so no operator run ever interleaves with a deploy.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan | dark | routes | h2 | handback | rollback | control | owner | restore | copyback | recover | erase | rotation | retire'
        required: true
        default: plan
        type: choice
        options: [plan, dark, routes, h2, handback, rollback, control, owner, restore, copyback, recover, erase, rotation, retire]
      rotate:
        description: 'Secrets to set again, comma-separated (a keyring only as an addition)'
        required: false
        default: ''
        type: string
      migrate:
        description: 'Workers with a pending Durable Object migration to deploy whole'
        required: false
        default: ''
        type: string
      record:
        description: 'handback: the route record to hand back; rollback: the rollout record to roll back (the run id its summary names)'
        required: false
        default: ''
        type: string
      set:
        description: 'control: edits, space-separated (outside=on canary+=<owner> tiers.free.runs=5)'
        required: false
        default: ''
        type: string
      replace:
        description: 'control: the whole record, as JSON, the edits start from in place of the live one'
        required: false
        default: ''
        type: string
      owner:
        description: 'owner, restore, copyback and erase: the owner principal'
        required: false
        default: ''
        type: string
      act:
        description: 'owner: state | tier=<tier> | suspend=<reason> | lift=<reason> | admit'
        required: false
        default: ''
        type: string
      generation:
        description: 'restore: <namespace>/<gen> to restore from; none asks the owner source'
        required: false
        default: ''
        type: string
      confirm:
        description: 'restore: wipe-<owner>-<gen> as restore.pin answers it, or release-<owner>; erase: erase-<owner>; retire: retire-<keyring>-<kids> as its apply job names it'
        required: false
        default: ''
        type: string
      keyring:
        description: 'rotation and retire: FILES_KEYRING or GATEWAY_KEYRING'
        required: false
        default: ''
        type: string
      at:
        description: 'copyback and recover: the time the copy is read as it stood at (yyyy-mm-ddThh:mm:ssZ); none, as it stands'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: platform-deploy
  cancel-in-progress: false

jobs:
  plan:
    environment: production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
      OWNER_ISSUER: ${{ vars.OWNER_ISSUER }}
      OFFSITE_BUCKET: ${{ vars.OFFSITE_BUCKET }}
      MODE: ${{ inputs.mode }}
      ROTATE: ${{ inputs.rotate }}
      MIGRATE: ${{ inputs.migrate }}
      RECORD: ${{ inputs.record }}
      SET: ${{ inputs.set }}
      REPLACE: ${{ inputs.replace }}
      OWNER: ${{ inputs.owner }}
      ACT: ${{ inputs.act }}
      GENERATION: ${{ inputs.generation }}
      CONFIRM: ${{ inputs.confirm }}
      KEYRING: ${{ inputs.keyring }}
      AT: ${{ inputs.at }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the platform's pinned tools
        working-directory: platform
        run: npm ci

      - name: The plan (changes nothing)
        run: >-
          node --experimental-strip-types platform/deploy/deploy.ts --mode "${MODE}" --public
          --plan "${RUNNER_TEMP}/deploy-plan.json"
          --rotate "${ROTATE}" --migrate "${MIGRATE}" --record "${RECORD}" --set "${SET}"
          --replace "${REPLACE}" --owner "${OWNER}" --act "${ACT}"
          --generation "${GENERATION}" --confirm "${CONFIRM}" --keyring "${KEYRING}"
          --at "${AT}"

      # The plan the apply job is held to, kept by this run alone (a re-run of the plan job
      # writes it again).
      - name: Keep the plan for the apply job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deploy-plan
          path: ${{ runner.temp }}/deploy-plan.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # The pair check, in a job of its own before apply: the pinned E2B template, the runner
  # this commit's sandbox Worker ships and the probes beside it, unless E2B already holds
  # their pair's tag (deploy.ts --mode pair runs sandbox/template/checks.ts pair: the
  # probes' plan's throwaway sandboxes, one after another). It holds only the E2B key.
  pair:
    needs: plan
    if: github.ref == 'refs/heads/main' && (inputs.mode == 'dark' || inputs.mode == 'routes')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the platform's pinned tools
        working-directory: platform
        run: npm ci

      - name: The pair check
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: node --experimental-strip-types platform/deploy/deploy.ts --mode pair

  apply:
    needs: [plan, pair]
    if: >-
      always() && github.ref == 'refs/heads/main' && inputs.mode != 'plan'
      && needs.plan.result == 'success'
      && (needs.pair.result == 'success'
          || (inputs.mode != 'dark' && inputs.mode != 'routes' && needs.pair.result == 'skipped'))
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The platform canary after each mode reads the off-account copy's nights with the job's
    # own token (platform/deploy/canary.ts).
    permissions:
      contents: read
      actions: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
      WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
      OWNER_ISSUER: ${{ vars.OWNER_ISSUER }}
      OFFSITE_BUCKET: ${{ vars.OFFSITE_BUCKET }}
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      ROUTING_MAC_KEY: ${{ secrets.ROUTING_MAC_KEY }}
      GATEWAY_KEYRING: ${{ secrets.GATEWAY_KEYRING }}
      FILES_KEYRING: ${{ secrets.FILES_KEYRING }}
      OPERATOR_KEYRING: ${{ secrets.OPERATOR_KEYRING }}
      E2B_WEBHOOK_SECRET: ${{ secrets.E2B_WEBHOOK_SECRET }}
      INBOUND_SLACK_SIGNING_SECRET: ${{ secrets.INBOUND_SLACK_SIGNING_SECRET }}
      PLATFORM_CANARY_TOKEN: ${{ secrets.PLATFORM_CANARY_TOKEN }}
      PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
      PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
      TA_PROBE_KEY: ${{ secrets.TA_PROBE_KEY }}
      TA_PROBE_KEY_B: ${{ secrets.TA_PROBE_KEY_B }}
      TA_PROBE_APP_TOKEN: ${{ secrets.TA_PROBE_APP_TOKEN }}
      TA_PROBE_KEY_ID: ${{ secrets.TA_PROBE_KEY_ID }}
      OFFSITE_B2_READ_KEY_ID: ${{ secrets.OFFSITE_B2_READ_KEY_ID }}
      OFFSITE_B2_READ_KEY: ${{ secrets.OFFSITE_B2_READ_KEY }}
      OFFSITE_R2_WRITE_ACCESS_KEY_ID: ${{ secrets.OFFSITE_R2_WRITE_ACCESS_KEY_ID }}
      OFFSITE_R2_WRITE_SECRET_ACCESS_KEY: ${{ secrets.OFFSITE_R2_WRITE_SECRET_ACCESS_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODE: ${{ inputs.mode }}
      ROTATE: ${{ inputs.rotate }}
      MIGRATE: ${{ inputs.migrate }}
      RECORD: ${{ inputs.record }}
      SET: ${{ inputs.set }}
      REPLACE: ${{ inputs.replace }}
      OWNER: ${{ inputs.owner }}
      ACT: ${{ inputs.act }}
      GENERATION: ${{ inputs.generation }}
      CONFIRM: ${{ inputs.confirm }}
      KEYRING: ${{ inputs.keyring }}
      AT: ${{ inputs.at }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the platform's pinned tools
        working-directory: platform
        run: npm ci

      # The copy back's rclone (deploy/offsite.ts `copyBack`, `recover`), for those modes alone.
      - if: inputs.mode == 'copyback' || inputs.mode == 'recover'
        uses: ./.github/actions/rclone

      # This run's plan alone: with no run-id, the download reads no other run's artifacts.
      - name: The plan the plan job showed
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deploy-plan
          path: ${{ runner.temp }}

      - name: Apply
        run: >-
          node --experimental-strip-types platform/deploy/deploy.ts --mode "${MODE}" --yes
          --plan "${RUNNER_TEMP}/deploy-plan.json"
          --rotate "${ROTATE}" --migrate "${MIGRATE}" --record "${RECORD}" --set "${SET}"
          --replace "${REPLACE}" --owner "${OWNER}" --act "${ACT}"
          --generation "${GENERATION}" --confirm "${CONFIRM}" --keyring "${KEYRING}"
          --at "${AT}"
