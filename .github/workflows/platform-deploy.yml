name: Platform deploy (manual, founder-approved)

# The platform's dark-deploy kit (platform/deploy/deploy.ts, slice L), run by
# hand. Every run first prints the kit's plan (what it would change) to the job
# summary; only a run with `mode` other than `plan` then applies it. The job
# waits on the `platform-production` environment, whose required reviewer is
# the founder: that approval is the kit's `--yes`.
#
# Secrets come from the `platform-production` environment's secret store,
# never from a host (Direction 8). The kit never prints a value and never
# makes one in a deploy; GATEWAY_KEYRING is made once with `keyring-new` and
# rotated with `keyring-add` (both local), then stored here.
#
# Modes:
#   plan    - print what would change; change nothing
#   dark    - the dark deploy: storage, secrets, six Workers with no route,
#             the control record when absent, the WorkOS redirect URI
#   routes  - the cutover's routes (its own approved run)
#   h2      - H2's probes, once a probe owner exists

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan | dark | routes | h2'
        required: true
        default: plan
        type: choice
        options: [plan, dark, routes, h2]
      rotate:
        description: 'Secrets to set again, comma-separated (GATEWAY_KEYRING only as an addition)'
        required: false
        default: ''
        type: string
      migrate:
        description: 'Workers with a pending Durable Object migration to deploy whole'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: platform-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: platform-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
      WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
      OWNER_ISSUER: ${{ secrets.OWNER_ISSUER }}
      OWNER_TOKEN_CLAIMS: ${{ secrets.OWNER_TOKEN_CLAIMS }}
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      ROUTING_MAC_KEY: ${{ secrets.ROUTING_MAC_KEY }}
      GATEWAY_KEYRING: ${{ secrets.GATEWAY_KEYRING }}
      INBOUND_SLACK_SIGNING_SECRET: ${{ secrets.INBOUND_SLACK_SIGNING_SECRET }}
      TA_PROBE_KEY: ${{ secrets.TA_PROBE_KEY }}
      TA_PROBE_KEY_B: ${{ secrets.TA_PROBE_KEY_B }}
      TA_PROBE_APP_TOKEN: ${{ secrets.TA_PROBE_APP_TOKEN }}
      TA_PROBE_KEY_ID: ${{ secrets.TA_PROBE_KEY_ID }}
      MODE: ${{ inputs.mode }}
      ROTATE: ${{ inputs.rotate }}
      MIGRATE: ${{ inputs.migrate }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the platform's pinned tools
        working-directory: platform
        run: npm ci

      - name: The plan (changes nothing)
        run: |
          set -euo pipefail
          args=()
          if [ "${MODE}" = "routes" ]; then args+=(--routes); fi
          if [ -n "${ROTATE}" ]; then args+=(--rotate "${ROTATE}"); fi
          if [ -n "${MIGRATE}" ]; then args+=(--migrate "${MIGRATE}"); fi
          node --experimental-strip-types platform/deploy/deploy.ts "${args[@]}"

      - name: Apply
        if: inputs.mode != 'plan'
        run: |
          set -euo pipefail
          args=(--yes)
          if [ "${MODE}" = "routes" ]; then args+=(--routes); fi
          if [ "${MODE}" = "h2" ]; then args+=(--h2); fi
          if [ -n "${ROTATE}" ]; then args+=(--rotate "${ROTATE}"); fi
          if [ -n "${MIGRATE}" ]; then args+=(--migrate "${MIGRATE}"); fi
          node --experimental-strip-types platform/deploy/deploy.ts "${args[@]}"
