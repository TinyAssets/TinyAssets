name: Tests

# Why this exists
# ---------------
# Until this workflow landed, NEITHER required status check on `main` tested code
# behaviour:
#
#   * `policy` (daemon-request-policy.yml) only reads writer:/checker: labels. A
#     PR carrying none of them passes it trivially.
#   * `Diff scope declared` (pr-scope-guard.yml) is a scope-DECLARATION gate and
#     says so in its own honesty note.
#
# Since the repo auto-merges any non-draft PR once required checks pass, and
# merges flow on to production, code could reach live users without a single
# behavioural gate. This workflow is that gate.
#
# MUST run unconditionally — no `paths:` filter, no job-level `if:`.
# A REQUIRED status check that is path-filtered never reports at all on PRs
# outside those paths, and the PR then hangs forever on "Expected — waiting for
# status". That is why `lint`/actionlint is path-filtered and must NEVER be made
# required. Every `exit` path below produces a conclusion for the same check name.

on:
  pull_request:
    # No `paths:` — see above. Drafts get `opened`/`synchronize` too, so the gate
    # gives signal before a PR is marked ready and becomes auto-merge eligible.
    types: [opened, reopened, synchronize, ready_for_review]
  # The merge queue. `required-tests` and `slow-tests` are required checks, and
  # a queue waits for every required check to report on the merge-group commit;
  # without this trigger nothing reports and every queued PR times out.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  # The post-merge tripwire's only reliable AUTOMATIC trigger on this repo.
  # This run IS the compensator for `strict` branch protection being off, so a
  # red `main` here is reverted first and diagnosed after -- never left red
  # while someone investigates.
  # (`workflow_dispatch` below is also non-PR, but it needs a human to press it,
  # so it cannot carry a tripwire. Stated precisely because the first draft of
  # this comment claimed push was the only non-PR trigger, which is false.)
  #
  # `push: branches: [main]` looks like it covers every merge. It does not:
  # auto-enroll-merge.yml enrols each PR with the repo's GITHUB_TOKEN, so
  # GitHub performs the merge as `app/github-actions`, and events raised by
  # GITHUB_TOKEN never start a workflow run (AGENTS.md hard rule 14, "Merged is
  # not deployed"). Measured 2026-08-03: of the last 6 merges, the 5 done by the
  # app produced ZERO push runs; only #2191, merged by a human PAT, produced one.
  # So `push` fires on the rare human merge and never on the normal path — the
  # tripwire read as coverage while providing none, the same failure shape as the
  # concurrency bug fixed above.
  #
  # `schedule` is used because it is the one trigger empirically proven to fire
  # here (26 of the last 200 runs). Runners are free on a public repo, so the
  # cadence is chosen for detection latency, not cost.
  #
  # It is BEST-EFFORT. The cron declares NOMINAL SLOTS, not a delivered rate:
  # GitHub drops scheduled runs under load. Measured on this repo 2026-08-03,
  # release-reconcile declares `*/15 * * * *` (96 runs/day) and actually fired
  # 16 in 24h — a 6x shortfall, with one 3h47m gap. So read the cron below as a
  # declaration of one nominal slot per hour, not a promise about how many
  # runs arrive or how far apart they land. That is acceptable
  # for a
  # tripwire whose alternative is never running at all; it would NOT be
  # acceptable for a merge gate, which is why `required-tests` is REQUIRED only
  # via `pull_request`, where the trigger is deterministic.
  #
  # Accepted side effect: `required-tests` (and its shards) and `slow-tests`
  # have no job-level `if:` that can skip them — the aggregate's `always()`
  # cannot evaluate false — so they run on the schedule too. `heavy-tests` runs only what the required gate excludes; it is no longer a superset of
  # `required-tests`, so that is duplicated work. It is deliberate — runners are
  # free here, and the alternative is a job-level `if:` on the REQUIRED job.
  #
  # That would fail OPEN, not closed. A skipped job reports
  # `conclusion=skipped`, and branch protection accepts a skipped required check
  # as satisfied — so a condition that was wrong in some edge case would merge
  # untested code silently. (Verified empirically 2026-08-03, when this was `full-tests`:
  # reported COMPLETED/SKIPPED on PR #2197, not pending. An earlier draft of
  # this comment claimed a job-level `if:` would strand PRs on "Expected"; that
  # is the behaviour of a *trigger-level* `paths:` filter, not a job `if:`, and
  # cross-family review corrected it.)
  #
  # Wasting a free runner is the cheaper failure than a required check that can
  # quietly pass without running.
  #
  # WHY HOURLY. `17 */3` declared 8 slots/day; this declares 24. That is a
  # change to what the repo DECLARES. GitHub documents that scheduled events
  # may be delayed or dropped and specifies no relationship between declared
  # and delivered rate, so the delivered effect is unknown and is to be
  # measured rather than assumed:
  #
  #     gh run list --workflow tests.yml --event schedule
  #
  # WHY NOT TIGHTER. The old `full-tests` measured 36-45 minutes, and non-PR runs
  # get a unique concurrency group (`github.run_id`) with cancel-in-progress
  # false. Whatever GitHub delivers, this workflow's own concurrency policy
  # will not replace one non-PR run with another; it does not follow that two
  # runs execute simultaneously, since runner capacity may serialize them. A
  # declared interval shorter than the job's runtime is therefore a policy
  # this file declines to adopt, not a prediction about what would happen.
  #
  # A fixed minute is therefore a policy about the DECLARATION only, pinned by
  # test_schedule_declares_at_most_one_nominal_slot_per_hour. Nothing here
  # claims runs cannot overlap: two nominally-hourly slots can be dispatched
  # minutes apart — the two runs above arrived 59 and 17 minutes after theirs.
  # Overlap is tolerated, not prevented: runners are free on a public repo, so
  # duplicated tripwire work costs nothing and corrupts nothing.
  #
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# `pull_request`, deliberately NOT `pull_request_target`: testing a PR means
# EXECUTING the PR's code, so it must run in the untrusted-by-default context
# where the token is read-only and secrets are withheld. The scope guard uses
# _target for the opposite reason — it only reads metadata and must not be
# editable by the PR it judges.
permissions:
  contents: read

concurrency:
  # PRs cancel superseded runs (only the latest head matters). Non-PR runs are
  # keyed per-RUN and never collide at all: grouping them by ref meant each push
  # killed the previous main run, so with a commit every ~10 min the post-merge
  # tripwire almost never finished — it looked like coverage while providing
  # none (found in cross-family review 2026-08-03).
  #
  # `run_id` rather than `sha`, per a second review round: keying by SHA still
  # collides when several scheduled runs land on an UNCHANGED main, and GitHub
  # replaces an existing *pending* run with a newer one — so a queued tripwire
  # run can be silently dropped. run_id makes every
  # non-PR run unique, so THIS workflow's concurrency policy has nothing to
  # replace — GitHub may still drop a queued job under load, which is a
  # separate mechanism this key cannot address.
  # cancel-in-progress stays conditional as defence in depth.
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-capabilities:
    name: core-capabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select the real-image tier
        id: tier
        run: |
          python -c 'import sys; sys.path.insert(0,"."); from scripts.affected_tests import changed_files, needs_image; print("required="+str(needs_image(changed_files("HEAD^1"))).lower())' >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.tier.outputs.required == 'true'
      - name: Build the PR production image
        if: steps.tier.outputs.required == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tinyassets-capability:pr
          cache-from: |
            type=gha,scope=core-capabilities
            type=gha,scope=tinyassets-daemon
            type=gha
          cache-to: type=gha,scope=core-capabilities,mode=max
      - name: Permit user namespaces for the capability container
        if: steps.tier.outputs.required == 'true'
        run: |
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
            'profile ta-capability-userns flags=(unconfined) {' '  userns,' '}' \
            > "$RUNNER_TEMP/ta-capability-userns"
          sudo apparmor_parser -r "$RUNNER_TEMP/ta-capability-userns"
      - name: Exercise every core capability through real execution seams
        if: steps.tier.outputs.required == 'true'
        run: |
          pip install cryptography
          python scripts/core_capability_image.py --image tinyassets-capability:pr --apparmor ta-capability-userns --report core-capabilities.json
      - name: Explain a runtime-equivalent change
        if: steps.tier.outputs.required == 'false'
        run: echo 'No runtime/deploy inputs changed; fast affected units are the PR tier.'
      - uses: actions/upload-artifact@v4
        if: always() && steps.tier.outputs.required == 'true'
        with:
          name: core-capabilities
          path: core-capabilities.json
          if-no-files-found: error

  structural-guards:
    name: structural-guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install guard dependencies
        run: pip install -e '.[dev,browser]'
      - name: Run every structural guard with repair instructions
        run: python -m scripts.ci_structural_guards

  # The required surface runs as SHARDS in parallel, then ONE aggregate job
  # (`required-tests`, below) decides the gate over the union. Measured before
  # the split: ~21,900 tests serially, 19-22 min on an idle runner (runs
  # 36284043853, 36283801757), 40+ under contention. Each test FILE is owned by
  # exactly one shard (ci_required_tests.shard_of: packed by the measured
  # per-file durations in .github/test-durations.json, path hash for anything
  # the table does not cover), so the split is complete and disjoint by
  # construction.
  #
  # Not pytest-xdist: parallelism is across RUNNERS, so no two shards share a
  # process, temp dir or sqlite file — the in-process nondeterminism documented
  # in ci_required_tests.py does not apply.
  #
  # The shard count appears twice — the matrix and `--expect-shards` in the
  # aggregate — and test_tests_workflow pins them equal. A shard added to one
  # and not the other is either a missing shard (gate red) or an unowned file
  # set (tests silently never run); the test is what stops the second.
  # What this run must cover, decided ONCE so six shards and the aggregate
  # cannot disagree about it (lean-CI lever L1,
  # docs/design-notes/2026-10-02-affected-only-merge-gate.md).
  #
  # On `merge_group` the queue branch is base_sha + this entry's commits, so
  # `affected_tests.py --base <base_sha>` is exactly the entry's own diff. On
  # EVERY other event -- push to main, schedule, dispatch -- the answer is ALL,
  # unconditionally: the post-merge run is the one that sees the whole surface,
  # and `main-red.yml` acts on it. That split is the whole design; a selective
  # push run would leave nothing covering the rest.
  #
  # It publishes the selection as an artifact AND its digest as an output. The
  # digest is what makes the shards' agreement checkable: every shard records
  # the digest it ran, and the aggregate refuses a union whose shards do not all
  # report this one. If this job fails, the shards are skipped and the aggregate
  # fails closed on `needs.required-tests-shard.result` -- it never reads a
  # missing selection as "nothing to do".
  select:
    name: select
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.pick.outputs.digest }}
      scope: ${{ steps.pick.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          # affected_tests.py diffs against the group's base commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      # REQUIRED, not an optimisation. Selection imports every conftest to see
      # what they load at runtime, and tests/conftest.py needs pytest and
      # langgraph; on a bare runner that raises and affected_tests.py falls back
      # to ALL. That fallback is correct (it is the only safe direction) but it
      # made the whole gate inert while costing the overhead -- caught by
      # cross-family review, which reproduced the missing-pytest failure.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Pick what this run must cover
        id: pick
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "merge_group" ] && [ -n "${BASE:-}" ]; then
            # --gate, not the advisory PR-time selection: ALL unless the diff
            # shape carries a completeness argument (affected_tests.provable_shape).
            python scripts/affected_tests.py --gate --base "$BASE" --out affected.txt
            # Drop files that collect nothing under this gate's -m "not slow",
            # BEFORE the digest, so a slow-only file neither fails coverage nor
            # makes its shard exit 5.
            python scripts/ci_required_tests.py \
              --exclude-from .github/heavy-test-files.txt \
              --prune-to-collectible affected.txt
          else
            echo ALL > affected.txt
          fi
          DIGEST="$(python scripts/ci_required_tests.py --print-selection-digest affected.txt)"
          if [ "$(cat affected.txt)" = "ALL" ]; then SCOPE=ALL; else SCOPE=affected; fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          {
            echo "### Selection: $SCOPE"
            echo ""
            echo "\`$DIGEST\`"
            echo ""
            echo '```'
            head -c 60000 affected.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: affected-selection
          path: affected.txt
          if-no-files-found: error

  required-tests-shard:
    # Deliberately NOT `required-tests`: only the aggregate may carry the
    # protection context, or a green shard could satisfy it alone.
    name: required-tests shard ${{ matrix.shard }}/6
    # ONE heavy run per change (founder 2026-09-30: "cut the double CI run in
    # the merge queue"). Every PR reaches main through the merge queue, which
    # runs these shards on the merge-group commit -- the tree that actually
    # lands. Running them on the PR too was a second full run of the same code,
    # ~10-17 min of every PR's wall clock. The aggregate below still REPORTS on
    # the PR (it cannot be skipped), explicitly deferring to the queue.
    if: github.event_name != 'pull_request'
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One red shard must not cancel the rest: the aggregate would then report
      # missing shards instead of the actual failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - uses: actions/checkout@v4

      # This host only plans the shard; dependencies live in the oracle image.
      # Enabling pip caching here fails cleanup on a cold host with no pip cache.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          name: affected-selection

      # BEFORE the install, which is the cost: ~48 s a shard, paid six times a
      # group even by a shard that owns two tests. Needs only the stdlib and the
      # checkout, so it is free. Prints ALL, or this shard's selected-file
      # count; when the count is 0 it also writes the empty junit and manifest
      # the aggregate needs, so a shard with nothing to do still reports in the
      # same shape as one that ran (a shard that simply vanished must keep
      # failing the gate).
      - name: Does this shard own any selected test
        id: plan
        run: |
          mkdir -p shard-out
          COUNT="$(python scripts/ci_required_tests.py \
            --junit "shard-out/junit-shard-${{ matrix.shard }}.xml" \
            --exclude-from .github/heavy-test-files.txt \
            --affected affected.txt --shard "${{ matrix.shard }}/6" \
            --profile affected --selection "${{ needs.select.outputs.digest }}" \
            --plan-shard)"
          echo "this shard owns: $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      # WHERE THE SHARD RUNS: the Linux oracle container, as uid 1001 -- the
      # venue linux-jail-proof already uses (its header has the why). On the
      # bare runner bubblewrap cannot make a jail, so every jail-backed test in
      # the required surface skips. The browser no-skip assertion rejects the
      # preview skips; ordinary jail cases count toward the skip budget.
      # The image carries the dependencies, the
      # `browser` extra and Chromium (docker/linux-oracle.Dockerfile), so the
      # host installs nothing. The container gets linux-jail-proof's
      # per-container exceptions and nothing more: seccomp and systempaths
      # unconfined plus the named `ta-jail-userns` AppArmor profile. Those are
      # broad for that one throwaway container, not an allowlist; no host
      # sysctl, no privileged container, no added capability. If no jail can be
      # made the oracle exits 3 before the runner starts: no manifest, the
      # aggregate reports the shard missing, the gate is red. Nothing retries.
      - name: Allow user namespaces for the jail container only
        if: steps.plan.outputs.count != '0'
        env:
          PROFILE: ${{ runner.temp }}/ta-jail-userns
        run: |
          set -euo pipefail
          # Unconfined like Docker's apparmor=unconfined, plus the one permission
          # the kernel's userns restriction withholds. Applied only to the
          # containers below, by name.
          printf '%s\n' \
            'abi <abi/4.0>,' \
            'include <tunables/global>' \
            'profile ta-jail-userns flags=(unconfined) {' \
            '  userns,' \
            '}' > "$PROFILE"
          sudo apparmor_parser -r "$PROFILE"

      # The whole-surface path, unchanged from before the selection existed:
      # same command, same `shard` profile, same 1000-test floor. A push,
      # schedule or dispatch run always lands here.
      - name: Run this shard of the required test surface
        if: steps.plan.outputs.count == 'ALL'
        run: |
          set -euo pipefail
          mkdir -p shard-out
          # The shard applies the same quarantine comparison to its own tests
          # (a red shard names its new failures), but the AGGREGATE is the gate.
          #
          # --exclude-from drops the files holding most of the heavy wall
          # clock; they run in `heavy-tests` on the hourly schedule instead.
          # Excluding them was VERIFIED safe, not assumed: every failure the
          # exclusion run reported was also failing in the same-tree full run.
          # NOT "on every main push" — app-performed merges raise no push
          # event. See the `schedule:` trigger comment.
          #
          # Everything after `--` is the runner's own command line, unchanged;
          # shard-out is bound at /out, so the junit and the manifest beside it
          # land where they always did. TINYASSETS_DATA_DIR keeps the suite off
          # the tree and off any host state, as before (the conftest already
          # forces mock providers and sqlite_only storage).
          python scripts/linux_oracle.py --required-runner --out shard-out \
            --apparmor ta-jail-userns \
            --env TINYASSETS_DATA_DIR=/tmp/ta-data \
            --env CI=true --env GITHUB_ACTIONS=true \
            --env "GITHUB_STEP_SUMMARY=/out/summary-shard-${{ matrix.shard }}.md" \
            -- \
            --junit "/out/junit-shard-${{ matrix.shard }}.xml" \
            --exclude-from .github/heavy-test-files.txt \
            --shard "${{ matrix.shard }}/6" --profile shard

      # The selective path: this shard's slice of the entry's own selection.
      # The `affected` profile's floor is 0 because a selection can honestly be
      # one test -- the aggregate's COVERAGE check is what replaces the floor,
      # and it is exact: every selected file must report a case.
      - name: Run this shard of the selection
        if: steps.plan.outputs.count != '0' && steps.plan.outputs.count != 'ALL'
        run: |
          set -euo pipefail
          mkdir -p shard-out
          # affected.txt sits in the checkout, so the oracle's tree copy carries
          # it to /work beside the runner.
          python scripts/linux_oracle.py --required-runner --out shard-out \
            --apparmor ta-jail-userns \
            --env TINYASSETS_DATA_DIR=/tmp/ta-data \
            --env CI=true --env GITHUB_ACTIONS=true \
            --env "GITHUB_STEP_SUMMARY=/out/summary-shard-${{ matrix.shard }}.md" \
            -- \
            --junit "/out/junit-shard-${{ matrix.shard }}.xml" \
            --exclude-from .github/heavy-test-files.txt \
            --affected affected.txt --shard "${{ matrix.shard }}/6" \
            --profile affected --selection "${{ needs.select.outputs.digest }}"

      - name: Publish the runner's summary
        # The runner wrote it inside the container; always(), so a red shard
        # still says why on the run page.
        if: always() && steps.plan.outputs.count != '0'
        run: |
          if [ -f "shard-out/summary-shard-${{ matrix.shard }}.md" ]; then
            cat "shard-out/summary-shard-${{ matrix.shard }}.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload shard result
        # always(): a red shard's junit and manifest are what let the aggregate
        # report the real failures rather than "missing shard".
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-required-shard-${{ matrix.shard }}
          path: shard-out/
          if-no-files-found: warn
          overwrite: true

  # PR-time slice of the suite (2026-10-01). With the shards queue-only, a PR
  # met the Linux suite for the first time AFTER it was stamped and queued, so
  # every test failure surfaced as a queue drop (14 PRs were dropped ~30 times
  # in one day). This runs the tests the change can affect -- import graph
  # plus path mentions, the whole suite when unsure (scripts/affected_tests.py)
  # -- on the PR, before anyone stamps it.
  #
  # Required through the required-tests aggregate: a failed, skipped or cancelled
  # PR shard blocks admission. The queue still checks the combined commit.
  affected-tests:
    name: affected-tests ${{ matrix.shard }}/2
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull_request checkout is the merge commit; HEAD^1 is the base
          # tip, so HEAD^1..HEAD is exactly what merging this PR changes.
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Select the tests this change can affect
        run: |
          python scripts/affected_tests.py --pr --base HEAD^1 --out affected.txt
          { echo "### Selection"; echo; echo '```'; head -c 60000 affected.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Run this shard of the selection
        env:
          TINYASSETS_DATA_DIR: ${{ runner.temp }}/ta-data
          GITHUB_STEP_SUMMARY: shard-out/summary-affected-${{ matrix.shard }}.md
        run: |
          set -euo pipefail
          mkdir -p shard-out
          python scripts/ci_required_tests.py \
            --junit "shard-out/junit-affected-${{ matrix.shard }}.xml" \
            --exclude-from .github/heavy-test-files.txt \
            --affected affected.txt \
            --shard "${{ matrix.shard }}/2" --profile affected

      - name: Publish the runner's summary
        if: always()
        run: |
          if [ -f "shard-out/summary-affected-${{ matrix.shard }}.md" ]; then
            cat "shard-out/summary-affected-${{ matrix.shard }}.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload affected shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-affected-shard-${{ matrix.shard }}
          path: shard-out/
          if-no-files-found: warn
          overwrite: true

  required-tests:
    # This exact string is the branch-protection context. Renaming the job
    # ORPHANS the old required context: it stays "Expected — waiting for
    # status" forever and every PR blocks indefinitely (it does NOT fail open;
    # corrected 2026-08-02 per Codex review). Change the name only together
    # with the `gh api` protection update in
    # docs/decisions/ADR-003-required-test-aggregator.md.
    name: required-tests
    needs: [select, required-tests-shard, affected-tests, structural-guards, core-capabilities]
    # `always()` is the ONE condition this job may carry, and it is required,
    # not optional. Without it a failed or cancelled shard makes GitHub SKIP
    # this job, and a skipped required check is accepted by branch protection
    # as satisfied — a red shard would merge green. always() cannot evaluate
    # false, so the job cannot be skipped: it always runs and always reports.
    # Pinned by test_required_tests_cannot_decline_to_report.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require structural guards on every event
        env:
          STRUCTURAL_RESULT: ${{ needs.structural-guards.result }}
          CAPABILITY_RESULT: ${{ needs.core-capabilities.result }}
        run: |
          if [ "$STRUCTURAL_RESULT" != success ] || [ "$CAPABILITY_RESULT" != success ]; then
            echo "::error::Fix structural-guards using its repair instructions, then rerun Tests; it must finish successfully."
            exit 1
          fi

      - name: Require PR structural guards and affected tests
        if: github.event_name == 'pull_request'
        env:
          STRUCTURAL_RESULT: ${{ needs.structural-guards.result }}
          AFFECTED_RESULT: ${{ needs.affected-tests.result }}
        run: |
          if [ "$STRUCTURAL_RESULT" != success ] || [ "$AFFECTED_RESULT" != success ]; then
            echo "::error::PR checks did not pass (structural=$STRUCTURAL_RESULT, affected=$AFFECTED_RESULT). Fix the failures in structural-guards or affected-tests, then rerun Tests; cancelled or skipped jobs must execute successfully."
            exit 1
          fi
          echo "PR guards and affected tests passed; the queue will check the combined commit."

      - name: Download shard results
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          pattern: junit-required-shard-*
          path: shards/
          merge-multiple: true

      # Not read from the `select` output: the aggregate judges the selection it
      # can actually READ, and then checks that file against the digest `select`
      # published. If `select` failed there is no artifact, this step fails, and
      # the gate is red -- a missing selection never reads as "nothing to do".
      - name: Download the selection
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: affected-selection

      - name: Decide the gate over the union of all shards
        if: github.event_name != 'pull_request' && needs.select.outputs.scope == 'ALL'
        env:
          SHARD_RESULT: ${{ needs.required-tests-shard.result }}
        run: |
          # The script fails on a shard job result other than success (even if
          # its files look complete) and on a MISSING, duplicated, truncated or
          # differently-split shard, before the quarantine comparison.
          # No `|| true`, no `continue-on-error` — the exit code IS the gate.
          python scripts/ci_required_tests.py --aggregate shards/ \
            --expect-shards 6 --shard-job-result "$SHARD_RESULT" \
            --junit junit.xml --min-ran 10700

      # The selective verdict. Everything above still applies -- shard set,
      # truncation, overlap, the quarantine comparison -- plus two checks that
      # exist because the 10,700 floor cannot: every shard must report the
      # digest `select` published, and every selected file must appear in the
      # union with at least one case (any outcome, skip included). A file that
      # reported nothing is a collapse and is named. `!= 'ALL'` rather than
      # `== 'affected'` so a `select` job that produced no output at all still
      # lands on a branch that fails closed.
      - name: Decide the gate over this entry's selection
        if: github.event_name != 'pull_request' && needs.select.outputs.scope != 'ALL'
        env:
          SHARD_RESULT: ${{ needs.required-tests-shard.result }}
        run: |
          python scripts/ci_required_tests.py --aggregate shards/ \
            --expect-shards 6 --shard-job-result "$SHARD_RESULT" \
            --junit junit.xml \
            --exclude-from .github/heavy-test-files.txt \
            --affected affected.txt --profile affected \
            --selection "${{ needs.select.outputs.digest }}"

      # The browser proofs must never read as satisfied by a SKIP, and these
      # tests skip themselves when Chromium will not launch
      # (`pytest.skip(f"Chromium is not available here: ...")`). Coverage
      # accepts a skip -- it has to, for platform-guarded files -- so without
      # this step a selective UI change could pass its gate without ever
      # executing its browser proof. Caught by cross-family review.
      #
      # Two steps rather than one because `ci_assert_junit_case` exits 1 on an
      # ABSENT case: on a selective union the marked cases OUTSIDE the selection
      # are legitimately absent, so there the assertion is restricted to the
      # selected files, and an empty intersection is an honest pass.
      - name: Require every browser proof in the shard union
        if: github.event_name != 'pull_request' && needs.select.outputs.scope == 'ALL'
        run: |
          # Collection discovers the current marker set. The report must show
          # each case passed; an unavailable browser must never become a skip.
          pip install -e '.[dev,browser]'
          python scripts/ci_assert_junit_case.py --junit junit.xml \
            --marker real_browser --label required-browser-proof

      - name: Require every SELECTED browser proof in the shard union
        if: github.event_name != 'pull_request' && needs.select.outputs.scope != 'ALL'
        run: |
          pip install -e '.[dev,browser]'
          python scripts/ci_assert_junit_case.py --junit junit.xml \
            --marker real_browser --only-files affected.txt \
            --label required-browser-proof

      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-required-tests
          path: junit.xml
          if-no-files-found: warn

  # The other half of the split: the COMPLETE surface, on a best-effort
  # schedule (one nominal slot per hour; delivered count and spacing are
  # unspecified — see the `schedule:` trigger comment).
  # NOT required — this is the post-merge tripwire, not the merge gate. It
  # exists because `required-tests` deliberately trades coverage for a wall
  # clock that fits main's commit cadence; without this the excluded files
  # would have no CI at all. Same quarantine ledger.
  #
  # This job is RED at baseline and a failure here is NOT by itself a
  # regression. Measured 2026-08-27 on the first run of the split: 2,236 run,
  # 114 failures, 107 of them outside `known-failing-tests.txt` -- 105 of
  # those concentrated in two files (test_deploy_prod_workflow.py 88,
  # test_retire_cheat_loop_deploy_fence.py 17). Until that baseline is triaged
  # to zero, compare a failure against the PREVIOUS heavy run before treating
  # it as caused by the commit that triggered it. Reverting on a red heavy
  # job without that comparison reverts the wrong change.
  # Tracked: docs/concerns/2026-08-27-full-tests-permanently-red.md
  #
  # Schedule and manual dispatch ONLY (2026-09-27). It used to be every
  # non-PR event, and once merges started raising `push` it ran on every
  # merge: 18 main pushes x ~41 min in one 4 h window, 15 of 15 red at
  # baseline, on a runner pool capped near 20 jobs that PR CI and the deploy
  # were queuing for. An hourly tripwire needs no per-merge copy. Naming the
  # events also keeps a future `merge_group` trigger from inheriting it.
  # docs/design-notes/2026-09-27-lean-ci-pipeline.md
  # Was `full-tests`, which re-ran the ENTIRE required suite a second time.
  # Measured on Linux CI run 33037400288: required-tests 7m26s / 10,700 tests;
  # full-tests 45m09s / 13,865. The ~3,100-test difference IS the heavy list;
  # the other 10,700 duplicated a job that had passed minutes earlier in the
  # same workflow.
  #
  # This runs through ci_required_tests.py, NOT raw pytest, deliberately.
  # Cross-family review found that raw pytest loses two things the old job had:
  # the quarantine ledger (17 current entries are in heavy-listed files, so a
  # raw run is red on an unchanged baseline) and the vacuity floor (a green
  # run of zero tests). `--profile heavy` selects a reviewed floor rather than
  # letting the job pick a number it can meet.
  heavy-tests:
    name: heavy-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run only the files the required gate excludes
        env:
          TINYASSETS_DATA_DIR: ${{ runner.temp }}/ta-data-heavy
        run: |
          mkdir -p "$TINYASSETS_DATA_DIR"
          python scripts/ci_required_tests.py --junit junit-heavy.xml \
            --include-from .github/heavy-test-files.txt \
            --profile heavy
      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-heavy-tests
          path: junit-heavy.xml
          if-no-files-found: warn

  slow-tests:
    name: slow-tests
    # Queue-only, like the shards above: skipped on the PR, run on the
    # merge-group commit before anything lands.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,browser]'
          python -m playwright install --with-deps chromium
      - name: Run slow/stress/race tests
        env:
          TINYASSETS_DATA_DIR: ${{ runner.temp }}/ta-data-slow
        run: |
          mkdir -p "$TINYASSETS_DATA_DIR"
          # Serial on purpose: these assert cross-process/locking behaviour and
          # sharing a worker pool with them would test the pool, not the code.
          # Both ignores are tray imports that die at COLLECTION on a headless
          # runner (Xlib "Bad display name") and take the whole job down with
          # an Interrupted — required-tests survives the same files only via
          # --continue-on-collection-errors.
          pytest -m slow -q --no-header -rfE --durations=10 \
            --ignore=tests/test_tinyassets_tray.py \
            --ignore=tests/desktop_install/test_packaged_runtime.py
