name: Tests

# The required-tests aggregate reports a verdict for every pull request and
# merge group. A path filter would leave unrelated changes waiting indefinitely
# for that required check. Test selection belongs inside the workflow.

on:
  pull_request:
    # No `paths:` — see above. Drafts get `opened`/`synchronize` too, so the gate
    # gives signal before a PR is marked ready and becomes auto-merge eligible.
    #
    # Not `edited`, `labeled`, `unlabeled`, or `issue_comment`. Those events do
    # not change the head SHA, so the check already reported for that SHA stays
    # in force. Starting a new run here cancelled the in-progress one
    # (cancel-in-progress is on for pull_request) and spent another ~15 minutes
    # on the same code: 140 of 331 PR runs in the 2026-10-12 sample. The
    # body's checks are pr-scope-guard.yml, a separate small job.
    #
    # Not `ready_for_review` either, for the same reason: marking a draft ready
    # leaves the SHA alone, and the new run cancelled the draft's run of that
    # SHA, so the aggregate's `always()` failed it as `structural=cancelled`
    # (every PR of 2026-11-04, #5407-#5416). One run per SHA.
    types: [opened, reopened, synchronize]
  # The merge queue. `required-tests` is a required check, and a queue waits
  # for every required check to report on the merge-group commit;
  # without this trigger nothing reports and every queued PR times out.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  # The post-merge check of every merge: the merge queue merges as
  # `github-merge-queue[bot]`, and its push starts runs, as the repo's
  # GITHUB_TOKEN's does not (merges by the app raised none, measured 2026-08-03,
  # before the queue). Entries the queue merges together move `main` once, so the
  # last of them gets the run: 96 push runs, every one the queue's, for the 110
  # commits `main` took on 2026-11-21 and 2026-11-22 (four groups finished at
  # 04:23-04:26 on 2026-11-21 and one run started, for the last). Red on `main` is
  # re-run once, then raises the `main-red` alarm (main-red.yml): the check that
  # `strict` status checks being off needs. Nothing is reverted automatically.
  #
  # `schedule` checks `main` hourly whether or not anything merged, and is the
  # only automatic run of `heavy-tests`. Runners are free on a public repo, so
  # the cadence is chosen for detection latency, not cost.
  #
  # It is BEST-EFFORT. The cron declares NOMINAL SLOTS, not a delivered rate:
  # GitHub drops scheduled runs under load. Measured on this repo 2026-08-03,
  # release-reconcile declares `*/15 * * * *` (96 runs/day) and actually fired
  # 16 in 24h — a 6x shortfall, with one 3h47m gap. So read the cron below as a
  # declaration of one nominal slot per hour, not a promise about how many
  # runs arrive or how far apart they land. That is acceptable for a check
  # beside the push run; it would NOT be acceptable for a merge gate, which is
  # why `required-tests` gates through `pull_request` and `merge_group`, whose
  # triggers are deterministic.
  #
  # Accepted side effect: `required-tests` and its shards have no job-level
  # `if:` that can skip them — the aggregate's `always()` cannot evaluate
  # false — so they run on the schedule too, repeating the PR's run.
  # (`heavy-tests` runs only what the required gate excludes, so it repeats
  # nothing.) It is deliberate — runners are free here, and the alternative is
  # a job-level `if:` on the REQUIRED job.
  #
  # That would fail OPEN, not closed. A skipped job reports
  # `conclusion=skipped`, and branch protection accepts a skipped required check
  # as satisfied — so a condition that was wrong in some edge case would merge
  # untested code silently. (Verified empirically 2026-08-03, when this was `full-tests`:
  # reported COMPLETED/SKIPPED on PR #2197, not pending. An earlier draft of
  # this comment claimed a job-level `if:` would strand PRs on "Expected"; that
  # is the behaviour of a *trigger-level* `paths:` filter, not a job `if:`, and
  # cross-family review corrected it.)
  #
  # Wasting a free runner is the cheaper failure than a required check that can
  # quietly pass without running.
  #
  # WHY HOURLY. `17 */3` declared 8 slots/day; this declares 24. That is a
  # change to what the repo DECLARES. GitHub documents that scheduled events
  # may be delayed or dropped and specifies no relationship between declared
  # and delivered rate, so the delivered effect is unknown and is to be
  # measured rather than assumed:
  #
  #     gh run list --workflow tests.yml --event schedule
  #
  # WHY NOT TIGHTER. The old `full-tests` measured 36-45 minutes, and non-PR runs
  # get a unique concurrency group (`github.run_id`) with cancel-in-progress
  # false. Whatever GitHub delivers, this workflow's own concurrency policy
  # will not replace one non-PR run with another; it does not follow that two
  # runs execute simultaneously, since runner capacity may serialize them. A
  # declared interval shorter than the job's runtime is therefore a policy
  # this file declines to adopt, not a prediction about what would happen.
  #
  # A fixed minute is therefore a policy about the DECLARATION only, pinned by
  # test_schedule_declares_at_most_one_nominal_slot_per_hour. Nothing here
  # claims runs cannot overlap: two nominally-hourly slots can be dispatched
  # minutes apart — the two runs above arrived 59 and 17 minutes after theirs.
  # Overlap is tolerated, not prevented: runners are free on a public repo, so
  # duplicated tripwire work costs nothing and corrupts nothing.
  #
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# `pull_request`, deliberately NOT `pull_request_target`: testing a PR means
# EXECUTING the PR's code, so it must run in the untrusted-by-default context
# where the token is read-only and secrets are withheld. The scope guard uses
# _target for the opposite reason — it only reads metadata and must not be
# editable by the PR it judges.
permissions:
  contents: read

concurrency:
  # PRs cancel superseded runs (only the latest head matters). Non-PR runs are
  # keyed per-RUN and never collide at all: grouping them by ref meant each push
  # killed the previous main run, so with a commit every ~10 min the post-merge
  # tripwire almost never finished — it looked like coverage while providing
  # none (found in cross-family review 2026-08-03).
  #
  # `run_id` rather than `sha`, per a second review round: keying by SHA still
  # collides when several scheduled runs land on an UNCHANGED main, and GitHub
  # replaces an existing *pending* run with a newer one — so a queued tripwire
  # run can be silently dropped. run_id makes every
  # non-PR run unique, so THIS workflow's concurrency policy has nothing to
  # replace — GitHub may still drop a queued job under load, which is a
  # separate mechanism this key cannot address.
  # cancel-in-progress stays conditional as defence in depth.
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The old stack's structural guards, under the selection the shards run under
  # (`affected_tests.py --gate`, see `select` below): a guard runs when its test file is
  # selected, and every guard runs when the selection is the whole surface. A diff no guard
  # can read runs none. The job reads the selection as the selector gives it, before the
  # shards' own exclusions (a guard on the heavy list still runs here). On a pull request
  # the diff is the PR's own (HEAD^1 of the merge commit is the base tip), so a builder
  # sees the guards the queue will run. Required through `required-tests`' needs.
  structural-guards:
    name: structural-guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install guard dependencies
        run: pip install -e '.[dev,browser]'
      - name: Run the structural guards this run's diff can reach, with repair instructions
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          SELECTION: ${{ runner.temp }}/structural-selection.txt
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "merge_group" ] && [ -n "${BASE:-}" ]; then
            python scripts/affected_tests.py --gate --base "$BASE" --out "$SELECTION"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/affected_tests.py --gate --base HEAD^1 --out "$SELECTION"
          else
            echo ALL > "$SELECTION"
          fi
          python -m scripts.ci_structural_guards --selection "$SELECTION"

  # The platform's spec change, validated when the run's diff touches openspec/: the diff the
  # structural guards read (the merge group's base, or HEAD^1 of the PR's merge commit), and
  # the whole change on every other event. Only `clean-sheet-platform`: `--all` fails on the
  # old stack's changes and specs, which the cutover deletes. Required through
  # `required-tests`' needs.
  openspec:
    name: openspec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate clean-sheet-platform when the diff touches openspec/
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "merge_group" ] && [ -n "${BASE:-}" ]; then
            CHANGED="$(git diff --name-only "$BASE" HEAD)"
          elif [ "$EVENT" = "pull_request" ]; then
            CHANGED="$(git diff --name-only HEAD^1 HEAD)"
          else
            CHANGED="openspec/"
          fi
          if ! grep -q '^openspec/' <<< "$CHANGED"; then
            echo "The diff touches nothing under openspec/."
            exit 0
          fi
          npx --yes @fission-ai/openspec@1.15.0 validate clean-sheet-platform

  # The process's own tests, beside the gates' scripts that outlast the old stack
  # (`scripts/tests/`). Plain pytest on the runner, on every event: no image, no old-stack
  # package, and no conftest. Required through `required-tests`' needs. Held by
  # platform/ci/guards/legs.test.ts, where the pin outlasts the Python suite.
  #
  # timeout-minutes is a watchdog, as the platform legs' are: about 6 x the slowest
  # measured run, for a runner up to five times slower than usual. The leg took 1m14s of
  # job in run 44872746964, the slowest of 100 Tests runs from 2026-11-18
  # (docs/decisions/untangle-2026-11/p6-tests-beside.md).
  process:
    name: process
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/process-requirements.txt
      - run: pip install -r scripts/process-requirements.txt
      - run: >-
          python -m pytest --noconftest -q -p no:cacheprovider
          scripts/tests

  # The TypeScript platform workspace (ADR-032): its Vitest tests, in the real workerd
  # runtime or in Node. Required through `required-tests`' needs; nothing here deploys.
  # One leg a workspace, in parallel. A matrix job's result is every leg's, so one red leg
  # fails `required-tests`. Every workspace in `platform/package.json` has its leg, the
  # sandbox's `test` split in two (workerd and guards; the runner as root), and the owner's
  # and the gateway's (each suite here, each memory leg in `platform-checks`). Each test's
  # budget is its size class's, one a project (platform/ci/classes.ts); the legs leave the
  # large class out (`--tags-filter=!large`), which `platform-sizes` runs. Each leg names
  # its shard, `1/1` when whole, as the sizes legs do: the owner's suite runs in two, so no
  # leg is twice as long as the next. Pinned by platform/ci/guards.
  # Full history: the owner's migration lock is held against the event's base.
  #
  # timeout-minutes is a watchdog, never a design figure: about 6 x the slowest leg's
  # measured time, since a runner up to five times slower than usual scales every test's
  # budget (platform/ci/classes.ts) and its leg takes that much longer, with a fifth to
  # spare, and a job's watchdog is fixed before its first step measures the runner. The
  # owner's shard 2/2 took 4m50s of job in merge-group run 43761103673, the slowest in runs
  # 43759409585, 43759511841, 43761103673 and 43762132768
  # (docs/decisions/untangle-2026-11/budgets-variance.md).
  platform-tests:
    name: platform-tests
    runs-on: ubuntu-latest
    timeout-minutes: 29
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: owner 1/2
            command: npm run test:workerd -w owner -- --shard=1/2
          - leg: owner 2/2
            command: npm run test:workerd -w owner -- --shard=2/2
          - leg: doors
            command: npm run test -w doors -- --shard=1/1
          - leg: files
            command: npm run test -w files -- --shard=1/1
          - leg: gateway
            command: npm run test:workerd -w gateway -- --shard=1/1
          - leg: codemode
            command: npm run test -w codemode -- --shard=1/1
          - leg: sandbox
            command: npm run test:workerd -w sandbox -- --shard=1/1
          - leg: runner
            command: npm run test:root -w sandbox -- --shard=1/1
          - leg: ci
            command: npm run test -w ci -- --shard=1/1
          - leg: contract
            command: npm run test -w contract -- --shard=1/1
          - leg: sources
            command: npm run test -w sources -- --shard=1/1
          - leg: starter
            command: npm run test -w starter -- --shard=1/1
          - leg: import
            command: npm run test -w import -- --shard=1/1
          - leg: deploy
            command: npm run test -w deploy -- --shard=1/1
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      # Each leg's Vitest JSON report, the input of `node ci/budgets.mjs` for the medium
      # budgets (ci/classes.ts), as `platform-sizes` uploads it for the large one. The leg's
      # own `--` hands its shard and these reporters to its script, which runs Vitest.
      - run: ${{ matrix.command }} --reporter=default --reporter=github-actions --reporter=json --outputFile.json=${{ runner.temp }}/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-report-${{ strategy.job-index }}
          path: ${{ runner.temp }}/report.json
          if-no-files-found: error
          overwrite: true

  # The platform's legs that are not Vitest runs, so measure no budget: the typecheck, the
  # owner's workerd memory leg (each chunk-wise path O(1) in its data's size, by differences
  # at checkpoints, ADR-037), and the gateway's (the egress door and the gateway, their real
  # bundles, the same way). Required through `required-tests`' needs.
  #
  # timeout-minutes is a watchdog: about 6 x the slowest leg's measured time, as
  # `platform-tests`' (the owner's memory, 4m11s of job in merge-group run 43759511841, the
  # slowest in runs 43759409585, 43759511841, 43761103673 and 43762132768).
  platform-checks:
    name: platform-checks
    runs-on: ubuntu-latest
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: typecheck
            command: npm run typecheck
          - leg: owner memory
            command: npm run test:memory -w owner
          - leg: gateway memory
            command: npm run test:memory -w gateway
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: ${{ matrix.command }}

  # The platform's large tests (platform/ci/classes.ts): production sizes, real-size data,
  # and anything slower than its project's medium budget, sharded so no shard is longer
  # than the medium legs' critical path. Required through `required-tests`' needs, on every
  # event: the PR's builder sees a production-size failure before anyone stamps it, and the
  # queue and the hourly run hold main to it. Every workspace with a large test has its
  # `test:sizes` here, every shard, `1/1` when whole (platform/ci/guards/legs.test.ts).
  #
  # timeout-minutes is a watchdog: about 6 x the slowest shard's measured time, as
  # `platform-tests`' (the owner's shard 3/3, 4m40s of job in merge-group run 43759511841,
  # the slowest in runs 43759409585, 43759511841, 43761103673 and 43762132768).
  platform-sizes:
    name: platform-sizes
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: owner 1/3
            command: npm run test:sizes -w owner -- --shard=1/3
          - leg: owner 2/3
            command: npm run test:sizes -w owner -- --shard=2/3
          - leg: owner 3/3
            command: npm run test:sizes -w owner -- --shard=3/3
          - leg: contract
            command: npm run test:sizes -w contract -- --shard=1/1
          - leg: files
            command: npm run test:sizes -w files -- --shard=1/1
          - leg: starter
            command: npm run test:sizes -w starter -- --shard=1/1
          - leg: runner
            command: npm run test:sizes -w sandbox -- --shard=1/1
          - leg: deploy
            command: npm run test:sizes -w deploy -- --shard=1/1
          - leg: ci
            command: npm run test:sizes -w ci -- --shard=1/1
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      # Each leg's Vitest JSON report, the input of `node ci/budgets.mjs` (ci/classes.ts), beside
      # Vitest's two reporters on a GitHub runner (the default and its failure annotations).
      # overwrite: a re-run of the whole run uploads each leg's report again.
      - run: ${{ matrix.command }} --reporter=default --reporter=github-actions --reporter=json --outputFile.json=${{ runner.temp }}/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sizes-report-${{ strategy.job-index }}
          path: ${{ runner.temp }}/report.json
          if-no-files-found: error
          overwrite: true

  # The owner app in a real browser (slice APP): Chromium at the Playwright version the
  # platform lockfile pins, against the doors in workerd. Required through
  # `required-tests`' needs. It fails, never skips, when Playwright or Chromium is missing.
  platform-app:
    name: platform-app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: Install Chromium at the pinned Playwright's version
        run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:app -w doors

  # The recorders, base against head (platform/ci/record.ts), on a pull request (base: HEAD^1
  # of its merge commit) and a merge group (its base), when the diff touches a platform file
  # other than prose: a recorder that differs fails its shard unless the PR body's `Recorders-Differ:`
  # line names it, and each shard's log shows its lines that differ, for the reviewer. The
  # body is read when the leg runs, so a re-run reads it as edited. Every other event has no
  # change to compare. Each shard records its part of base and head at once. Required through
  # `required-tests`' needs; held by platform/ci/guards/legs.test.ts.
  #
  # timeout-minutes is a watchdog: the queue's ceiling (`required-tests`' watchdog), since
  # about 6 x the slowest shard, as `platform-tests`', would be past it. The slowest shard
  # took 513 s (merge-group run 44924361778), in 300 Tests runs from 2026-11-21 to
  # 2026-11-23 (docs/decisions/untangle-2026-11/dry-run-timeout.md).
  platform-recorders:
    name: platform-recorders
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Compare the recorders' shard, base against head, with the body's declaration
        env:
          EVENT: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_REF: ${{ github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            BASE="$(git rev-parse HEAD^1)"; PR="$EVENT_PR"
          elif [ "$EVENT" = merge_group ]; then
            BASE="$GROUP_BASE"
            PR="$(python3 -c 'import sys; from scripts.review_checks import queued_pr; print(queued_pr(sys.argv[1]) or "")' "$GROUP_REF")"
          else
            echo "A $EVENT run compares no change."
            exit 0
          fi
          if ! [[ "$PR" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "::error::no pull request for this run ($EVENT)"
            exit 1
          fi
          python3 scripts/review_checks.py --gh-read "repos/$REPO/pulls/$PR" --jq '.body // ""' > "$RUNNER_TEMP/body.md"
          npm --prefix platform run record:check -- "$BASE" "$SHARD" "$RUNNER_TEMP/body.md"

  # The cutover's dry run (untangle B24, d3 §A10; tasks.md §10 step 5): the manifest
  # (platform/cutover.json) applied to this run's own checkout by platform/ci/dry-run.ts, its
  # carry-outs and deletes made, what an edit still loads kept and the tests it edits set aside,
  # then every platform-tests leg (`cutover-dry-run-legs` derives them from this file, less the
  # workspaces it deletes), the typecheck and the process leg run on that tree. Green when
  # nothing that stays, and is no edit, needs what goes. The tree is never pushed, no job holds
  # a secret, and nothing live is reached. Required through `required-tests`' needs, as the
  # platform legs are, on every event: strict status checks are off, so the merge group is
  # the one run of a PR merged onto the main it lands on
  # (docs/decisions/untangle-2026-11/dry-run-queue.md). Deleted at the cutover with dry-run.ts.
  #
  # timeout-minutes is a watchdog, about 6 x the slowest measured time as the platform legs'
  # are, held under the queue's ceiling (`required-tests`' watchdog). The legs job took 29 s
  # at its slowest and the checks 109 s. The dry run's legs, whose slowest took 436 s
  # (owner 2/2, run 45092062586), would pass the ceiling at 6 x, so they have the ceiling
  # less the legs job's. In 300 Tests runs from 2026-11-21 to 2026-11-23
  # (docs/decisions/untangle-2026-11/dry-run-timeout.md).
  cutover-dry-run-legs:
    name: cutover-dry-run-legs
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.legs.outputs.matrix }}
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - id: legs
        run: echo "matrix=$(node --experimental-strip-types --no-warnings ci/dry-run.ts legs)" >> "$GITHUB_OUTPUT"

  cutover-dry-run:
    name: cutover-dry-run
    needs: cutover-dry-run-legs
    runs-on: ubuntu-latest
    timeout-minutes: 27
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cutover-dry-run-legs.outputs.matrix) }}
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: node --experimental-strip-types --no-warnings ci/dry-run.ts apply
      - run: npm ci
      - run: ${{ matrix.command }}

  cutover-dry-run-checks:
    name: cutover-dry-run-checks
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
        working-directory: platform
      - run: node --experimental-strip-types --no-warnings platform/ci/dry-run.ts apply
      - run: npm ci
        working-directory: platform
      - run: npm run typecheck
        working-directory: platform
      - run: pip install -r scripts/process-requirements.txt
      - run: python -m pytest --noconftest -q -p no:cacheprovider scripts/tests

  # The required surface runs as SHARDS in parallel, then ONE aggregate job
  # (`required-tests`, below) decides the gate over the union. Measured before
  # the split: ~21,900 tests serially, 19-22 min on an idle runner (runs
  # 36284043853, 36283801757), 40+ under contention. Each test FILE is owned by
  # exactly one shard (ci_required_tests.shard_of: each venue packed on its own
  # by the measured per-file durations in .github/test-durations.json, path hash
  # for anything the table does not cover), so the split is complete and
  # disjoint by construction. Packed so, the slowest shard's tests took 569 to
  # 621 s in the junits of whole-surface runs 43940676068, 43939779247,
  # 43769559562 and 43705715555, about 15 minutes with the image build
  # (docs/decisions/untangle-2026-11/shard-2-time.md). A shard and `select`, which it
  # waits on, share the queue's ceiling (`required-tests`' watchdog): select about 2 x its
  # slowest, 125 s (merge-group run 44989843138), and a shard the rest, against the slowest
  # shard's 917 s (push run 45071657634), in 300 Tests runs from 2026-11-21 to 2026-11-23
  # (docs/decisions/untangle-2026-11/dry-run-timeout.md).
  #
  # Not pytest-xdist: parallelism is across RUNNERS, so no two shards share a
  # process, temp dir or sqlite file — the in-process nondeterminism documented
  # in ci_required_tests.py does not apply.
  #
  # The shard count appears twice — the matrix and `--expect-shards` in the
  # aggregate — and test_tests_workflow pins them equal. A shard added to one
  # and not the other is either a missing shard (gate red) or an unowned file
  # set (tests silently never run); the test is what stops the second.
  # What this run must cover, decided ONCE so six shards and the aggregate
  # cannot disagree about it (lean-CI lever L1,
  # docs/decisions/ADR-020-lean-ci-successor.md).
  #
  # On `merge_group` the queue branch is base_sha + this entry's commits, so
  # `affected_tests.py --base <base_sha>` is exactly the entry's own diff. On
  # EVERY other event -- push to main, schedule, dispatch -- the answer is ALL,
  # unconditionally: the post-merge run is the one that sees the whole surface,
  # and `main-red.yml` alarms on it. That split is the whole design; a selective
  # push run would leave nothing covering the rest.
  #
  # The selection is ALL for any diff that touches the old stack: its code, its
  # tests, its packaging, any Python outside `platform/`, or a path that starts its
  # image build (`build-image.yml`'s push paths: the deploy chain's workflows).
  # A diff confined to
  # the trees no Python imports (`affected_tests.TREES`: the platform, the prose,
  # the workflows, the provider files, the non-Python files under `scripts/`)
  # selects only the tests the reader map gives those trees, and none when the
  # map gives none.
  #
  # It publishes the selection as an artifact AND its digest as an output. The
  # digest is what makes the shards' agreement checkable: every shard records
  # the digest it ran, and the aggregate refuses a union whose shards do not all
  # report this one. If this job fails, the shards are skipped and the aggregate
  # fails closed on `needs.required-tests-shard.result` -- it never reads a
  # missing selection as "nothing to do".
  select:
    name: select
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      digest: ${{ steps.pick.outputs.digest }}
      scope: ${{ steps.pick.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          # affected_tests.py diffs against the group's base commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      # REQUIRED, not an optimisation. Selection imports every conftest to see
      # what they load at runtime, and tests/conftest.py needs pytest and
      # langgraph; on a bare runner that raises and affected_tests.py falls back
      # to ALL. That fallback is correct (it is the only safe direction) but it
      # made the whole gate inert while costing the overhead -- caught by
      # cross-family review, which reproduced the missing-pytest failure.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Pick what this run must cover
        id: pick
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "merge_group" ] && [ -n "${BASE:-}" ]; then
            # --gate, not the advisory PR-time selection: ALL unless the diff
            # shape carries a completeness argument (affected_tests.provable_shape).
            python scripts/ci_required_tests.py --ci-select gate --base "$BASE" --out affected.txt
          else
            python scripts/ci_required_tests.py --ci-select all --out affected.txt
          fi
          DIGEST="$(python scripts/ci_required_tests.py --print-selection-digest affected.txt)"
          if [ "$(cat affected.txt)" = "ALL" ]; then SCOPE=ALL; else SCOPE=affected; fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          {
            echo "### Selection: $SCOPE"
            echo ""
            echo "\`$DIGEST\`"
            echo ""
            echo '```'
            head -c 60000 affected.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: affected-selection
          path: affected.txt
          if-no-files-found: error

  required-tests-shard:
    # Deliberately NOT `required-tests`: only the aggregate may carry the
    # protection context, or a green shard could satisfy it alone.
    name: required-tests shard ${{ matrix.shard }}/6
    # ONE heavy run per change (founder 2026-09-30: "cut the double CI run in
    # the merge queue"). Every PR reaches main through the merge queue, which
    # runs these shards on the merge-group commit -- the tree that actually
    # lands. Running them on the PR too was a second full run of the same code,
    # ~10-17 min of every PR's wall clock. The aggregate below still REPORTS on
    # the PR (it cannot be skipped), explicitly deferring to the queue.
    if: github.event_name != 'pull_request'
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 26
    strategy:
      # One red shard must not cancel the rest: the aggregate would then report
      # missing shards instead of the actual failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - uses: actions/checkout@v4
        with:
          # test_shape_registry diffs against main. The shard runs in the linux
          # oracle, which bind-mounts this checkout at /src and re-inits a
          # one-commit repo at /work. Depth 1 leaves /src with no parent and no
          # origin/main (merge_group run 38208790984, shard 2/6). 0 fetches
          # main. The guard prefers github.event.merge_group.base_sha, passed
          # into the oracle below, because HEAD~1 is the previous queue entry
          # when a group holds more than one PR.
          fetch-depth: 0

      # This host only plans the shard; dependencies live in the oracle image.
      # Enabling pip caching here fails cleanup on a cold host with no pip cache.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          name: affected-selection

      # BEFORE the install, which is the cost: ~48 s a shard, paid six times a
      # group even by a shard that owns two tests. Needs only the stdlib and the
      # checkout, so it is free. Prints ALL, or this shard's selected-file
      # count; when the count is 0 it also writes the empty junit and manifest
      # the aggregate needs, so a shard with nothing to do still reports in the
      # same shape as one that ran (a shard that simply vanished must keep
      # failing the gate).
      - name: Does this shard own any selected test
        id: plan
        run: |
          mkdir -p shard-out
          COUNT="$(python scripts/ci_required_tests.py \
            --junit "shard-out/junit-shard-${{ matrix.shard }}.xml" \
            --exclude-from .github/heavy-test-files.txt \
            --affected affected.txt --shard "${{ matrix.shard }}/6" \
            --profile affected --selection "${{ needs.select.outputs.digest }}" \
            --plan-shard)"
          echo "this shard owns: $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      # WHERE THE SHARD RUNS: the Linux oracle container, as uid 1001 -- the
      # venue linux-jail-proof already uses (its header has the why). On the
      # bare runner bubblewrap cannot make a jail, so every jail-backed test in
      # the required surface skips. The browser no-skip assertion rejects the
      # preview skips; ordinary jail cases count toward the skip budget.
      # The image carries the dependencies, the
      # `browser` extra and Chromium (docker/linux-oracle.Dockerfile), so the
      # host installs nothing. The container gets linux-jail-proof's
      # per-container exceptions and nothing more: seccomp and systempaths
      # unconfined plus the named `ta-jail-userns` AppArmor profile. Those are
      # broad for that one throwaway container, not an allowlist; no host
      # sysctl, no privileged container, no added capability. If no jail can be
      # made the oracle exits 3 before the runner starts: no manifest, the
      # aggregate reports the shard missing, the gate is red. Nothing retries.
      - name: Allow user namespaces for the jail container only
        if: steps.plan.outputs.count != '0'
        env:
          PROFILE: ${{ runner.temp }}/ta-jail-userns
        run: |
          set -euo pipefail
          # Unconfined like Docker's apparmor=unconfined, plus the one permission
          # the kernel's userns restriction withholds. Applied only to the
          # containers below, by name.
          printf '%s\n' \
            'abi <abi/4.0>,' \
            'include <tunables/global>' \
            'profile ta-jail-userns flags=(unconfined) {' \
            '  userns,' \
            '}' > "$PROFILE"
          sudo apparmor_parser -r "$PROFILE"

      # The whole-surface path, unchanged from before the selection existed:
      # same command, same `shard` profile (no floor of its own). A push,
      # schedule or dispatch run always lands here.
      - name: Run this shard of the required test surface
        if: steps.plan.outputs.count == 'ALL'
        run: |
          set -euo pipefail
          mkdir -p shard-out
          # The shard applies the same quarantine comparison to its own tests
          # (a red shard names its new failures), but the AGGREGATE is the gate.
          #
          # --exclude-from drops the files holding most of the heavy wall
          # clock; they run in `heavy-tests` on the hourly schedule instead.
          # Excluding them was VERIFIED safe, not assumed: every failure the
          # exclusion run reported was also failing in the same-tree full run.
          # NOT "on every main push" — app-performed merges raise no push
          # event. See the `schedule:` trigger comment.
          #
          # Everything after `--` is the runner's own command line, unchanged;
          # shard-out is bound at /out, so the junit and the manifest beside it
          # land where they always did. TINYASSETS_DATA_DIR keeps the suite off
          # the tree and off any host state, as before (the conftest already
          # forces mock providers and sqlite_only storage).
          python scripts/prepare_oracle_runsc.py shard-out/gvisor
          python scripts/linux_oracle.py --required-runner --docker-engine --out shard-out \
            --env TA_REHEARSAL_RUNSC_DIR=/out/gvisor \
            --apparmor ta-jail-userns \
            --env TINYASSETS_DATA_DIR=/tmp/ta-data \
            --env CI=true --env GITHUB_ACTIONS=true \
            --env MERGE_GROUP_BASE_SHA=${{ github.event.merge_group.base_sha }} \
            --env "GITHUB_STEP_SUMMARY=/out/summary-shard-${{ matrix.shard }}.md" \
            -- \
            --junit "/out/junit-shard-${{ matrix.shard }}.xml" \
            --exclude-from .github/heavy-test-files.txt \
            --shard "${{ matrix.shard }}/6" --profile shard

      # The selective path: this shard's slice of the entry's own selection.
      # The `affected` profile's floor is 0 because a selection can honestly be
      # one test -- the aggregate's COVERAGE check is what replaces the floor,
      # and it is exact: every selected file must report a case.
      - name: Run this shard of the selection
        if: steps.plan.outputs.count != '0' && steps.plan.outputs.count != 'ALL'
        run: |
          set -euo pipefail
          mkdir -p shard-out
          # affected.txt sits in the checkout, so the oracle's tree copy carries
          # it to /work beside the runner.
          python scripts/prepare_oracle_runsc.py shard-out/gvisor
          python scripts/linux_oracle.py --required-runner --docker-engine --out shard-out \
            --env TA_REHEARSAL_RUNSC_DIR=/out/gvisor \
            --apparmor ta-jail-userns \
            --env TINYASSETS_DATA_DIR=/tmp/ta-data \
            --env CI=true --env GITHUB_ACTIONS=true \
            --env MERGE_GROUP_BASE_SHA=${{ github.event.merge_group.base_sha }} \
            --env "GITHUB_STEP_SUMMARY=/out/summary-shard-${{ matrix.shard }}.md" \
            -- \
            --junit "/out/junit-shard-${{ matrix.shard }}.xml" \
            --exclude-from .github/heavy-test-files.txt \
            --affected affected.txt --shard "${{ matrix.shard }}/6" \
            --profile affected --selection "${{ needs.select.outputs.digest }}"

      - name: Publish the runner's summary
        # The runner wrote it inside the container; always(), so a red shard
        # still says why on the run page.
        if: always() && steps.plan.outputs.count != '0'
        run: |
          if [ -f "shard-out/summary-shard-${{ matrix.shard }}.md" ]; then
            cat "shard-out/summary-shard-${{ matrix.shard }}.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload shard result
        # always(): a red shard's junit and manifest are what let the aggregate
        # report the real failures rather than "missing shard".
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-required-shard-${{ matrix.shard }}
          path: shard-out/
          if-no-files-found: warn
          overwrite: true

  # PR-time slice of the suite (2026-10-01). With the shards queue-only, a PR
  # met the Linux suite for the first time AFTER it was stamped and queued, so
  # every test failure surfaced as a queue drop (14 PRs were dropped ~30 times
  # in one day). This runs the tests the change can affect -- import graph
  # plus path mentions, the whole suite when unsure (scripts/affected_tests.py)
  # -- on the PR, before anyone stamps it.
  #
  # Required through the required-tests aggregate: a failed, skipped or cancelled
  # PR shard blocks admission. The queue still checks the combined commit.
  affected-tests:
    name: affected-tests ${{ matrix.shard }}/4
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull_request checkout is the merge commit; HEAD^1 is the base
          # tip, so HEAD^1..HEAD is exactly what merging this PR changes.
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Select the tests this change can affect
        run: |
          python scripts/ci_required_tests.py --ci-select pr --base HEAD^1 --out affected.txt
          python scripts/ci_required_tests.py --print-selection-digest affected.txt
          { echo "### Selection"; echo; echo '```'; head -c 60000 affected.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Preview rendering requires a bubblewrap PID namespace as well as
      # Chromium. Use the queue's oracle venue, including its jail preflight,
      # instead of the bare Ubuntu runner where user namespaces are restricted.
      - name: Allow user namespaces for the jail container only
        env:
          PROFILE: ${{ runner.temp }}/ta-jail-userns
        run: |
          set -euo pipefail
          printf '%s\n' \
            'abi <abi/4.0>,' \
            'include <tunables/global>' \
            'profile ta-jail-userns flags=(unconfined) {' \
            '  userns,' \
            '}' > "$PROFILE"
          sudo apparmor_parser -r "$PROFILE"

      - name: Run this shard of the selection
        run: |
          set -euo pipefail
          mkdir -p shard-out
          # The oracle invokes scripts/ci_required_tests.py inside the container.
          python scripts/prepare_oracle_runsc.py shard-out/gvisor
          python scripts/linux_oracle.py --required-runner --docker-engine --out shard-out \
            --env TA_REHEARSAL_RUNSC_DIR=/out/gvisor \
            --apparmor ta-jail-userns \
            --env TINYASSETS_DATA_DIR=/tmp/ta-data \
            --env CI=true --env GITHUB_ACTIONS=true \
            --env "GITHUB_STEP_SUMMARY=/out/summary-affected-${{ matrix.shard }}.md" \
            -- \
            --junit "/out/junit-affected-${{ matrix.shard }}.xml" \
            --exclude-from .github/heavy-test-files.txt \
            --affected affected.txt \
            --shard "${{ matrix.shard }}/4" --profile affected

      - name: Publish the runner's summary
        if: always()
        run: |
          if [ -f "shard-out/summary-affected-${{ matrix.shard }}.md" ]; then
            cat "shard-out/summary-affected-${{ matrix.shard }}.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload affected shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-affected-shard-${{ matrix.shard }}
          path: shard-out/
          if-no-files-found: warn
          overwrite: true

  required-tests:
    # This exact string is a required check (docs/ops/merge-queue-ruleset.json,
    # held to the job names by platform/ci/guards/required-checks.test.ts).
    # A rename the live ruleset has not taken leaves the old context
    # "Expected — waiting for status" and every PR blocked (it does NOT fail
    # open), so the ruleset takes it at the merge (docs/host-actions.md).
    name: required-tests
    # The gate's lasting shape is the platform's jobs and the process leg. The first four
    # are the old stack's Python jobs and the next two the dry run's, which leave at the
    # cutover.
    needs: [select, required-tests-shard, affected-tests, structural-guards, cutover-dry-run,
            cutover-dry-run-checks, platform-tests, platform-checks, platform-app,
            platform-sizes, platform-recorders, process, openspec]
    # `always()` is the ONE condition this job may carry, and it is required,
    # not optional. Without it a failed or cancelled shard makes GitHub SKIP
    # this job, and a skipped required check is accepted by branch protection
    # as satisfied — a red shard would merge green. always() cannot evaluate
    # false, so the job cannot be skipped: it always runs and always reports.
    # Pinned by test_required_tests_cannot_decline_to_report.
    if: always()
    runs-on: ubuntu-latest
    # The queue's ceiling. The queue fails a group whose required checks have not reported
    # within its check timeout (docs/ops/merge-queue-ruleset.json). So this job's watchdog,
    # added to the longest chain of watchdogs it waits on, is within it
    # (platform/ci/guards/required-checks.test.ts): a job that hangs is killed by its own
    # watchdog and named here, not left to the queue's timeout. A runner's wait to pick a
    # job up counts toward the queue's timeout and no watchdog. Its own is about 3 x its
    # slowest run's 92 s (push run 45000387004, of 300 Tests runs from 2026-11-21 to
    # 2026-11-23); the rest of the queue's timeout is the ceiling of the jobs it waits on
    # (docs/decisions/untangle-2026-11/dry-run-timeout.md).
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The job must have run and succeeded on every event. Which guards it ran is the
      # selection's to say; a skipped or cancelled job fails.
      - name: Require structural guards on every event
        env:
          STRUCTURAL_RESULT: ${{ needs.structural-guards.result }}
        run: |
          if [ "$STRUCTURAL_RESULT" != success ]; then
            echo "::error::Required checks failed (structural=$STRUCTURAL_RESULT). Fix the named job and rerun Tests."
            exit 1
          fi

      # Whether it validated is the diff's to say; a skipped or cancelled job fails.
      - name: Require the openspec leg on every event
        env:
          OPENSPEC_RESULT: ${{ needs.openspec.result }}
        run: |
          if [ "$OPENSPEC_RESULT" != success ]; then
            echo "::error::Required checks failed (openspec=$OPENSPEC_RESULT). Fix the named job and rerun Tests."
            exit 1
          fi

      # The TypeScript platform (ADR-032), its checks, its large tests, the owner app in a
      # browser, the recorders and the process leg gate every event: each must have run and
      # succeeded; skipped or cancelled fails. This step is the gate's lasting shape.
      - name: Require the platform's tests, the owner app's browser test, the recorders and the process leg
        env:
          PLATFORM_RESULT: ${{ needs.platform-tests.result }}
          CHECKS_RESULT: ${{ needs.platform-checks.result }}
          APP_RESULT: ${{ needs.platform-app.result }}
          SIZES_RESULT: ${{ needs.platform-sizes.result }}
          RECORDERS_RESULT: ${{ needs.platform-recorders.result }}
          PROCESS_RESULT: ${{ needs.process.result }}
        run: |
          if [ "$PLATFORM_RESULT" != success ] || [ "$CHECKS_RESULT" != success ] || [ "$APP_RESULT" != success ] || [ "$SIZES_RESULT" != success ] || [ "$RECORDERS_RESULT" != success ] || [ "$PROCESS_RESULT" != success ]; then
            echo "::error::Required legs did not pass (platform-tests=$PLATFORM_RESULT, platform-checks=$CHECKS_RESULT, platform-sizes=$SIZES_RESULT, platform-app=$APP_RESULT, platform-recorders=$RECORDERS_RESULT, process=$PROCESS_RESULT). Fix the named job and rerun Tests."
            exit 1
          fi

      # The cutover's dry run on every event: its legs and its checks must have run and
      # succeeded. A failed `cutover-dry-run-legs` skips `cutover-dry-run`, which fails here.
      - name: Require the cutover dry run
        env:
          DRY_RUN_RESULT: ${{ needs.cutover-dry-run.result }}
          DRY_RUN_CHECKS_RESULT: ${{ needs.cutover-dry-run-checks.result }}
        run: |
          if [ "$DRY_RUN_RESULT" != success ] || [ "$DRY_RUN_CHECKS_RESULT" != success ]; then
            echo "::error::The cutover dry run did not pass (cutover-dry-run=$DRY_RUN_RESULT, cutover-dry-run-checks=$DRY_RUN_CHECKS_RESULT): something that stays needs what the manifest (platform/cutover.json) deletes. Fix it or declare it there, then rerun Tests."
            exit 1
          fi

      - name: Require PR structural guards and affected tests
        if: github.event_name == 'pull_request'
        env:
          STRUCTURAL_RESULT: ${{ needs.structural-guards.result }}
          AFFECTED_RESULT: ${{ needs.affected-tests.result }}
        run: |
          if [ "$STRUCTURAL_RESULT" != success ] || [ "$AFFECTED_RESULT" != success ]; then
            echo "::error::PR checks did not pass (structural=$STRUCTURAL_RESULT, affected=$AFFECTED_RESULT). Fix the failures in structural-guards or affected-tests, then rerun Tests; cancelled or skipped jobs must execute successfully."
            exit 1
          fi
          echo "PR guards and affected tests passed; the queue will check the combined commit."

      - name: Download shard results
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          pattern: junit-required-shard-*
          path: shards/
          merge-multiple: true

      # Not read from the `select` output: the aggregate judges the selection it
      # can actually READ, and then checks that file against the digest `select`
      # published. If `select` failed there is no artifact, this step fails, and
      # the gate is red -- a missing selection never reads as "nothing to do".
      - name: Download the selection
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: affected-selection

      - name: Decide the gate over the union of all shards
        if: github.event_name != 'pull_request' && needs.select.outputs.scope == 'ALL'
        env:
          SHARD_RESULT: ${{ needs.required-tests-shard.result }}
        run: |
          # The script fails on a shard job result other than success (even if
          # its files look complete) and on a MISSING, duplicated, truncated or
          # differently-split shard, before the quarantine comparison.
          # No `|| true`, no `continue-on-error` — the exit code IS the gate.
          python scripts/ci_required_tests.py --aggregate shards/ \
            --expect-shards 6 --shard-job-result "$SHARD_RESULT" \
            --junit junit.xml --min-ran 2200 \
            --exclude-from .github/heavy-test-files.txt

      # The selective verdict. Everything above still applies -- shard set,
      # truncation, overlap, the quarantine comparison -- plus two checks that
      # exist because the union floor cannot: every shard must report the
      # digest `select` published, and every selected file must appear in the
      # union with at least one case (any outcome, skip included). A file that
      # reported nothing is a collapse and is named. `!= 'ALL'` rather than
      # `== 'affected'` so a `select` job that produced no output at all still
      # lands on a branch that fails closed.
      - name: Decide the gate over this entry's selection
        if: github.event_name != 'pull_request' && needs.select.outputs.scope != 'ALL'
        env:
          SHARD_RESULT: ${{ needs.required-tests-shard.result }}
        run: |
          python scripts/ci_required_tests.py --aggregate shards/ \
            --expect-shards 6 --shard-job-result "$SHARD_RESULT" \
            --junit junit.xml \
            --exclude-from .github/heavy-test-files.txt \
            --affected affected.txt --profile affected \
            --selection "${{ needs.select.outputs.digest }}"

      # The browser proofs must never read as satisfied by a SKIP, and these
      # tests skip themselves when Chromium will not launch
      # (`pytest.skip(f"Chromium is not available here: ...")`). Coverage
      # accepts a skip -- it has to, for platform-guarded files -- so without
      # this step a selective UI change could pass its gate without ever
      # executing its browser proof. Caught by cross-family review.
      #
      # Two steps rather than one because `ci_assert_junit_case` exits 1 on an
      # ABSENT case: on a selective union the marked cases OUTSIDE the selection
      # are legitimately absent, so there the assertion is restricted to the
      # selected files, and an empty intersection is an honest pass.
      - name: Require every browser proof in the shard union
        if: github.event_name != 'pull_request' && needs.select.outputs.scope == 'ALL'
        run: |
          # Collection discovers the current marker set. The report must show
          # each case passed; an unavailable browser must never become a skip.
          pip install -e '.[dev,browser]'
          python scripts/ci_assert_junit_case.py --junit junit.xml \
            --marker real_browser --label required-browser-proof

      - name: Require every SELECTED browser proof in the shard union
        if: github.event_name != 'pull_request' && needs.select.outputs.scope != 'ALL'
        run: |
          pip install -e '.[dev,browser]'
          python scripts/ci_assert_junit_case.py --junit junit.xml \
            --marker real_browser --only-files affected.txt \
            --label required-browser-proof

      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-required-tests
          path: junit.xml
          if-no-files-found: warn

  # The other half of the split: the COMPLETE surface, on a best-effort
  # schedule (one nominal slot per hour; delivered count and spacing are
  # unspecified — see the `schedule:` trigger comment).
  # NOT required — this is the post-merge tripwire, not the merge gate. It
  # exists because `required-tests` deliberately trades coverage for a wall
  # clock that fits main's commit cadence; without this the excluded files
  # would have no CI at all. Same quarantine ledger.
  #
  # This job is RED at baseline and a failure here is NOT by itself a
  # regression. Measured 2026-08-27 on the first run of the split: 2,236 run,
  # 114 failures, 107 of them outside `known-failing-tests.txt` -- 105 of
  # those concentrated in two files (test_deploy_prod_workflow.py 88,
  # test_retire_cheat_loop_deploy_fence.py 17). Until that baseline is triaged
  # to zero, compare a failure against the PREVIOUS heavy run before treating
  # it as caused by the commit that triggered it. Reverting on a red heavy
  # job without that comparison reverts the wrong change.
  # Tracked: docs/concerns/2026-08-27-full-tests-permanently-red.md
  #
  # Schedule and manual dispatch ONLY (2026-09-27). It used to be every
  # non-PR event, and once merges started raising `push` it ran on every
  # merge: 18 main pushes x ~41 min in one 4 h window, 15 of 15 red at
  # baseline, on a runner pool capped near 20 jobs that PR CI and the deploy
  # were queuing for. An hourly tripwire needs no per-merge copy. Naming the
  # events also keeps a future `merge_group` trigger from inheriting it.
  # docs/decisions/ADR-020-lean-ci-successor.md
  # Was `full-tests`, which re-ran the ENTIRE required suite a second time.
  # Measured on Linux CI run 33037400288: required-tests 7m26s / 10,700 tests;
  # full-tests 45m09s / 13,865. The ~3,100-test difference IS the heavy list;
  # the other 10,700 duplicated a job that had passed minutes earlier in the
  # same workflow.
  #
  # This runs through ci_required_tests.py, NOT raw pytest, deliberately.
  # Cross-family review found that raw pytest loses two things the old job had:
  # the quarantine ledger (17 current entries are in heavy-listed files, so a
  # raw run is red on an unchanged baseline) and the vacuity floor (a green
  # run of zero tests). `--profile heavy` selects a reviewed floor rather than
  # letting the job pick a number it can meet.
  heavy-tests:
    name: heavy-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run only the files the required gate excludes
        env:
          TINYASSETS_DATA_DIR: ${{ runner.temp }}/ta-data-heavy
        run: |
          mkdir -p "$TINYASSETS_DATA_DIR"
          python scripts/ci_required_tests.py --junit junit-heavy.xml \
            --include-from .github/heavy-test-files.txt \
            --profile heavy
      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-heavy-tests
          path: junit-heavy.xml
          if-no-files-found: warn
