name: Import window (manual)

# The cutover importer's runner (import_research.md §1, §3 and §4; import_host_research.md;
# tasks.md §9 item 7): one step of the import window a dispatch, run on the run's own import
# host against one verified backup copy a run, by platform/import/window.sh as root, the job
# (platform/import/, bundled here) in `docker run --rm node:22`. Deleted at the cutover with
# platform/import/.
#
# - The import host: a disposable Droplet a run, tinyassets-import-<run> in sfo3, which
#   census makes (none while another import host is up) and clean destroys after deleting
#   the copy (platform/import/host.py). It leaves for Cloudflare through one reserved IP
#   (IMPORT_RESERVED_IP), which the R2 and API tokens are pinned to, and it is checked to
#   before any copy and before any mode that hands it a credential. Its host key is made
#   here, recorded as a tag and pinned on every dispatch. Nothing reaches the production
#   droplet: the copy is read from the primary backup store with a read-only key.
# - mode: census (makes the run's host and copy when it has none, then counts), bundle,
#   stage, verify, wipe, admit, dlq, offsite (the real window alone: its final backup copied
#   to the final backup's R2 bucket, deploy/platform.json's, and read back), or clean
#   (unmount and delete the run's copy, then destroy its host).
# - run: the run's id, which keys its host, its work folder and its staging prefix, so
#   census -> bundle -> stage -> verify -> wipe run against one copy over several dispatches.
# - rehearsal: true by default, and then every owner is imported under its
#   `rehearsal-<run>-...` name. A real window run needs rehearsal false and confirm equal to
#   `window-<run>`; without both, the first step refuses before any other.
#
# Output: counts and owner ordinals alone, to the log and the job summary, with every
# import-window Droplet and its age. The job's own output is let out only through its release
# check (no principal, no owner key, no path of the copy); the per-owner table and the
# window's record stay 0600 on the import host.
#
# Secrets (`production`; platform/deploy/checklist.md, "The import window's credentials"):
# DO_SSH_KEY, IMPORT_DO_TOKEN and IMPORT_RESERVED_IP for every mode;
# IMPORT_SPACES_ACCESS_KEY_ID and IMPORT_SPACES_SECRET_ACCESS_KEY for census and offsite;
# IMPORT_EXCLUSION_LIST for bundle; IMPORT_R2_ACCESS_KEY_ID and IMPORT_R2_SECRET_ACCESS_KEY for
# stage, verify, wipe, admit, dlq and offsite, with IMPORT_CLOUDFLARE_API_TOKEN and IMPORT_KEY
# for the first five. The Cloudflare account id, which is no secret, is the repository
# variable CLOUDFLARE_ACCOUNT_ID, for those six; no token of the deploy kit's is read here.
# Each credential reaches the host on the SSH session's stdin. There, the job's reach the job
# on its own stdin (`docker run -i`), and the Spaces and off-site R2 keys reach rclone alone,
# in that one process's environment (window.sh): never an argument, an exported variable, a
# container's environment or config (`docker inspect`), a file or a log.
#
# clean destroys the run's host once it is held to its name, tags and kind (census tags it
# ta-kind-<rehearsal|window>, and every dispatch of the other kind is refused before the host
# is reached or destroyed), even when the host was never set up or lost the reserved IP (then
# it is not reached at all: its disk, and the copy on it, go with it); a clean that the host
# itself refuses destroys nothing.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'census | bundle | stage | verify | wipe | admit | dlq | offsite | clean'
        required: true
        default: census
        type: choice
        options: [census, bundle, stage, verify, wipe, admit, dlq, offsite, clean]
      run:
        description: "The run's id (lowercase letters, digits and dashes): its host, copy and staging"
        required: true
        type: string
      rehearsal:
        description: 'A rehearsal, under rehearsal- names (false only for the real window)'
        required: false
        default: true
        type: boolean
      confirm:
        description: 'A real window run only: window-<run>'
        required: false
        default: ''
        type: string
      delete_dead_letters:
        description: 'dlq only: delete the dead letters it reads'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# One group for every mode: a run's modes share one import host and one copy, and the
# reserved IP is on one host at a time. Nothing here reaches the production droplet, so the
# host-mutation and observation locks stay free for the old stack's deploys and diagnostics.
concurrency:
  group: import-window
  cancel-in-progress: false

jobs:
  window:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 345
    steps:
      - name: Refuse a run this dispatch may not make
        env:
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ inputs.run }}
          REHEARSAL: ${{ inputs.rehearsal }}
          CONFIRM: ${{ inputs.confirm }}
          DELETE_DEAD_LETTERS: ${{ inputs.delete_dead_letters }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          IMPORT_DO_TOKEN: ${{ secrets.IMPORT_DO_TOKEN }}
          IMPORT_RESERVED_IP: ${{ secrets.IMPORT_RESERVED_IP }}
          IMPORT_SPACES_ACCESS_KEY_ID: ${{ secrets.IMPORT_SPACES_ACCESS_KEY_ID }}
          IMPORT_SPACES_SECRET_ACCESS_KEY: ${{ secrets.IMPORT_SPACES_SECRET_ACCESS_KEY }}
          IMPORT_EXCLUSION_LIST: ${{ secrets.IMPORT_EXCLUSION_LIST }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          IMPORT_R2_ACCESS_KEY_ID: ${{ secrets.IMPORT_R2_ACCESS_KEY_ID }}
          IMPORT_R2_SECRET_ACCESS_KEY: ${{ secrets.IMPORT_R2_SECRET_ACCESS_KEY }}
          IMPORT_CLOUDFLARE_API_TOKEN: ${{ secrets.IMPORT_CLOUDFLARE_API_TOKEN }}
          IMPORT_KEY: ${{ secrets.IMPORT_KEY }}
        run: |
          set -euo pipefail
          refuse() { echo "::error::refused: $*"; exit 1; }
          case "${MODE}" in
            census|bundle|stage|verify|wipe|admit|dlq|offsite|clean) ;;
            *) refuse "no such mode" ;;
          esac
          [[ "${RUN_ID}" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]] \
            || refuse "a run's id is lowercase letters, digits and dashes, at most 64"
          if [ "${REHEARSAL}" = "true" ]; then
            [ -z "${CONFIRM}" ] || refuse "confirm is for a real window run alone (rehearsal false)"
          elif [ "${CONFIRM}" != "window-${RUN_ID}" ]; then
            refuse "a real window run needs rehearsal false and confirm window-<run>"
          fi
          if [ "${DELETE_DEAD_LETTERS}" = "true" ] && [ "${MODE}" != dlq ]; then
            refuse "delete_dead_letters is for dlq alone"
          fi
          if [ "${MODE}" = offsite ] && [ "${REHEARSAL}" = "true" ]; then
            refuse "offsite copies the real window's final backup alone, never a rehearsal's"
          fi
          needed=(DO_SSH_KEY IMPORT_DO_TOKEN IMPORT_RESERVED_IP)
          case "${MODE}" in
            census) needed+=(IMPORT_SPACES_ACCESS_KEY_ID IMPORT_SPACES_SECRET_ACCESS_KEY) ;;
            bundle) needed+=(IMPORT_EXCLUSION_LIST) ;;
            stage|verify|wipe|admit|dlq)
              needed+=(CLOUDFLARE_ACCOUNT_ID IMPORT_R2_ACCESS_KEY_ID IMPORT_R2_SECRET_ACCESS_KEY
                       IMPORT_CLOUDFLARE_API_TOKEN IMPORT_KEY) ;;
            offsite)
              needed+=(IMPORT_SPACES_ACCESS_KEY_ID IMPORT_SPACES_SECRET_ACCESS_KEY
                       CLOUDFLARE_ACCOUNT_ID IMPORT_R2_ACCESS_KEY_ID IMPORT_R2_SECRET_ACCESS_KEY) ;;
          esac
          missing=()
          for name in "${needed[@]}"; do
            [ -n "${!name:-}" ] || missing+=("${name}")
          done
          [ "${#missing[@]}" -eq 0 ] \
            || refuse "mode ${MODE} needs the secret(s) ${missing[*]}, which the environment does not hold"
          # A credential is one line with no space and no control character. One pasted with a
          # trailing CR or space, or holding a line break, is refused here by its name, before
          # any host is made or reached (window.sh's take refuses it again on the host).
          # DO_SSH_KEY is a key file's lines (ssh-keygen reads it before any host is made) and
          # IMPORT_EXCLUSION_LIST a list's (each line trimmed, each name held to the backup's
          # owners), so neither is one line.
          shaped=()
          for name in "${needed[@]}"; do
            case "${name}" in DO_SSH_KEY|IMPORT_EXCLUSION_LIST) continue ;; esac
            [[ "${!name}" != *[[:space:][:cntrl:]]* ]] || shaped+=("${name}")
          done
          [ "${#shaped[@]}" -eq 0 ] \
            || refuse "mode ${MODE}'s credential(s) ${shaped[*]} hold a space or a control character"
          [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[0-9a-f]{32}$ ]] \
            || refuse "the repository variable CLOUDFLARE_ACCOUNT_ID is no 32-hex account id"
          echo "mode ${MODE}, run ${RUN_ID}, $([ "${REHEARSAL}" = true ] && echo rehearsal || echo 'the real window')"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Name every import host and its age
        env:
          DO_TOKEN: ${{ secrets.IMPORT_DO_TOKEN }}
        run: python3 platform/import/host.py hosts --summary "${GITHUB_STEP_SUMMARY}"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bundle the job
        working-directory: platform
        run: |
          set -euo pipefail
          npm ci
          npm run build -w import
          # Beside the job, each read where it is written: the founder's tiers (the dark
          # control record's) and the live names the job reaches (the deploy kit's facts).
          jq -e '{ tiers }' deploy/control.json > "${RUNNER_TEMP}/control.json"
          node --experimental-strip-types deploy/facts.ts --import > "${RUNNER_TEMP}/facts.json"

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/do_deploy
          chmod 600 ~/.ssh/do_deploy
          ssh-keygen -y -f ~/.ssh/do_deploy > "${RUNNER_TEMP}/do_deploy.pub"

      - name: Find or make the run's import host
        id: host
        env:
          DO_TOKEN: ${{ secrets.IMPORT_DO_TOKEN }}
          IMPORT_RESERVED_IP: ${{ secrets.IMPORT_RESERVED_IP }}
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ inputs.run }}
          REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          set -euo pipefail
          # The kind census tags the host with, and every later dispatch is held to.
          kind=rehearsal
          [ "${REHEARSAL}" = true ] || kind=window
          python3 platform/import/host.py ensure --run "${RUN_ID}" --mode "${MODE}" \
            --kind "${kind}" --deploy-key "${RUNNER_TEMP}/do_deploy.pub" --output "${GITHUB_OUTPUT}"

      - name: Pin its host key
        id: pin
        if: steps.host.outputs.address != ''
        env:
          IMPORT_RESERVED_IP: ${{ secrets.IMPORT_RESERVED_IP }}
          RUN_ID: ${{ inputs.run }}
          HOSTKEY: ${{ steps.host.outputs.hostkey }}
        run: |
          python3 platform/import/host.py pin --run "${RUN_ID}" --hostkey "${HOSTKEY}" \
            --known-hosts "${RUNNER_TEMP}/import_known_hosts" --identity ~/.ssh/do_deploy

      - name: Check its egress is the reserved IP
        if: >-
          steps.host.outputs.address != '' &&
          contains(fromJSON('["census","stage","verify","wipe","admit","dlq","offsite"]'), inputs.mode)
        env:
          IMPORT_RESERVED_IP: ${{ secrets.IMPORT_RESERVED_IP }}
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ inputs.run }}
        run: |
          python3 platform/import/host.py egress --run "${RUN_ID}" --mode "${MODE}" \
            --known-hosts "${RUNNER_TEMP}/import_known_hosts" --identity ~/.ssh/do_deploy

      - name: Run the step on the import host
        id: run
        if: steps.host.outputs.address != ''
        env:
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ inputs.run }}
          REHEARSAL: ${{ inputs.rehearsal }}
          DELETE_DEAD_LETTERS: ${{ inputs.delete_dead_letters }}
          ADDRESS: ${{ steps.host.outputs.address }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          IMPORT_SPACES_ACCESS_KEY_ID: ${{ secrets.IMPORT_SPACES_ACCESS_KEY_ID }}
          IMPORT_SPACES_SECRET_ACCESS_KEY: ${{ secrets.IMPORT_SPACES_SECRET_ACCESS_KEY }}
          IMPORT_EXCLUSION_LIST: ${{ secrets.IMPORT_EXCLUSION_LIST }}
          IMPORT_R2_ACCESS_KEY_ID: ${{ secrets.IMPORT_R2_ACCESS_KEY_ID }}
          IMPORT_R2_SECRET_ACCESS_KEY: ${{ secrets.IMPORT_R2_SECRET_ACCESS_KEY }}
          IMPORT_CLOUDFLARE_API_TOKEN: ${{ secrets.IMPORT_CLOUDFLARE_API_TOKEN }}
          IMPORT_KEY: ${{ secrets.IMPORT_KEY }}
        run: |
          set -euo pipefail
          [[ "${ADDRESS}" =~ ^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$ ]]
          kind=rehearsal
          [ "${REHEARSAL}" = true ] || kind=window
          words=("${MODE}" "${RUN_ID}" "${kind}")
          [ "${DELETE_DEAD_LETTERS}" != true ] || words+=(delete)
          # Every session checks the host key pinned from the host's tag, and no other.
          opts=(-i ~/.ssh/do_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes
                -o "UserKnownHostsFile=${RUNNER_TEMP}/import_known_hosts")
          remote_stage="$(
            ssh "${opts[@]}" -o ConnectTimeout=10 "root@${ADDRESS}" \
                mktemp -d /tmp/tinyassets-import-window.XXXXXX
          )"
          [[ "${remote_stage}" =~ ^/tmp/tinyassets-import-window[.][A-Za-z0-9]+$ ]]
          cleanup() {
            # The stage's path, quoted here, on purpose.
            # shellcheck disable=SC2029
            ssh "${opts[@]}" "root@${ADDRESS}" "rm -rf -- $(printf '%q' "${remote_stage}")" || true
          }
          trap cleanup EXIT
          scp "${opts[@]}" \
              platform/import/dist/import.mjs platform/import/window.sh "${RUNNER_TEMP}/control.json" \
              "${RUNNER_TEMP}/facts.json" "root@${ADDRESS}:${remote_stage}/"
          # Each secret on the session's stdin, in window.sh's order (printf is a builtin: no
          # argument holds one).
          handed() {
            case "${MODE}" in
              census)
                printf '%s\n' "${IMPORT_SPACES_ACCESS_KEY_ID}" "${IMPORT_SPACES_SECRET_ACCESS_KEY}" ;;
              bundle) printf '%s\n' "${IMPORT_EXCLUSION_LIST}" ;;
              stage|verify|wipe|admit|dlq)
                printf '%s\n' "${CLOUDFLARE_ACCOUNT_ID}" "${IMPORT_R2_ACCESS_KEY_ID}" \
                  "${IMPORT_R2_SECRET_ACCESS_KEY}" "${IMPORT_CLOUDFLARE_API_TOKEN}" "${IMPORT_KEY}" ;;
              offsite)
                printf '%s\n' "${IMPORT_SPACES_ACCESS_KEY_ID}" "${IMPORT_SPACES_SECRET_ACCESS_KEY}" \
                  "${CLOUDFLARE_ACCOUNT_ID}" "${IMPORT_R2_ACCESS_KEY_ID}" \
                  "${IMPORT_R2_SECRET_ACCESS_KEY}" ;;
            esac
          }
          set +e
          handed | timeout 300m ssh "${opts[@]}" \
              -o ConnectTimeout=10 -o ServerAliveInterval=30 -o ServerAliveCountMax=50 \
              "root@${ADDRESS}" \
              "bash $(printf '%q' "${remote_stage}")/window.sh $(printf '%q ' "${words[@]}")" \
            | tee "${RUNNER_TEMP}/step.out"
          status=$?
          set -e
          {
            echo "### Import window: ${MODE}, run ${RUN_ID} (${kind}), exit ${status}"
            echo '```'
            cat "${RUNNER_TEMP}/step.out"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${status}" -ne 0 ]; then
            echo "::error::the ${MODE} step ended ${status} (3: it does not hold yet; see its counts)"
            exit 1
          fi

      - name: Destroy the run's import host
        # After the host's own clean; or, with no clean, when the host is not to be reached (no
        # address: it lost the reserved IP or records no one key) or its pin or set-up failed.
        # Never after a clean the host refused, nor for a host not held to its name and tags.
        if: >-
          always() && inputs.mode == 'clean' && steps.host.outputs.id != '' &&
          (steps.run.outcome == 'success' || steps.host.outputs.address == '' ||
           steps.pin.outcome == 'failure')
        env:
          DO_TOKEN: ${{ secrets.IMPORT_DO_TOKEN }}
          RUN_ID: ${{ inputs.run }}
          REHEARSAL: ${{ inputs.rehearsal }}
          DROPLET_ID: ${{ steps.host.outputs.id }}
        run: |
          set -euo pipefail
          kind=rehearsal
          [ "${REHEARSAL}" = true ] || kind=window
          python3 platform/import/host.py destroy --run "${RUN_ID}" --kind "${kind}" \
            --id "${DROPLET_ID}" | tee -a "${GITHUB_STEP_SUMMARY}"
