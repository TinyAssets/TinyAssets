name: Sandbox template (manual, founder-approved)

# The sandbox's E2B template (platform/sandbox/template/image.py, its spec and tag
# image.ts), built in the deploying E2B team with that team's key, from no host
# (Direction 8). The template is the image alone (Node, the engines from their
# locks, the user pool, the runner's loader): a runner change is a Worker deploy,
# and a build is due only when image.ts's tag moves (an engine's pin, the pool's
# size, the loader, image.py).
#
# Modes (checks.ts):
#   build - builds this tree's image, runs its standing checks with this
#           commit's runner and probes on throwaway sandboxes (each killed), tags
#           the passed pair at E2B and uploads passed.json, whose new entry and
#           the printed tag are then committed with the pin (wrangler.jsonc). Once a
#           tag: when E2B already holds a ready build of it in this team (a second
#           dispatch, or one after a failed check), it builds nothing and runs the
#           standing checks, and their record, on that build.
#   pair  - the pair check alone: the pinned template with this commit's runner
#           and probes, no build (the deploy kit runs the same before a deploy).
#
# Each run spends: a build and a few sandbox-minutes. Its secret comes from the
# main-only `production` environment's store, so a branch's copy of this file
# never reaches it (tests/test_workflow_production_environment.py).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'build | pair'
        required: true
        default: pair
        type: choice
        options: [build, pair]

permissions:
  contents: read

concurrency:
  group: sandbox-template
  cancel-in-progress: false

jobs:
  template:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ inputs.mode }}
    steps:
      # Nothing here pushes: no token is left in .git for npm's or pip's installs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install the platform's pinned tools (the bundles, the checks)
        working-directory: platform
        run: npm ci

      # image.py's build alone needs Python and E2B's SDK (from its hashed lock), so a
      # pair run installs neither.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: env.MODE == 'build'
        with:
          python-version: '3.13'

      - name: Install the template's E2B SDK from its hashed lock
        if: env.MODE == 'build'
        run: python3 -m pip install --require-hashes -r platform/sandbox/template/requirements.txt

      # The one step that holds the E2B key: the checks runner (checks.ts), on the E2B client
      # the Worker and the deploy kit use. In build mode it asks E2B whether this tree's tag
      # already has a ready build, and builds (image.py) only when it has none; an answer it
      # cannot read stops it before anything is spent. A ready build gets the checks and
      # their record alone, never a second build.
      - name: Build and check
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: >-
          node --experimental-strip-types --no-warnings
          --import ./platform/sandbox/template/resolve.mjs
          platform/sandbox/template/checks.ts "${MODE}"

      # An upload is a new record only: passed.json as checked out is no pass of this run.
      - name: Did this run record a pass
        id: record
        if: always()
        run: |
          rc=0
          git diff --quiet -- platform/sandbox/template/passed.json || rc=$?
          case "$rc" in
            0)
              echo "fresh=no" >> "$GITHUB_OUTPUT"
              echo "passed.json is unchanged: this run recorded no pass." | tee -a "$GITHUB_STEP_SUMMARY" ;;
            1)
              echo "fresh=yes" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::git could not compare passed.json ($rc)"
              exit 1 ;;
          esac

      - name: Keep the record of what passed
        if: always() && steps.record.outputs.fresh == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: passed-json
          path: platform/sandbox/template/passed.json
