name: Sandbox template (manual, founder-approved)

# The sandbox's E2B template (platform/sandbox/template/build.py), built in the
# deploying E2B team with that team's key, from no host (Direction 8). Since the
# runner by digest, the template is the image alone (Node, the engines from
# their locks, the user pool, the runner's loader): a runner change is a Worker
# deploy, and this runs only when build.py's tag moves (an engine's pin, the
# pool's size, the loader, the script).
#
# Modes:
#   build - builds the template, runs its three standing checks with this
#           commit's runner on throwaway sandboxes (each killed), tags the
#           passed pair at E2B and uploads passed.json, whose new entry and the
#           printed tag are then committed with the pin (wrangler.jsonc). Once a
#           tag: when E2B already holds a ready build of it in this team (a second
#           dispatch, or one after a failed check), it builds nothing and runs the
#           standing checks, and their record, on that build.
#   pair  - the pair check alone: the pinned template with this commit's
#           runner, no build (the deploy kit runs the same before a deploy).
#
# Each run spends: a build and a few sandbox-minutes. Its secret comes from the
# main-only `production` environment's store, so a branch's copy of this file
# never reaches it (tests/test_workflow_production_environment.py).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'build | pair'
        required: true
        default: pair
        type: choice
        options: [build, pair]

permissions:
  contents: read

concurrency:
  group: sandbox-template
  cancel-in-progress: false

jobs:
  template:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ inputs.mode }}
    steps:
      # Nothing here pushes: no token is left in .git for npm's or pip's installs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install the platform's pinned tools (the runner's bundle)
        working-directory: platform
        run: npm ci

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install the template's E2B SDK from its hashed lock
        run: python3 -m pip install --require-hashes -r platform/sandbox/template/requirements.txt

      # The one step that holds the E2B key. Whether E2B already has a ready build of the
      # tag is the E2B client's own check (sandbox/src/e2b.ts `ready`, the deploy kit's
      # too); an answer it cannot
      # read stops the step before anything is spent. A ready build gets build.py's own
      # checks and record (CHECKS), on this tree's tag, never a second Template.build.
      - name: Build and check
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          # build.py's main() after its build, driven rather than given a flag: build.py's
          # text is in the template's tag, so an edit to it would be a new, paid build.
          CHECKS: |
            import hashlib, json, os, sys, tempfile
            from pathlib import Path
            sys.path.insert(0, os.path.join(os.getcwd(), "platform", "sandbox", "template"))
            import build
            os.chdir(build.PLATFORM)
            name = f"{build.NAME}:{build.tag()}"
            if name != sys.argv[1]:
                raise SystemExit(f"this tree's template is {name}, not {sys.argv[1]}")
            with tempfile.TemporaryDirectory() as tmp:
                runner = build.bundle(Path(tmp) / "runner")
                logins = build.check_logins(name, runner)
                routes = build.route_probe(name, runner)
                matcher = build.check_matcher(name, runner)
                build.record_pass(name, runner, logins, routes, matcher)
                print(json.dumps({"template": name, "runner": hashlib.sha256(runner).hexdigest(),
                                  "install": matcher["install"]}))
        run: |
          set -euo pipefail
          if [ "${MODE}" = "pair" ]; then
            python3 platform/sandbox/template/build.py --check-pair
          else
            name="$(python3 platform/sandbox/template/build.py --tag-only)"
            ready="$(node --experimental-strip-types --input-type=module -e '
              const { E2b } = await import("./platform/sandbox/src/e2b.ts");
              console.log(await new E2b(process.env.E2B_API_KEY ?? "").ready(process.argv[1]));
            ' "$name")"
            case "$ready" in
              true)
                echo "E2B already holds a ready build of ${name} in this team: no build;" \
                  "its standing checks run on it." | tee -a "$GITHUB_STEP_SUMMARY"
                python3 -c "$CHECKS" "$name" ;;
              false)
                python3 platform/sandbox/template/build.py ;;
              *)
                echo "::error::E2B's ready-build check answered '${ready}'"
                exit 1 ;;
            esac
          fi

      # An upload is a new record only: passed.json as checked out is no pass of this run.
      - name: Did this run record a pass
        id: record
        if: always()
        run: |
          rc=0
          git diff --quiet -- platform/sandbox/template/passed.json || rc=$?
          case "$rc" in
            0)
              echo "fresh=no" >> "$GITHUB_OUTPUT"
              echo "passed.json is unchanged: this run recorded no pass." | tee -a "$GITHUB_STEP_SUMMARY" ;;
            1)
              echo "fresh=yes" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::git could not compare passed.json ($rc)"
              exit 1 ;;
          esac

      - name: Keep the record of what passed
        if: always() && steps.record.outputs.fresh == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: passed-json
          path: platform/sandbox/template/passed.json
