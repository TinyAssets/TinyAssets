name: Release desktop chat app (Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver greater than the previous signed desktop release
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - name: Require signing inputs and valid version
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          WIN_CSC_LINK: ${{ secrets.DESKTOP_WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_WIN_CSC_KEY_PASSWORD }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'version must be X.Y.Z' }
          if (-not $env:WIN_CSC_LINK -or -not $env:WIN_CSC_KEY_PASSWORD) { throw 'desktop signing secrets are missing' }
          $latest = (Get-Content tinyassets/onboarding/app_versions.json -Raw | ConvertFrom-Json).desktop.latest
          if ([version]$env:VERSION -le [version]$latest) { throw 'release version must exceed the page policy' }
      # No install scripts, and no signing secret in scope (as desktop-chat-app.yml).
      - name: Install desktop deps (no secrets)
        working-directory: desktop-app
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build signed NSIS update
        working-directory: desktop-app
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          WIN_CSC_LINK: ${{ secrets.DESKTOP_WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_WIN_CSC_KEY_PASSWORD }}
        run: |
          npm pkg set version=$env:VERSION
          Set-Content -Path src/update-channel.json -Value '{"enabled": true}' -NoNewline
          npx --no-install electron-builder --win nsis --x64 --publish never
          $setup = @(Get-ChildItem dist/TinyAssetsChatSetup-*-x64.exe)
          if ($setup.Count -ne 1 -or -not (Test-Path dist/latest.yml) -or
              -not (Test-Path "$($setup[0].FullName).blockmap")) { throw 'update assets missing' }
          npx --no-install asar extract-file dist/win-unpacked/resources/app.asar src/update-channel.json
          if (((Get-Content update-channel.json -Raw | ConvertFrom-Json).enabled) -ne $true) {
            throw 'release updater is disabled'
          }
          foreach ($file in @($setup[0].FullName, 'dist/win-unpacked/TinyAssets.exe')) {
            if ((Get-AuthenticodeSignature $file).Status -ne 'Valid') { throw "unsigned or invalid: $file" }
          }
      - name: Publish rolling update feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $assets = @(Get-ChildItem desktop-app/dist/TinyAssetsChatSetup-*-x64.exe | ForEach-Object FullName)
          $assets += @(Get-ChildItem desktop-app/dist/TinyAssetsChatSetup-*-x64.exe.blockmap | ForEach-Object FullName)
          $assets += (Resolve-Path desktop-app/dist/latest.yml).Path
          gh release view desktop-chat-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create desktop-chat-latest --title 'TinyAssets Desktop updates' --prerelease --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'could not create update release' }
          }
          gh release upload desktop-chat-latest @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'could not upload update assets' }
