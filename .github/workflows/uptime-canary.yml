name: Uptime canary

# Row H of the self-host migration (cloud-canary + out-of-band alarm sink).
# Spec: docs/exec-plans/active/2026-04-20-selfhost-uptime-migration.md.
#
# Host directive 2026-04-20: retire mcp.tinyassets.io/mcp as a public URL.
# Canonical is tinyassets.io/mcp ONLY. Canary probes the single canonical.
#
# What this closes:
#   - Pre-Row-H, Layer-1 uptime canary ran on the HOST's Windows Task
#     Scheduler. Host box offline = no canary = no alarm = no signal
#     that the platform is down. Host-fate-sharing defeats the canary.
#   - This workflow requests a five-minute schedule on GitHub's infrastructure
#     plus manual/deploy-completion triggers. Independent of the daemon host,
#     but GitHub may delay or drop scheduled jobs; this is not a cadence SLA.
#   - On 2 consecutive reds, automation opens / updates a GitHub issue
#     labeled `p0-outage`. Out-of-band alarm sink — zero new deps,
#     reuses issue infrastructure, host gets emailed by GitHub.
#   - On GREEN after reds, comments "RECOVERED" + closes the issue.
#
# Consecutive-state: open P0 issue IS the state. First red = log only.
# Second measured Layer-1 red = open issue. Literal green = recovery.

on:
  schedule:
    # Five-minute requested cadence, not a maximum observation gap. GitHub
    # documents possible delays/dropped scheduled jobs, not a ±1 minute bound.
    - cron: '*/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy prod"]
    types: [completed]

# Permissions: canary reads repo; alarm sink writes issues.
permissions:
  actions: read
  contents: read
  issues: write

# Avoid piled-up runs if probe or alarm step is slow.
concurrency:
  group: uptime-canary
  cancel-in-progress: false

env:
  # Single canonical public endpoint (host directive 2026-04-20).
  PROBE_URL: https://tinyassets.io/mcp
  ALARM_ISSUE_LABEL: p0-outage
  # Number of consecutive measured reds before alarming. This is an observation
  # threshold, not an elapsed-outage SLA; scheduler gaps remain a coverage gap.
  ALARM_THRESHOLD: 2

jobs:
  core-capabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ./.github/actions/core-capability-canary
        env:
          TINYASSETS_CORE_CANARY_CONFIG: ${{ secrets.TINYASSETS_CORE_CANARY_CONFIG }}
          TINYASSETS_WIKI_CANARY_TOKEN: ${{ secrets.TINYASSETS_WIKI_CANARY_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}

  probe:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # Combined outputs across handshake + tool-invocation sub-probes.
      # alarm-sink reads these same keys as before.
      status: ${{ steps.combine.outputs.status }}
      msg: ${{ steps.combine.outputs.msg }}
      overall: ${{ steps.combine.outputs.overall }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Layer-1a: MCP handshake. Proves the daemon answers `initialize`.
      - name: Probe canonical URL (handshake)
        env:
          TINYASSETS_WIKI_CANARY_TOKEN: ${{ secrets.TINYASSETS_WIKI_CANARY_TOKEN }}
        id: probe
        continue-on-error: true
        run: |
          set +e
          output=$(python scripts/mcp_public_canary.py --url "${PROBE_URL}" --verbose 2>&1)
          code=$?
          set -e
          # Escape newlines for $GITHUB_OUTPUT multiline capture.
          # Use a random delimiter so probe output containing bare CANARY_EOF
          # cannot close the heredoc early and corrupt $GITHUB_OUTPUT.
          _delim="EOF_$(tr -d '-' < /proc/sys/kernel/random/uuid)"
          {
            echo "handshake_status=$code"
            echo "handshake_msg<<${_delim}"
            echo "$output"
            echo "${_delim}"
          } >> "$GITHUB_OUTPUT"
          echo "=== handshake probe (${PROBE_URL}) exit=$code ==="
          echo "$output"
          # DO NOT exit here — we want to still run the tool canary if
          # handshake passed, and combine results in the summary step
          # below. continue-on-error=true ensures the step doesn't fail
          # the job on its own.

      # Layer-1b: tool-invocation canary. Proves a real tool handler
      # executes end-to-end — closes the "handshake-green, tool-handler-
      # crashed" gap. Only runs if handshake was green (if the daemon
      # isn't answering initialize, the tool canary can't progress past
      # step 1 anyway — skip to save log noise).
      - name: Tool-invocation canary (read_graph status)
        env:
          TINYASSETS_WIKI_CANARY_TOKEN: ${{ secrets.TINYASSETS_WIKI_CANARY_TOKEN }}
        id: tool_probe
        continue-on-error: true
        if: steps.probe.outputs.handshake_status == '0'
        run: |
          set +e
          output=$(python scripts/mcp_tool_canary.py \
              --url "${PROBE_URL}" --timeout 20 --verbose 2>&1)
          code=$?
          set -e
          _delim="EOF_$(tr -d '-' < /proc/sys/kernel/random/uuid)"
          {
            echo "tool_status=$code"
            echo "tool_msg<<${_delim}"
            echo "$output"
            echo "${_delim}"
          } >> "$GITHUB_OUTPUT"
          echo "=== tool canary (${PROBE_URL}) exit=$code ==="
          echo "$output"

      # Layer-1c: last_activity canary (Task #15). Proves node
      # execution is 24/7, not just MCP surface. Reads daemon.
      # last_activity_at from `read_graph target=graph` (same inspect
      # payload; the deprecated `universe` fat tool refuses anonymous
      # calls since #1441) and pages
      # if it's older than TINYASSETS_LAST_ACTIVITY_THRESHOLD_MIN
      # (default 30min). Closes the "MCP is green but node execution
      # is stalled" gap — exactly the state seen live 2026-04-22
      # before Task #14 landed the cloud-side worker.
      #
      # Only runs when both handshake AND tool-canary are green — if
      # the daemon isn't speaking MCP or its tool handler crashed,
      # last_activity_at is meaningless to check.
      - name: Last-activity canary (platform run ledger 24/7)
        env:
          TINYASSETS_WIKI_CANARY_TOKEN: ${{ secrets.TINYASSETS_WIKI_CANARY_TOKEN }}
        id: activity_probe
        continue-on-error: true
        if: >
          steps.probe.outputs.handshake_status == '0' &&
          steps.tool_probe.outputs.tool_status == '0'
        run: |
          set +e
          output=$(python scripts/last_activity_canary.py \
              --url "${PROBE_URL}" --timeout 20 --verbose 2>&1)
          code=$?
          set -e
          _delim="EOF_$(tr -d '-' < /proc/sys/kernel/random/uuid)"
          {
            echo "activity_status=$code"
            echo "activity_msg<<${_delim}"
            echo "$output"
            echo "${_delim}"
          } >> "$GITHUB_OUTPUT"
          echo "=== last-activity canary (${PROBE_URL}) exit=$code ==="
          echo "$output"

      # Layer-1d — revert-loop canary (BUG-023 Lane 4a). Catches the
      # "daemon is writing but every draft fails" class — distinct from
      # dark daemon (handshake red), broken tool handler (tool red), and
      # stalled worker (activity red). 2026-04-23 P0 signature: 67
      # consecutive REVERT verdicts on concordance while MCP stayed green.
      #
      # Runs only when handshake + tool are green; revert-loop is a
      # work-quality signal, meaningful only when MCP itself is healthy.
      # Does NOT require activity_probe green — activity can be fresh
      # (new writes happening) WHILE all those writes are failing; that
      # is the exact state this canary targets.
      - name: Revert-loop canary (work-quality 24/7)
        env:
          TINYASSETS_WIKI_CANARY_TOKEN: ${{ secrets.TINYASSETS_WIKI_CANARY_TOKEN }}
        id: revert_loop_probe
        continue-on-error: true
        if: >
          steps.probe.outputs.handshake_status == '0' &&
          steps.tool_probe.outputs.tool_status == '0'
        run: |
          set +e
          output=$(python scripts/revert_loop_canary.py \
              --url "${PROBE_URL}" --timeout 20 --verbose --format gha 2>&1)
          code=$?
          set -e
          _delim="EOF_$(tr -d '-' < /proc/sys/kernel/random/uuid)"
          {
            echo "revert_status=$code"
            echo "revert_msg<<${_delim}"
            echo "$output"
            echo "${_delim}"
          } >> "$GITHUB_OUTPUT"
          echo "=== revert-loop canary (${PROBE_URL}) exit=$code ==="
          echo "$output"

      # Layer-1e — wiki write-roundtrip canary (PROBE-003).
      # The scoped service token can write only the reserved canary
      # draft, restoring persisted write/read evidence without reopening
      # anonymous writes. If the secret is unavailable, the script keeps
      # the post-#1441 anonymous gate + persisted-read policy assertion,
      # so missing credential availability alone never makes uptime red.
      # BUG-028 context: a slug bug once silently broke bug filing while
      # every probe above stayed green — the read half keeps that cover.
      #
      # Runs only when handshake + tool are green; the wiki probe is
      # meaningless when MCP itself is down. Does NOT require activity
      # or revert green — the wiki surface is independent of node execution.
      - name: Wiki write-roundtrip canary (auto-heal pipeline 24/7)
        id: wiki_probe
        continue-on-error: true
        if: >
          steps.probe.outputs.handshake_status == '0' &&
          steps.tool_probe.outputs.tool_status == '0'
        env:
          TINYASSETS_WIKI_CANARY_TOKEN: ${{ secrets.TINYASSETS_WIKI_CANARY_TOKEN }}
        run: |
          set +e
          output=$(python scripts/wiki_canary.py \
              --url "${PROBE_URL}" --timeout 20 --verbose --format gha 2>&1)
          code=$?
          set -e
          _delim="EOF_$(tr -d '-' < /proc/sys/kernel/random/uuid)"
          {
            echo "wiki_status=$code"
            echo "wiki_msg<<${_delim}"
            echo "$output"
            echo "${_delim}"
          } >> "$GITHUB_OUTPUT"
          echo "=== wiki canary (${PROBE_URL}) exit=$code ==="
          echo "$output"

      # Classification never fails the step; only a measured red emits the
      # versioned failure receipt consumed by exact-attempt history reads.
      - name: Combine canary results
        id: combine
        if: always()
        env:
          HANDSHAKE_STATUS: ${{ steps.probe.outputs.handshake_status }}
          TOOL_STATUS: ${{ steps.tool_probe.outputs.tool_status }}
          ACTIVITY_STATUS: ${{ steps.activity_probe.outputs.activity_status }}
          REVERT_STATUS: ${{ steps.revert_loop_probe.outputs.revert_status }}
          WIKI_STATUS: ${{ steps.wiki_probe.outputs.wiki_status }}
          REVERT_OBSERVATION: ${{ steps.revert_loop_probe.outputs.revert_observation }}
          REVERT_REASON: ${{ steps.revert_loop_probe.outputs.revert_reason }}
          HANDSHAKE_MSG: ${{ steps.probe.outputs.handshake_msg }}
          TOOL_MSG: ${{ steps.tool_probe.outputs.tool_msg }}
          ACTIVITY_MSG: ${{ steps.activity_probe.outputs.activity_msg }}
          REVERT_MSG: ${{ steps.revert_loop_probe.outputs.revert_msg }}
          WIKI_MSG: ${{ steps.wiki_probe.outputs.wiki_msg }}
        run: python scripts/uptime_observations.py

      - name: Layer-1 measured red v1
        if: steps.combine.outputs.overall == 'red'
        run: exit 1

      - name: Layer-1 measured green v1
        if: steps.combine.outputs.overall == 'green'
        run: exit 0

  layer2-probe:
    # Hosted infrastructure has no authorized rendered-user session and must
    # not invoke an LLM or act as a universe. Record the missing observation;
    # user-directed rendered acceptance remains a separate required proof.
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      l2_status: ${{ steps.l2probe.outputs.l2_status }}
      l2_semantic: ${{ steps.l2probe.outputs.l2_semantic }}
    steps:
      - name: Record unavailable rendered acceptance
        id: l2probe
        run: |
          {
            echo "l2_status=unknown"
            echo "l2_semantic=authorized_rendered_session_unavailable"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Layer-2 rendered acceptance: UNKNOWN"
            echo ""
            echo "This hosted runner has no authorized rendered-user session."
            echo "No browser or LLM was invoked; this is not a provider outage."
            echo "Full hostless acceptance remains incomplete pending rendered proof."
          } >> "$GITHUB_STEP_SUMMARY"

  alarm-sink:
    # Runs on every tick so it can close issues after recovery too.
    # `if: always()` because the probe job intentionally exits non-zero
    # on red — without always(), alarm-sink would skip on every red run.
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gate on consecutive-red threshold + manage issue
        id: gate
        uses: actions/github-script@v7
        env:
          OVERALL: ${{ needs.probe.outputs.overall }}
          PROBE_STATUS: ${{ needs.probe.outputs.status }}
          PROBE_MSG: ${{ needs.probe.outputs.msg }}
          LABEL: ${{ env.ALARM_ISSUE_LABEL }}
          THRESHOLD: ${{ env.ALARM_THRESHOLD }}
          PROBE_URL: ${{ env.PROBE_URL }}
          PRODUCTION_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const overall = process.env.OVERALL;
            const label = process.env.LABEL;
            const threshold = parseInt(process.env.THRESHOLD, 10);
            const probeStatus = process.env.PROBE_STATUS;
            const probeMsg = process.env.PROBE_MSG || '';
            const now = new Date().toISOString();
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            // Set no-page defaults and classify before any REST call. A failed
            // deploy completion skips the probe, so its empty result is unknown
            // rather than evidence of recovery or another red observation.
            core.setOutput('page_eligible', 'false');
            core.setOutput('issue_number', '');
            core.setOutput('is_first_alarm', 'false');
            if (overall !== 'red' && overall !== 'green') {
              const unknownResult = overall || '(empty)';
              const warning = `uptime alarm sink received unknown overall=${JSON.stringify(unknownResult)}; no issue mutation or page`;
              core.warning(warning);
              await core.summary
                .addRaw(`### Uptime canary alarm sink\n\n- **overall**: \`${unknownResult}\`\n- **alarm action**: unknown result; no issue mutation or page\n`)
                .write();
              return;
            }

            // Only an exact-attempt measured Layer-1 receipt proves prior red.
            // Unknown/skipped observations break the chain; never search past
            // them for an older red. Unrelated job failures prove nothing.
            async function previousRunWasRed() {
              try {
                const branch = process.env.PRODUCTION_BRANCH || 'main';
                const prior = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner, repo: context.repo.repo,
                  workflow_id: 'uptime-canary.yml', branch,
                  status: 'completed', per_page: 5,
                });
                const runs = (prior.data.workflow_runs || []).filter(
                  r => String(r.id) !== process.env.GITHUB_RUN_ID,
                );
                // This bounded read never stitches across an unknown result.
                const run = runs[0];
                if (!run) return false;
                const age = Date.now() - Date.parse(run.updated_at);
                if (run.head_branch !== branch || run.status !== 'completed' ||
                    run.path !== '.github/workflows/uptime-canary.yml' ||
                    !Number.isSafeInteger(run.run_attempt) || run.run_attempt < 1 ||
                    !Number.isFinite(age) || age < 0 || age > 30 * 60 * 1000) {
                  core.warning('Prior Layer-1 receipt is unavailable, stale or wrong-source; not counted as red.');
                  return false;
                }
                const response = await github.rest.actions.listJobsForWorkflowRunAttempt({
                  owner: context.repo.owner, repo: context.repo.repo,
                  run_id: run.id, attempt_number: run.run_attempt, per_page: 100,
                });
                const jobs = response.data.jobs || [];
                if (response.data.total_count > jobs.length) return false;
                const probeJobs = jobs.filter(j => j.name === 'probe');
                if (probeJobs.length !== 1) return false;
                const job = probeJobs[0];
                if (job.run_id !== run.id || job.run_attempt !== run.run_attempt ||
                    job.status !== 'completed' || job.head_sha !== run.head_sha) return false;
                const receipts = (job.steps || []).filter(s => s.name === 'Layer-1 measured red v1');
                if (receipts.length !== 1 || receipts[0].status !== 'completed' ||
                    receipts[0].conclusion !== 'failure') return false;
                // Do not count a receipt from an attempt superseded during the read.
                const latest = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner, repo: context.repo.repo, run_id: run.id,
                });
                return latest.data.run_attempt === run.run_attempt &&
                  latest.data.status === 'completed' && latest.data.head_sha === run.head_sha;
              } catch (error) {
                core.warning('Prior Layer-1 receipt could not be verified; not counted as red.');
                return false;
              }
            }

            function formatBody(kind) {
              return [
                `**${kind}** @ ${now}`,
                ``,
                `- \`${process.env.PROBE_URL}\` → exit ${probeStatus}`,
                ``,
                `<details><summary>probe output</summary>`,
                ``,
                '```',
                probeMsg.trim() || '(empty)',
                '```',
                ``,
                `</details>`,
                ``,
                `Run: ${runUrl}`,
              ].join('\n');
            }

            // Outputs consumed by the Pushover paging step downstream.
            // Defaults are "no page" — only flipped when an issue is opened
            // or already open during red.
            core.setOutput('page_eligible', 'false');
            core.setOutput('issue_number', '');
            core.setOutput('is_first_alarm', 'false');

            if (overall === 'red') {
              // Only red creates the label. Green recovery must not create a
              // missing label, and unknown results returned before any REST call.
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label,
                    color: 'd73a4a',
                    description: 'Auto-opened by uptime canary on public MCP outage.',
                  });
                  console.log(`created label ${label}`);
                } else {
                  throw e;
                }
              }

              const openIssues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: label,
                per_page: 5,
              });
              const openIssue = openIssues.data[0] || null;

              if (openIssue) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: openIssue.number,
                  body: formatBody('RED'),
                });
                console.log(`appended RED to #${openIssue.number}`);
                // Escalation path — not a first alarm, but the ladder may
                // still re-page at 1h/4h/24h.
                core.setOutput('page_eligible', 'true');
                core.setOutput('issue_number', String(openIssue.number));
                core.setOutput('is_first_alarm', 'false');
                return;
              }

              const priorRed = await previousRunWasRed();
              if (priorRed) {
                const result = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `P0 Public MCP outage — ${now}`,
                  labels: [label],
                  body: [
                    `Auto-opened by the uptime canary after ${threshold} consecutive reds.`,
                    `This issue tracks the outage window; comments append per tick.`,
                    ``,
                    formatBody('RED (threshold crossed)'),
                  ].join('\n'),
                });
                console.log(`opened issue #${result.data.number} (threshold crossed)`);
                // First-alarm path — always pages.
                core.setOutput('page_eligible', 'true');
                core.setOutput('issue_number', String(result.data.number));
                core.setOutput('is_first_alarm', 'true');
              } else {
                console.log('first-red — not yet alarming. Next red will open issue.');
              }
              return;
            }

            // Literal green is the only recovery path. It can inspect an
            // existing incident but never creates a missing p0-outage label.
            if (overall === 'green') {
              const openIssues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: label,
                per_page: 5,
              });
              const openIssue = openIssues.data[0] || null;
              if (openIssue) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: openIssue.number,
                  body: formatBody('GREEN — RECOVERED'),
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: openIssue.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                console.log(`closed #${openIssue.number} as RECOVERED`);
              } else {
                console.log('steady green — no action');
              }
            }

      # Pushover paging — navigator 2026-04-22 §c P0 fix.
      # Today's 18h outage: canary probe was green→red correctly, alarm-sink
      # opened issue correctly, but host learned ~18h later (email+GH only).
      # Pushover app push arrives on phone; priority=2 (emergency) forces
      # sound even on silent mode + retries until the host acknowledges,
      # with retry/expire set by pushover_page.py's P0_RETRY_S / P0_EXPIRE_S.
      # Re-pages at 1h / 4h / 24h while the incident stays open without a
      # host comment (escalation ladder in scripts/pushover_page.py).
      #
      # Seeding secrets (host action — not in-workflow):
      #   gh secret set PUSHOVER_USER_KEY --body "<user key from pushover.net>"
      #   gh secret set PUSHOVER_APP_TOKEN --body "<app api token>"
      # Both secrets live at Settings → Secrets and variables → Actions.
      # When missing, the step no-ops (decision stays intact; send_pushover
      # returns ok=false with a 'missing' error and we still post the marker
      # comment to preserve audit trail).
      - name: Fetch issue comments for escalation decision
        id: comments
        if: steps.gate.outputs.page_eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
        run: |
          # Pull all comments (paginated), emit as a single JSON array.
          mkdir -p /tmp/pushover
          gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              --jq '.' > /tmp/pushover/comments_raw.json
          # `gh --paginate` concatenates per-page JSON arrays; merge them.
          python -c "
          import json, sys
          merged = []
          with open('/tmp/pushover/comments_raw.json', 'r', encoding='utf-8') as fp:
              text = fp.read().strip()
          # --paginate emits multiple arrays back-to-back; parse each.
          dec = json.JSONDecoder()
          i = 0
          while i < len(text):
              while i < len(text) and text[i] in ' \t\r\n':
                  i += 1
              if i >= len(text):
                  break
              obj, offset = dec.raw_decode(text, i)
              if isinstance(obj, list):
                  merged.extend(obj)
              i = offset
          with open('/tmp/pushover/comments.json', 'w', encoding='utf-8') as fp:
              json.dump(merged, fp)
          print(f'merged {len(merged)} comments')
          "

      - name: Pushover page
        id: page
        if: steps.gate.outputs.page_eligible == 'true'
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
        run: |
          set +e
          extra_args=()
          if [ "${{ steps.gate.outputs.is_first_alarm }}" = "true" ]; then
            extra_args+=(--first-alarm)
          fi
          output=$(python scripts/pushover_page.py \
              --issue-number "${{ steps.gate.outputs.issue_number }}" \
              --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --probe-url "${PROBE_URL}" \
              --probe-exit "${{ needs.probe.outputs.status }}" \
              --kind "PUBLIC_MCP_OUTAGE" \
              "${extra_args[@]}" \
              --comments-json /tmp/pushover/comments.json)
          code=$?
          set -e
          echo "$output"
          # Capture the MARKER line emitted only on successful page — the next
          # alarm-sink tick parses it back out of issue comments.
          marker=$(echo "$output" | awk -F'MARKER::' '/^MARKER::/ {print $2; exit}')
          if [ -n "$marker" ]; then
            printf 'marker=%s\n' "$marker" >> "$GITHUB_OUTPUT"
          fi
          exit $code

      - name: Post PAGED marker comment on issue
        if: steps.page.outputs.marker != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
          MARKER_BODY: ${{ steps.page.outputs.marker }}
        run: |
          # The marker is a single-line machine-readable record the next
          # tick's pushover_page.py reads back to compute elapsed-since-last.
          gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -f "body=${MARKER_BODY}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Uptime canary result"
            echo ""
            echo "- **${{ env.PROBE_URL }}** → exit \`${{ needs.probe.outputs.status }}\`"
            echo "- **overall** → **${{ needs.probe.outputs.overall }}**"
            echo "- **page_eligible** → \`${{ steps.gate.outputs.page_eligible }}\`"
            echo "- **is_first_alarm** → \`${{ steps.gate.outputs.is_first_alarm }}\`"
            echo "- **paged_this_tick** → \`${{ steps.page.outputs.marker != '' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
