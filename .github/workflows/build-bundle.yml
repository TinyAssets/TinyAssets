name: Build packaging artifacts

on:
  push:
    branches:
      - main
    paths:
      - "tinyassets/**"
      - "packaging/**"
      - ".github/workflows/build-bundle.yml"
  pull_request:
    # `ready_for_review` is NOT a default type, and `stage-and-probe` skips on a
    # draft; without it a PR marked ready keeps the draft run's skip until its
    # next push.
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "tinyassets/**"
      - "packaging/**"
      - ".github/workflows/build-bundle.yml"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  # One group per PR, so a new push cancels the superseded run. Every non-PR run
  # gets its OWN group via `run_id`, and `cancel-in-progress` is conditional on
  # top of that -- two layers, because a cancelled run here would be a
  # `release: published` run that packs and publishes the .mcpb, or the `push:
  # main` build of what landed. Neither may ever be interrupted by a PR or by a
  # later release. tests.yml adopted the same two layers after grouping non-PR
  # runs by ref let each push kill the previous main run.
  group: build-bundle-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stage-and-probe:
    name: Stage + import-probe both bundle and plugin
    # Drafts do not spend a runner here; `ready_for_review` above runs it for
    # real as soon as the PR is ready. Not a branch-protection context, which is
    # what makes skipping safe -- a skipped job reports `conclusion=skipped` and
    # branch protection accepts that as satisfied (see tests.yml's note on
    # `required-tests`). `release` and `push` are unaffected: the condition's
    # first clause is true for every non-PR event, so `pack-mcpb`'s `needs:` on
    # this job still resolves on a tagged release.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bundle deps for import probe
        run: |
          python -m pip install --upgrade pip
          # Install the same dep set as packaging/mcpb/pyproject.toml so
          # the subprocess import probe can resolve tinyassets.universe_server.
          python -m pip install \
            "fastmcp>=3.2,<4" \
            "mcp>=1.0" \
            "langgraph>=0.4,<0.5" \
            "langgraph-checkpoint-sqlite>=3.0,<4.0" \
            "langchain-core>=0.3,<0.4" \
            "pyyaml>=6.0" \
            "aiofiles>=24.1" \
            "json-repair>=0.30" \
            "tenacity>=9.0,<10.0"

      - name: Verify committed MCP Registry manifest is current
        run: python packaging/registry/generate_server_json.py --check

      - name: Stage MCPB bundle (with import probe)
        run: python packaging/mcpb/build_bundle.py

      - name: Stage claude-plugin runtime (with import probe)
        run: python packaging/claude-plugin/build_plugin.py

      - name: Verify committed plugin runtime matches live tinyassets/
        # The plugin runtime tree under
        # packaging/claude-plugin/.../runtime/tinyassets/ is tracked so
        # marketplace consumers can install from the cloned repo. If a
        # commit modifies tinyassets/ but forgets to re-run
        # build_plugin.py, the committed tree goes stale — CI would
        # otherwise pass silently because the build script re-stages
        # locally on each run. This check closes that gap.
        #
        # `git status --porcelain`, NOT `git diff`: a canonical file that is
        # brand new leaves an UNTRACKED mirror file after the build, and
        # `git diff` does not see untracked paths. workspace_pool.py and
        # workspace_fs.py were absent from the committed mirror for three
        # commits and every gate reported clean (2026-08-30).
        run: |
          STALE=$(git status --porcelain -- packaging/claude-plugin/plugins/tinyassets-universe-server/runtime/tinyassets)
          if [ -n "$STALE" ]; then
            echo "::error::Committed plugin runtime is stale. Run 'python packaging/claude-plugin/build_plugin.py' and commit the result."
            echo "$STALE"
            exit 1
          fi

      - name: Run packaging build tests
        run: |
          python -m pip install pytest
          python -m pytest tests/test_packaging_build.py -v

  pack-mcpb:
    name: Pack .mcpb on tagged release
    needs: stage-and-probe
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node (for @anthropic-ai/mcpb)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install bundle deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastmcp>=3.2,<4" \
            "mcp>=1.0" \
            "langgraph>=0.4,<0.5" \
            "langgraph-checkpoint-sqlite>=3.0,<4.0" \
            "langchain-core>=0.3,<0.4" \
            "pyyaml>=6.0" \
            "aiofiles>=24.1" \
            "json-repair>=0.30" \
            "tenacity>=9.0,<10.0"

      - name: Build + pack MCPB bundle
        run: python packaging/mcpb/build_bundle.py --validate --pack

      - name: Upload .mcpb as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/dist/tinyassets-universe-server.mcpb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
