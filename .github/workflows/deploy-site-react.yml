# Deploy WebSite/site-react (Next.js static export) to GitHub Pages.
#
# A push to main publishes when one of the paths below changes. The first
# three are the site's source folders (the same set preview-worker.yml builds).
# The workflow file is included so a change to the publisher itself, including
# the merge that turns this trigger on, publishes the current site:
#   WebSite/site-react/**
#   WebSite/design-system/**
#   WebSite/shared/**
#   .github/workflows/deploy-site-react.yml
# workflow_dispatch stays for a rollback or a republish of an earlier revision;
# that path still requires confirm=deploy. Two deploys share one group and the
# second waits, so they cannot overlap. The Svelte rollback tree and
# deploy-site.yml were retired on 2026-09-02. After deployment, verify
# https://tinyassets.io and /mcp via the public canary (AGENTS.md hard rule #11).
name: deploy-site-react

on:
  push:
    branches: [main]
    paths:
      - 'WebSite/site-react/**'
      - 'WebSite/design-system/**'
      - 'WebSite/shared/**'
      - '.github/workflows/deploy-site-react.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to publish the current production React build to tinyassets.io'
        required: true
        default: 'no'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One publisher. cancel-in-progress false means a second deploy waits
  # instead of killing the one already writing GitHub Pages.
  group: deploy-site-react
  cancel-in-progress: false

jobs:
  guard:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        if: ${{ github.event.inputs.confirm != 'deploy' }}
        run: |
          echo "Refusing to deploy: type 'deploy' in the confirm input to proceed."
          exit 1

  build:
    needs: guard
    if: ${{ !cancelled() && (needs.guard.result == 'success' || needs.guard.result == 'skipped') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebSite/site-react
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: WebSite/site-react/package-lock.json

      - name: Build design system (workspace dependency)
        working-directory: WebSite/design-system
        run: |
          npm ci
          npm run build

      - name: Install site deps
        run: npm ci

      - name: Test canonical MCP read contract and preview trust boundary
        run: npm test

      - name: Build (static export)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: WebSite/site-react/out

  # A skipped guard (every push) skips later jobs in the chain, including
  # one whose direct need succeeded, unless that job's own if uses a status
  # function and names the result it needs. build already continues on a
  # skipped guard. This is the same shape: not cancelled, and build succeeded.
  # A failed or skipped build still does not publish.
  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
