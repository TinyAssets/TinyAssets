name: invariants

# The server-side half of the invariant framework.
#
# The local hook (scripts/git-hooks/pre-commit) is fast feedback where a clone
# installs it; this is the authoritative gate.
#
# Scope: pre-commit-scoped invariants only (cross-provider-drift, skills-valid,
# context-budget, mirror-parity, mojibake). Network- and browser-dependent ones
# (tab-single needs Chrome; deployed_sha needs the live surface) are excluded by
# design — a gate that depends on an external service fails for reasons the PR
# author cannot fix.

on:
  pull_request:
  # `invariants` is a required check, and a merge queue waits for every
  # required check on the merge-group commit.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invariants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pre-commit-scoped invariants
        run: python scripts/invariants_run.py --pre-commit

      - name: Summary
        if: always()
        run: |
          {
            echo "### invariants"
            echo ""
            echo '```'
            python scripts/check_context_budget.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
