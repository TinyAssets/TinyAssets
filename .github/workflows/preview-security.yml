# Path-unfiltered required-check candidate for the trusted preview boundary.
#
# `preview-worker.yml` remains path-filtered so unrelated pull requests do not
# build/upload a site artifact. This small job runs on every NON-DRAFT pull
# request, whatever it touches, so validator or workflow regressions always
# produce a check that branch protection can require.
#
# "Unfiltered" here means by PATH, not by event: #4352 added a draft skip for
# runner cost. If this is ever made an actually-required check, read the `if:`
# on the job first -- a skipped job reports `conclusion=skipped` and branch
# protection accepts that as satisfied.
name: preview-security

on:
  pull_request:
    # `ready_for_review` is NOT one of the default types, and the job below
    # skips while the PR is a draft. Without it, a PR marked ready would keep
    # the draft run's skip until its next push.
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: Preview trust-boundary contract
    # Drafts do not spend a runner on this; `ready_for_review` above runs it for
    # real the moment the PR is ready. See docs/design-notes/2026-09-27-lean-ci-pipeline.md.
    #
    # Safe ONLY because this is not a branch-protection context today. A skipped
    # job reports `conclusion=skipped`, which branch protection accepts as
    # satisfied -- so if the header's "required-check candidate" is ever acted
    # on, this `if:` must go first, or the check passes without running
    # (tests.yml says the same thing at greater length about `required-tests`).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Run preview trust-boundary contracts
        working-directory: WebSite/site-react
        run: |
          npm ci
          npm test
