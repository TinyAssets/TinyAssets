name: Platform setup (one-time, founder-dispatched)

# The production secrets and variables the dark deploy needs (platform/deploy/checklist.md),
# made or moved once, from `main`, in the main-only `production` environment, by
# scripts/platform_setup.py. Each name is set only where it is absent, never overwritten
# and never printed: the job summary names each one and its status alone.
#
# It runs on SETUP_PAT, a fine-grained token the founder makes for this repo alone, one day
# long (Actions: read; Environments, Secrets and Variables: read and write), stored as a
# `production` secret. The last step deletes it, whatever came before.
#
#   - ROUTING_MAC_KEY (32 random bytes), GATEWAY_KEYRING and FILES_KEYRING (deploy.ts
#     keyring-new, in RUNNER_TEMP, shredded once stored)
#   - WORKOS_API_KEY, read from the production host over one ssh call into the API
#   - E2B_API_KEY into `production` when it is held at repository scope (that copy then
#     deleted), E2B_WEBHOOK_SECRET, and E2B's lifecycle webhook, registered disabled until
#     the cutover
#   - the variables OWNER_ISSUER and WORKOS_CLIENT_ID (below), and OWNER_TOKEN_CLAIMS from
#     the uptime canary's receipt of its renewed AuthKit token (iss and auth_time alone)
#
# Each step holds only the secrets it uses, and a step that fails leaves the rest to run.
# Run again with a new SETUP_PAT to finish what one run could not; it changes nothing set.
# The review App is not made here: its one-time code would sit in a public run until spent
# (scripts/review_app_setup.py, on the founder's own computer).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-setup
  cancel-in-progress: false

jobs:
  setup:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Checked live (AuthKit's discovery; the AuthKit login's own client id).
      OWNER_ISSUER: https://unassuming-environment-16.authkit.app
      WORKOS_CLIENT_ID: client_01KW15P0PD1R9ETW3DTP8R9G3B
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install PyNaCl from its hashed lock
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r scripts/platform_setup.requirements.txt

      - name: ROUTING_MAC_KEY
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.SETUP_PAT }}
        run: python3 scripts/platform_setup.py secret ROUTING_MAC_KEY --make mac

      - name: GATEWAY_KEYRING
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.SETUP_PAT }}
        run: python3 scripts/platform_setup.py secret GATEWAY_KEYRING --make keyring

      - name: FILES_KEYRING
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.SETUP_PAT }}
        run: python3 scripts/platform_setup.py secret FILES_KEYRING --make keyring

      - name: WORKOS_API_KEY from the host
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.SETUP_PAT }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_DROPLET_HOST: ${{ secrets.DO_DROPLET_HOST }}
          DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/do_deploy"
          trap 'shred -u "${key_file}" 2>/dev/null || true' EXIT
          (umask 077 && printf '%s\n' "${SSH_KEY}" > "${key_file}")
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519,rsa "${DO_DROPLET_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          SSH_KEY_FILE="${key_file}" python3 scripts/platform_setup.py secret WORKOS_API_KEY --make host

      - name: E2B key, webhook secret and lifecycle webhook
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.SETUP_PAT }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          E2B_WEBHOOK_SECRET: ${{ secrets.E2B_WEBHOOK_SECRET }}
        run: python3 scripts/platform_setup.py e2b

      - name: Repository variables
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.SETUP_PAT }}
        run: python3 scripts/platform_setup.py variables --issuer "${OWNER_ISSUER}" --client-id "${WORKOS_CLIENT_ID}"

      - name: Delete the setup token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SETUP_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "- \`SETUP_PAT\`: absent, nothing to delete" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if ! gh secret delete SETUP_PAT --env production --repo "${GITHUB_REPOSITORY}"; then
            echo "::error::SETUP_PAT was not deleted; delete it by hand in Settings > Environments > production." >&2
            exit 1
          fi
          echo "- \`SETUP_PAT\`: deleted" >> "${GITHUB_STEP_SUMMARY}"
