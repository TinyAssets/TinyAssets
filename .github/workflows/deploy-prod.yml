name: Deploy prod

# Fail-safe single-daemon deploy (host directive 2026-08-18). Replaces the
# "retire-cheat-loop" stop-writer fence, which quiesced prod BEFORE proving the
# new image and could not reliably restore it — so every failed deploy since
# 2026-08-10 left prod with ZERO containers. That fence guarded a retired
# multi-container writer fleet; only the daemon + sidecars remain.
#
# Flow: resolve image + verify ancestry -> SSH -> run deploy/deploy_fail_safe.sh
# (record current -> pull -> prove-load -> swap+restart -> health+tunnel check ->
# roll back to the recorded image if unhealthy) -> public --assert-handles canary
# (roll back if the public surface is red) -> publish release-state -> prove the
# protected receipt contains the target revision.
#
# The deploy step NEVER leaves prod at zero: the script's worst case restores the
# previous healthy image, backed by compose `restart: unless-stopped` + systemd
# `Restart=always`. Rationale + prior-fence postmortem: the deploy_fail_safe.sh
# header and docs/audits/2026-08-20-deploy-fence-rewrite.md.
#
# Required repo secrets: DO_DROPLET_HOST, DO_SSH_USER, DO_SSH_KEY.

on:
  workflow_run:
    workflows: ["Build and publish image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default = build head / current main short-SHA)'
        required: false
        type: string
      rotate_request_idempotency_hmac:
        description: 'Replace the host request-idempotency HMAC key with the GitHub secret. Use only after rotating a key that was exposed; normal deploys install it set-once and fail closed on a mismatch.'
        required: false
        type: boolean
        default: false

concurrency:
  # One deploy at a time; never cancel an in-flight deploy mid-swap.
  #
  # The group is SHARED with every other workflow that mutates this droplet --
  # install-host-services.yml, restart-daemon.yml, p0-outage-triage.yml all
  # declare `production-host-mutation`. That is the point: a daemon restart or
  # a P0 triage must not land in the middle of an image swap. #2442 moved this
  # workflow to a private `deploy-prod` group, which silently allowed exactly
  # that overlap; restored 2026-08-27.
  #
  # `cancel-in-progress: false` stops an in-flight run being killed, but it does
  # NOT make waiting runs queue: GitHub holds only ONE pending run per group and
  # a newer pending run REPLACES the older one, which is cancelled. So the cost
  # of sharing is that a run waiting behind a long deploy can be displaced by a
  # newer one -- including an automated p0-outage-triage run. That risk already
  # existed among the three workflows below; this adds contention to it.
  # It is still the right trade: a displaced triage run can be re-dispatched,
  # a half-applied host mutation cannot be un-applied. Cross-family review
  # 2026-08-27 caught the wrong claim in the first version of this comment.
  group: production-host-mutation
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  issues: write
  # Read-only: "Wait for in-flight turns" looks for queued host-mutating runs
  # it must yield to.
  actions: read

jobs:
  deploy:
    # Skip failed build-image runs; manual dispatch always allowed.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    # 15 min of deploy work plus up to 55 for "Wait for in-flight turns".
    timeout-minutes: 70
    env:
      DO_DROPLET_HOST: ${{ secrets.DO_DROPLET_HOST }}
      DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
      # Stop-writer floor: the target commit must descend from this (rollback
      # protection against deploying an image predating the security floor).
      STOP_WRITER_SHA: 35da9d4fc1a1fc51d3db56bf5d1627691f54d894
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve image tag -> immutable digest
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_IMAGE_TAG}" ]; then
            tag="${REQUESTED_IMAGE_TAG}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            full_sha="${{ github.event.workflow_run.head_sha }}"
            tag="${full_sha:0:12}"
          else
            tag="$(git rev-parse --short=12 HEAD)"
          fi
          if [[ ! "${tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::refusing invalid OCI image tag"; exit 1
          fi
          owner_lower="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner_lower}/tinyassets-daemon"
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null 2>&1 || true
          if ! docker manifest inspect "${image}:${tag}" >/dev/null 2>&1; then
            echo "::error::${image}:${tag} not found in GHCR; refusing mutable fallback"; exit 1
          fi
          digest="$(docker buildx imagetools inspect "${image}:${tag}" | awk '/^Digest:/ && !seen {print $2; seen=1}')"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::non-canonical image digest for ${image}:${tag}"; exit 1
          fi
          # Full source revision (40-hex) from the trigger context; the build
          # tagged the image from exactly this commit. Used for the ancestry gate.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            revision="${{ github.event.workflow_run.head_sha }}"
          else
            revision="$(git rev-parse "${tag}^{commit}" 2>/dev/null || git rev-parse HEAD)"
          fi
          if [[ ! "${revision}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve full source revision for ${tag}"; exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image}@${digest}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"

      - name: Verify target descends from the stop-writer floor
        env:
          TARGET_REVISION: ${{ steps.tag.outputs.revision }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin main
          for rev in "${STOP_WRITER_SHA}" "${TARGET_REVISION}"; do
            if ! git cat-file -e "${rev}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "${rev}" || { echo "::error::revision ${rev} unavailable"; exit 1; }
            fi
          done
          if ! git merge-base --is-ancestor "${STOP_WRITER_SHA}" "${TARGET_REVISION}"; then
            echo "::error::target ${TARGET_REVISION} is not descended from the stop-writer floor; refusing"
            exit 1
          fi
          echo "ancestry OK: ${TARGET_REVISION} descends from ${STOP_WRITER_SHA}"

      - name: Verify deploy secrets present
        run: |
          set -euo pipefail
          : "${DO_DROPLET_HOST:?DO_DROPLET_HOST secret missing}"
          : "${DO_SSH_USER:?DO_SSH_USER secret missing}"
          [ -n "${{ secrets.DO_SSH_KEY }}" ] || { echo "::error::DO_SSH_KEY secret missing"; exit 1; }

      # Both daemon HMAC keys are validated on the runner BEFORE anything touches
      # the host. PR #2442 dropped these steps along with the installs below; prod
      # kept working only because /etc/tinyassets/{request-idempotency,agent-
      # interchange}.env survived from 2026-08-10, so a rebuilt host would boot
      # without them (tinyassets-daemon.service's ExecStartPre refuses) and a
      # rotation had no path at all (docs/concerns, 2026-10-01 triage).
      - name: Validate agent interchange HMAC prerequisite
        env:
          TINYASSETS_AGENT_INTERCHANGE_HMAC_KEY: ${{ secrets.TINYASSETS_AGENT_INTERCHANGE_HMAC_KEY }}
        run: python scripts/validate_agent_interchange_hmac.py

      - name: Validate request idempotency HMAC prerequisite
        env:
          TINYASSETS_REQUEST_IDEMPOTENCY_HMAC_KEY: ${{ secrets.TINYASSETS_REQUEST_IDEMPOTENCY_HMAC_KEY }}
          TINYASSETS_AGENT_INTERCHANGE_HMAC_KEY: ${{ secrets.TINYASSETS_AGENT_INTERCHANGE_HMAC_KEY }}
        run: python scripts/validate_request_idempotency_hmac.py

      - name: Validate OAuth provider credentials
        id: oauth
        env:
          TINYASSETS_OAUTH_CREDENTIALS_INSTALL: ${{ vars.TINYASSETS_OAUTH_CREDENTIALS_INSTALL }}
          TARGET_REVISION: ${{ steps.tag.outputs.revision }}
          TINYASSETS_OAUTH_GOOGLE_CLIENT_ID: ${{ vars.TINYASSETS_OAUTH_GOOGLE_CLIENT_ID }}
          TINYASSETS_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.TINYASSETS_OAUTH_GOOGLE_CLIENT_SECRET }}
        run: python scripts/validate_oauth_provider_credentials.py

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/do_deploy
          chmod 600 ~/.ssh/do_deploy
          ssh-keyscan -t ed25519,rsa "$DO_DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Capture current image (for public-canary rollback)
        id: capture
        run: |
          set -euo pipefail
          # What is RUNNING, not what the env file says: after a failed deploy
          # the env file already names the failed image. Fall back to the env
          # ref only when no daemon container exists.
          # Captured as an immutable repo digest (the rollback script requires
          # an @sha256: ref); `.Config.Image` could be a mutable tag.
          prev="$(ssh -i ~/.ssh/do_deploy -o BatchMode=yes "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
                 "docker inspect -f '{{.Image}}' tinyassets-daemon 2>/dev/null | xargs -r docker image inspect -f '{{index .RepoDigests 0}}' 2>/dev/null")"
          case "$prev" in
            *@sha256:*) ;;
            *) prev="$(ssh -i ~/.ssh/do_deploy -o BatchMode=yes "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
                     "grep -E '^TINYASSETS_IMAGE=' /etc/tinyassets/env | head -1 | cut -d= -f2-")" ;;
          esac
          echo "prev_image=${prev}" >> "$GITHUB_OUTPUT"
          echo "current prod image (running, digest): ${prev:-<none>}"

      # Daemon-only request-admission key, in its own root:tinyassets 640 file
      # that only the daemon service mounts (compose env_file). set-once on every
      # deploy: an absent key is installed, the identical key is a no-op, and a
      # DIFFERENT host key fails the deploy closed (helper exit 5) before any
      # swap -- GitHub and the host must never silently disagree about the key
      # that signs request admissions. Replacing it is `set`, manual dispatch only
      # (rotate_request_idempotency_hmac=true). The fail-safe deploy below then
      # recreates the daemon, its only consumer, because the env_file contents
      # are part of the service config compose hashes.
      - name: Install daemon-only request idempotency HMAC secret
        env:
          TINYASSETS_REQUEST_IDEMPOTENCY_HMAC_KEY: ${{ secrets.TINYASSETS_REQUEST_IDEMPOTENCY_HMAC_KEY }}
          REQUEST_HMAC_INSTALL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.rotate_request_idempotency_hmac && 'set' || 'set-once' }}
        run: |
          set -euo pipefail
          case "${REQUEST_HMAC_INSTALL_MODE}" in
            set-once|set) ;;
            *)
              echo "::error::invalid request HMAC install mode"
              exit 1
              ;;
          esac
          if [ "${REQUEST_HMAC_INSTALL_MODE}" = "set" ] && [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "::error::request HMAC rotation is manual-dispatch only"
            exit 1
          fi
          scp -i ~/.ssh/do_deploy -o BatchMode=yes \
              deploy/install-tinyassets-env.sh \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}:/tmp/install-tinyassets-env.sh"
          if [ "${REQUEST_HMAC_INSTALL_MODE}" = "set" ]; then
            # Rotating while the shared env still carries a copy would leave the
            # old key live there; refuse first.
            if ! ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
                "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
                "sudo env TINYASSETS_ENV_FILE=/etc/tinyassets/env bash /tmp/install-tinyassets-env.sh assert-absent TINYASSETS_REQUEST_IDEMPOTENCY_HMAC_KEY"; then
              echo "::error::rotation prerequisite failed: shared env exposes request admission authority"
              exit 1
            fi
          fi
          printf '%s' "${TINYASSETS_REQUEST_IDEMPOTENCY_HMAC_KEY}" | \
              ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
              "sudo env TINYASSETS_ENV_FILE=/etc/tinyassets/request-idempotency.env TINYASSETS_LEGACY_ENV_FILE=/etc/tinyassets/no-request-idempotency-legacy bash /tmp/install-tinyassets-env.sh '${REQUEST_HMAC_INSTALL_MODE}' TINYASSETS_REQUEST_IDEMPOTENCY_HMAC_KEY"

      - name: Install OAuth provider client credentials
        env:
          TINYASSETS_OAUTH_GOOGLE_CLIENT_ID: ${{ vars.TINYASSETS_OAUTH_GOOGLE_CLIENT_ID }}
          TINYASSETS_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.TINYASSETS_OAUTH_GOOGLE_CLIENT_SECRET }}
          OAUTH_ACTION: ${{ steps.oauth.outputs.action }}
          PREV_IMAGE: ${{ steps.capture.outputs.prev_image }}
        run: |
          set +x
          set -euo pipefail
          # Decisions and image references are the only remote arguments.
          case "${OAUTH_ACTION}" in install|skip|remove) ;; *) exit 1 ;; esac
          if [[ -n "${PREV_IMAGE}" && ! "${PREV_IMAGE}" =~ ^[a-zA-Z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::warning::unrecognized rollback image; removing OAuth keys"
            OAUTH_ACTION=remove
            PREV_IMAGE=''
          fi
          scp -i ~/.ssh/do_deploy -o BatchMode=yes deploy/install-oauth-credentials.sh \
            "${DO_SSH_USER}@${DO_DROPLET_HOST}:/tmp/install-oauth-credentials.sh"
          if [ "${OAUTH_ACTION}" != install ]; then
            TINYASSETS_OAUTH_GOOGLE_CLIENT_ID=''
            TINYASSETS_OAUTH_GOOGLE_CLIENT_SECRET=''
          fi
          # The HMAC step installed the env helper. The lock covers the rollback
          # proof and the whole-pair write/delete, including daemon.env rendering.
          printf '%s\n' "${TINYASSETS_OAUTH_GOOGLE_CLIENT_ID}" "${TINYASSETS_OAUTH_GOOGLE_CLIENT_SECRET}" | \
            ssh -i ~/.ssh/do_deploy -o BatchMode=yes "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
              "sudo flock -w 120 /var/lock/tinyassets-host-mutation.lock bash /tmp/install-oauth-credentials.sh '${OAUTH_ACTION}' '${PREV_IMAGE}'"

      - name: Install daemon-only agent interchange HMAC secret
        env:
          TINYASSETS_AGENT_INTERCHANGE_HMAC_KEY: ${{ secrets.TINYASSETS_AGENT_INTERCHANGE_HMAC_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "${TINYASSETS_AGENT_INTERCHANGE_HMAC_KEY}" | \
              ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
              "sudo env TINYASSETS_ENV_FILE=/etc/tinyassets/agent-interchange.env TINYASSETS_LEGACY_ENV_FILE=/etc/tinyassets/no-agent-interchange-legacy bash /tmp/install-tinyassets-env.sh set TINYASSETS_AGENT_INTERCHANGE_HMAC_KEY"

      # The two installed keys must be valid and DISTINCT on the host itself,
      # not just in GitHub: the daemon reads the files, not the secrets.
      - name: Validate installed host HMAC pair
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
              "sudo python3 -" < scripts/validate_host_runtime_hmac_pair.py

      # The shared /etc/tinyassets/env is mounted by more than the daemon, so it
      # must never carry request-admission minting authority. Also strips the
      # stale overrides the pre-#2442 scrub removed (BUG-002 wiki path, the
      # stdio-only TINYASSETS_UNIVERSE, retired WORKFLOW_* names). The retired
      # platform-credential names are NOT listed: repo gates forbid any workflow
      # from naming them at all (tests/test_no_platform_*). All absent on
      # prod as of 2026-10-01, so this is a guard, not a migration. BACKUP_DEST,
      # LOG_DEST and BACKUP_GH_REPO are host-owned and deliberately not touched
      # (deploy/backup.sh still reads BACKUP_GH_REPO; the pre-#2442 list deleted it).
      - name: Scrub stale cloud env overrides
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
              "sudo bash -s -- delete TINYASSETS_WIKI_PATH TINYASSETS_UNIVERSE TINYASSETS_REQUEST_IDEMPOTENCY_HMAC_KEY WORKFLOW_IMAGE WORKFLOW_DATA_DIR WORKFLOW_MCP_CANARY_URL WORKFLOW_ALLOW_API_KEY_PROVIDERS WORKFLOW_NODE_ENQUEUE_ENABLED WORKFLOW_SOUL_LOOP_DISPATCH WORKFLOW_BUG_INVESTIGATION_BACKFILL WORKFLOW_BUG_INVESTIGATION_BRANCH_DEF_ID WORKFLOW_BUG_INVESTIGATION_GOAL_ID GITHUB_OAUTH_CLIENT_ID GITHUB_OAUTH_CLIENT_SECRET" \
              < deploy/install-tinyassets-env.sh
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
              "sudo env TINYASSETS_ENV_FILE=/etc/tinyassets/env bash /tmp/install-tinyassets-env.sh assert-absent TINYASSETS_REQUEST_IDEMPOTENCY_HMAC_KEY" || {
            echo "::error::shared env still contains request admission minting authority"
            exit 1
          }
          # The GitHub OAuth pair was retired on 2026-10-03: nothing reads it,
          # no route serves the callback the template used to describe, and
          # deploy/tinyassets-env.template no longer declares it (#4422).
          # Withholding it from the daemon is handled at the renderer, by
          # RETIRED_ENV in deploy/install-tinyassets-env.sh (#4267) -- that
          # covers every writer of daemon.env, not just this workflow. This
          # step is the other half: withholding keeps the key out of the
          # daemon, DELETING makes it actually go away. The delete above runs
          # first and this proves it took, so a stale assignment cannot sit on
          # the host indefinitely.
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
              "sudo env TINYASSETS_ENV_FILE=/etc/tinyassets/env bash /tmp/install-tinyassets-env.sh assert-absent GITHUB_OAUTH_CLIENT_SECRET" || {
            echo "::error::shared env still contains the retired GITHUB_OAUTH_CLIENT_SECRET"
            exit 1
          }

      - name: Sync runtime deploy files
        # compose.yml, the vector configs and the systemd unit are part of the
        # deploy, not a one-time bootstrap. PR #2442 dropped this sync and every
        # compose-level change went silently inert in production for nine days
        # (docs/concerns/2026-08-27-deploy-drops-compose-sync.md, resolved 2026-08-29
        # after the droplet's live copy was diffed against the repo: identical
        # daemon/cloudflared/logs directives, drift only in comments, two env keys
        # the env file also carries, and vector.yaml's retired worker role).
        #
        # This step only STAGES. It installs nothing. A cross-family review of the
        # first restore (Codex, 2026-08-29) showed that installing here mutates
        # config OUTSIDE the fail-safe transaction: the auth-volume step below,
        # the deploy_fail_safe.sh scp, the host-mutation lock and the candidate
        # image preflight can all fail AFTER the new config is live, leaving the
        # new compose file under the old image with no rollback path that
        # restores it. deploy_fail_safe.sh now owns validate -> snapshot ->
        # install -> converge -> restore for this bundle; see its header and
        # deploy/DEPLOY.md ("Runtime bundle transaction").
        id: stage_bundle
        run: |
          set -euo pipefail
          # Per-run directory, not a shared /tmp/tinyassets-bundle. A shared path
          # is populated here, BEFORE the script's host-mutation lock exists, so
          # a concurrent deploy or a manual run could swap the bytes between the
          # script's validation and its install (Codex round 2). The script also
          # copies this into a private directory under the lock; the per-run name
          # keeps two workflow runs from clobbering each other's stage first.
          stage="/tmp/tinyassets-bundle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "stage=${stage}" >> "$GITHUB_OUTPUT"
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
              "sudo bash -s '${DO_SSH_USER}' '${stage}'" <<'SH'
          set -euo pipefail
          owner="$1"
          stage="$2"
          case "${stage}" in
            /tmp/tinyassets-bundle-*) : ;;
            *) echo "refusing to stage into an unexpected path: ${stage}" >&2; exit 1 ;;
          esac
          rm -rf "${stage}"
          mkdir -p "${stage}"
          chown "${owner}:" "${stage}"
          chmod 0750 "${stage}"
          # Sweep stages older than a day so a failed run does not accumulate.
          find /tmp -maxdepth 1 -name 'tinyassets-bundle-*' -type d -mtime +1 \
            -exec rm -rf {} + 2>/dev/null || true
          echo "staged bundle directory ${stage} (owner ${owner})"
          SH
          scp -i ~/.ssh/do_deploy -o BatchMode=yes \
              deploy/compose.yml \
              deploy/vector.yaml \
              deploy/vector-betterstack.yaml \
              deploy/vector-entrypoint.sh \
              deploy/tinyassets-daemon.service \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}:${stage}/"
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}" "ls -l '${stage}/'"

      - name: Prepare data volume root
        # The volume root holds the OAuth registration db and every universe.
        # It no longer holds platform model logins: the platform has no LLM
        # (AGENTS.md Hard Rule 15), so this step creates no .codex or .claude
        # directory. The host copies left from before are removed by the
        # "Retire platform LLM logins" step, after the canary is green.
        run: |
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
              'sudo bash -s' <<'SH'
          set -euo pipefail

          VOLUME_NAME="tinyassets-data"
          TINYASSETS_UID=1001
          TINYASSETS_GID=1001

          docker volume create "$VOLUME_NAME" >/dev/null
          VOLUME_DIR="$(docker volume inspect "$VOLUME_NAME" --format '{{ .Mountpoint }}')"

          # OAuth registration state lives directly at /data/.auth.db.
          # The volume root must be writable by the container's uid 1001;
          # otherwise every public MCP initialize request fails in
          # OptionalOAuthProvider with sqlite3 "unable to open database file".
          chown "$TINYASSETS_UID:$TINYASSETS_GID" "$VOLUME_DIR"
          chmod 755 "$VOLUME_DIR"
          find "$VOLUME_DIR" -maxdepth 1 -type f \
            \( -name '.auth.db' -o -name '.auth.db-*' \) \
            -exec chown "$TINYASSETS_UID:$TINYASSETS_GID" {} + \
            -exec chmod 600 {} + || true
          SH

      - name: Sync the canary bearer into /etc/tinyassets/env
        # REQUIRED. No anonymous platform read exists: `/mcp/pulse`, the
        # container healthcheck, the public handle canary, and the post-receipt
        # deploy assertion all run as the constrained `canary` principal.
        #
        # A future short-lived GitHub OIDC principal can replace this standing
        # secret once `oidc-bound-probe-principals` lands. Until then, this
        # shared bearer is fail-closed and must remain present on both the host
        # and the GitHub Actions runner.
        env:
          TINYASSETS_WIKI_CANARY_TOKEN: ${{ secrets.TINYASSETS_WIKI_CANARY_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${#TINYASSETS_WIKI_CANARY_TOKEN}" -lt 32 ]; then
            echo "::error::TINYASSETS_WIKI_CANARY_TOKEN is unset or under 32 bytes. The protected pulse healthcheck and authenticated MCP probes require this service-principal credential."
            exit 1
          fi
          scp -i ~/.ssh/do_deploy -o BatchMode=yes deploy/install-tinyassets-env.sh \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}:/tmp/install-tinyassets-env.sh"
          printf '%s' "${TINYASSETS_WIKI_CANARY_TOKEN}" \
            | ssh -i ~/.ssh/do_deploy -o BatchMode=yes "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
                "sudo bash /tmp/install-tinyassets-env.sh set TINYASSETS_WIKI_CANARY_TOKEN"
          echo "canary bearer synced"

      # Expected-instance state for cloud provenance admission
      # (openspec change cloud-only-runtime-admission, task 4). This MUST run
      # before the candidate starts: the release receipt below is published only
      # after the candidate is already healthy, so a field inside it would be
      # absent exactly when the first enforcement needs it, and the receipt is
      # rewritten whole on every deploy, which would erase such a field. Its own
      # typed file in the data root survives receipt replacement, and survives a
      # rollback to the previous image because the expected identity is a
      # property of the droplet, not of the build.
      #
      # Admission requires this preparation. Stop before replacing the running
      # service if either identity resolution or installation fails. A previous
      # file is not evidence that this deploy prepared the candidate correctly.
      - name: Prepare expected-instance state (required for admission)
        id: expected_instance
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: |
          set -euo pipefail
          rc=0
          python scripts/prepare_expected_instance_state.py \
            --out platform-expected-instance.json || rc=$?
          if [ "${rc}" -ne 0 ]; then
            echo "::error::expected-instance state not freshly prepared (rc=${rc}); any prior state is unchanged; candidate deployment stopped"
            echo "prepared=false" >> "$GITHUB_OUTPUT"
            exit "${rc}"
          fi
          scp -i ~/.ssh/do_deploy -o BatchMode=yes platform-expected-instance.json \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}:/tmp/platform-expected-instance.json"
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes "${DO_SSH_USER}@${DO_DROPLET_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          vol="$(sudo docker volume inspect tinyassets-data --format '{{ .Mountpoint }}')"
          [ -n "$vol" ] && [ "${vol#/}" != "$vol" ] && sudo test -d "$vol"
          staged="$(sudo mktemp "${vol}/.platform-expected-instance.XXXXXX")"
          trap 'sudo rm -f -- "$staged"' EXIT
          sudo install -m 0644 -o root -g root /tmp/platform-expected-instance.json "$staged"
          sudo mv -f -- "$staged" "${vol}/platform-expected-instance.json"
          REMOTE
          echo "prepared=true" >> "$GITHUB_OUTPUT"
          echo "expected-instance state installed before candidate startup"

      # A deploy recreates the daemon, and that kills every turn running in it:
      # on 2026-10-02 it cut the founder's live village turn twice. So the swap
      # waits until no work is in flight, polling every TURN_POLL_S and
      # proceeding anyway at TURN_WAIT_CAP_S; deploy/wait_for_turns.sh has the
      # rules (what counts, when it proceeds, the race it cannot close).
      #
      # Deliberately OUTSIDE deploy_fail_safe.sh: that script holds the
      # host-mutation flock, and holding it for up to 45 min would stop the
      # watchdogs restarting a daemon that falls over mid-wait.
      #
      # Coalescing comes from the concurrency group above: GitHub keeps ONE
      # pending run per group, and a newer one replaces it. Merges landing during
      # a long turn therefore queue as a single deploy of the newest sha behind
      # this one, not twenty swaps. release-reconcile treats this in-progress run
      # as covering its sha and dispatches nothing extra for it.
      #
      # The same group makes the other host-mutating workflows (p0-outage-triage,
      # restart-daemon, install-host-services, apply-daemon-env) queue behind a
      # waiting deploy. A P0 repair must not sit 45 min behind a polite wait, so
      # the wait YIELDS -- proceeds to the swap now -- as soon as any of them is
      # queued (YIELD_WORKFLOWS).
      - name: Wait for in-flight turns
        id: turns
        # The cap (which includes the prefetch) + one worst-case poll + cleanup.
        timeout-minutes: 55
        env:
          TARGET_REVISION: ${{ steps.tag.outputs.revision }}
          IMAGE_REF: ${{ steps.tag.outputs.image_ref }}
          TURN_WAIT_CAP_S: '2700'
          TURN_POLL_S: '15'
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YIELD_WORKFLOWS: p0-outage-triage.yml restart-daemon.yml install-host-services.yml apply-daemon-env.yml
        run: bash deploy/wait_for_turns.sh

      - name: Run fail-safe deploy on the droplet
        id: deploy
        env:
          IMAGE_REF: ${{ steps.tag.outputs.image_ref }}
          BUNDLE_DIR: ${{ steps.stage_bundle.outputs.stage }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/do_deploy -o BatchMode=yes \
              deploy/deploy_fail_safe.sh deploy/install-tinyassets-env.sh \
              deploy/snapshot_candidate_evidence.sh \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}:/tmp/"
          set +e
          out="$(ssh -i ~/.ssh/do_deploy -o BatchMode=yes "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
                "sudo HEALTH_TIMEOUT=180 BUNDLE_DIR='${BUNDLE_DIR}' bash /tmp/deploy_fail_safe.sh '${IMAGE_REF}'")"
          rc=$?
          set -e
          echo "${out}"
          result="$(printf '%s\n' "${out}" | awk -F= '/^deploy_result=/{print $2}' | tail -1)"
          deployed="$(printf '%s\n' "${out}" | awk -F= '/^deployed_image=/{print $2}' | tail -1)"
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          echo "result=${result}" >> "$GITHUB_OUTPUT"
          echo "deployed_image=${deployed}" >> "$GITHUB_OUTPUT"
          # rc 0 = deployed new, 2 = rolled back to previous (prod still up), 1/3 = hard fail.
          if [ "${rc}" -eq 0 ]; then
            echo "::notice::deployed ${deployed}"
          elif [ "${rc}" -eq 2 ]; then
            echo "::error::new image unhealthy; prod rolled back to ${deployed}"; exit 1
          else
            echo "::error::deploy failed (rc=${rc}); see log above"; exit 1
          fi

      - name: Public MCP canary (--assert-handles)
        env:
          TINYASSETS_WIKI_CANARY_TOKEN: ${{ secrets.TINYASSETS_WIKI_CANARY_TOKEN }}
        id: canary
        run: |
          set -euo pipefail
          python scripts/mcp_public_canary.py --url https://tinyassets.io/mcp --assert-handles

      # The app is the second public surface this deploy can break, and the MCP
      # canary says nothing about it: the connector can be perfectly green while
      # /app 404s. Folded into the same rollback condition below.
      - name: Public app-surface probe
        id: app_probe
        run: |
          set -euo pipefail
          python scripts/probe_app_surface.py --verbose

      # Hard Rule 11: tinyassets.io/mcp is the ONLY public endpoint, and the
      # direct origin is an Access-gated internal one that must never answer an
      # unauthenticated request. This step PROVES the gate; it does not make the
      # origin usable, and the name stays out of user-facing docs.
      #
      # #2442 dropped this check with the rest of the post-canary block, so
      # since then a change that opened the internal origin would deploy green:
      # the public canary goes through the Worker and says nothing about the
      # origin behind it.
      #
      # Non-mutating: one unauthenticated GET, no credentials, 10s cap.
      #
      # The pass condition is exactly ONE status, and 401 is a FAILURE. That is
      # the opposite of what this step's name used to promise, and it is the
      # point (Codex, 2026-10-03).
      #
      # The Access policy is service-token, non-identity
      # (scripts/cf_access_cutover.py: decision="non_identity",
      # include=[{service_token}], allowed_idps=[]), so Cloudflare denies an
      # unauthenticated request with 403 and no login redirect.
      #
      # Our own application answers an anonymous GET on /mcp with 401
      # (tinyassets/auth/middleware.py: no bearer on the MCP endpoint -> 401
      # challenge). So a 401 PROVES the request reached the application, which
      # means Access did not stop it -- the exact hole this step exists to
      # catch. Accepting 401, as the deleted original and my first version both
      # did, certifies the failure as a pass.
      #
      #   403                      -> pass: Access denied it, origin unreached
      #   401, 200, 404, 405, ...  -> fail: something answered FOR us
      #   transfer error, 5xx/530  -> advisory: nothing was proved either way
      #
      # If the policy is ever changed to an identity-based one (which redirects
      # to a login page instead), this fails loudly and names the code rather
      # than quietly accepting a redirect our own origin could also produce.
      #
      # No rollback either way. The rollback below keys on the canary and
      # app-probe outcomes, not on this step, so a red gate stops the deploy
      # without swapping a healthy image back out of production. That is
      # detection, not containment: an image rollback would not restore a
      # missing Cloudflare policy.
      - name: Verify CF Access gates the direct origin (expects 403)
        id: access-gate
        env:
          DIRECT_ORIGIN: ${{ vars.TINYASSETS_INTERNAL_ORIGIN_NAME || 'mcp.tinyassets.io' }}
        run: |
          set -uo pipefail
          if ! command -v curl >/dev/null 2>&1; then
            echo "::error::curl is unavailable on the runner, so the Access gate cannot be checked at all"
            exit 1
          fi
          direct_url="https://${DIRECT_ORIGIN}/mcp"
          # curl's exit status is captured SEPARATELY from the status code. The
          # earlier `|| echo 000` appended to curl's own "000" on a connect
          # failure, producing 000000, which matched no branch and failed the
          # deploy -- breaking the advisory band it was written to provide.
          # The step runs under Actions' default `bash -e`, and `set -uo
          # pipefail` does not clear errexit: a bare failing assignment would
          # exit here before curl_rc was read. `|| curl_rc=$?` keeps it.
          curl_rc=0
          http_code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${direct_url}")" || curl_rc=$?
          echo "curl exit ${curl_rc}, HTTP status '${http_code}'"
          if [ "${curl_rc}" != "0" ]; then
            echo "::warning::could not reach the direct origin (curl exit ${curl_rc}); the Access gate was not proved this run. Public MCP is served through the canonical endpoint, which was proved green above."
          elif [ "${http_code}" = "403" ]; then
            echo "Access gate confirmed: Cloudflare denied an unauthenticated request with 403 and the origin was never reached"
          elif [ "${http_code}" = "429" ] || [ "${http_code}" = "502" ] || [ "${http_code}" = "503" ] || [ "${http_code}" = "504" ] || [ "${http_code}" = "530" ]; then
            # Rate limiting and the edge/tunnel errors say nothing about the
            # policy: the request never reached a decision about identity.
            echo "::warning::the edge returned ${http_code} for the direct origin; nothing was proved about the Access policy this run"
          elif [ "${http_code}" = "401" ]; then
            echo "::error::Cloudflare Access is NOT gating the direct origin: the request reached our application, which answered 401 itself. A 401 here is our own auth middleware, not Access."
            echo "::error::Fix: Cloudflare dashboard -> Access -> Applications -> confirm the service-token policy is active and covers this hostname."
            exit 1
          else
            echo "::error::Cloudflare Access is NOT gating the direct origin: an unauthenticated request got HTTP ${http_code}, so something answered for us instead of Access denying it with 403."
            echo "::error::Fix: Cloudflare dashboard -> Access -> Applications -> confirm the service-token policy is active and covers this hostname."
            exit 1
          fi

      # Evidence BEFORE the rollback destroys it, WITHOUT delaying the
      # rollback (Codex P1 on #4367: two 25s SSH calls plus local sanitizing ran
      # while the broken candidate was still serving). This step is one SSH
      # round trip that writes raw bytes to host temp files and nothing else;
      # the rollback runs next; fetch, sanitize and upload happen after it.
      #
      # #2442 dropped this path along with the stop-writer fence it was written
      # beside, leaving scripts/sanitize_startup_diagnostics.py with no caller
      # at all -- so a failed prod deploy kept no container state and no logs.
      #
      # Scope: rc 0 only -- the swap succeeded and a public surface then went
      # red, the one window where the candidate container still exists. An
      # unhealthy candidate (rc 2) was rolled back inside deploy_fail_safe.sh
      # before control returned, so reading logs then would mislabel the
      # restored image's output --
      # docs/concerns/2026-10-03-unhealthy-candidate-rollback-keeps-no-diagnostics.md
      - name: Snapshot failed candidate evidence (before rollback)
        id: candidate_snapshot
        if: ${{ always() && steps.deploy.outputs.rc == '0' && (failure() || cancelled()) }}
        continue-on-error: true
        timeout-minutes: 1
        run: |
          set +e
          timeout 25s ssh -i ~/.ssh/do_deploy               -o BatchMode=yes               -o ConnectTimeout=10               -o ServerAliveInterval=5               -o ServerAliveCountMax=2               "${DO_SSH_USER}@${DO_DROPLET_HOST}"               "sudo bash /tmp/snapshot_candidate_evidence.sh"
          echo "ssh_rc=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # Name kept verbatim: three test files key on this step by name
      # (test_deploy_prod_workflow, test_expected_instance_state_preparation,
      # test_prune_units). The CONDITION is what had to change — the app probe
      # is a second public surface that must trigger the same rollback.
      - name: Roll back if the public canary is red
        if: ${{ failure() && steps.deploy.outputs.rc == '0' && (steps.canary.outcome == 'failure' || steps.app_probe.outcome == 'failure') }}
        env:
          PREV_IMAGE: ${{ steps.capture.outputs.prev_image }}
        run: |
          set -euo pipefail
          echo "::error::a public surface (MCP canary or app probe) went red after a fresh deploy — rolling back to the captured previous image"
          if [ -z "${PREV_IMAGE}" ]; then
            echo "::error::no previous image captured; manual rollback required"; exit 3
          fi
          # --restore-bundle, not a plain invocation: the forward deploy installed
          # a new compose.yml / vector config / systemd unit inside its
          # transaction, so converging the previous IMAGE against the new CONFIG
          # would roll back half the change. This reinstalls the snapshot named by
          # /var/lib/tinyassets-deploy/bundle-previous first, then converges
          # PREV_IMAGE (and force-recreates tinyassets-logs if the restore moved a
          # vector input). It never installs the staged bundle — that is what it
          # is undoing.
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
            "sudo HEALTH_TIMEOUT=180 bash /tmp/deploy_fail_safe.sh --restore-bundle '${PREV_IMAGE}'"

      # AFTER the rollback: nothing here touches production, so none of it can
      # delay recovery. Fetches what the snapshot wrote, sanitizes locally, and
      # records the evidence as unavailable when the container was already gone
      # (Codex P2) rather than leaving a manifest that implies a match.
      - name: Sanitize failed candidate diagnostics
        id: candidate_diagnostics
        if: ${{ always() && steps.candidate_snapshot.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          TARGET_IMAGE_REF: ${{ steps.tag.outputs.image_ref }}
          TARGET_REVISION: ${{ steps.tag.outputs.revision }}
        run: |
          set +e
          evidence_dir="${RUNNER_TEMP}/candidate-startup-diagnostics"
          state_raw="${RUNNER_TEMP}/ta-candidate.state"
          raw_log="${RUNNER_TEMP}/ta-candidate.log"
          cid_file="${RUNNER_TEMP}/ta-candidate.cid"
          mkdir -p "${evidence_dir}"
          printf '{"candidate_identity_match":false,"capture":"unavailable"}\n' \
              > "${evidence_dir}/daemon-state.json"
          : > "${raw_log}"
          : > "${cid_file}"

          timeout 40s scp -i ~/.ssh/do_deploy -o BatchMode=yes \
              -o ConnectTimeout=10 \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}:/tmp/ta-candidate.cid" \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}:/tmp/ta-candidate.state" \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}:/tmp/ta-candidate.log" \
              "${RUNNER_TEMP}/" 2>/dev/null

          container_id="$(head -c 128 "${cid_file}" 2>/dev/null | tr -dc 'a-f0-9')"
          candidate_identity_match=false
          if [ -n "${container_id}" ] && [ -s "${state_raw}" ]; then
            if python scripts/sanitize_startup_diagnostics.py \
                --state \
                --target-revision "${TARGET_REVISION}" \
                --target-image-ref "${TARGET_IMAGE_REF}" \
                < "${state_raw}" \
                > "${evidence_dir}/daemon-state.json" 2>/dev/null; then
              candidate_identity_match=true
            fi
          fi
          if [ "${candidate_identity_match}" != "true" ]; then
            : > "${raw_log}"
          fi
          python scripts/sanitize_startup_diagnostics.py \
              < "${raw_log}" \
              > "${evidence_dir}/daemon-signals.json"
          rm -f "${raw_log}" "${state_raw}" "${cid_file}"

          CONTAINER_ID="${container_id}" python - \
              "${evidence_dir}/manifest.json" \
              "${evidence_dir}/daemon-state.json" <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import re
          import sys

          revision = os.environ["TARGET_REVISION"]
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              revision = "unavailable"
          container_id = os.environ.get("CONTAINER_ID") or ""
          if not re.fullmatch(r"[0-9a-f]{12,64}", container_id):
              container_id = "unavailable"
          state = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          manifest = {
              "schema_version": 2,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "target_revision": revision,
              "container_id": container_id,
              "candidate_identity_match": state.get("candidate_identity_match") is True,
              "captured_utc": datetime.datetime.now(datetime.UTC).isoformat(),
          }
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          exit 0

      - name: Publish release-state receipt
        if: ${{ success() }}
        env:
          GIT_SHA: ${{ steps.tag.outputs.revision }}
          IMAGE_TAG: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.tag.outputs.digest }}
          IMAGE_REF: ${{ steps.tag.outputs.image_ref }}
          DEPLOYED_IMAGE: ${{ steps.deploy.outputs.deployed_image }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%S.000000Z)"
          cat > release-state.json <<EOF
          {"receipt_available":true,"git_sha":"${GIT_SHA}","image_tag":"${IMAGE_TAG}","image_digest":"${IMAGE_DIGEST}","build_run_id":"${BUILD_RUN_ID}","build_run_url":"https://github.com/${{ github.repository }}/actions/runs/${BUILD_RUN_ID}","deploy_run_id":"${{ github.run_id }}","deploy_run_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}","schema_migration_rev":"not_applicable","canary_bundle_status":"not_run","deployed_at":"${now}","rollback_target":"","actor":"${{ github.actor }}","repository":"${{ github.repository }}","workflow_event":"${{ github.event_name }}","extra":{"active_git_sha":"${GIT_SHA}","active_identity_status":"running_healthy","active_image_digest":"${IMAGE_DIGEST}","active_image_ref":"${DEPLOYED_IMAGE}","active_source_provenance":"digest_revision_label","image_ref":"${IMAGE_REF}","image_mutation_started":true,"outcome":"succeeded","production_mutation_started":true,"release_state_version":2,"rollback_attempted":false,"rollback_reason":"not_needed","rollback_result":"not_attempted","running_image_ref":"${DEPLOYED_IMAGE}","forward_canary_status":"passed","forward_deploy_status":"succeeded","terminal_at":"${now}"}}
          EOF
          scp -i ~/.ssh/do_deploy -o BatchMode=yes release-state.json \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}:/tmp/release-state.json"
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
            "vol=\$(sudo docker volume inspect tinyassets-data --format '{{ .Mountpoint }}'); \
             sudo install -m 0644 -o root -g root /tmp/release-state.json \"\${vol}/release-state.json\""
          echo "published release-state git_sha=${GIT_SHA}"

      - name: Verify protected receipt contains target revision
        id: deployed_sha
        env:
          GIT_SHA: ${{ steps.tag.outputs.revision }}
          TINYASSETS_WIKI_CANARY_TOKEN: ${{ secrets.TINYASSETS_WIKI_CANARY_TOKEN }}
        run: |
          set -euo pipefail
          # --report-provenance is a record-only diagnostic printed from the same
          # pulse response this assertion already fetches (openspec change
          # cloud-only-runtime-admission, task 5). It does not affect the exit
          # code, and an `unknown` verdict is the absence of an observation --
          # never a pass of cloud acceptance.
          python scripts/deployed_sha.py \
            --url https://tinyassets.io/mcp \
            --report-provenance \
            --assert-contains "${GIT_SHA}"

      - name: Enforce daemon image retention (post-canary)
        # Every deploy pulls a ~2.7 GB daemon image; on 2026-09-24 the droplet
        # held 23 of them (50 GB disk, 87% used) because retention only acted
        # above a pressure threshold and the dedicated timer was weekly.
        #
        # This runs only after the public canary is green and the protected
        # receipt names the target revision, i.e. after the canary rollback
        # step can no longer fire. It starts the SAME installed unit the daily
        # timer and the hourly disk-watch use -- fence then host-mutation lock,
        # registry-verified, at most four removals, bounded budget -- rather
        # than a second copy of the policy. Keep set (scripts/
        # daemon_image_retention.py): the running image, every container's
        # image, the configured TINYASSETS_IMAGE and receipt rollback_target,
        # anything newer than the running image, and the two newest older
        # daemon images. Everything else is removed regardless of disk percent.
        #
        # A retention refusal must not fail a deploy that succeeded: that would
        # open a deploy-failed issue and suppress the install-host-services
        # chain, which only runs after a successful deploy. It is a warning, and
        # the daily timer plus the hourly disk-watch retry.
        id: retention
        if: ${{ success() }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -uo pipefail
          rc=0
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes "${DO_SSH_USER}@${DO_DROPLET_HOST}" 'bash -s' <<'REMOTE' || rc=$?
          set -uo pipefail
          status=0
          sudo systemctl start tinyassets-prune.service || status=$?
          invocation="$(systemctl show --property=InvocationID --value tinyassets-prune.service)"
          if [ -n "${invocation}" ]; then
            sudo journalctl --no-pager --output=cat "_SYSTEMD_INVOCATION_ID=${invocation}" | tail -n 20
          fi
          df -h / | tail -n 1
          exit "${status}"
          REMOTE
          if [ "${rc}" -ne 0 ]; then
            echo "::warning::post-deploy image retention did not complete (rc=${rc}); the daily timer and hourly disk-watch retry. The pass report is above."
          fi

      - name: Retire platform LLM logins from the host
        # The platform has no LLM (AGENTS.md Hard Rule 15). The new image and
        # compose file read no platform model credential, and the entrypoint
        # strips every such name, so what is left on the host is dead weight
        # that is also a live secret. This removes it -- env-file names
        # (including the retired platform GitHub push maps), the GitHub App
        # token refresher and its key, and both platform login directories in
        # full (founder decision 2026-09-24), behind exact-path, mount and symlink guards; never a
        # universe (u-*). Names and counts only in the log. Idempotent, and it runs ONLY after the public canary is green:
        # the script also refuses unless the running daemon is the new release.
        if: ${{ success() && steps.canary.outcome == 'success' }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/do_deploy -o BatchMode=yes \
              deploy/retire_platform_llm_logins.sh deploy/install-tinyassets-env.sh \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}:/tmp/"
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
            "sudo bash /tmp/retire_platform_llm_logins.sh /tmp/install-tinyassets-env.sh"

      - name: Open deploy-failed issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue create --repo "${{ github.repository }}" \
            --title "deploy-failed: run ${{ github.run_id }}" \
            --label "deploy-failed" \
            --body "Fail-safe deploy did not fully succeed. deploy rc=${{ steps.deploy.outputs.rc }}, result=${{ steps.deploy.outputs.result }}, deployed_image=${{ steps.deploy.outputs.deployed_image }}. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}. Prod is NOT left at zero (the script restores the previous image), but the target release did not become healthy — investigate before retrying." 2>&1 | tail -2 || true

      # After every rollback and bookkeeping step, so the artifact is written
      # once the deploy has finished moving. Gated on the capture SUCCEEDING,
      # not on the deploy failing: `if-no-files-found: error` would otherwise
      # fail a green run that never captured anything. The old gate also
      # required the stop-writer cleanup outputs, which #2442 retired with the
      # fence itself -- there is nothing left to race.
      # Non-fatal and bounded (Codex P2): this runs on the recovery path, where
      # an artifact-service error or a slow upload must not fail the job or hold
      # the production-host-mutation group any longer than necessary --
      # release-reconcile defers while a matching deploy is unfinished. `warn`
      # rather than `error` because an empty evidence dir is a legitimate
      # outcome when the container was already gone.
      - name: Upload failed candidate startup diagnostics
        if: ${{ always() && steps.candidate_diagnostics.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-startup-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-startup-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "## Fail-safe deploy"
            echo "- image: \`${{ steps.tag.outputs.image_ref }}\`"
            echo "- revision: \`${{ steps.tag.outputs.revision }}\`"
            echo "- waited for in-flight turns: \`${{ steps.turns.outputs.outcome }}\` after \`${{ steps.turns.outputs.waited_s }}s\` (\`${{ steps.turns.outputs.polls }}\` polls)"
            echo "- deploy rc: \`${{ steps.deploy.outputs.rc }}\` result: \`${{ steps.deploy.outputs.result }}\`"
            echo "- deployed image: \`${{ steps.deploy.outputs.deployed_image }}\`"
            echo "- public canary: \`${{ steps.canary.outcome }}\`"
            echo "- app surface probe: \`${{ steps.app_probe.outcome }}\`"
            echo "- protected receipt assertion: \`${{ steps.deployed_sha.outcome }}\`"
            echo "- image retention: \`${{ steps.retention.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
