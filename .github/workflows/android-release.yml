name: Android release AAB

# Builds a signed Android App Bundle (.aab) for Google Play from the upload
# keystore (provided as repo secrets — see docs/ops/google-play-launch.md §3).
# The web app itself ships instantly; a new AAB is only needed when the native
# shell / config changes. Runs on demand (workflow_dispatch) or on a mobile-v* tag.
#
# Signing: gradle builds the UNSIGNED bundle (no committed signing config to leak),
# then we sign the .aab with the upload key via jarsigner. Google re-signs with the
# real app-signing key via Play App Signing (enroll on first upload). The keystore
# secret is exposed ONLY to the signing step and is decoded to a runner-temp file
# that is removed after use.

on:
  workflow_dispatch:
  push:
    tags: ["mobile-v*"]
  pull_request:
    paths:
      - ".github/workflows/android-release.yml"
      - "mobile/**"

permissions:
  contents: read

concurrency:
  # One group per PR, so a new push to a `mobile/**` PR cancels the superseded
  # AAB build. Every non-PR run gets its OWN group via `run_id`, and
  # `cancel-in-progress` is conditional on top of that. Two layers here matter
  # more than anywhere else in this repo: a `push: tags: mobile-v*` run BUILDS
  # AND SIGNS the release bundle Play receives. Cancelling one mid-jarsigner
  # would leave a tag with no artifact and no error anyone reads, so neither a
  # PR nor a second tag may ever interrupt it.
  group: android-release-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Refuse to sign commits outside main history
        if: github.event_name != 'pull_request'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # TinyAssets is public by invariant, so this deliberately remains an
          # anonymous read after checkout removed credentials. A private fork
          # must supply read auth here or releases fail closed.
          if git rev-parse --is-shallow-repository | grep -qx true; then
            git fetch --unshallow --no-tags origin \
              +refs/heads/main:refs/remotes/origin/main
          else
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::refuses to sign $RELEASE_SHA because it is not in origin/main history"
            exit 1
          fi

      - name: Install JS deps (lockfile-pinned)
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Add + sync Android platform
        working-directory: mobile
        run: |
          npx --no-install cap add android
          npx --no-install cap sync android

      - name: Register the tinyassets:// deep link (in-app OAuth return)
        working-directory: mobile
        run: |
          python3 scripts/add_app_scheme.py
          grep -n 'android:scheme="tinyassets"' android/app/src/main/AndroidManifest.xml

      - name: Materialise google-services.json (phone notifications)
        working-directory: mobile
        env:
          # Build input, never committed (public repo). Unset = the build still
          # succeeds with push disabled and says so in this step's log.
          ANDROID_GOOGLE_SERVICES_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}
        run: python3 scripts/materialize_google_services.py

      - name: Install the launcher icon + splash (pre-rendered, no image toolchain in CI)
        working-directory: mobile
        run: python3 scripts/add_app_icons.py

      - name: Apply version + verify Android release identity, SDK, manifest and artwork
        working-directory: mobile
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/mobile-v') && github.ref_name || '' }}
        run: |
          expected=""
          if [ -n "$RELEASE_TAG" ]; then expected="${RELEASE_TAG#mobile-v}"; fi
          if [ -n "$RELEASE_TAG" ] && [ -z "$expected" ]; then
            echo "::error::release tag must include a version after mobile-v"
            exit 1
          fi
          args=()
          if [ -n "$expected" ]; then args+=(--expected-version "$expected"); fi
          python3 scripts/configure_android_release.py "${args[@]}"
          python3 scripts/verify_android_release.py --artwork-only
          python3 scripts/verify_android_release.py

      - name: Lint and build unsigned release bundle
        working-directory: mobile/android
        run: ./gradlew lintRelease bundleRelease --no-daemon --stacktrace

      - name: Verify the merged release manifest
        working-directory: mobile
        run: python3 scripts/verify_android_release.py --merged

      - name: Locate the bundle
        id: findaab
        run: |
          set -euo pipefail
          aab="$(find mobile/android/app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          [ -n "$aab" ] || { echo "::error::no .aab produced"; exit 1; }
          echo "aab=$aab" >> "$GITHUB_OUTPUT"

      - name: Sign the bundle with the upload key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          AAB: ${{ steps.findaab.outputs.aab }}
          # The upload certificate generated 2026-09-01 (keytool, RSA 2048, alias
          # `upload`). A restored keystore that does not carry exactly this
          # certificate must never sign a Play upload — fail closed, like the
          # debug-keystore pin in android-build.yml.
          EXPECTED_SHA256: "D0:BC:F2:FB:EA:4E:11:6D:87:DD:DD:BD:B2:4C:1E:28:53:7A:CA:77:BE:8E:69:BE:AD:52:C7:C1:C1:03:B2:11"
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::ANDROID_UPLOAD_KEYSTORE_B64 not set — add the upload keystore secrets (docs/ops/google-play-launch.md §3) before building a release."
            exit 1
          fi
          ks="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          trap 'rm -f "$ks"' EXIT
          # Passwords reach keytool/jarsigner via `:env`, never argv — a same-job
          # process could otherwise read them from /proc/*/cmdline (Codex 2026-09-02).
          actual="$(keytool -list -v -keystore "$ks" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" | awk '/SHA256:/ {print $2; exit}')"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::upload keystore certificate fingerprint mismatch ($actual) — refusing to sign"
            exit 1
          fi
          echo "upload certificate fingerprint verified"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$ks" -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD \
            "$AAB" "$KEY_ALIAS"
          # Upload keys are intentionally self-signed, so `-strict` would reject
          # the valid bundle for an untrusted certificate chain. The next check
          # pins the signer certificate instead of weakening provenance.
          jarsigner -verify "$AAB"
          signed_fingerprint="$(keytool -printcert -jarfile "$AAB" | awk '/SHA256:/ {print $2; exit}')"
          if [ "$signed_fingerprint" != "$EXPECTED_SHA256" ]; then
            echo "::error::signed AAB certificate fingerprint mismatch ($signed_fingerprint)"
            exit 1
          fi
          aab_dir="$(dirname "$AAB")"
          aab_name="$(basename "$AAB")"
          (cd "$aab_dir" && sha256sum "$aab_name" | tee "$aab_name.sha256")
          echo "signed $AAB with upload key"

      - name: Upload signed AAB artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tinyassets-release-aab
          path: |
            ${{ steps.findaab.outputs.aab }}
            ${{ steps.findaab.outputs.aab }}.sha256
          if-no-files-found: error
