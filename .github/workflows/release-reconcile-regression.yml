name: Release reconcile regression

on:
  pull_request:
    paths:
      - '.github/workflows/build-image.yml'
      - '.github/workflows/release-reconcile.yml'
      - '.github/workflows/release-reconcile-regression.yml'
      - 'tests/test_build_image_workflow.py'
      - 'tests/test_release_reconcile_workflow.py'
      - 'scripts/runtime_paths.py'
      - 'tests/test_runtime_paths.py'
      - 'tests/runtime_repo_fixture.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-image.yml'
      - '.github/workflows/release-reconcile.yml'
      - '.github/workflows/release-reconcile-regression.yml'
      - 'tests/test_build_image_workflow.py'
      - 'tests/test_release_reconcile_workflow.py'
      - 'scripts/runtime_paths.py'
      - 'tests/test_runtime_paths.py'
      - 'tests/runtime_repo_fixture.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # `github.ref` is unique per PR (refs/pull/N/merge), so PR cancellation is
  # unchanged -- but on `push: main` every push shared ONE group, so each push
  # cancelled the previous main run of this regression. That is the shape
  # tests.yml calls "coverage while providing none": the main run is the one
  # that proves what LANDED still reconciles. The `run_id` fallback gives every
  # non-PR run its own group, and the condition is the second layer.
  group: release-reconcile-regression-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # release-reconcile.yml uses the system python3 on ubuntu-24.04. Pin the
      # same minor version here so embedded-script syntax cannot silently pass
      # only on a more permissive developer interpreter.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: python -m pip install -e . pytest pyyaml

      - name: Run release workflow contracts
        run: >-
          python -m pytest
          tests/test_build_image_workflow.py
          tests/test_release_reconcile_workflow.py
          tests/test_runtime_paths.py
          -q
