      - "tinyassets/agent_loop/tool_session.py"
      - "tinyassets/extension_capabilities.py"
      - "tinyassets/extension_hooks.py"
      - "tests/test_ta_capabilities.py"
      # Workspace mount jail proofs (real_jail-marked
      # 2026-10-01; before that no CI job ran them).
      # Code nodes' bwrap jail: positive control plus the boundary proofs.
      - "tests/engine_authority_helpers.py"
      - "tinyassets/universe_tools.py"
      - "tinyassets/ta_capabilities.py"
      - "tinyassets/ta_cli.py"
      - "tinyassets/engine_mcp_server.py"
      - "tinyassets/served_tools.py"
