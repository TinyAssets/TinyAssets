name: linux-jail-proof

# Why this exists
# ---------------
# Some proofs only mean anything inside a real bubblewrap jail, and every one
# of them is `skipif`-gated on bwrap. No other job installs bubblewrap, so
# `required-tests` records them as SKIPPED on every run. A skip is invisible in
# a green run and is not evidence in either direction. The guarded cases:
#
#   * tests/test_delivery_node_rpc.py::test_real_linux_jail_transports_delivery_rpc
#     runs the file-delivery RPC through the real jail
#     (tinyassets/node_sandbox.py BwrapLauncher);
#   * tests/test_native_refresh_jail.py runs the argv the shipping codex
#     provider builds for a coding turn (tinyassets/providers/codex_provider.py)
#     and proves the launch-credential mask holds, with a detection control;
#   * tests/test_provider_jail_root_masks.py proves a provider cannot read,
#     write or re-link the per-universe platform state kept in hidden root files
#     (the credential vault, the run/consent/usage databases);
#   * tests/test_provider_universe_jail.py runs the shipping claude and codex
#     adapters, and a jail-unaware command adapter through the router, inside
#     the shared provider jail (tinyassets/providers/provider_jail.py) and
#     proves a launch for universe A reads A but not universe B, the platform
#     source, another launch's credential or any outside process environment;
#   * tests/test_provider_jail_network.py proves a provider launch has no host
#     network: its API only through the universe's checking egress proxy, its
#     own engine MCP server only through the pinned relay, and never the
#     daemon's loopback, another universe's engine port, the metadata address
#     or the host; plus the seccomp filter and rlimits inside the jail;
#   * tests/test_universe_tools_jail.py drives the universe agent's four tools
#     (tinyassets/universe_tools.py, served by tinyassets/engine_mcp_server.py)
#     through the real tool jail and proves: only its own universe at /u, no
#     network, no planted link or FIFO, a settings dir it writes masked from
#     the next provider launch, resource limits that kill a runaway
#     (memory, processes / fork bomb, cpu, output, wall clock, shared disk), and
#     that a skill file the agent writes changes its next served turn.
#
# This job supplies the jail on a disposable GitHub-hosted Ubuntu VM and FAILS
# unless EVERY case marked `@pytest.mark.real_jail` is present in JUnit with no
# skip, failure or error. The marker is the only list: a new jail proof joins
# by carrying it (and adding its file to `paths:` below so it retriggers).
# It is cloud-only test infrastructure: no deployment, no production surface,
# no account secrets, no self-hosted runner, never the founder's desktop.
#
# It is deliberately NOT a branch-protection context. `required-tests` in
# tests.yml remains the merge gate; this is the independent Linux proof for the
# file-delivery, codex coding-turn and provider-universe jail slices, read by
# a human before a "proven live" claim.
#
# WHERE THE JAIL RUNS: a container as uid 1001, because that is production,
# through scripts/linux_oracle.py -- the same invocation developers use
# locally, so CI and the local oracle cannot drift apart.
# The live daemon runs as uid=1001(tinyassets) inside its container with
# unprivileged user namespaces enabled and /usr/bin/bwrap (checked 2026-10-01).
# The hosted Ubuntu VM refuses unprivileged user namespaces to the runner, and
# the old fallback ran pytest under `sudo -n`: as root inside bwrap's user
# namespace, binds of runner-owned paths and /proc/self/fd/N are denied, so 18
# workspace-provisioning proofs failed for a reason production never has. The
# proof therefore runs in the oracle image (docker/linux-oracle.Dockerfile:
# python:3.11-slim + bubblewrap, the same base as production) at --user
# 1001:1001, with seccomp and systempaths unconfined for that one container
# (Docker's defaults block bubblewrap's clone flags and /proc mounts).
# The hosted kernel restricts unprivileged user namespaces through AppArmor
# (kernel.apparmor_restrict_unprivileged_userns=1): with plain
# `apparmor=unconfined` the namespace is created but its capabilities are
# denied (`bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted`,
# measured 2026-10-01). So the container gets ONE named profile,
# `ta-jail-userns` (unconfined plus `userns,`), loaded for this run only. No
# host sysctl is changed, no privileged container, no daemon edits, and no
# other process gains user namespaces. If the jail cannot be created, the job
# is red, not skipped.

on:
  pull_request:
    # `ready_for_review` is NOT a default type, and the job below skips on a
    # draft; without it a PR marked ready keeps the draft run's skip until its
    # next push.
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      # This job and its assertion helper.
      - ".github/workflows/linux-jail-proof.yml"
      - "docker/linux-oracle.Dockerfile"
      - "scripts/linux_oracle.py"
      - "scripts/ci_assert_junit_case.py"
      # The jail and the runtime that drives delivery RPC through it.
      - "tinyassets/node_sandbox.py"
      - "tinyassets/graph_compiler.py"
      - "tinyassets/runs.py"
      - "tinyassets/engine_admissions.py"
      - "tinyassets/delivery_runtime.py"
      - "tinyassets/action_result_delivery.py"
      - "tinyassets/conversation_custody.py"
      - "tinyassets/run_file_*.py"
      # Delivery / receiver / file custody API and storage.
      - "tinyassets/api/deliveries.py"
      - "tinyassets/api/receiver_links.py"
      - "tinyassets/api/run_files.py"
      - "tinyassets/storage/deliveries.py"
      - "tinyassets/storage/delivery_lock.py"
      - "tinyassets/storage/receiver_links.py"
      - "tinyassets/storage/run_files.py"
      - "tinyassets/storage/run_file_lock.py"
      - "tinyassets/storage/conversation_custody.py"
      # The module under proof and the fixtures it imports.
      - "tests/test_delivery_node_rpc.py"
      - "tests/test_delivery_public.py"
      - "tests/test_receiver_links.py"
      - "tests/conftest.py"
      # The codex coding-turn jail proof and the provider whose argv it runs.
      - "tests/test_native_refresh_jail.py"
      - "tinyassets/providers/codex_provider.py"
      # The provider universe jail, the shared spawn point that applies it, the
      # router that binds the owning universe, the adapters it launches and the
      # environment builder whose paths must resolve inside it.
      - "tests/test_provider_universe_jail.py"
      - "tests/test_provider_jail_network.py"
      - "tests/test_provider_jail_root_masks.py"
      - "tinyassets/providers/provider_jail.py"
      - "tinyassets/providers/jail_seccomp.py"
      - "tinyassets/providers/owned_process.py"
      - "tinyassets/providers/router.py"
      - "tinyassets/providers/claude_provider.py"
      - "tinyassets/providers/base.py"
      # The universe agent's four tools, the engine surface that serves them,
      # the served turn that indexes its skills, and their real-jail proof.
      - "tests/test_universe_tools_jail.py"
      # Workspace provisioning and registry proxy jail proofs (real_jail-marked
      # 2026-10-01; before that no CI job ran them).
      - "tests/test_node_sandbox_workspace.py"
      - "tests/test_workspace_provision_mount.py"
      - "tests/test_workspace_provision_process.py"
      - "tests/test_workspace_registry_proxy.py"
      - "tests/test_sandbox_mount_handles.py"
      # Code nodes' bwrap jail: positive control plus the boundary proofs.
      - "tests/test_node_sandbox.py"
      - "tinyassets/workspace_provision_process.py"
      - "tinyassets/workspace_registry_process.py"
      - "tinyassets/workspace_registry.py"
      - "tinyassets/workspace_registry_proxy.py"
      - "tests/engine_authority_helpers.py"
      - "tinyassets/universe_tools.py"
      - "tinyassets/engine_mcp_server.py"
      - "tinyassets/served_tools.py"
      - "tinyassets/universe_intelligence.py"
      - "tinyassets/universe_egress.py"
      - "tinyassets/workspace_fs.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-jail-proof-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  linux-jail-proof:
    name: linux-jail-proof
    # Drafts do not spend a runner here; `ready_for_review` above runs it for
    # real as soon as the PR is ready, and `workflow_dispatch` is unaffected
    # (the condition's first clause is true for every non-PR event).
    # Deliberately NOT a branch-protection context (see the header), which is
    # what makes skipping safe: a skipped job reports `conclusion=skipped` and
    # branch protection accepts that as satisfied. If this proof is ever
    # promoted to a required check, this `if:` must be removed in the same
    # change -- otherwise the gate passes without running.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Ephemeral GitHub-hosted VM only, never self-hosted. The jail itself runs
    # in a throwaway container as uid 1001 (see the header).
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # On the host only to collect the marked cases and read the JUnit;
        # the proofs themselves run in the container.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Allow user namespaces for the jail container only
        env:
          PROFILE: ${{ runner.temp }}/ta-jail-userns
        run: |
          set -euo pipefail
          # Unconfined like Docker's apparmor=unconfined, plus the one permission
          # the kernel's userns restriction withholds. Applied only to the
          # containers below, by name.
          printf '%s\n' \
            'abi <abi/4.0>,' \
            'include <tunables/global>' \
            'profile ta-jail-userns flags=(unconfined) {' \
            '  userns,' \
            '}' > "$PROFILE"
          sudo apparmor_parser -r "$PROFILE"

      - name: Run the jail proof modules inside the real jail
        env:
          OUT_DIR: ${{ runner.temp }}/jail-out
        run: |
          set -euo pipefail
          # The cases are whatever carries @pytest.mark.real_jail -- the ONE
          # definition. A plain assignment, so `set -e` stops on the helper's
          # own failure (it exits 2 when no test carries the marker).
          listed="$(python scripts/ci_assert_junit_case.py --marker real_jail --list-files)"
          mapfile -t files <<< "$listed"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no test file carries pytest.mark.real_jail"
            exit 1
          fi
          mkdir -p "$OUT_DIR"
          # The SAME invocation a developer runs locally: scripts/linux_oracle.py
          # builds the oracle image, runs as uid 1001, probes bubblewrap first
          # (exit 3, pytest never starts, if no jail can be made) and passes
          # pytest's exit code through. Only the profile is CI-specific.
          python scripts/linux_oracle.py --out "$OUT_DIR" --apparmor ta-jail-userns \
            --env TINYASSETS_DATA_DIR=/tmp/ta-data \
            -- -m real_jail -q -p no:cacheprovider -o junit_family=xunit1 \
            --basetemp /tmp/b --junitxml /out/junit-linux-jail.xml "${files[@]}"

      - name: Assert every real-jail case executed (a skip is not a pass)
        # Runs even when pytest is red so the summary names each case's state.
        if: always()
        env:
          JUNIT_PATH: ${{ runner.temp }}/jail-out/junit-linux-jail.xml
        run: |
          set -euo pipefail
          # Every case carrying the marker, derived from the test source by the
          # same helper; absent, skipped, failed or errored fails the job.
          python scripts/ci_assert_junit_case.py \
            --junit "$JUNIT_PATH" \
            --marker real_jail \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-linux-jail-proof
          path: ${{ runner.temp }}/jail-out/junit-linux-jail.xml
          if-no-files-found: warn
