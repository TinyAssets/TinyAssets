permissions:
  contents: read

concurrency:
  group: linux-jail-proof-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  linux-jail-proof:
    name: linux-jail-proof
    # Draft proofs run when ready_for_review fires; dispatch and main still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Ephemeral GitHub-hosted VM only, never self-hosted. The jail itself runs
    # in a throwaway container as uid 1001 (see the header).
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # On the host only to collect the marked cases and read the JUnit;
        # the proofs themselves run in the container.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Allow user namespaces for the jail container only
        env:
          PROFILE: ${{ runner.temp }}/ta-jail-userns
        run: |
          set -euo pipefail
          # Unconfined like Docker's apparmor=unconfined, plus the one permission
          # the kernel's userns restriction withholds. Applied only to the
          # containers below, by name.
          printf '%s\n' \
            'abi <abi/4.0>,' \
            'include <tunables/global>' \
            'profile ta-jail-userns flags=(unconfined) {' \
            '  userns,' \
            '}' > "$PROFILE"
          sudo apparmor_parser -r "$PROFILE"

      - name: Run the jail proof modules inside the real jail
        env:
          OUT_DIR: ${{ runner.temp }}/jail-out
        run: |
          set -euo pipefail
          # The cases are whatever carries @pytest.mark.real_jail -- the ONE
          # definition. A plain assignment, so `set -e` stops on the helper's
          # own failure (it exits 2 when no test carries the marker).
          listed="$(python scripts/ci_assert_junit_case.py --marker real_jail --list-files)"
          mapfile -t files <<< "$listed"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no test file carries pytest.mark.real_jail"
            exit 1
          fi
          mkdir -p "$OUT_DIR"
          # The SAME invocation a developer runs locally: scripts/linux_oracle.py
          # builds the oracle image, runs as uid 1001, probes bubblewrap first
          # (exit 3, pytest never starts, if no jail can be made) and passes
          # pytest's exit code through. Only the profile is CI-specific.
          python scripts/linux_oracle.py --out "$OUT_DIR" --apparmor ta-jail-userns \
            --env TINYASSETS_DATA_DIR=/tmp/ta-data \
            -- -m real_jail -q -p no:cacheprovider -o junit_family=xunit1 \
            --basetemp /tmp/b --junitxml /out/junit-linux-jail.xml "${files[@]}"

      - name: Assert every real-jail case executed (a skip is not a pass)
        # Runs even when pytest is red so the summary names each case's state.
        if: always()
        env:
          JUNIT_PATH: ${{ runner.temp }}/jail-out/junit-linux-jail.xml
        run: |
          set -euo pipefail
          # Every case carrying the marker, derived from the test source by the
          # same helper; absent, skipped, failed or errored fails the job.
          python scripts/ci_assert_junit_case.py \
            --junit "$JUNIT_PATH" \
            --marker real_jail \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-linux-jail-proof
          path: ${{ runner.temp }}/jail-out/junit-linux-jail.xml
          if-no-files-found: warn

  production-owner-launch:
    name: production boxhostd startup and owner wake through runsc
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the candidate harness image
        env:
          SHA: ${{ github.sha }}
        run: docker build --build-arg TINYASSETS_BUILD_SHA="$SHA" -t ta-launch-proof .
      - name: Fetch the production-pinned runsc release
        env:
          OUT: ${{ runner.temp }}/owner-launch
        run: |
          set -euo pipefail
          mkdir -p "$OUT/gvisor"
          release=$(sed -n 's/^release=//p' deploy/install-boxhostd-preflight.sh)
          digest=$(sed -n 's/^archive_sha=//p' deploy/install-boxhostd-preflight.sh)
          test -n "$release" && test -n "$digest"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            "https://github.com/google/gvisor/releases/download/$release/gvisor-x86_64.tar.bz2" \
            -o "$OUT/gvisor.tar.bz2"
          echo "$digest  $OUT/gvisor.tar.bz2" | sha256sum --strict -c -
          tar -xjf "$OUT/gvisor.tar.bz2" -C "$OUT/gvisor"
      - name: Launch an owner from the production extraction
        # Disposable synthetic archive only. Starts the production entry point
        # in a populated, undelegated service cgroup; it must evacuate itself,
        # create its sockets/relays and wake an owner through the UID1001 channel.
        # Real runsc supplies OCI mounts/UID/argv and cgroup floor readback.
        env:
          OUT: ${{ runner.temp }}/owner-launch
        run: |
          python scripts/linux_oracle.py --as-root --docker-engine --out "$OUT" \
            --env TA_REHEARSAL_BASE_IMAGE=ta-launch-proof \
            --env TA_REHEARSAL_RUNSC_DIR=/out/gvisor \
            -- tests/test_box_move_rehearsal.py::test_synthetic_archive_rehearses_final_cutover \
            -q --junitxml=/out/owner-launch.xml
      - name: Refuse absent or skipped launch proof
        if: always()
        env:
          REPORT: ${{ runner.temp }}/owner-launch/owner-launch.xml
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          cases = ET.parse(os.environ["REPORT"]).findall(".//testcase")
          assert len(cases) == 1
          assert not any(c.find(tag) is not None for c in cases for tag in ("skipped", "failure", "error"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-owner-launch
          path: ${{ runner.temp }}/owner-launch/owner-launch.xml
