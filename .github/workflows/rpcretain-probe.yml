name: RPC retention probe

# The production memory probe of rpcretain research §5: does Cloudflare's 128 MB isolate
# limit count garbage V8 has not collected yet? Manual only, from main, and the founder
# approves each run. It deploys one throwaway Worker, rr-rpcretain-probe (workers.dev only,
# bound to no TinyAssets resource), runs four forms (alloc, rpcArr, rpcStream, and the
# control retain) at 32, 128, 256, 512 and 1024 MiB, each run twice 30 s apart, and reads
# production's own figures through GraphQL. It deletes the Worker and its Durable Object
# namespace before deploying and again at the end, whatever happened, then reads the
# account's Worker list back to prove it is gone. No route, zone or DNS record is touched.
# Cost: about $0 on Workers Paid (40 requests; about 10 GB-s of DO duration).
#
# Token scope (the CLOUDFLARE_API_TOKEN repo secret store-probe.yml uses):
#   Account -> Workers Scripts: Edit       upload, DO class migration, the workers.dev
#                                          route, delete, the subdomain, the script and
#                                          DO namespace lists
#   Account -> Billing: Read               optional: names the account's plan
#   Account -> Account Analytics: Read     optional: the GraphQL readings
#
# A run takes about 40 minutes: about 25 for the matrix, up to 10 for analytics to land.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run at a time: every run deploys the same script name.
  group: rpcretain-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Install <=10, harness <=10, account <=3, deploy <=10, matrix <=150, cleanup <=10,
    # analytics <=15, and the rest.
    timeout-minutes: 220
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER: ${{ github.workspace }}/platform/node_modules/.bin/wrangler
      SCRIPT: rr-rpcretain-probe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      # The platform lockfile pins wrangler and miniflare (workerd 1.20261023.1).
      - name: Install the pinned toolchain
        working-directory: platform
        timeout-minutes: 10
        run: npm ci --no-audit --no-fund

      - name: Harness check in miniflare (proves the harness, not a reading)
        timeout-minutes: 10
        run: node scripts/probes/rpcretain/local.mjs

      - name: Check the account
        id: account
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set (needs Account: Workers Scripts: Edit)."
            exit 1
          fi
          api() {
            curl -sS --max-time 60 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -o "${RUNNER_TEMP}/api.json" -w '%{http_code}' "https://api.cloudflare.com/client/v4$1"
          }

          account_id="${CLOUDFLARE_ACCOUNT_ID_SECRET}"
          if [ -z "${account_id}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID secret is not set; resolving from the tinyassets.io zone."
            api "/zones?name=tinyassets.io" > /dev/null
            account_id="$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1])).get("result") or []; print(((r[0].get("account") or {}).get("id") or "") if r else "")' "${RUNNER_TEMP}/api.json")"
          fi
          if [ -z "${account_id}" ]; then
            echo "::error::Could not resolve the Cloudflare account id."
            exit 1
          fi
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

          status="$(api "/accounts/${account_id}/workers/subdomain")"
          subdomain="$(python3 -c 'import json,sys; print((json.load(open(sys.argv[1])).get("result") or {}).get("subdomain") or "")' "${RUNNER_TEMP}/api.json" || true)"
          if [ "${status}" != "200" ] || [ -z "${subdomain}" ]; then
            echo "::error::No workers.dev subdomain on this account (HTTP ${status}). Creating one is account configuration: the founder picks it in the dashboard (Workers & Pages, then Subdomain)."
            exit 1
          fi
          echo "::add-mask::${subdomain}"
          echo "PROBE_SUBDOMAIN=${subdomain}" >> "${GITHUB_ENV}"
          echo "workers.dev subdomain: present"

          status="$(api "/accounts/${account_id}/subscriptions")"
          plan="$(python3 - "${RUNNER_TEMP}/api.json" "${status}" <<'PY'
          import json, sys
          path, status = sys.argv[1], sys.argv[2]
          if status != "200":
              print(f"unknown (HTTP {status}: the token cannot read billing)")
              sys.exit()
          subs = json.load(open(path)).get("result") or []
          names = [((sub.get("rate_plan") or {}).get("public_name") or (sub.get("rate_plan") or {}).get("id") or "?") for sub in subs]
          workers = [n for n in names if "worker" in n.lower()]
          print("Workers: " + ", ".join(workers) if workers else "Free (no Workers subscription among: " + (", ".join(names) or "none") + ")")
          PY
          )"
          echo "Workers plan: ${plan}"
          echo "plan=${plan}" >> "${GITHUB_OUTPUT}"

          # A fresh gate token per run; only the probe Worker and the driver hold it.
          token="$(openssl rand -hex 24)"
          echo "::add-mask::${token}"
          echo "PROBE_TOKEN=${token}" >> "${GITHUB_ENV}"

      # The bootstrap copy (no SELF binding) goes first, so the binding's target script
      # exists when the full config deploys. The token goes up as a Worker secret.
      - name: Deploy the probe Worker
        id: deploy
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # Clear anything an earlier run left, Durable Object state included.
          bash scripts/probes/storeprobe/delete.sh "${SCRIPT}"
          config="${RUNNER_TEMP}/rpcretain-config"
          node scripts/probes/rpcretain/config.mjs --out "${config}" > /dev/null
          secrets="${RUNNER_TEMP}/rpcretain-token.json"
          trap 'rm -f "${secrets}"' EXIT
          python3 -c 'import json,os,sys; json.dump({"TOKEN": os.environ["PROBE_TOKEN"]}, open(sys.argv[1], "w"))' "${secrets}"
          "${WRANGLER}" deploy --config "${config}/bootstrap.wrangler.json" --secrets-file "${secrets}"
          "${WRANGLER}" deploy --config "${config}/probe.wrangler.json" --secrets-file "${secrets}"
          echo "deployed=true" >> "${GITHUB_OUTPUT}"

          # The namespace id filters the Durable Object analytics; it is masked like the account.
          curl -sS --max-time 60 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o "${RUNNER_TEMP}/ns.json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/durable_objects/namespaces?per_page=1000"
          namespace="$(python3 -c 'import json,os,sys; rows=json.load(open(sys.argv[1])).get("result") or []; print(next((r.get("id") or "" for r in rows if r.get("script")==os.environ["SCRIPT"] and r.get("class")=="Prober"), ""))' "${RUNNER_TEMP}/ns.json" || true)"
          rm -f "${RUNNER_TEMP}/ns.json"
          if [ -n "${namespace}" ]; then
            echo "::add-mask::${namespace}"
            echo "PROBE_NAMESPACE_ID=${namespace}" >> "${GITHUB_ENV}"
            echo "Durable Object namespace: read"
          else
            echo "::warning::The Prober namespace id was not read; the DO analytics will be skipped."
          fi

      # 150 minutes: the worst case is 40 calls at their 180 s timeout plus 39 gaps of 30 s
      # (about 140). The driver rewrites the results after each call and prints them, so a
      # step killed here still leaves what it had.
      - name: Run the matrix
        id: drive
        if: steps.deploy.outputs.deployed == 'true'
        timeout-minutes: 150
        run: |
          set -euo pipefail
          node scripts/probes/rpcretain/drive.mjs \
            --base "https://${SCRIPT}.${PROBE_SUBDOMAIN}.workers.dev" \
            --out "${RUNNER_TEMP}/rpcretain.json" --summary "${RUNNER_TEMP}/rpcretain.md" \
            --redact "${PROBE_SUBDOMAIN},${CLOUDFLARE_ACCOUNT_ID},${PROBE_NAMESPACE_ID:-}"

      # Right after the matrix, whatever happened: the analytics read by script name and
      # namespace id, not through the Worker. Then the account's Worker list is read back.
      - name: Delete the probe Worker and prove it is gone
        if: always()
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "The account step never resolved an account, so nothing was deployed."
            exit 0
          fi
          bash scripts/probes/storeprobe/delete.sh "${SCRIPT}"
          failed=$?
          status="$(curl -sS --max-time 60 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o "${RUNNER_TEMP}/scripts.json" -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts")" || status="curl failed"
          listed="$(python3 -c 'import json,os,sys; rows=json.load(open(sys.argv[1])).get("result") or []; names=[r.get("id") for r in rows]; print(len(names), os.environ["SCRIPT"] in names)' "${RUNNER_TEMP}/scripts.json" 2>/dev/null || echo "unread")"
          rm -f "${RUNNER_TEMP}/scripts.json"
          if [ "${failed}" != "0" ]; then
            line="FAILED: ${SCRIPT} or its namespace is still there (see the step log)"
          elif [ "${status}" != "200" ] || [ "${listed#* }" != "False" ]; then
            line="FAILED: the account's Worker list was not read back clean (HTTP ${status}, ${listed})"
            failed=1
          else
            line="${SCRIPT} and its namespace deleted and checked gone; the account's Worker list (${listed% *} scripts) does not hold it"
          fi
          echo "${line}"
          echo "- **cleanup:** ${line}" > "${RUNNER_TEMP}/rpcretain-cleanup.md"
          exit "${failed}"

      # Optional (Account Analytics: Read): a refusal is a line in the summary.
      - name: Production's figures from GraphQL
        if: always() && steps.drive.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -f "${RUNNER_TEMP}/rpcretain.json" ]; then
            node scripts/probes/rpcretain/analytics.mjs --results "${RUNNER_TEMP}/rpcretain.json" \
              --summary "${RUNNER_TEMP}/rpcretain.md" --redact "${PROBE_SUBDOMAIN:-},${PROBE_TOKEN:-}"
          fi

      - name: Results into the job summary
        if: always()
        env:
          PLAN: ${{ steps.account.outputs.plan }}
        run: |
          {
            echo "### RPC retention probe"
            echo ""
            echo "- **Workers plan (API):** ${PLAN:-not read}"
            echo "- **sha:** \`${GITHUB_SHA}\`"
            if [ -f "${RUNNER_TEMP}/rpcretain-cleanup.md" ]; then
              cat "${RUNNER_TEMP}/rpcretain-cleanup.md"
            fi
            echo ""
            if [ -f "${RUNNER_TEMP}/rpcretain.md" ]; then
              cat "${RUNNER_TEMP}/rpcretain.md"
            else
              echo "No results: the run stopped before the first call."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          mkdir -p "${RUNNER_TEMP}/rpcretain-results"
          for f in rpcretain.json rpcretain.md rpcretain-cleanup.md; do
            if [ -f "${RUNNER_TEMP}/${f}" ]; then
              cp "${RUNNER_TEMP}/${f}" "${RUNNER_TEMP}/rpcretain-results/"
            fi
          done

      - name: Results as an artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpcretain-probe-results
          path: ${{ runner.temp }}/rpcretain-results/
          if-no-files-found: warn
          retention-days: 30
