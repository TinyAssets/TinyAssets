name: Desktop release

on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
    paths:
      - "tinyassets/**"
      - "fantasy_daemon/**"
      - "domains/**"
      - "tinyassets_tray.py"
      - "packaging/windows/**"
      - "packaging/macos/**"
      - "packaging/linux/**"
      - "packaging/desktop_metadata.py"
      - ".github/workflows/desktop-release.yml"
  # No `pull_request` trigger. The 6-platform installer matrix cost 31.8
  # runner-min per PR run (60 runs, ~1,900 runner-min in 4 h on 2026-09-27),
  # more than the required gate, on a user-owned repo capped at ~20 concurrent
  # jobs, so it queued every required check and the deploy behind it. It is
  # not a required check; the main push above still builds every change that
  # lands, and a PR that needs installer proof can use workflow_dispatch.
  # docs/decisions/ADR-019-lean-ci-successor.md
  workflow_dispatch:
    inputs:
      publish_signed:
        description: Publish signed artifacts after every identity gate passes
        required: true
        type: boolean
        default: false
      version:
        description: SemVer without a leading v
        required: true
        type: string
        default: "0.1.0"
      channel:
        description: Update channel
        required: true
        type: choice
        options: [prerelease, stable]
        default: prerelease
      rollout_percent:
        description: Stable assignment percentage (0-100)
        required: true
        type: string
        default: "10"
      previous_version:
        description: Last known-good signed version for rollback evidence
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      publication_requested: ${{ steps.plan.outputs.publication_requested }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      rollout_percent: ${{ steps.plan.outputs.rollout_percent }}
      previous_version: ${{ steps.plan.outputs.previous_version }}
      source_date_epoch: ${{ steps.plan.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve reproducible build and publication plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PUBLISH: ${{ inputs.publish_signed }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_ROLLOUT: ${{ inputs.rollout_percent }}
          INPUT_PREVIOUS: ${{ inputs.previous_version }}
        shell: bash
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-0.1.0}"
          channel="${INPUT_CHANNEL:-prerelease}"
          rollout="${INPUT_ROLLOUT:-10}"
          publication_requested=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_PUBLISH" == "true" ]]; then
            publication_requested=true
          fi
          if [[ "$REF_NAME" == desktop-v* ]]; then
            version="${REF_NAME#desktop-v}"
            channel=stable
            rollout=100
            publication_requested=true
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be SemVer without a leading v"
            exit 1
          fi
          if ! [[ "$rollout" =~ ^[0-9]+$ ]] || (( rollout < 0 || rollout > 100 )); then
            echo "::error::rollout_percent must be between 0 and 100"
            exit 1
          fi
          if [[ "$channel" == "stable" && "$publication_requested" != "true" ]]; then
            echo "Stable was selected for metadata only; unsigned artifacts remain CI-only."
          fi
          {
            echo "publication_requested=$publication_requested"
            echo "version=$version"
            echo "channel=$channel"
            echo "rollout_percent=$rollout"
            echo "previous_version=${INPUT_PREVIOUS:-}"
            echo "source_date_epoch=$(git show -s --format=%ct HEAD)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            architecture: x86_64
          - platform: macos
            runner: macos-15
            architecture: arm64
          - platform: linux
            runner: ubuntu-24.04
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install frozen-build dependencies
        run: python -m pip install ".[desktop]" "pyinstaller==6.19.0"

      - name: Install Windows installer compiler
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
        run: >
          ./packaging/windows/build.ps1
          -Version "${{ needs.plan.outputs.version }}"
          -Architecture "${{ matrix.architecture }}"

      - name: Build macOS app and image
        if: matrix.platform == 'macos'
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
          VERSION: ${{ needs.plan.outputs.version }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: bash packaging/macos/build.sh

      - name: Build Linux packages
        if: matrix.platform == 'linux'
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
          VERSION: ${{ needs.plan.outputs.version }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: bash packaging/linux/build.sh

      - name: Stage Windows unsigned CI artifact and metadata
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
        run: |
          $stage = "packaging/release-stage/windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $artifact = Get-ChildItem "packaging/dist/windows/TinyAssetsServerSetup-*.exe"
          if ($artifact.Count -ne 1) { throw "expected exactly one Windows installer" }
          Copy-Item -LiteralPath $artifact.FullName -Destination $stage
          $staged = Join-Path $stage $artifact.Name
          $sbom = "$staged.spdx.json"
          python packaging/desktop_metadata.py sbom `
            --artifact $staged `
            --pyinstaller-analysis "packaging/build/windows/TinyAssets/Analysis-00.toc" `
            --project-name TinyAssets --project-version "${{ needs.plan.outputs.version }}" `
            --output $sbom
          python packaging/desktop_metadata.py metadata `
            --artifact $staged --output "$staged.metadata.json" `
            --version "${{ needs.plan.outputs.version }}" `
            --source-commit "${{ github.sha }}" `
            --workflow "desktop-release.yml" --platform windows `
            --architecture "${{ matrix.architecture }}" `
            --signing-status unsigned-ci --sbom $sbom `
            --channel "${{ needs.plan.outputs.channel }}" `
            --rollout-percent "${{ needs.plan.outputs.rollout_percent }}"

      - name: Stage macOS unsigned CI artifact and metadata
        if: matrix.platform == 'macos'
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          stage=packaging/release-stage/macos
          mkdir -p "$stage"
          tar -C packaging/dist/macos -czf "$stage/TinyAssets.app.tar.gz" TinyAssets.app
          artifact="$(find packaging/dist/macos -maxdepth 1 -name '*.dmg' -type f)"
          [[ "$(printf '%s\n' "$artifact" | sed '/^$/d' | wc -l)" -eq 1 ]]
          cp "$artifact" "$stage/"
          staged="$stage/$(basename "$artifact")"
          sbom="${staged}.spdx.json"
          python packaging/desktop_metadata.py sbom \
            --artifact "$staged" \
            --pyinstaller-analysis packaging/build/macos/TinyAssets/Analysis-00.toc \
            --project-name TinyAssets --project-version "${{ needs.plan.outputs.version }}" \
            --output "$sbom"
          python packaging/desktop_metadata.py metadata \
            --artifact "$staged" --output "${staged}.metadata.json" \
            --version "${{ needs.plan.outputs.version }}" \
            --source-commit "${{ github.sha }}" \
            --workflow desktop-release.yml --platform macos \
            --architecture "${{ matrix.architecture }}" \
            --signing-status unsigned-ci --sbom "$sbom" \
            --channel "${{ needs.plan.outputs.channel }}" \
            --rollout-percent "${{ needs.plan.outputs.rollout_percent }}"

      - name: Stage Linux unsigned CI artifacts and metadata
        if: matrix.platform == 'linux'
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          stage=packaging/release-stage/linux
          mkdir -p "$stage"
          find packaging/dist/linux -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.tar.gz' \) -exec cp {} "$stage/" \;
          count=0
          for staged in "$stage"/*.deb "$stage"/*.tar.gz; do
            [[ -f "$staged" ]] || continue
            count=$((count + 1))
            sbom="${staged}.spdx.json"
            python packaging/desktop_metadata.py sbom \
              --artifact "$staged" \
              --pyinstaller-analysis packaging/build/linux/TinyAssets/Analysis-00.toc \
              --project-name TinyAssets --project-version "${{ needs.plan.outputs.version }}" \
              --output "$sbom"
            python packaging/desktop_metadata.py metadata \
              --artifact "$staged" --output "${staged}.metadata.json" \
              --version "${{ needs.plan.outputs.version }}" \
              --source-commit "${{ github.sha }}" \
              --workflow desktop-release.yml --platform linux \
              --architecture "${{ matrix.architecture }}" \
              --signing-status unsigned-ci --sbom "$sbom" \
              --channel "${{ needs.plan.outputs.channel }}" \
              --rollout-percent "${{ needs.plan.outputs.rollout_percent }}"
          done
          [[ "$count" -eq 2 ]]

      - name: Attest unsigned build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: packaging/release-stage/${{ matrix.platform }}/*

      - name: Upload unsigned CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-unsigned-${{ matrix.platform }}-${{ matrix.architecture }}
          path: packaging/release-stage/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14

  test-unsigned-windows-install:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download unsigned Windows installer
        uses: actions/download-artifact@v4
        with:
          name: desktop-unsigned-windows-x86_64
          path: packaging/dist/windows

      - name: Install, probe, repair, and uninstall exact CI artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem "packaging/dist/windows/TinyAssetsServerSetup-*.exe"
          if ($installer.Count -ne 1) {
            throw "expected exactly one Windows installer"
          }
          # The supervisor captures directly to private files so escaped
          # descendants cannot retain GitHub runner output-stream handles.
          python ./tests/desktop_install/windows_lifecycle_supervisor.py `
            --installer $installer.FullName `
            --phase-timeout-seconds 90 `
            --total-timeout-seconds 300 `
            --hard-timeout-seconds 420

  sign-and-verify:
    needs: [plan, build, test-unsigned-windows-install]
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            architecture: x86_64
            update_platform: win32
          - platform: macos
            runner: macos-15
            architecture: arm64
            update_platform: darwin
          - platform: linux
            runner: ubuntu-24.04
            architecture: x86_64
            update_platform: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install manifest signing dependency
        run: python -m pip install "cryptography>=42,<46"

      - name: Download unsigned CI artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-unsigned-${{ matrix.platform }}-${{ matrix.architecture }}
          path: packaging/dist/${{ matrix.platform }}

      - name: Record unsigned-only CI state
        if: needs.plan.outputs.publication_requested != 'true'
        shell: bash
        run: |
          echo "Unsigned CI build complete; signed publication was not requested." |
            tee -a "$GITHUB_STEP_SUMMARY"

      - name: Gate signing identities
        if: needs.plan.outputs.publication_requested == 'true'
        shell: bash
        env:
          WINDOWS_CERT: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_IDENTITY: ${{ secrets.WINDOWS_SIGNING_IDENTITY }}
          APPLE_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ACCOUNT: ${{ secrets.APPLE_ID }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          LINUX_KEY: ${{ secrets.LINUX_SIGNING_KEY_BASE64 }}
          LINUX_IDENTITY: ${{ secrets.LINUX_SIGNING_IDENTITY }}
          UPDATE_KEY: ${{ secrets.DESKTOP_UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          missing=false
          case "${{ matrix.platform }}" in
            windows)
              [[ -n "$WINDOWS_CERT" && -n "$WINDOWS_PASSWORD" && -n "$WINDOWS_IDENTITY" ]] ||
                missing=true
              ;;
            macos)
              [[ -n "$APPLE_IDENTITY" && -n "$APPLE_CERTIFICATE" &&
                 -n "$APPLE_CERTIFICATE_PASSWORD" && -n "$APPLE_ACCOUNT" &&
                 -n "$APPLE_TEAM" && -n "$APPLE_PASSWORD" ]] || missing=true
              ;;
            linux)
              [[ -n "$LINUX_KEY" && -n "$LINUX_IDENTITY" ]] || missing=true
              ;;
          esac
          [[ -n "$UPDATE_KEY" ]] || missing=true
          if [[ "$missing" == true ]]; then
            echo "::error::signing identity not provisioned: ${{ matrix.platform }}"
            exit 1
          fi

      - name: Sign and verify Windows installer
        if: needs.plan.outputs.publication_requested == 'true' && matrix.platform == 'windows'
        shell: pwsh
        env:
          SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_IDENTITY: ${{ secrets.WINDOWS_SIGNING_IDENTITY }}
        run: |
          $artifact = Get-ChildItem "packaging/dist/windows/TinyAssetsServerSetup-*.exe"
          if ($artifact.Count -ne 1) { throw "expected exactly one Windows installer" }
          ./packaging/windows/sign.ps1 -Artifact $artifact.FullName
          signtool.exe verify /pa /all $artifact.FullName

      - name: Sign, notarize, and verify macOS image
        if: needs.plan.outputs.publication_requested == 'true' && matrix.platform == 'macos'
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
          VERSION: ${{ needs.plan.outputs.version }}
          ARCHITECTURE: ${{ matrix.architecture }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          cd packaging/dist/macos
          tar -xzf TinyAssets.app.tar.gz
          rm TinyAssets.app.tar.gz
          cd ../../..
          certificate="$RUNNER_TEMP/tinyassets-signing.p12"
          keychain="$RUNNER_TEMP/tinyassets-signing.keychain-db"
          keychain_password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          cleanup_signing_material() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$certificate"
          }
          trap cleanup_signing_material EXIT
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" |
            grep -F "$APPLE_DEVELOPER_ID_APPLICATION"
          bash packaging/macos/sign-and-notarize.sh
          xcrun stapler validate "packaging/dist/macos/TinyAssets-${VERSION}-${ARCHITECTURE}.dmg"

      - name: Sign and verify Linux packages
        if: needs.plan.outputs.publication_requested == 'true' && matrix.platform == 'linux'
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
          LINUX_SIGNING_KEY_BASE64: ${{ secrets.LINUX_SIGNING_KEY_BASE64 }}
          LINUX_SIGNING_IDENTITY: ${{ secrets.LINUX_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for artifact in packaging/dist/linux/*.deb packaging/dist/linux/*.tar.gz; do
            [[ -f "$artifact" ]] || continue
            ARTIFACT="$artifact" bash packaging/linux/sign.sh
            verify_home="$(mktemp -d)"
            chmod 700 "$verify_home"
            printf '%s' "$LINUX_SIGNING_KEY_BASE64" | base64 --decode |
              gpg --homedir "$verify_home" --batch --import
            gpg --homedir "$verify_home" --verify "${artifact}.asc" "$artifact"
            rm -rf "$verify_home"
          done

      - name: Emit signed metadata, manifests, and rollback evidence
        if: needs.plan.outputs.publication_requested == 'true'
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
          DESKTOP_UPDATE_SIGNING_KEY_BASE64: ${{ secrets.DESKTOP_UPDATE_SIGNING_KEY_BASE64 }}
          WINDOWS_IDENTITY: ${{ secrets.WINDOWS_SIGNING_IDENTITY }}
          APPLE_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          LINUX_IDENTITY: ${{ secrets.LINUX_SIGNING_IDENTITY }}
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          ROLLOUT: ${{ needs.plan.outputs.rollout_percent }}
          PREVIOUS_VERSION: ${{ needs.plan.outputs.previous_version }}
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            windows)
              identity="$WINDOWS_IDENTITY"
              status=signed
              patterns=("packaging/dist/windows/TinyAssetsServerSetup-"*.exe)
              ;;
            macos)
              identity="$APPLE_IDENTITY"
              status=signed-and-notarized
              patterns=("packaging/dist/macos/"*.dmg)
              ;;
            linux)
              identity="$LINUX_IDENTITY"
              status=signed
              patterns=("packaging/dist/linux/"*.deb "packaging/dist/linux/"*.tar.gz)
              ;;
          esac
          count=0
          for artifact in "${patterns[@]}"; do
            [[ -f "$artifact" ]] || continue
            count=$((count + 1))
            sbom="${artifact}.spdx.json"
            python packaging/desktop_metadata.py verify-build-sbom \
              --artifact "$artifact" --sbom "$sbom" \
              --build-metadata "${artifact}.metadata.json"
            python packaging/desktop_metadata.py metadata \
              --artifact "$artifact" --output "${artifact}.metadata.json" \
              --version "$VERSION" --source-commit "${{ github.sha }}" \
              --workflow desktop-release.yml --platform "${{ matrix.platform }}" \
              --architecture "${{ matrix.architecture }}" \
              --signing-status "$status" --signing-identity "$identity" \
              --sbom "$sbom" --channel "$CHANNEL" --rollout-percent "$ROLLOUT"
            python packaging/desktop_metadata.py sign-update-manifest \
              --artifact "$artifact" --output "${artifact}.update-manifest.json" \
              --sbom "$sbom" --metadata "${artifact}.metadata.json" \
              --version "$VERSION" --source-commit "${{ github.sha }}" \
              --workflow desktop-release.yml \
              --platform "${{ matrix.update_platform }}" \
              --architecture "${{ matrix.architecture }}" \
              --channel "$CHANNEL" --rollout-percent "$ROLLOUT"
          done
          [[ "$count" -gt 0 ]]
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schema_version": 1,
              "candidate_version": os.environ["VERSION"],
              "previous_version": os.environ["PREVIOUS_VERSION"] or None,
              "channel": os.environ["CHANNEL"],
              "rollout_percent": int(os.environ["ROLLOUT"]),
              "source_commit": "${{ github.sha }}",
              "rollback_action": "restore previous signed manifest and artifact",
          }
          Path(
              "packaging/dist/${{ matrix.platform }}/"
              "rollback-evidence-${{ matrix.platform }}-${{ matrix.architecture }}.json"
          ).write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            rm -rf packaging/dist/macos/TinyAssets.app
          fi

      - name: Attest signed build provenance
        if: needs.plan.outputs.publication_requested == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            packaging/dist/${{ matrix.platform }}/*.exe
            packaging/dist/${{ matrix.platform }}/*.dmg
            packaging/dist/${{ matrix.platform }}/*.deb
            packaging/dist/${{ matrix.platform }}/*.tar.gz
            packaging/dist/${{ matrix.platform }}/*.json

      - name: Upload signed and verified artifacts
        if: needs.plan.outputs.publication_requested == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-signed-${{ matrix.platform }}-${{ matrix.architecture }}
          path: packaging/dist/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 30

  publish-signed:
    needs: [plan, sign-and-verify]
    if: needs.plan.outputs.publication_requested == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-signed-*
          path: signed
          merge-multiple: false

      - name: Publish only signed and verified release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(
            find signed -type f \
              \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' \
                 -o -name '*.tar.gz' -o -name '*.asc' \
                 -o -name '*.json' \) -print
          )
          [[ "${#files[@]}" -gt 0 ]]
          tag="desktop-v${VERSION}"
          prerelease=()
          [[ "$CHANNEL" == "stable" ]] || prerelease=(--prerelease)
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "TinyAssets Desktop ${VERSION}" \
              --notes "Signed desktop release; see attached provenance and rollback evidence." \
              "${prerelease[@]}"
          fi
          gh release upload "$tag" --clobber "${files[@]}"
