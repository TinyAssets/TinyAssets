name: Auto-enroll merge

# Why this exists
# ---------------
# Branch protection + repo auto-merge only get you so far: SOMEONE still has to
# enroll each PR with `gh pr merge --auto`. That left a human (or an agent that
# cannot merge) in the loop for every single PR, which defeats the point.
#
# This workflow does the enrolling. From here: open a PR, and when its required
# checks go green GitHub merges it. No human step, no agent step.
#
# Safety is delegated to branch protection, which is the right place for it:
#   - required checks `policy` and `Diff scope declared` must pass
#   - `strict` means the branch must be current with main
#   - a PR that fails ANY required check simply never merges; enrolment is not a
#     bypass, it is a standing instruction to merge WHEN allowed
#
# The scope guard is what makes this safe to automate. Without it, auto-enrolment
# would have merged PR #1491 — 386 files including deploy-prod.yml and Dockerfile,
# presented as a two-file auth fix, with CI green on everything it looked at.

on:
  # pull_request_target so this always runs the trusted copy from the default
  # branch and has a token that can enrol. We never check out or execute PR code.
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-enroll-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enroll:
    name: Enroll for auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Forks are excluded deliberately: a fork PR is untrusted contribution and
    # should not carry a standing merge instruction. Drafts are excluded because
    # draft means "not finished" — marking ready fires `ready_for_review` and
    # enrols it then.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    steps:
      - name: Check out trusted enrollment policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          # Full history of commits and trees, no file contents: enough for the
          # merge base and `git diff --raw` that the PR's diff key reads, while
          # still never checking out or executing PR code.
          fetch-depth: 0
          filter: blob:none

      - name: Require the merge-attribution token
        # Fail loudly (hard rule 8), never fall back to GITHUB_TOKEN. With the
        # merge queue on, an auto-merge armed by GITHUB_TOKEN never enqueues:
        # on 2026-09-27 #4059 and #4062 sat CLEAN, green and armed by
        # github-actions, with an empty queue and no merge_group run, because
        # the secret had been stored empty and the old `|| github.token`
        # fallback hid it. Before the queue the same fallback produced merges
        # that never deployed (ADR-004).
        env:
          TOKEN_PRESENT: ${{ secrets.MERGE_ATTRIBUTION_TOKEN != '' }}
        shell: bash
        run: |
          if [ "$TOKEN_PRESENT" != "true" ]; then
            echo "::error::MERGE_ATTRIBUTION_TOKEN is empty or unset. Enrollment needs a user-owned token (fine-grained PAT, resource owner TinyAssets, Contents + Pull requests read/write); GITHUB_TOKEN-armed auto-merge never enters the merge queue. Set it in Settings > Secrets > Actions."
            exit 1
          fi

      - name: Enable auto-merge
        env:
          # Merge attribution is what gates the whole deploy chain. A merge
          # attributed to the default GITHUB_TOKEN raises no `push` on main,
          # so `build-image` never fires and `deploy-prod` never chains from
          # it — the "merged is not deployed" class (hard rule 14). Measured
          # 2026-08-04: PR #2259 (app-merged) produced no build and needed a
          # manual dispatch; PR #2260 (human-merged) built and deployed
          # unattended, one hour apart, same workflow. See
          # docs/decisions/ADR-004-merge-attribution-and-the-deploy-gap.md.
          #
          # No fallback: the step above refuses an empty secret, and after
          # enrolling the step checks that a USER armed or queued the PR.
          # Pinned by tests/test_auto_enroll_merge_workflow.py.
          GH_TOKEN: ${{ secrets.MERGE_ATTRIBUTION_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # Who armed, queued or merged this PR, as `<__typename>:<login>`.
          # With the queue on, autoMergeRequest reads null once GitHub has
          # queued the PR, so the queue entry's enqueuer is checked too.
          who_enrolled() {
            # The $owner/$name/$number GraphQL variables are for GitHub to
            # bind, not the shell to expand, so the query stays single-quoted.
            # shellcheck disable=SC2016
            gh api graphql \
              -F owner="${REPO%/*}" -F name="${REPO#*/}" -F number="$PR" \
              -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){state mergedBy{__typename login} autoMergeRequest{enabledBy{__typename login}} mergeQueueEntry{enqueuer{__typename login}}}}}' \
              --jq '.data.repository.pullRequest | (.autoMergeRequest.enabledBy // .mergeQueueEntry.enqueuer // (if .state == "MERGED" then .mergedBy else null end)) | if . == null then "none" else "\(.__typename):\(.login)" end'
          }

          PR_JSON="$(gh pr view "$PR" --repo "$REPO" \
            --json autoMergeRequest,body,headRefOid,baseRefOid)"
          STATE="$(jq -r \
            'if .autoMergeRequest == null then "no" else "yes" end' \
            <<<"$PR_JSON")"
          HEAD_OID="$(jq -r '.headRefOid' <<<"$PR_JSON")"
          # Base and head from the SAME read, never the event's base with the
          # current head: a rebase between the two would key the wrong diff.
          BASE_OID="$(jq -r '.baseRefOid' <<<"$PR_JSON")"
          jq -r '.body // ""' <<<"$PR_JSON" > "$RUNNER_TEMP/pr-body.md"

          # Same diff key as pr-scope-guard.yml; empty on any failure, which
          # leaves head receipts as the only match.
          DIFF_KEY=""
          if git fetch --no-tags --filter=blob:none origin \
                "+refs/pull/${PR}/head:refs/remotes/pr/head" \
                "+refs/heads/main:refs/remotes/origin/main" \
              && git cat-file -e "${HEAD_OID}^{commit}" \
              && git cat-file -e "${BASE_OID}^{commit}"; then
            DIFF_KEY="$(python scripts/drain_review_gate.py --print-diff-key \
              "$BASE_OID" "$HEAD_OID")" || DIFF_KEY=""
          fi

          # Every PR needs a receipt for its head (2026-10-02): on 2026-10-01
          # this step armed #4247 -- a superseded head with a known data-loss
          # bug and no review receipt -- and the queue accepted it.
          if python scripts/drain_review_gate.py \
              --head "$HEAD_OID" \
              --diff-key "$DIFF_KEY" \
              --body-file "$RUNNER_TEMP/pr-body.md"; then
            REVIEW_GATE="allow"
          else
            REVIEW_GATE="deny"
          fi

          if [ "$REVIEW_GATE" = "deny" ]; then
            if [ "$STATE" = "yes" ]; then
              # Fetch/diff evaluation can outlive a new head or receipt. A
              # stale denial must not disarm that newer enrollment. Compare
              # the same fields, including the body and enrollment identity.
              # This is not an atomic compare-and-disable; the final
              # read-to-mutation gap remains.
              CURRENT_PR_JSON="$(gh pr view "$PR" --repo "$REPO" \
                --json autoMergeRequest,body,headRefOid,baseRefOid)"
              if [ "$CURRENT_PR_JSON" != "$PR_JSON" ]; then
                echo "PR state changed since receipt evaluation; leaving current enrollment alone."
                exit 0
              fi
              gh pr merge "$PR" --repo "$REPO" --disable-auto
              echo "Disabled auto-merge: no current review receipt for this head."
            else
              echo "PR remains unenrolled pending a review receipt for this head."
            fi
            {
              echo "### Auto-merge"
              echo ""
              echo "Not enrolled: every PR needs exactly one current review receipt:"
              echo "\`Drain-Review-Verdict: APPROVE\`"
              echo "\`Drain-Review-Head: <40-character lowercase head SHA>\`"
              echo "\`Drain-Review-Artifact: <docs path or GitHub URL>\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Queue-attempt cap: a head handed off by queue-handoff.yml (record
          # for this exact head + the queue-handoff label) is not re-armed.
          # Exit 3 means capped. Any other failure of the check enrolls anyway, with a
          # warning: the cap stops a retry loop, it must never block a merge.
          CAP_RC=0
          python scripts/queue_attempts.py check --repo "$REPO" --pr "$PR" || CAP_RC=$?
          if [ "$CAP_RC" -eq 3 ]; then
            if [ "$STATE" = "yes" ]; then
              gh pr merge "$PR" --repo "$REPO" --disable-auto || true
            fi
            {
              echo "### Auto-merge"
              echo ""
              echo "Not enrolled: this head failed the merge queue twice (see the queue-handoff record). Push a fix, or remove the queue-handoff label to retry."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          elif [ "$CAP_RC" -ne 0 ]; then
            echo "::warning::queue-attempt cap check failed (exit ${CAP_RC}); enrolling without it."
          fi

          # Idempotent: re-running on a later event is a no-op if a USER
          # already enrolled it. An enrollment by a bot (the old GITHUB_TOKEN
          # fallback) never enqueues, so it is replaced, not kept.
          if [ "$STATE" = "yes" ]; then
            ENROLLER="$(who_enrolled)"
            if [[ "$ENROLLER" == User:* ]]; then
              echo "PR #${PR} is already enrolled for auto-merge by ${ENROLLER#User:}."
              echo "already enrolled" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "PR #${PR} was enrolled by ${ENROLLER}; re-enrolling with the attribution token."
            gh pr merge "$PR" --repo "$REPO" --disable-auto
          fi

          # `|| true`: enrolment can legitimately fail — e.g. the PR is already
          # mergeable and protection is satisfied, or the branch is behind. Those
          # are not this workflow's problem and must not fail the PR's checks.
          if gh pr merge "$PR" --repo "$REPO" --auto --squash \
              --match-head-commit "$HEAD_OID" 2>err.txt; then
            echo "PR #${PR} enrolled for auto-merge (squash)."
            # The token that ran this is the one GitHub attributes. A bot here
            # means the PR will never enqueue, so say so where it is seen.
            ENROLLER="$(who_enrolled)"
            echo "enrolled by: ${ENROLLER}"
            if [[ "$ENROLLER" != User:* ]]; then
              echo "::error::PR #${PR} was enrolled by ${ENROLLER}, not a user. A merge queue does not enqueue a bot-armed auto-merge, and a bot-attributed merge raises no push. Check MERGE_ATTRIBUTION_TOKEN."
              exit 1
            fi
            {
              echo "### Auto-merge"
              echo ""
              echo "Enrolled. This PR will merge itself once required checks pass:"
              echo "\`policy\` and \`Diff scope declared\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Could not enrol PR #${PR} — not fatal, leaving it to the humans:"
            sed 's/^/    /' err.txt || true
            {
              echo "### Auto-merge"
              echo ""
              echo "Could not enrol automatically. This does not block the PR."
              echo ""
              echo '```'
              cat err.txt || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

# Note on blast radius
# --------------------
# This makes merging the DEFAULT for any non-draft, same-repo PR targeting main.
# The protection against a bad merge is entirely the required-check set, so those
# checks are now load-bearing in a way they were not before. Weakening or removing
# a required check silently widens what merges itself — treat changes to
# `policy` or `Diff scope declared` as changes to the merge policy itself.
