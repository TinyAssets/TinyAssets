name: PR scope guard

# Why this exists
# ---------------
# Green checks are not sufficient to auto-merge safely. PR #1491 presented as a
# two-file auth fix and CI was happy — but its diff against main carried seven
# workflow files plus deploy-prod.yml and Dockerfile, because the branch sat on
# an unmerged 217-commit lineage. Nothing in CI objected; only inspecting the
# DIFF SCOPE caught it. With auto-merge enabled, that PR would have shipped
# changes to the production deploy workflow under the banner of an auth fix.
#
# So: every PR names its files with `Lane:`, and a file outside the lane is
# refused, which is what catches a dragged lineage file by file. (A count of
# "release-critical" files, capped at 8, stood in for that until 2026-11-04: it
# blocked planned, reviewed slices and passed the 2026-10-21 dragged refactor.)
# This check judges scope only, so it passes when the PR opens. Whether the
# change was reviewed is the `review` check (review.yml), and what ships is
# gated by the main-only `production` environment.
#
# MUST run unconditionally (no `paths:` filter). A required status check that is
# path-filtered never reports on PRs outside those paths, and the PR then hangs
# forever on "Expected — waiting for status". `lint`/actionlint is path-filtered
# for exactly this reason and must NOT be added as a required check.

on:
  # pull_request_target: this workflow is always the TRUSTED copy from the default
  # branch. With plain `pull_request`, a PR could edit the very workflow that
  # judges it — the guard would grade its own homework. We never check out or
  # execute PR-head code here, so using _target is safe.
  pull_request_target:
    # `labeled`/`unlabeled` matter: declaring an infra change must re-run the gate.
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled, unlabeled]
  # The merge queue. `Diff scope declared` is a required check, and a queue waits
  # for every required check on the merge-group commit, so this must report
  # there. It reports a pass WITHOUT re-running the gate, deliberately:
  #
  #   1. GitHub admits a PR to the queue only after it "has passed all required
  #      branch protection checks" (docs: Managing a merge queue). This gate,
  #      at the PR's current head, is one of them.
  #   2. Everything the gate reads -- the file list, the labels and the body
  #      -- belongs to the PR, and none of it changes when
  #      the queue stacks the PR on a newer main. What does change is the code,
  #      and `required-tests` and `invariants` re-test that on
  #      the merge-group commit.
  #   3. A merge_group run takes this workflow file from the merge-group
  #      commit, which includes the PR's own edits, not from the trusted base.
  #      Re-running the gate here would let a PR grade itself, so it would
  #      add no trust. A PR that edits this file is caught at PR time instead,
  #      by its review.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  # Reads the PR's file list; PR code is never checked out or run.
  pull-requests: read

concurrency:
  # A merge_group event has no pull_request number. Without the head_ref
  # fallback every queue entry would share one group and cancel the others,
  # and a cancelled required check ejects the PR from the queue.
  group: pr-scope-guard-${{ github.event.pull_request.number || github.event.merge_group.head_ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Diff scope declared
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Steps are gated per event, not the job. The job name IS the required
      # context, and a skipped job would report that context as passed.
      - name: Merge queue -- already enforced on the pull request
        if: github.event_name == 'merge_group'
        env:
          GROUP_REF: ${{ github.event.merge_group.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Merge group ${GROUP_REF}: every queued PR passed this gate at its head before GitHub admitted it."
          echo "Diff scope declared: enforced at PR time; see the trigger comment in this file." >> "$GITHUB_STEP_SUMMARY"

      - name: Check out trusted policy
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          # Full history of commits and trees, no file contents: enough for the
          # merge base and the trees the hygiene gate reads, while
          # still never checking out or executing PR code.
          fetch-depth: 0
          filter: blob:none

      # PR-relative test hygiene: removing, skipping or loosening an existing
      # test needs a stated reason and its own PR; a new skip needs an owner
      # and an end; a new test may not touch the network, real paths or sleep.
      # The trusted base copy of the script reads both trees as text
      # (`git show` + ast.parse); no PR code runs. Nothing here fails on a
      # date of main -- the weekly inventory (quarantine-oracle.yml) reports
      # expiry, and expired markers block only a PR that touches their file.
      - name: Test hygiene (what this PR changes)
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_OID: ${{ github.event.pull_request.head.sha }}
          BASE_OID: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/test_hygiene_gate.py ]; then
            echo "::notice::base predates scripts/test_hygiene_gate.py; nothing to check"
            exit 0
          fi
          git cat-file -e "${HEAD_OID}^{commit}" \
            || git fetch --no-tags --filter=blob:none origin "${HEAD_OID}"
          printf '%s' "${PR_BODY:-}" > "$RUNNER_TEMP/pr-body-hygiene.md"
          python scripts/test_hygiene_gate.py \
            --base "${BASE_OID}" --head "${HEAD_OID}" \
            --body "$RUNNER_TEMP/pr-body-hygiene.md"

      # Under pull_request_target, only the trusted base SHA above is checked out.
      # The PR head is never executed with this workflow's token. The file list
      # below comes from the API.
      - name: Hold the PR to its declared lane
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_OID: ${{ github.event.pull_request.head.sha }}
          BASE_OID: ${{ github.event.pull_request.base.sha }}
          # The body is author-controlled text. It is read through the
          # environment and never interpolated into this script, so a body
          # containing shell metacharacters is data, not code.
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail

          # Paginated API read. Fail CLOSED on error — a guard that silently
          # sees fewer files than the PR contains is worse than none.
          # Project BOTH the new path and, for renames, the previous one. Reading
          # only `.filename` let a PR move tinyassets/auth/provider.py to an
          # unprotected path and escape the lane check entirely -- the
          # gate saw only the destination (cross-family review 2026-08-26).
          if ! CHANGED="$(gh api --paginate "repos/${REPO}/pulls/${PR}/files"                             --jq '.[] | .filename, (.previous_filename // empty)' 2>/dev/null)"; then
            echo "::error::could not read the PR file list — failing closed"
            exit 1
          fi

          TOTAL="$(printf '%s\n' "$CHANGED" | sed '/^$/d' | wc -l | tr -d ' ')"

          # Paths no PR may touch at all (scripts/check_forbidden_pr_paths.py).
          # Checked FIRST, and on purpose: fixing this is mechanical and takes seconds, and the fix is a PUSH,
          # which voids a review anyway. Telling the author now means they fix
          # it and get reviewed once.
          #
          # The `-f` guard is REQUIRED, not defensive. Under
          # pull_request_target this workflow is the trusted copy from the
          # default branch, but the CHECKOUT above is the PR's own base sha --
          # so for any PR whose base predates the script, the workflow calls a
          # file that is not there. Without this, python exited 2 ("can't open
          # file"), the `if !` read that as "a forbidden path was found", and
          # the REQUIRED `Diff scope declared` check failed every such PR with
          # a message naming the wrong cause. The step above does exactly this
          # for scripts/test_hygiene_gate.py and I did not copy it.
          if [ ! -f scripts/check_forbidden_pr_paths.py ]; then
            echo "::notice::base predates scripts/check_forbidden_pr_paths.py; nothing to check"
          elif ! printf '%s\n' "$CHANGED" \
              | python scripts/check_forbidden_pr_paths.py \
                2> "$RUNNER_TEMP/forbidden-paths.txt"; then
            echo "::error::this PR changes a path no PR may change"
            {
              echo "### PR scope guard"
              echo ""
              echo "**Blocked — this PR changes a path no PR may change.**"
              echo ""
              sed 's/^/> /' "$RUNNER_TEMP/forbidden-paths.txt"
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/forbidden-paths.txt"
            exit 1
          fi

          # The endpoint caps at 3000 files and says nothing when it truncates.
          # An earlier version of this comment claimed the read above already
          # failed closed on truncation; it did not, and a cross-family review
          # caught the false assurance. At the cap we cannot know whether the
          # unseen files are inside the lane, so refuse rather than guess —
          # a diff that large needs splitting regardless.
          API_FILE_CAP=3000
          if [ "$TOTAL" -ge "$API_FILE_CAP" ]; then
            echo "::error::PR file list hit the ${API_FILE_CAP}-file API cap — the diff cannot be fully inspected"
            {
              echo "### PR scope guard"
              echo ""
              echo "**Blocked — diff exceeds what the API will report.** ${TOTAL} files;"
              echo "the endpoint caps at ${API_FILE_CAP} and does not report truncation, so"
              echo "files outside the lane could be present and invisible to this check."
              echo ""
              echo "Split the PR, or rebase it if it is carrying an unmerged lineage."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Declared lane (drain_review_gate.py `declared_lane`): every PR names its
          # files with `Lane:` and is held to them, so a smuggled lineage is
          # refused before anyone reviews it. A prose-only PR writes `Lane: docs/`.
          # Bases that predate the check skip it, as with the forbidden-paths
          # script above.
          printf '%s' "${PR_BODY:-}" > "$RUNNER_TEMP/pr-body-lane.md"
          if grep -q -- '--lane-scope' scripts/drain_review_gate.py; then
            if ! printf '%s\n' "$CHANGED" \
                | python scripts/drain_review_gate.py --lane-scope \
                  --body-file "$RUNNER_TEMP/pr-body-lane.md" --require \
                  2> "$RUNNER_TEMP/lane-why.txt"; then
              {
                echo "### PR scope guard"
                echo ""
                echo "**Blocked — diff outside the declared lane.**"
                echo ""
                sed 's/^/> /' "$RUNNER_TEMP/lane-why.txt"
              } >> "$GITHUB_STEP_SUMMARY"
              cat "$RUNNER_TEMP/lane-why.txt"
              exit 1
            fi
          fi

          {
            echo "### PR scope guard"
            echo ""
            echo "Files changed vs merge-base: **${TOTAL}**, all inside the declared lane."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "scope guard: ${TOTAL} files, inside the lane"
          exit 0

# Honesty note
# ------------
# A lane is author-written, so it does NOT stop a determined actor — it is not a
# security boundary; the reviewer judges whether a lane is honest. What it does
# stop is the failure that actually happened: infrastructure changing SILENTLY,
# as a side effect of a branch's history, while the PR title and CI both say
# something narrower. It converts an invisible diff into a deliberate one.
#
# Review is the `review` check (review.yml), not this one, and the same honesty
# applies to it: this repository has exactly one account with write access, so the
# reviewer posts a COMMENT review rather than an approval (an author cannot approve
# their own PR), and a rule of "reviewer must differ from author" would be
# unsatisfiable, a wall, not a gate (Fact 4: an executable gate needs an autonomous
# default). What it does make impossible is the accident that happened: a BLOCK
# verdict cannot satisfy it, and an approval of a different change cannot satisfy it.
# The day a second writer exists, requiring a different author is a short change in
# scripts/drain_review_gate.py `latest_verdict`.
