name: PR scope guard

# Why this exists
# ---------------
# Green checks are not sufficient to auto-merge safely. PR #1491 presented as a
# two-file auth fix and CI was happy — but its diff against main carried seven
# workflow files plus deploy-prod.yml and Dockerfile, because the branch sat on
# an unmerged 217-commit lineage. Nothing in CI objected; only inspecting the
# DIFF SCOPE caught it. With auto-merge enabled, that PR would have shipped
# changes to the production deploy workflow under the banner of an auth fix.
#
# So: every PR's diff against main is reviewed before it merges, and the
# receipt below is the control. The release-critical files a PR touches are
# counted in the step summary for the reviewer — see the honesty note at the
# bottom of this file.
#
# Since 2026-09-26 the exact-head receipt this guard already demanded on
# gate-defining and authority paths has to be a PUBLISHED APPROVAL, not a
# bookmark. PR #3989 auto-merged at the exact head its Tier 2 reviewer had
# BLOCKED, because a verdict lives in a PR comment and auto-merge reads only
# required checks. So the receipt must now cite a comment on this PR that a
# trusted author wrote and that itself says APPROVE for the current head. WHO
# needs a receipt did not change.
#
# MUST run unconditionally (no `paths:` filter). A required status check that is
# path-filtered never reports on PRs outside those paths, and the PR then hangs
# forever on "Expected — waiting for status". `lint`/actionlint is path-filtered
# for exactly this reason and must NOT be added as a required check.

on:
  # pull_request_target: this workflow is always the TRUSTED copy from the default
  # branch. With plain `pull_request`, a PR could edit the very workflow that
  # judges it — the guard would grade its own homework. We never check out or
  # execute PR-head code here, so using _target is safe.
  pull_request_target:
    # `edited` matters: the receipt is cited in the body.
    types: [opened, reopened, synchronize, ready_for_review, edited]
  # The merge queue. `Diff scope declared` is a required check, and a queue waits
  # for every required check on the merge-group commit, so this must report
  # there. It reports a pass WITHOUT re-running the gate, deliberately:
  #
  #   1. GitHub admits a PR to the queue only after it "has passed all required
  #      branch protection checks" (docs: Managing a merge queue). This gate,
  #      at the PR's current head, is one of them.
  #   2. Everything the gate reads -- the file list, the body and the
  #      receipt comment -- belongs to the PR, and none of it changes when
  #      the queue stacks the PR on a newer main. What does change is the code,
  #      and `required-tests`, `slow-tests` and `invariants` re-test that on
  #      the merge-group commit.
  #   3. A merge_group run takes this workflow file from the merge-group
  #      commit, which includes the PR's own edits, not from the trusted base.
  #      Re-running the gate here would let a PR grade itself, so it would
  #      add no trust. A PR that edits this file is caught at PR time instead,
  #      because .github/workflows/ is a release-critical path.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  # read: the file list, the comments and the reviews. PR code is never
  # checked out or run.
  pull-requests: read

concurrency:
  # A merge_group event has no pull_request number. Without the head_ref
  # fallback every queue entry would share one group and cancel the others,
  # and a cancelled required check ejects the PR from the queue.
  group: pr-scope-guard-${{ github.event.pull_request.number || github.event.merge_group.head_ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Diff scope declared
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Steps are gated per event, not the job. The job name IS the required
      # context, and a skipped job would report that context as passed.
      - name: Merge queue -- already enforced on the pull request
        if: github.event_name == 'merge_group'
        env:
          GROUP_REF: ${{ github.event.merge_group.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Merge group ${GROUP_REF}: every queued PR passed this gate at its head before GitHub admitted it."
          echo "Diff scope declared: enforced at PR time; see the trigger comment in this file." >> "$GITHUB_STEP_SUMMARY"

      - name: Check out trusted policy
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          # Full history of commits and trees, no file contents: enough for the
          # merge base and `git diff --raw` that the PR's diff key reads, while
          # still never checking out or executing PR code.
          fetch-depth: 0
          filter: blob:none

      - name: Compute the PR's diff key
        if: github.event_name == 'pull_request_target'
        id: diffkey
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_OID: ${{ github.event.pull_request.head.sha }}
          BASE_OID: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          # Lets a `Drain-Review-Diff:` receipt (drain_review_gate.diff_key)
          # survive merge-main and rebase. On ANY failure the key is empty, and
          # an empty key only means head receipts are the sole way to match:
          # it can never allow what a head receipt would not.
          set -uo pipefail
          KEY=""
          if git fetch --no-tags --filter=blob:none origin \
                "+refs/pull/${PR}/head:refs/remotes/pr/head" \
              && git cat-file -e "${HEAD_OID}^{commit}"; then
            KEY="$(python scripts/drain_review_gate.py --print-diff-key \
              "${BASE_OID}" "${HEAD_OID}")" || KEY=""
          fi
          echo "diff key: ${KEY:-<none>}"
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"

      # PR-relative test hygiene: removing, skipping or loosening an existing
      # test needs a stated reason and its own PR; a new skip needs an owner
      # and an end; a new test may not touch the network, real paths or sleep.
      # The trusted base copy of the script reads both trees as text
      # (`git show` + ast.parse); no PR code runs. Nothing here fails on a
      # date of main -- the weekly inventory (quarantine-oracle.yml) reports
      # expiry, and expired markers block only a PR that touches their file.
      - name: Test hygiene (what this PR changes)
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_OID: ${{ github.event.pull_request.head.sha }}
          BASE_OID: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/test_hygiene_gate.py ]; then
            echo "::notice::base predates scripts/test_hygiene_gate.py; nothing to check"
            exit 0
          fi
          git cat-file -e "${HEAD_OID}^{commit}" \
            || git fetch --no-tags --filter=blob:none origin "${HEAD_OID}"
          printf '%s' "${PR_BODY:-}" > "$RUNNER_TEMP/pr-body-hygiene.md"
          python scripts/test_hygiene_gate.py \
            --base "${BASE_OID}" --head "${HEAD_OID}" \
            --body "$RUNNER_TEMP/pr-body-hygiene.md"

      # Under pull_request_target, only the trusted base SHA above is checked out.
      # The PR head is never executed with this workflow's token. The file list
      # below comes from the API.
      - name: Compare the PR diff against release-critical paths
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_OID: ${{ github.event.pull_request.head.sha }}
          BASE_OID: ${{ github.event.pull_request.base.sha }}
          DIFF_KEY: ${{ steps.diffkey.outputs.key }}
          # The body is author-controlled text. It is read through the
          # environment and never interpolated into this script, so a body
          # containing shell metacharacters is data, not code.
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail

          # Release-critical: anything that can change how the product is built,
          # deployed, or what runs in production.
          #
          # Generated plugin runtime files are absent from Git. Its builder and
          # source declarations are release-critical packaging inputs.
          # scripts/ci_required_tests.py and .github/known-failing-tests.txt are
          # here because they ARE the `required-tests` gate. That gate runs from
          # the PR's own checkout (it must — it executes the PR's code), so a PR
          # can rewrite the thing judging it while keeping the check name green.
          # Workflow files were already covered; without these two entries the
          # same neutering could be done one directory over, undeclared.
          # platform/deploy/ is the kit that deploys the platform's production.
          SENSITIVE_RE='^(\.github/workflows/|\.github/known-failing-tests\.txt$|\.github/heavy-test-files\.txt$|scripts/ci_required_tests\.py$|scripts/ci_structural_guards\.py$|scripts/check_shapes\.py$|scripts/drain_review_gate\.py$|tests/test_shape_registry\.py$|deploy/|platform/deploy/|Dockerfile$|\.dockerignore$)'

          # Paginated API read. Fail CLOSED on error — a guard that silently
          # sees fewer files than the PR contains is worse than none.
          # Project BOTH the new path and, for renames, the previous one. Reading
          # only `.filename` let a PR move tinyassets/auth/provider.py to an
          # unprotected path and escape the authority receipt entirely -- the
          # gate saw only the destination (cross-family review 2026-08-26).
          if ! CHANGED="$(gh api --paginate "repos/${REPO}/pulls/${PR}/files" \
              --jq '.[] | .filename, (.previous_filename // empty)' 2>/dev/null)"; then
            echo "::error::could not read the PR file list — failing closed"
            exit 1
          fi

          TOTAL="$(printf '%s\n' "$CHANGED" | sed '/^$/d' | wc -l | tr -d ' ')"

          # The endpoint caps at 3000 files and says nothing when it truncates.
          # An earlier version of this comment claimed the read above already
          # failed closed on truncation; it did not, and a cross-family review
          # caught the false assurance. At the cap we cannot know whether the
          # unseen files are release-critical, so refuse rather than guess —
          # a diff that large needs splitting regardless.
          API_FILE_CAP=3000
          if [ "$TOTAL" -ge "$API_FILE_CAP" ]; then
            echo "::error::PR file list hit the ${API_FILE_CAP}-file API cap — the diff cannot be fully inspected"
            {
              echo "### PR scope guard"
              echo ""
              echo "**Blocked — diff exceeds what the API will report.** ${TOTAL} files;"
              echo "the endpoint caps at ${API_FILE_CAP} and does not report truncation, so"
              echo "release-critical files could be present and invisible to this check."
              echo ""
              echo "Split the PR, or rebase it if it is carrying an unmerged lineage."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # `|| true` here USED to swallow an execution error as well as "no
          # match": grep exits 1 for no match and 2+ for a real failure, and a
          # failure read as an empty hit list means "no release-critical paths
          # touched" — fail-open on the exact question this gate answers. Found
          # by cross-family review 2026-09-26 (finding 3) by injecting exit 2.
          classify() {
            local rc=0
            if [ -n "$2" ]; then
              printf '%s\n' "$CHANGED" | grep "$2" -E "$1" || rc=$?
            else
              printf '%s\n' "$CHANGED" | grep -E "$1" || rc=$?
            fi
            if [ "$rc" -gt 1 ]; then
              echo "::error::grep exited ${rc} classifying paths — failing closed" >&2
              return 1
            fi
          }
          HITS="$(classify "$SENSITIVE_RE" "")" || exit 1
          HIT_COUNT="$(printf '%s\n' "$HITS" | sed '/^$/d' | wc -l | tr -d ' ')"

          # The count is for the reviewer, so it is written before the receipt is
          # read: the run that waits for the review shows it.
          # Breadth is the reviewer's to judge, not a cap's. #1491 carried 16
          # release-critical files while claiming to be a two-file auth fix,
          # because its branch dragged an unmerged lineage; the receipt below is
          # what stops that now, since every PR's diff is reviewed against main.
          # A hard cap of 8 would also refuse the cutover's deletion, which is
          # meant to be that broad, and this file runs from the base, so no PR
          # could lift it for itself (docs/reference/executable-gates.md).
          REVIEW_NOTE_SENSITIVE=8
          LARGE_TOTAL=150
          {
            echo "### PR scope guard"
            echo ""
            echo "Files changed vs merge-base: **${TOTAL}**"
            echo "Release-critical files touched: **${HIT_COUNT}**"
            echo ""
            if [ "$HIT_COUNT" -eq 0 ]; then
              echo "No release-critical paths touched."
            else
              echo "<details><summary>Release-critical files</summary>"
              echo ""
              # shellcheck disable=SC2016  # the $ is sed's end-of-line anchor, not a variable
              printf '%s\n' "$HITS" | sed 's/^/- `/; s/$/`/'
              echo ""
              echo "</details>"
            fi
            if [ "$HIT_COUNT" -gt "$REVIEW_NOTE_SENSITIVE" ]; then
              echo ""
              echo "Note for the reviewer: ${HIT_COUNT} release-critical files. Past ${REVIEW_NOTE_SENSITIVE}, check the branch is not carrying an unmerged lineage."
            fi
            if [ "$TOTAL" -gt "$LARGE_TOTAL" ]; then
              echo ""
              echo "Note: ${TOTAL} files changed (advisory threshold ${LARGE_TOTAL})."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # EVERY PR needs a review receipt (2026-10-02). This used to be a
          # narrow set -- gate-defining files plus an authority-path regex, with AST and
          # deletion-only-ledger exemptions -- on the reasoning that a blanket
          # rule was process bloat. Then auto-enroll armed #4247, a superseded
          # head with a known data-loss bug, no receipt and no path in that
          # set, and the merge queue admitted it (a merge-group run passes this
          # check unconditionally). Every PR is stamped by the lead anyway, so
          # the blanket rule adds no step; it stops unreviewed heads merging.
          # This is the only place that can stop one: the queue does not re-run
          # it, because a merge-group run would grade itself.

          # The receipt's artifact must be a comment ON THIS PR that a trusted
          # author published, AND that comment must itself attest
          # `Drain-Review-Verdict: APPROVE` of this change: this head, or an
          # earlier commit whose tree-diff against the base is the same.
          # Without the URL check the artifact was any string matching a URL
          # shape; without the BODY check, cross-family review 2026-09-26
          # (finding 6) got a receipt past the gate by citing an OWNER comment
          # that said `VERDICT: BLOCK` for that exact head. The body check is
          # also what closes the stale-comment gap, with no clock involved.
          #
          # Read from the API, so it is GitHub's `author_association` deciding
          # trust rather than anything the PR controls. Three sources, because a
          # verdict legitimately lands in any of them: a top-level comment, a
          # submitted review, an inline review comment.
          #
          # A failed read REMOVES the inventory rather than failing the step:
          # the decision then finds no inventory and denies, saying why.
          COMMENTS_FILE="$RUNNER_TEMP/pr-comments.ndjson"
          rm -f "$COMMENTS_FILE"
          for ENDPOINT in "issues/${PR}/comments" "pulls/${PR}/comments" "pulls/${PR}/reviews"; do
            if ! gh api --paginate "repos/${REPO}/${ENDPOINT}" \
                --jq '.[] | {url: .html_url, association: .author_association, body: (.body // "")}' \
                >> "$COMMENTS_FILE" 2>/dev/null; then
              echo "::warning::could not read ${ENDPOINT} — a receipt requirement fails closed"
              rm -f "$COMMENTS_FILE"
              break
            fi
          done

          printf '%s' "${PR_BODY:-}" > "$RUNNER_TEMP/pr-body-gate.md"
          # Fetch the commit a head receipt names, when it is not this head, so
          # an unchanged rebase can be compared. A fetch failure leaves the
          # object missing; the gate then cannot prove the diffs match and
          # requires a receipt for this head. It cannot become a pass.
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --filter=blob:none origin "$sha" || true
            fi
          done < <(python scripts/drain_review_gate.py --list-carry-heads \
              --head "${HEAD_OID}" \
              --body-file "$RUNNER_TEMP/pr-body-gate.md" \
              --review-comments-file "$COMMENTS_FILE" || true)
          # The receipt parse and its corroboration are one decision in one
          # unit-tested place. stderr names the head and diff key a receipt
          # must carry, so it can be shown on the PR either way.
          if ! python scripts/drain_review_gate.py --blocking-review \
              --head "${HEAD_OID}" \
              --base "${BASE_OID}" \
              --diff-key "${DIFF_KEY}" \
              --body-file "$RUNNER_TEMP/pr-body-gate.md" \
              --review-repo "${REPO}" \
              --review-pr "${PR}" \
              --review-comments-file "$COMMENTS_FILE" \
              2> "$RUNNER_TEMP/receipt-why.txt"; then
            {
              echo ""
              echo "**Blocked — no Drain-Review receipt for head \`${HEAD_OID}\`${DIFF_KEY:+ (diff key \`${DIFF_KEY}\`)}.**"
              echo ""
              echo "Every PR needs a current review receipt before it can merge."
              echo ""
              sed 's/^/> /' "$RUNNER_TEMP/receipt-why.txt"
              echo ""
              echo "**Two steps, both required. Each receipt goes at the TOP.**"
              echo ""
              echo "1. The reviewer POSTS the verdict as a comment on this PR."
              echo "   These must be its FIRST two non-blank lines:"
              echo ""
              echo '   ```'
              echo "   Drain-Review-Verdict: APPROVE"
              echo "   Drain-Review-Head: ${HEAD_OID}"
              echo '   ```'
              echo ""
              echo "   Reasoning and evidence go BELOW them."
              echo ""
              echo "2. The PR BODY then cites that comment. These must be its"
              echo "   FIRST three non-blank lines:"
              echo ""
              echo '   ```'
              echo "   Drain-Review-Verdict: APPROVE"
              echo "   Drain-Review-Head: ${HEAD_OID}"
              echo "   Drain-Review-Artifact: https://github.com/${REPO}/pull/${PR}#issuecomment-<id>"
              echo '   ```'
              echo ""
              echo "The artifact must link a comment, review or review comment on"
              echo "THIS PR whose author is a repository owner, member or"
              echo "collaborator AND which OPENS with the APPROVE lines above."
              echo "Only \`APPROVE\` counts — a BLOCK verdict can never satisfy"
              echo "this, in the body or in the comment."
              echo ""
              echo "**Only the top is read**, so nothing below either receipt can"
              echo "void it and nothing above it can hide it. A receipt in a"
              echo "fenced block, an HTML comment, a \`<details>\` or a quote is"
              echo "simply not at the top. If yours is being refused, MOVE IT UP:"
              echo "only blank lines may precede it."
              echo "A head receipt names the reviewed commit. It stays valid for a"
              echo "later head when that head's diff against the base is the same"
              echo "change (the tree-diff hash), so a conflict-free rebase does not"
              echo "need a new receipt. Any real edit to the code does. A"
              echo "\`Drain-Review-Diff:\` receipt states that hash explicitly."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "scope guard: BLOCKED — no Drain-Review receipt for head ${HEAD_OID}${DIFF_KEY:+ / diff key ${DIFF_KEY}}"
            cat "$RUNNER_TEMP/receipt-why.txt" || true
            exit 1
          fi
          cat "$RUNNER_TEMP/receipt-why.txt" || true

          echo "scope guard: ${TOTAL} files, ${HIT_COUNT} release-critical, receipted"
          exit 0

# Honesty note
# ------------
# The review receipt is not a security boundary. The receipt lives in the PR
# BODY, which the PR author can edit, so an author who is also a trusted
# reviewer can stamp their own PR. That is not closed here, and deliberately:
# this repository has exactly one account with write access, so a rule of
# "stamper must differ from author" would be unsatisfiable — a wall, not a gate
# (hard rule 4: an executable gate needs an autonomous default). What the
# receipt DOES make impossible is the accident that happened: a BLOCK verdict
# cannot satisfy it, a receipt for a different change cannot satisfy it, and
# a verdict that was never published as a visible comment on
# this PR by a trusted author cannot satisfy it. The day a second writer exists,
# requiring a different author is a two-line change in
# scripts/drain_review_gate.py.
#
# The first version of this gate checked only that the cited comment EXISTED and
# came from a trusted author. Cross-family review 2026-09-26 got a receipt past
# it by citing an OWNER comment whose text was `VERDICT: BLOCK` for that exact
# head. Closed: the cited comment must itself attest APPROVE of this change —
# the current head, or an earlier commit whose tree-diff against the base is
# the same. A comment that approved different bytes cannot be re-cited, and
# that needs no clock. Binding the comment's `created_at` against the head
# commit's date was considered and rejected — commit dates come from the
# committer's clock, and a client clock running ahead would make the gate
# unsatisfiable until real time caught up.
#
# Each receipt is read ONLY at the TOP of its text, and that is the whole
# anti-hiding rule. Three review rounds attacked a markdown scanner that tried to
# work out what GitHub renders, and each round found defects in BOTH directions:
# approvals hidden in an HTML comment, a fence, a nested <details>, a lazily
# continued blockquote, a list-nested quote; and honest receipts wrongly refused
# after a heading, after a fence marker inside an HTML block, after a literal
# <!-- in a code example. Every fix created the next round's findings, which
# AGENTS.md calls a loop, and answers with: recurring findings in one area mean
# the shape is wrong, so redesign. Nothing can precede the first line of a
# document, so a position with nothing in front of it needs no renderer. The
# scanner is gone.
