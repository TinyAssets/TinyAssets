name: Live workload scratch proof
on:
  push:
    branches: [conv/llg-live]
  workflow_dispatch:
jobs:
  workload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare disposable host
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          sudo ip addr add 169.254.169.254/32 dev docker0
          cat > /tmp/live-like-metadata.py <<'PY'
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path != '/metadata/v1/id':
                      self.send_error(404)
                      return
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'123456789')

          ThreadingHTTPServer(('169.254.169.254', 80), Handler).serve_forever()
          PY
          sudo systemd-run --unit=tinyassets-live-like-metadata --property=Restart=on-failure /usr/bin/python3 /tmp/live-like-metadata.py
          if ! curl --noproxy '*' --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://169.254.169.254/metadata/v1/id; then
            sudo journalctl -u tinyassets-live-like-metadata --no-pager --lines 30
            ip addr show docker0
            sudo ss -lntp | head -30
            exit 1
          fi
          sudo groupadd -o -g 1001 tinyassets
          sudo groupadd -o -g 1100 ta-work
          sudo groupadd -o -g 1002 ta-broker
          sudo useradd -o -u 1001 -g 1001 -M -s /usr/sbin/nologin tinyassets
          sudo install -d /opt/tinyassets/deploy /opt/tinyassets-host-uptime /etc/tinyassets
          sudo ln -s "$GITHUB_WORKSPACE" /opt/tinyassets-host-uptime/current
          sudo cp deploy/tinyassets-backup.service deploy/tinyassets-backup.timer /etc/systemd/system/
          sudo systemctl daemon-reload
      - name: Resolve pre-cutover serving image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision="$(python scripts/deployed_sha.py --json | python -c 'import json,sys; print(json.load(sys.stdin)["deployed_sha"])')"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          for file in compose.yml vector.yaml vector-betterstack.yaml vector-entrypoint.sh install-tinyassets-env.sh; do
            git show "$revision:deploy/$file" | sudo tee "/opt/tinyassets/deploy/$file" >/dev/null
          done
          sudo cp /opt/tinyassets/deploy/compose.yml /opt/tinyassets/compose.yml
          sudo install -m 0755 /opt/tinyassets/deploy/install-tinyassets-env.sh /usr/local/sbin/tinyassets-env
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/tinyassets/tinyassets-daemon:${revision:0:12}"
          digest="$(docker buildx imagetools inspect "$image" | awk '/^Digest:/ {print $2; exit}')"
          test -n "$digest"
          echo "ref=ghcr.io/tinyassets/tinyassets-daemon@$digest" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Build fixture and make it live
        run: |
          sudo bash scripts/live_like/s3_remote.sh up
          sudo python3 scripts/live_like/fixture.py build --volume tinyassets-data
          printf 'TINYASSETS_IMAGE=%s\nCLOUDFLARE_TUNNEL_TOKEN=synthetic-invalid\nTINYASSETS_WIKI_CANARY_TOKEN=%s\nBACKUP_DEST=spaces:tinyassets-live-like/workflow-backups\n' '${{ steps.image.outputs.ref }}' "$(openssl rand -hex 32)" | sudo tee /etc/tinyassets/env >/dev/null
          sudo bash scripts/live_like/make_live.sh start '${{ steps.image.outputs.ref }}'
          ! sudo grep -q '^CLOUDFLARE_TUNNEL_TOKEN=' /etc/tinyassets/daemon.env
          sudo bash scripts/live_like/make_live.sh check
          for _ in $(seq 1 30); do
            test "$(docker inspect -f '{{.State.Health.Status}}' tinyassets-daemon)" = healthy && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' tinyassets-daemon)" = healthy
      - name: Restart the workload and prove it stays live
        run: |
          sudo bash scripts/live_like/make_live.sh stop
          sudo bash scripts/live_like/make_live.sh start '${{ steps.image.outputs.ref }}'
          sudo bash scripts/live_like/make_live.sh check
          for _ in $(seq 1 30); do
            test "$(docker inspect -f '{{.State.Health.Status}}' tinyassets-daemon)" = healthy && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' tinyassets-daemon)" = healthy
      - name: Diagnose failure
        if: failure()
        run: |
          docker ps -a
          docker logs tinyassets-daemon --tail 100 || true
          docker inspect --format '{{json .State.Health}}' tinyassets-daemon || true
          docker logs tinyassets-broker --tail 100 || true
          sudo journalctl -u tinyassets-backup.timer --no-pager --lines 50 || true
      - name: Stop disposable workload
        if: always()
        run: |
          sudo bash scripts/live_like/make_live.sh stop || true
          sudo bash scripts/live_like/s3_remote.sh down || true
