name: iOS signed release

# Produces a manually signed App Store .ipa. Uploading to App Store Connect is
# a separate, explicit dispatch choice; this workflow never submits a build for
# App Review. See docs/ops/app-store-launch.md.

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: App version (for example 1.0.0)
        required: true
        default: "1.0.1"
        type: string
      build_number:
        description: Numeric build number; blank uses this workflow run number
        required: false
        default: ""
        type: string
      upload_to_testflight:
        description: Upload the validated IPA to App Store Connect/TestFlight
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

env:
  BUNDLE_ID: io.tinyassets.app

jobs:
  build-signed-ipa:
    runs-on: macos-15
    environment: app-store
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Select App Store-required Xcode 26
        run: |
          set -euo pipefail
          developer_dir="/Applications/Xcode_26.3.app/Contents/Developer"
          test -d "$developer_dir" || {
            echo "::error::required Xcode 26.3 is not installed on the macos-15 runner"
            exit 1
          }
          sudo xcode-select -s "$developer_dir"
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          [[ "$sdk_version" == 26.* ]] || {
            echo "::error::App Store uploads require the iOS 26 SDK; selected $sdk_version"
            exit 1
          }
          xcodebuild -version

      - name: Install JS deps (lockfile-pinned)
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Add + sync iOS platform
        working-directory: mobile
        run: |
          npx --no-install cap add ios
          npx --no-install cap sync ios

      - name: Install native configuration and artwork
        working-directory: mobile
        run: |
          python3 scripts/add_ios_scheme.py
          python3 scripts/add_ios_assets.py
          grep -q "<string>tinyassets</string>" ios/App/App/Info.plist
          grep -q "<key>NSMicrophoneUsageDescription</key>" ios/App/App/Info.plist
          grep -q "<key>ITSAppUsesNonExemptEncryption</key>" ios/App/App/Info.plist

      - name: Import signing assets, archive, and export IPA
        id: archive
        working-directory: mobile/ios/App
        env:
          CERTIFICATE_P12_B64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_B64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          PROVISIONING_PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_B64 }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          for variable in CERTIFICATE_P12_B64 CERTIFICATE_PASSWORD PROVISIONING_PROFILE_B64; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::$variable is not set; see docs/ops/app-store-launch.md §3"
              exit 1
            fi
          done
          if ! [[ "$MARKETING_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::marketing_version must contain two or three numeric components"
            exit 1
          fi
          build_number="${REQUESTED_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"
          if ! [[ "$build_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::build_number must be a positive integer"
            exit 1
          fi

          signing_dir="$RUNNER_TEMP/tinyassets-ios-signing"
          output_dir="$RUNNER_TEMP/tinyassets-ios-output"
          keychain="$signing_dir/app-signing.keychain-db"
          profile="$signing_dir/app-store.mobileprovision"
          profile_plist="$signing_dir/profile.plist"
          archive="$signing_dir/TinyAssets.xcarchive"
          mkdir -p "$signing_dir" "$output_dir"
          chmod 700 "$signing_dir"
          keychain_password="$(openssl rand -hex 32)"

          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$signing_dir"
          }
          trap cleanup EXIT

          CERTIFICATE_OUT="$signing_dir/distribution.p12" PROFILE_OUT="$profile" \
            python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          for variable, output_variable in (
              ("CERTIFICATE_P12_B64", "CERTIFICATE_OUT"),
              ("PROVISIONING_PROFILE_B64", "PROFILE_OUT"),
          ):
              try:
                  decoded = base64.b64decode(os.environ[variable].strip(), validate=True)
              except (binascii.Error, ValueError) as exc:
                  raise SystemExit(f"::error::{variable} is not valid base64: {exc}")
              if not decoded:
                  raise SystemExit(f"::error::{variable} decoded to an empty file")
              Path(os.environ[output_variable]).write_bytes(decoded)
          PY
          chmod 600 "$signing_dir/distribution.p12" "$profile"

          security cms -D -i "$profile" > "$profile_plist"
          PROFILE_PLIST="$profile_plist" python3 - <<'PY'
          import datetime
          import os
          import plistlib

          with open(os.environ["PROFILE_PLIST"], "rb") as source:
              profile_data = plistlib.load(source)
          entitlements = profile_data.get("Entitlements", {})
          expiration = profile_data.get("ExpirationDate")
          now = datetime.datetime.now(datetime.UTC).replace(tzinfo=None)
          if not isinstance(expiration, datetime.datetime) or expiration <= now:
              raise SystemExit("::error::provisioning profile is expired or has no expiration")
          if profile_data.get("ProvisionedDevices"):
              raise SystemExit("::error::ad hoc/development profile supplied; App Store profile required")
          if profile_data.get("ProvisionsAllDevices"):
              raise SystemExit("::error::enterprise profile supplied; App Store profile required")
          if entitlements.get("get-task-allow"):
              raise SystemExit("::error::development provisioning profile supplied")
          if not entitlements.get("beta-reports-active"):
              raise SystemExit("::error::profile is not enabled for App Store Connect/TestFlight")
          PY
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          application_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          profile_bundle_id="${application_id#"$team_id."}"
          if [ "$profile_bundle_id" != "$BUNDLE_ID" ]; then
            echo "::error::profile bundle id is $profile_bundle_id, expected $BUNDLE_ID"
            exit 1
          fi

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/distribution.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          signing_identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Apple Distribution/ {print $2; exit}')"
          if [ -z "$signing_identity" ]; then
            echo "::error::the p12 contains no usable Apple Distribution signing identity"
            exit 1
          fi

          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          installed_profile="$profiles_dir/$profile_uuid.mobileprovision"
          cp "$profile" "$installed_profile"
          trap 'rm -f "$installed_profile"; cleanup' EXIT

          target=(-project App.xcodeproj)
          if [ -d App.xcworkspace ]; then target=(-workspace App.xcworkspace); fi
          xcodebuild \
            "${target[@]}" \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$build_number" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$team_id" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$signing_identity" \
            PROVISIONING_PROFILE_SPECIFIER="$profile_name" \
            archive | tail -60

          export_options="$signing_dir/ExportOptions.plist"
          TEAM_ID="$team_id" PROFILE_NAME="$profile_name" EXPORT_OPTIONS="$export_options" \
            python3 - <<'PY'
          import os
          import plistlib

          options = {
              "destination": "export",
              "manageAppVersionAndBuildNumber": False,
              "method": "app-store-connect",
              "provisioningProfiles": {"io.tinyassets.app": os.environ["PROFILE_NAME"]},
              "signingCertificate": "Apple Distribution",
              "signingStyle": "manual",
              "teamID": os.environ["TEAM_ID"],
              "uploadSymbols": True,
          }
          with open(os.environ["EXPORT_OPTIONS"], "wb") as output:
              plistlib.dump(options, output)
          PY
          xcodebuild -exportArchive \
            -archivePath "$archive" \
            -exportPath "$output_dir" \
            -exportOptionsPlist "$export_options" | tail -60

          ipa="$(find "$output_dir" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$ipa" ]; then
            echo "::error::xcodebuild exported no IPA"
            exit 1
          fi
          codesign --verify --deep --strict "$archive/Products/Applications/App.app"
          ipa_name="$(basename "$ipa")"
          (cd "$output_dir" && shasum -a 256 "$ipa_name" > SHA256SUMS)
          cat "$output_dir/SHA256SUMS"
          IPA="$ipa" VERSION="$MARKETING_VERSION" BUILD="$build_number" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "build": os.environ["BUILD"],
              "bundle_id": "io.tinyassets.app",
              "commit": os.environ["GITHUB_SHA"],
              "file": Path(os.environ["IPA"]).name,
              "version": os.environ["VERSION"],
          }
          Path(os.environ["IPA"]).with_name("release-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY
          echo "ipa_path=$ipa" >> "$GITHUB_OUTPUT"
          echo "artifact_name=tinyassets-ios-$MARKETING_VERSION-$build_number" >> "$GITHUB_OUTPUT"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.archive.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/tinyassets-ios-output/*.ipa
            ${{ runner.temp }}/tinyassets-ios-output/SHA256SUMS
            ${{ runner.temp }}/tinyassets-ios-output/release-manifest.json
          if-no-files-found: error
          retention-days: 14

  upload-testflight:
    if: ${{ inputs.upload_to_testflight }}
    needs: build-signed-ipa
    runs-on: macos-15
    environment: app-store
    permissions:
      contents: read
    steps:
      - name: Download signed IPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tinyassets-ios-*
          path: ${{ runner.temp }}/tinyassets-ios-upload
          merge-multiple: true

      - name: Validate and upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_B64 }}
        run: |
          set -euo pipefail
          for variable in API_KEY_ID API_ISSUER_ID API_KEY_B64; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::$variable is not set; see docs/ops/app-store-launch.md §3"
              exit 1
            fi
          done
          cd "$RUNNER_TEMP/tinyassets-ios-upload"
          shasum -a 256 -c SHA256SUMS
          ipa="$(find . -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$ipa" ]; then
            echo "::error::downloaded artifact contains no IPA"
            exit 1
          fi
          mkdir -p private_keys
          key="private_keys/AuthKey_$API_KEY_ID.p8"
          trap 'rm -rf private_keys' EXIT
          API_KEY_OUT="$key" python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          try:
              decoded = base64.b64decode(os.environ["API_KEY_B64"].strip(), validate=True)
          except (binascii.Error, ValueError) as exc:
              raise SystemExit(f"::error::API_KEY_B64 is not valid base64: {exc}")
          Path(os.environ["API_KEY_OUT"]).write_bytes(decoded)
          PY
          chmod 600 "$key"
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$key" || {
            echo "::error::decoded App Store Connect key is not a p8 private key"
            exit 1
          }
          xcrun altool --validate-app -f "$ipa" -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
          echo "Uploaded to App Store Connect for TestFlight processing."
          echo "This workflow does not select the build for a version or submit it for App Review."
