name: Docker build smoke

# Self-host migration Row A drift protection per
# docs/exec-plans/active/2026-04-20-selfhost-uptime-migration.md.
#
# Fires on any change that could plausibly break the Dockerfile build:
# the Dockerfile itself, .dockerignore, pyproject.toml (dep changes),
# tinyassets/** (source the builder stage installs), deploy/** (future
# Row C + D wiring). Manual dispatch for host-triggered re-verification.
#
# Intentionally NOT folded into tier3-oss-clone-nightly — that one runs
# at 07:17 UTC on a schedule. Dockerfile changes want push-triggered
# feedback, not overnight discovery.

on:
  push:
    # main only. Unfiltered, this fired on EVERY agent-branch push as well as
    # on that branch's PR: 68 push + 61 PR runs in one 4 h window on
    # 2026-09-27, while PR CI was starved of runners. The PR run already
    # covers a branch; this covers what lands.
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'tinyassets/**'
      - 'domains/**'
      - 'deploy/**'
      - 'tests/fixtures/docker_admitted_process.py'
      - 'tests/fixtures/docker_protocol_probe.py'
      - '.github/workflows/docker-build.yml'
  pull_request:
    # `ready_for_review` is NOT a default type, and the job below skips on a
    # draft; without it a PR marked ready keeps the draft run's skip until its
    # next push.
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'tinyassets/**'
      - 'domains/**'
      - 'deploy/**'
      - 'tests/fixtures/docker_admitted_process.py'
      - 'tests/fixtures/docker_protocol_probe.py'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smoke:
    # Drafts do not spend a runner here (this was the single largest
    # pull_request consumer measured 2026-10-03, median 11 min per run);
    # `ready_for_review` above runs it for real as soon as the PR is ready.
    # Not a branch-protection context, which is what makes skipping safe -- a
    # skipped job reports `conclusion=skipped` and branch protection accepts
    # that as satisfied (see tests.yml's note on `required-tests`).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        # Pin explicitly so the "MCP initialize smoke" step runs on a
        # known interpreter version instead of whatever the runner
        # happens to ship. Matches the Dockerfile's python:3.11-slim
        # base so builder + canary agree on syntax + stdlib behavior.
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build TinyAssets daemon image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: tinyassets-daemon:ci
          load: true                  # keep the image local for the run step
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Unmodified image refuses unadmitted startup
        run: |
          # No published port, credentials, mounted state or admission fixture.
          # Keep the exited container until logs and exit status are checked.
          docker run -d --network none \
              --name tinyassets-daemon-unadmitted-ci \
              -e TINYASSETS_IMAGE=tinyassets-daemon:ci \
              -e UNIVERSE_SERVER_DEV_USER=ci-smoke \
              tinyassets-daemon:ci
          EXIT_CODE="$(timeout 60 docker wait tinyassets-daemon-unadmitted-ci)"
          docker logs tinyassets-daemon-unadmitted-ci > "$RUNNER_TEMP/unadmitted.log" 2>&1
          cat "$RUNNER_TEMP/unadmitted.log"
          test "$EXIT_CODE" = 78
          grep -q 'platform_not_cloud' "$RUNNER_TEMP/unadmitted.log"
          if grep -q 'Uvicorn running on' "$RUNNER_TEMP/unadmitted.log"; then
            echo "::error::Unadmitted image started a listener"
            exit 1
          fi

      - name: Start isolated protocol fixture with simulated admission
        run: |
          # This is NOT cloud acceptance. The harness is test-only, excluded
          # from the image and mounted read-only. Production admission stays
          # unchanged; the previous step tests the unmodified image's refusal.
          # The daemon serves nobody anonymously: dev auth mode needs a named
          # local operator, and the smoke below probes as the canary principal
          # with a token minted here for this run only.
          CANARY_TOKEN="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::${CANARY_TOKEN}"
          echo "TINYASSETS_WIKI_CANARY_TOKEN=${CANARY_TOKEN}" >> "$GITHUB_ENV"
          docker run -d \
              --name tinyassets-daemon-ci \
              -p 127.0.0.1:8001:8001 \
              --mount "type=bind,src=${GITHUB_WORKSPACE}/tests/fixtures/docker_admitted_process.py,dst=/ci/admitted_process.py,readonly" \
              -e TINYASSETS_IMAGE=tinyassets-daemon:ci \
              -e UNIVERSE_SERVER_DEV_USER=ci-smoke \
              -e TINYASSETS_WIKI_CANARY_TOKEN="${CANARY_TOKEN}" \
              -e UNIVERSE_SERVER_URL=http://localhost:8001/mcp \
              tinyassets-daemon:ci python /ci/admitted_process.py

          # Give uvicorn + FastMCP a moment to bind. Poll rather than
          # sleep-blindly so slow cold-starts don't false-fail.
          for i in $(seq 1 30); do
            if curl -sS -o /dev/null -w "%{http_code}" \
                 -X POST http://localhost:8001/mcp \
                 -H "Content-Type: application/json" \
                 -H "Accept: application/json, text/event-stream" \
                 -d '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
                 | grep -qE '^(200|401)$'; then
              # 401 is the daemon answering its own auth challenge to an
              # anonymous initialize; that is reachability, not an error.
              echo "Daemon reachable after $i poll(s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Daemon never became reachable on port 8001"
          docker logs tinyassets-daemon-ci || true
          exit 1

      - name: MCP initialize smoke
        run: |
          # Full MCP handshake via the same canary script the live tray
          # uses. This checks the simulated-admission fixture's protocol,
          # not real cloud admission or live production acceptance.
          # The public canary deliberately pins production's AuthKit issuer.
          # This isolated fixture uses its local authorization server instead.
          # Its client retains all --assert-handles/auth/status checks, while
          # the real post-deploy canary keeps the production pin unchanged.
          python tests/fixtures/docker_protocol_probe.py

      - name: Container logs on success
        if: success()
        run: docker logs tinyassets-daemon-ci | tail -50 || true

      - name: Container logs on failure
        if: failure()
        run: |
          echo "::error::Docker build or smoke failed"
          docker logs tinyassets-daemon-ci 2>&1 || true
          docker logs tinyassets-daemon-unadmitted-ci 2>&1 || true
          docker ps -a || true

      - name: Stop container
        if: always()
        run: |
          docker rm -f tinyassets-daemon-ci tinyassets-daemon-unadmitted-ci || true
