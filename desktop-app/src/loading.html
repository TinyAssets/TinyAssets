<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinyAssets</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%;
      background: #0f1020; color: #e8e8ee;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1.1rem; padding: 2rem;
      text-align: center;
    }
    .mark { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.01em; }
    .sub { color: #9a9aa6; font-size: 0.95rem; max-width: 22rem; line-height: 1.5; }
    .spin {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid #2a2a35; border-top-color: #2d6cdf;
      animation: r 0.9s linear infinite;
    }
    @keyframes r { to { transform: rotate(360deg); } }
    .offline { display: none; color: #b3261e; }
    body.is-offline .spin { display: none; }
    body.is-offline .offline { display: block; }
  </style>
</head>
<body>
  <!--
    Native-shell fallback. In normal operation the Electron main process loads
    the live app from https://tinyassets.io/app (see config.js -> APP_URL),
    the same origin as the /mcp API + the WorkOS AuthKit sign-in, so the OAuth
    round-trip stays inside the window. This page shows only briefly while that
    loads, or if the device is offline. Mirrors mobile/www/index.html.
  -->
  <div class="wrap">
    <div class="spin" aria-hidden="true"></div>
    <div class="mark">TinyAssets</div>
    <div class="sub">Connecting to your command center&hellip;</div>
    <div class="sub offline">You appear to be offline. Reconnect and reopen the app.</div>
  </div>
  <script>
    // Main process passes ?offline=1 when a remote load failed.
    var params = new URLSearchParams(location.search);
    if (params.get('offline') === '1' || !navigator.onLine) {
      document.body.classList.add('is-offline');
    }
    window.addEventListener('offline', function () {
      document.body.classList.add('is-offline');
    });
  </script>
</body>
</html>
