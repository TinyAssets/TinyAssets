# TinyAssets daemon — Docker Compose for self-host deploys.
#
# Self-host migration Row D per
# openspec/specs/uptime-and-alarms/spec.md.
#
# Two services:
#   daemon      — the MCP server image (Row A Dockerfile, published to
#                 GHCR by Row I build-image.yml). Binds 127.0.0.1:8001.
#                 Reads on-disk state from a named volume mounted at
#                 /data, env-var driven per Row B data_dir() resolver.
#   cloudflared — tunnel sidecar exposing daemon at mcp.tinyassets.io
#                 (tunnel origin). Token read from env. Runs the
#                 official cloudflared image + the same run-tunnel.sh
#                 entrypoint used locally (Row C).
#
# The daemon does NOT publish 8001 to the host network; cloudflared
# reaches it via Docker's default bridge at daemon:8001. Only the
# loopback is exposed for host-side canary probes.
#
# Secrets: /etc/tinyassets/env is the interpolation source (`--env-file`);
# the daemon loads the rendered /etc/tinyassets/daemon.env, which is that file
# minus the platform's own secrets (see the daemon's env_file below). Never
# commit real values to this repo.
#
# Log forwarding uses Docker's asynchronous Fluent driver to a loopback-only
# Vector listener. No sidecar receives the Docker control socket.
x-tinyassets-log-forwarding: &tinyassets_log_forwarding
  driver: fluentd
  options:
    fluentd-address: "127.0.0.1:24224"
    fluentd-async: "true"
    tag: "{{.Name}}"

# Where the forwarded lines come to REST. Vector re-emits everything it receives
# on its own stdout (vector.yaml's always-on `console` sink), so whatever driver
# the `logs` container uses is the durable host-side copy of every other
# container's output.
#
# It was Docker's default driver — json-file, 10m x 3 per
# deploy/hetzner-bootstrap.sh — which lives in the CONTAINER's directory under
# /var/lib/docker/containers/<id>/ and is deleted with the container. This file
# and deploy/tinyassets-env.template both already claimed "logs are captured by
# journald"; they were not. deploy_fail_safe.sh force-recreates this service
# whenever a vector input changes, and a normal deploy recreates the daemon, so
# on 2026-09-26 the latency evidence for a live investigation was gone six
# minutes after the turns that produced it
# (found 2026-09-26; docs/ops/log-aggregation-runbook.md explains the layering).
#
# journald is the fix because its retention is a property of the HOST, not of
# any container: `journalctl CONTAINER_NAME=tinyassets-logs` reads across every
# past recreate, and the caps live in the drop-in the host-uptime installer
# manages (deploy/journald-tinyassets.conf). The explicit `tag` is what makes
# CONTAINER_TAG/SYSLOG_IDENTIFIER a stable name instead of a truncated
# container id that changes on every recreate.
x-tinyassets-log-retention: &tinyassets_log_retention
  driver: journald
  options:
    tag: "tinyassets-logs"

# Dev use:
#   # Render this compose against a local env file for smoke tests.
#   cp deploy/tinyassets-env.template /tmp/tinyassets-env
#   # ...fill in real values...
#   docker compose -f deploy/compose.yml --env-file /tmp/tinyassets-env up

services:
  daemon:
    # Required immutable image reference. Production writes a digest ref
    # resolved from the short-SHA tag emitted by build-image.yml.
    image: ${TINYASSETS_IMAGE:?Set TINYASSETS_IMAGE to an immutable ghcr.io/tinyassets/tinyassets-daemon@sha256:<digest> ref}
    container_name: tinyassets-daemon
    restart: unless-stopped
    logging: *tinyassets_log_forwarding
    # How long a stopping daemon may drain before SIGKILL. SHORT ON PURPOSE.
    #
    # Uvicorn closes its listener on SIGTERM, and nothing else can bind
    # 127.0.0.1:8001 until this container is gone, so the drain IS public 502.
    # 180s here (#4039) let one long codex turn hold production down from
    # 22:49:48Z to 22:53:04Z on 2026-10-01: the process blocked in lifespan
    # shutdown on the turn's worker thread until docker force-killed it
    # (docs/audits/2026-10-01-deploy-drain-repro/INCIDENT.md).
    #
    # The drain never saved the reply anyway: sse-starlette cancels the SSE
    # response as shutdown begins (docs/audits/2026-09-26-pr4039-drain-repro.py).
    # A turn cut off here is settled truthfully at the next boot by
    # tinyassets/agent_turn_reconcile.py.
    #
    # Compose stores this as the container's StopTimeout at CREATE time, so a
    # change here only binds containers created afterwards. deploy_fail_safe.sh
    # therefore also passes `up --timeout` explicitly, which binds the container
    # being replaced no matter what it was created with. That script refuses a
    # bundle whose value exceeds its MAX_DAEMON_STOP_GRACE_S, and
    # tests/test_deploy_drains_in_flight_turns.py keeps it above
    # universe_server.GRACEFUL_SHUTDOWN_S.
    stop_grace_period: 20s
    # Bound the daemon so a memory runaway kills the CONTAINER, not the host.
    #
    # `docker inspect` reported mem_limit=0 (2026-08-28): the daemon could consume the
    # whole box. That matters because a host OOM takes `tinyassets-tunnel` with it — the
    # public surface disappears — whereas a container OOM is contained.
    #
    # ### These values assume the 4 vCPU / 8 GB box. On the 2 GB box they protect nothing.
    #
    # That is not an oversight, it is the finding: the daemon cgroup has ALREADY peaked at
    # 1,480,417,280 bytes (1411.8 MiB), which is 69% of a 2 GB host. Any limit low enough
    # to protect that host is low enough to OOM-kill the daemon under load it has already
    # survived. **A 2 GB box cannot protect itself from this workload** — one more reason
    # the resize is not merely a throughput upgrade.
    #
    # 4g is 2.9x the observed peak and leaves about half of an 8 GiB host outside the
    # cgroup. My first attempt was 1400m, derived as `390 + 6*39*3` from per-process PSS —
    # 11.8 MiB BELOW that observed peak, and wrong in kind as well as degree: a cgroup's
    # `memory.max` also charges file cache and kernel memory, so a PSS sum cannot size it.
    # Provider and engine-MCP children inherit this cgroup (cgroup v2 counts descendants),
    # and production already runs two persistent engine-MCP children inside it.
    #
    # `memswap_limit` equal to `mem_limit` DISABLES container swap, making failure
    # deterministic. Without it Docker allows swap equal to the limit, so the container
    # could thrash through most of the host's 2 GB of swap while nominally respecting its
    # RAM ceiling. Production already showed ~152 MiB of charged container swap.
    #
    # Caveat worth knowing when this fires: the cgroup reports `memory.oom.group=0`, so
    # the kernel may kill only the allocating child rather than the container. Then
    # `restart: unless-stopped` does NOT fire — the daemon survives and that one turn
    # fails. Containment, not automatic recovery.
    mem_limit: 4g
    memswap_limit: 4g
    # Owner box (ADR-022): the daemon is unprivileged from its first
    # instruction. Owner code never runs in this container; it runs in the
    # owner's gVisor box under boxhostd on the host, reached through the
    # bootstrap socket mounted read-only below. The credential broker is its
    # own service (uid 1002). No capability, no unconfined profile, no
    # privilege escalation anywhere in the daemon.
    security_opt:
      - no-new-privileges=true
    user: "1001:1001"
    # 1100 work, 1101 broker IPC, 1102 broker-readable platform files.
    group_add: ["1100", "1101", "1102"]
    cap_drop:
      - ALL
    # Image CMD runs /usr/local/libexec/ta-box-entry.py, which admits only a
    # committed owner-box layout and execs the unprivileged frontend.
    # Expose loopback only; cloudflared reaches via Docker network.
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      HOME: /home/tinyassets
      TINYASSETS_DATA_DIR: /data
      # No model login or key lives at the platform level (AGENTS.md Hard Rule
      # 15). Each universe's provider child gets its own CLI home from that
      # universe's credentials (tinyassets/providers/base.py
      # subprocess_env_for_provider); the daemon process has none to share.
      # Shared community-pool directory on the durable volume. No in-process
      # reader remains after the goal-pool producer was removed.
      TINYASSETS_REPO_ROOT: /data/community-pool
      TINYASSETS_CLOUD_DAEMON_SUBSCRIPTION_ONLY: "1"
      # Coding-lane eval gates (S2 output-rubric + S3 trajectory) — ENFORCE.
      # Host-approved flip 2026-06-25: the auto-ship MCP action
      # (validate_ship_packet) now BLOCKS on a conclusive rubric/trajectory FAIL
      # instead of warn-only. Both default `warn` in code; set here to make
      # enforce the deployed default. NOT exercised by the autonomous loop — only
      # by explicit ship-validation calls — so the flip cannot wedge the loop.
      # Rollback: set to "warn" (or revert this line) + recreate the daemon.
      TINYASSETS_AUTO_SHIP_RUBRIC_MODE: "enforce"
      TINYASSETS_AUTO_SHIP_TRAJECTORY_MODE: "enforce"
      # Pass through anything in the env file.
      TINYASSETS_MCP_CANARY_URL: ${TINYASSETS_MCP_CANARY_URL:-https://tinyassets.io/mcp}
      # MVP go-live (founder directive 2026-08-20): un-dark the two surfaces the
      # onboarding funnel needs — the daemon-served onboarding SPA at /app, and
      # claude serving so the universe answers on the founder's deposited subscription.
      # Baked here (compose `environment` wins over the env_file) so they ship with
      # the deploy — no droplet SSH / env-file edit needed. Inbound webhook + outbound
      # http connections stay DARK (not needed for the deposit→chat onboarding; their
      # deep hardening is post-live per AGENTS.md § Review sequencing).
      TINYASSETS_ONBOARDING_APP: "1"
    # NOT /etc/tinyassets/env. That file is the box's whole secret store and
    # this file's interpolation source (`--env-file`): the tunnel token, the
    # log-shipping token and an account-wide DigitalOcean token have all lived
    # there, and the daemon read every one of them and handed them to its engine
    # MCP children. daemon.env is the same file with those removed, rendered by
    # deploy/install-tinyassets-env.sh on every write to the source;
    # deploy_fail_safe.sh refuses a bundle that wires the source back in and a
    # running daemon that holds any of them
    # (docs/concerns/2026-10-02-platform-secrets-in-daemon-env.md).
    env_file:
      - /etc/tinyassets/daemon.env
      - /etc/tinyassets/agent-interchange.env
      - /etc/tinyassets/request-idempotency.env
      - /etc/tinyassets/app-ingress.env
    volumes:
      - tinyassets-data:/data
      # boxhostd's bootstrap and admission sockets; the daemon only connects.
      - /run/tinyassets-boxhostd:/run/tinyassets-boxhostd:ro
    healthcheck:
      # Liveness from release facts as the canary service principal. The token
      # is installed in /etc/tinyassets/env by deploy-prod before compose starts;
      # the tool surface is proved separately by the full authenticated probes.
      # The container is already uid 1001 with no capability, so the probe is
      # the canary itself.
      test: [CMD, /opt/venv/bin/python, /app/scripts/mcp_public_canary.py,
             --pulse-only, --url, "http://127.0.0.1:8001/mcp", --timeout, "10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    depends_on:
      broker:
        condition: service_started
    labels:
      org.tinyassets.component: daemon
      org.tinyassets.role: mcp-server

  broker:
    # The credential broker: the one process that holds connection secrets
    # and the owner-box egress floor. Same immutable image, its own identity.
    image: ${TINYASSETS_IMAGE:?Set immutable TINYASSETS_IMAGE}
    container_name: tinyassets-broker
    user: "1002:1002"
    group_add: ["1102"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges=true"]
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    entrypoint: [/opt/venv/bin/python, -I, -B, /app/broker_main.py]
    command: [--socket, /run/tinyassets-boxhostd/broker/broker.sock,
              --state, /data/.broker/state, --data-root, /data,
              --owner-uid, "1001", --box-host]
    volumes:
      - tinyassets-data:/data
      # Separate broker-only keys. Never included in data-volume backups.
      - tinyassets-browser-keys:/var/lib/ta-broker
      - /run/tinyassets-boxhostd:/run/tinyassets-boxhostd
    logging: *tinyassets_log_forwarding
    labels:
      org.tinyassets.component: broker
      org.tinyassets.role: credential-broker

  cloudflared:
    # Official image, pinned to a known-stable tag + digest. Bump by
    # hand after testing on a staging box.
    image: cloudflare/cloudflared:2026.3.0@sha256:6b599ca3e974349ead3286d178da61d291961182ec3fe9c505e1dd02c8ac31b0
    container_name: tinyassets-tunnel
    restart: unless-stopped
    logging: *tinyassets_log_forwarding
    # cloudflared runs in host network namespace so that the tunnel's
    # dashboard-configured ingress rule `http://localhost:8001` resolves
    # to the daemon's loopback-published port (127.0.0.1:8001 on the
    # Droplet host). Without this, "localhost" inside the cloudflared
    # container is the container's own loopback — not the daemon.
    # Long-term cleaner fix: edit the tunnel ingress rule in Cloudflare
    # Zero Trust dashboard to point at `http://daemon:8001` (Docker
    # service name), then drop network_mode: host.
    network_mode: host
    # Tunnel token auth (shape A per Row C).
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      daemon:
        condition: service_healthy
    labels:
      org.tinyassets.component: tunnel
      org.tinyassets.role: cloudflare-ingress

  # Row K — log aggregation sidecar. Receives daemon, tunnel, and worker
  # stdout through Docker's asynchronous Fluent logging driver. The listener
  # is host-loopback-only and Vector has no Docker control socket. Ships to Better Stack when
  # BETTERSTACK_SOURCE_TOKEN is set in /etc/tinyassets/env; with or without the
  # token, Vector's own console sink puts every line in the host journal via the
  # `logging` block below — `docker compose up -d` detaches, so a container's
  # stdout goes to its logging driver and never to the systemd unit that ran
  # compose. That is the correction: this comment used to say "compose stdout
  # (journald)", which is not a thing a detached container has.
  #
  # vector-entrypoint.sh builds /run/vector-config/ at startup:
  #   - vector.yaml always loaded (sources + transforms + stdout)
  #   - vector-betterstack.yaml loaded only when token is non-empty
  # This prevents 401 error noise when the token is unset.
  logs:
    image: timberio/vector:0.40.0-alpine@sha256:7a81fdd62e056321055a9e4bdec4073d752ecf68f4c192e676b85001721523c2
    container_name: tinyassets-logs
    restart: unless-stopped
    # NOT the forwarding anchor — this container is where the forwarded lines
    # land, so pointing it at its own fluent listener would be a loop. See the
    # x-tinyassets-log-retention comment at the top of this file.
    logging: *tinyassets_log_retention
    environment:
      BETTERSTACK_SOURCE_TOKEN: ${BETTERSTACK_SOURCE_TOKEN:-}
    ports:
      - "127.0.0.1:24224:24224"
    entrypoint: ["/bin/sh", "/etc/vector/vector-entrypoint.sh"]
    volumes:
      - /opt/tinyassets/deploy/vector.yaml:/etc/vector/vector.yaml:ro
      - /opt/tinyassets/deploy/vector-betterstack.yaml:/etc/vector/vector-betterstack.yaml:ro
      - /opt/tinyassets/deploy/vector-entrypoint.sh:/etc/vector/vector-entrypoint.sh:ro
    depends_on:
      - daemon
    labels:
      org.tinyassets.component: logs
      org.tinyassets.role: log-forwarder

volumes:
  tinyassets-browser-keys:
    name: tinyassets-browser-keys
  tinyassets-data:
    name: tinyassets-data
    # Local named volume backed by Docker's default driver. Backups
    # (Row J) snapshot this to Hetzner Storage Box.

networks:
  default:
    name: tinyassets-net
    # Default bridge; cloudflared reaches daemon via `daemon:8001`.
