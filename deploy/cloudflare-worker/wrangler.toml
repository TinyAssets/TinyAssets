# wrangler.toml — Cloudflare Worker config for the tinyassets.io/mcp
# path-based router.
#
# Deploy targets:
#   zone: tinyassets.io
#   routes: tinyassets.io/mcp*  (canonical /mcp proxy plus retired-path guard)
#           tinyassets.io/app*  (the web app; siblings handed to the website)
#
# Reference: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "tinyassets-mcp-proxy"
main = "worker.js"

# Pin the compat date so upstream runtime changes don't silently alter
# behavior. Bump this knowingly when a new Worker feature is needed.
compatibility_date = "2025-10-01"

# nodejs_compat isn't needed for this Worker — we only use the Fetch
# API + URL + Headers + Response primitives. Keeping it off keeps the
# bundle small + avoids tree-shake surprises.
compatibility_flags = []

# Routes — two public path families reach the daemon through this Worker.
#
#   tinyassets.io/mcp*  the MCP connector endpoint (Hard Rule 11 canonical URL)
#                       plus the retired /mcp-directory* variants, which
#                       worker.js terminates as ordinary 404s. Narrowing this
#                       binding would leak stale calls to the website origin and
#                       make rejection method-dependent.
#   tinyassets.io/app*  the web app -- shell, API subtree, and the
#                       QUERY-BEARING returns (2026-09-30 move off /mcp/app).
#                       The SPA and its API now live in the apex /app subtree,
#                       so the Worker must bind it or the apex website origin
#                       answers and the app is dark. This route is the infra
#                       half of the move: without it the daemon's /app routes
#                       are unreachable from the public URL.
#
#                       It MUST be the suffix wildcard, not an exact
#                       `tinyassets.io/app` plus `tinyassets.io/app/*`. A
#                       Cloudflare route is matched against the ENTIRE URL
#                       INCLUDING THE QUERY STRING, so an exact `/app` route
#                       matches only a bare `/app` -- and the two URLs that
#                       carry the whole sign-in and billing flow,
#                       `/app?code=...&state=...` (AuthKit return, built at
#                       tinyassets/onboarding/app.html `redirectUri()`) and
#                       `/app?subscribed=1` (Stripe return), would match
#                       NOTHING and land on the website origin. Caught by a
#                       gpt-6-astra review round, 2026-09-29.
#
#                       The cost of the wildcard: `*` matches any character,
#                       not a path segment, so this binding also captures apex
#                       assets whose path merely STARTS with "app" --
#                       `/apple-touch-icon.png` is one the site really serves.
#                       worker.js `belongsToWebsite` hands exactly those back
#                       to the website origin, so widening the route does not
#                       take the site's paths away. Do not narrow this route
#                       without re-proving the callback URLs.
#
# Cloudflare route syntax uses `*` as a match-any wildcard (zero or more of ANY
# character -- it does not respect path-segment or label boundaries).
# Zone name must match the Cloudflare zone that owns tinyassets.io.
# Reference: https://developers.cloudflare.com/workers/configuration/routing/routes/
routes = [
    { pattern = "tinyassets.io/mcp*", zone_name = "tinyassets.io" },
    { pattern = "tinyassets.io/app*", zone_name = "tinyassets.io" },
    { pattern = "tinyassets.io/api/v1/*", zone_name = "tinyassets.io" },
]

# Observability — enable request logs so post-P0 debugging has a trail.
# Tail via `wrangler tail`. Costs negligible at our request volume.
[observability]
enabled = true
head_sampling_rate = 1.0

# No bindings (KV, D1, Queues) — this Worker is a pure proxy.
# Secrets (set via dashboard or wrangler secret put, NOT committed here):
#   CF_ACCESS_CLIENT_ID     — CF Access service-token client ID
#   CF_ACCESS_CLIENT_SECRET — CF Access service-token client secret
# These let the Worker reach the Access-gated mcp.tinyassets.io tunnel origin.

# Local dev:
#   wrangler dev --local
# Deploy:
#   wrangler login
#   wrangler deploy
# Tail logs:
#   wrangler tail
