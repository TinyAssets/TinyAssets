# Transitional recovery override for retire-cheat-loop task 2.1.
#
# Every receipt-capable container must be created with restart policy "no"
# before an unsafe-fence recovery exposes them to traffic. The public canaries
# and exact-fleet proof run while this override is active. Finalization restores
# the policies recorded by the original fenced generation and proves each
# read-back before restoring systemd activators.
#
# The four `worker*` entries were removed 2026-08-29 with the host-run fleet
# (nothing runs outside a user's universe -- ADR-009). An override MUST NOT name
# a service absent from compose.yml: `-f compose.yml -f this` would then declare
# an imageless service and fail the whole project. Keep this set == compose.yml.
services:
  daemon:
    restart: "no"
  cloudflared:
    restart: "no"
  logs:
    restart: "no"
