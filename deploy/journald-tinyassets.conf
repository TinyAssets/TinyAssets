#  journald drop-in installed at /etc/systemd/journald.conf.d/ by
#  deploy/install-host-uptime-services.sh.
#
#  The journal is the durable home for container output: compose.yml points the
#  `logs` (Vector) container at the journald driver, and Vector re-emits every
#  forwarded daemon / tunnel line on its stdout. So this file is
#  what decides how much operational evidence survives a deploy, and it is the
#  only reason the journald driver is safe to point a chatty container at.
#
#  Storage=persistent, not the `auto` default. `auto` writes to /var/log/journal
#  only if that directory already exists, and falls back to /run/log/journal
#  (tmpfs) otherwise — which loses everything on reboot, silently, with no error
#  anywhere. `persistent` makes journald create /var/log/journal itself, with the
#  ownership it wants, so the installer does not pre-make the directory: it
#  restarts journald, which is when this takes effect.
#
#  SystemMaxUse caps total journal bytes. Left at journald's default it is 10%
#  of /var's filesystem, and the droplet's disk is also where Docker images, the
#  data volume and /tmp backup tarballs live. disk_watch.py alerts on that
#  filesystem at 80% (scripts/disk_watch.py). disk_autoprune starts at 85%
#  (DISK_AUTOPRUNE_PCT in scripts/daemon_image_retention.py). The verified
#  production filesystem is /dev/vda1, ext4, 49 GiB, 40% used on 2026-10-01
#  (docs/concerns/2026-10-01-no-per-universe-disk-budget-in-jails.md). Vector's
#  console sink is JSON, so a forwarded line costs more bytes here than it did
#  as raw stdout, and journald compresses but does not deduplicate.
#
#  A sustained 100 KiB/s for 3 days is about 25 GiB. Adding that on top of the
#  40% already used would pass 90% of 49 GiB, beyond the 80% alarm and the 85%
#  prune. 12G is the cap that still leaves headroom: growing the journal from
#  empty on top of that 40% lands near 65%, about fifteen points under the
#  alarm, with room for images and data growth since the reading. SystemKeepFree
#  stays 2G so the journal still yields disk to the daemon.
#
#  MaxRetentionSec is a MAXIMUM AGE, not a minimum retention guarantee. It causes
#  journald to discard entries older than 30 days; it does NOT promise 30 days are
#  present, because SystemMaxUse and SystemKeepFree evict independently and
#  whichever bound is reached first wins. An earlier version of this comment
#  claimed it stopped a noisy hour from shrinking the window, which is backwards
#  (cross-family review, output/codex-log-durability-review.md §7).
#
#  So the honest statement of the window is: **at most 30 days, and at most 12 GiB,
#  whichever runs out first.** At a sustained 100 KiB/s of stored journal that
#  12 GiB is about 35 hours. A reader can ask for 3 days and receive less. That
#  is a limit of the disk, visible as the byte cap, rather than a promise this
#  file cannot keep. If a later disk reading shows more free space under the
#  80% alarm, SystemMaxUse is the knob -- raise it here and nowhere else, since
#  the installer reverts host edits. Do not raise it onto the alarm.
#
#  SystemKeepFree is journald's own floor, and it is the one setting here that
#  protects something other than the logs: the journal yields disk to the daemon
#  rather than the reverse.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=12G
SystemKeepFree=2G
MaxRetentionSec=30day
# One file per day keeps vacuuming granular: journald deletes whole files, so a
# single huge file would drop a fortnight of history at once when a cap is hit.
MaxFileSec=1day
# Rate limiting is journald's protection against a log storm, but it DROPS
# messages to get it, and a dropped message during an incident is the exact
# evidence this change exists to keep.
#
# Disabling it entirely was too blunt, and the stated reason was wrong: the first
# version of this comment claimed "the Docker driver already gates volume at the
# container", and no such limit is configured anywhere (cross-family review,
# output/codex-log-durability-review.md §7). SystemMaxUse bounds DISK, which is not
# the same as bounding write and compression throughput during a storm.
#
# So: a deliberately generous ceiling rather than none. 100k messages per 30s is
# ~3,300/s sustained, orders of magnitude above anything this daemon has produced,
# and still finite if a loop starts screaming. A storm that reaches it leaves
# journald's own "Suppressed N messages" marker in the journal, so the loss is
# recorded rather than silent -- which is the property actually wanted here.
RateLimitIntervalSec=30s
RateLimitBurst=100000
