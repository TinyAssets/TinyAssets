<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TinyAssets</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: #0b0b0f; color: #e8e8ee;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
      min-height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1.1rem; padding: 2rem;
      text-align: center;
    }
    .mark { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.01em; }
    .sub { color: #9a9aa6; font-size: 0.95rem; max-width: 22rem; line-height: 1.5; }
    .retry {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; padding: 0.75rem 1.5rem; border-radius: 0.75rem;
      background: #2d6cdf; color: #fff; font-weight: 600; text-decoration: none;
    }
    .retry:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <!--
    This bundled page is a native-shell fallback. In normal operation Capacitor
    loads the live app from https://tinyassets.io/app (see capacitor.config.json
    -> server.url), which is the same origin as the /mcp API + the AuthKit sign-in,
    so the OAuth round-trip stays inside the WebView. server.errorPath shows this
    page when loading fails. A normal same-window link retries the live app;
    reloading here would only reload the bundled page. No native plugin is needed.
  -->
  <div class="wrap">
    <div class="mark">TinyAssets</div>
    <div class="sub">Can&rsquo;t connect to your command center. Check your connection and try again.</div>
    <a class="retry" href="https://tinyassets.io/app">Try again</a>
  </div>
</body>
</html>
