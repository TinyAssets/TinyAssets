version: 0.1
ios_test_host: default
phases:
  test:
    commands:
      - >-
        python3 "$DEVICEFARM_TEST_PACKAGE_PATH/review_xctest.py"
        --xctestrun "$DEVICEFARM_XCUITESTRUN_FILE"
        --destination "platform=iOS,id=$DEVICEFARM_DEVICE_UDID"
        --output "$DEVICEFARM_LOG_DIR/review"
artifacts:
  - $DEVICEFARM_LOG_DIR/review
