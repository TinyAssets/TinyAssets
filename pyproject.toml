[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinyassets"
version = "0.1.0"
description = "Goal-agnostic daemon engine. Bind it to a domain and let it run. MCP interface for any chatbot."
requires-python = ">=3.11"
authors = [
    {name = "Jonathan Farnsworth", email = "jonathan.m.farnsworth@gmail.com"}
]
dependencies = [
    # Core orchestration
    "langgraph>=0.4,<0.5",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "langchain-core>=0.3,<0.4",

    # Vector & KG storage
    "lancedb>=0.15,<1.0",
    "igraph>=0.11,<1.0",

    # Symbolic solving & planning
    "clingo>=5.7,<6.0",

    # Desktop app
    "pystray>=0.19,<1.0",
    "pillow>=10.0",

    # NLP (entity extraction, coreference)
    "spacy>=3.7,<4.0",

    # Async file I/O
    "aiofiles>=24.1",

    # Robust JSON parsing for LLM output
    "json-repair>=0.30",
    # RFC 8785/JCS body binding for durable request idempotency.
    "rfc8785>=0.1.4,<0.2",

    # Retry with backoff for provider calls
    "tenacity>=9.0,<10.0",

    # Imported directly by constraints/, knowledge/ and planning/ modules. It has
    # only ever resolved transitively (via langgraph/pydantic), so a minimal install
    # — the CI vault smoke, and any tier-3 `git clone` + `pip install -e .` — fails
    # with ModuleNotFoundError. Declare what we actually import.
    "typing-extensions>=4.0",

    # workspace_provision parses requirement records with the same library the index
    # and pip use, so admission cannot disagree with the installer about what a line
    # means. Transitive today (via langchain/pip's vendor tree); declared for the same
    # reason as typing-extensions above.
    "packaging>=23.0",

    # MCP/server entry points and Tier-3 structural smoke imports.
    #
    # The <4 bound is LOAD-BEARING, not tidiness. fastmcp 4.0.0 (with mcp
    # 2.1.1) dropped `request_ctx` from `mcp.server.lowlevel.server`, which
    # `tinyassets/auth/middleware.py` and `tinyassets/universe_server.py`
    # import to reach the live request. On 2026-08-31 CI resolved the new
    # major on its own and 7 tests failed with ImportError, reddening
    # `required-tests` for every open PR at once. Production runs 3.4.7 and was
    # unaffected -- but a container rebuild would have taken the PUBLIC MCP
    # connector down with it (Hard Rule 11), which is the real reason this is
    # pinned rather than chased.
    #
    # The plugin runtime already carried `>=3.2,<4`; this is the canonical
    # package catching up, and tests/test_fastmcp_pin_matches_runtime.py keeps
    # the two from drifting again. Upgrading to 4.x is its own lane: port the
    # `request_ctx` call sites first, then move both bounds together.
    "fastmcp>=3.2,<4",
    "uvicorn[standard]>=0.30",
    # OAuth 2.1 Resource Server: validate WorkOS AuthKit bearer JWTs (PyJWT + JWKS).
    # The [crypto] extra pulls cryptography for RS256 signature verification.
    "pyjwt[crypto]>=2.8,<3.0",
]

[project.scripts]
tinyassets-cli = "tinyassets.__main__:main"
tinyassets-mcp = "tinyassets.mcp_server:main"
tinyassets-universe-server = "tinyassets.universe_server:main"
tinyassets-probe = "tinyassets.probe:entry_point"

[project.gui-scripts]
tinyassets = "tinyassets.desktop.launcher:main"

# Domain discovery entry-point group (Task #22 / modularity §3.2).
# Each built-in or third-party domain declares itself here as
# name = "module.path:ClassName". Discovered at runtime by
# tinyassets.discovery.discover_domains() — pip-installed packages
# surface via this table without needing to sit inside the repo tree.
[project.entry-points."tinyassets.domains"]
fantasy_daemon = "domains.fantasy_daemon.skill:FantasyAuthorDomain"
research_probe = "domains.research_probe.skill:ResearchProbeDomain"

[project.optional-dependencies]
# Real-browser proofs (tests marked real_browser); installed by
# .github/workflows/real-browser-proof.yml. Also the custom-UI preview's
# headless browser in the daemon image (tinyassets/ui_preview.py, Dockerfile).
# Pinned so its browser cache key holds, and because the exact Playwright
# version decides which Chromium build the image downloads.
browser = [
    "playwright==1.58.0",
]
desktop = [
    "Pillow>=10.0",
    "pystray>=0.19",
    "keyring>=25.0,<26.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Required by the `required-tests` CI gate (scripts/ci_required_tests.py).
    # Declared here rather than pip-installed ad hoc in the workflow so the
    # gate's own dependency is pinned and reproducible locally.
    "pytest-xdist>=3.5",
    # tests/test_tests_workflow.py imports yaml hard (no skipif) because its
    # invariants guard against silent CI failures, and skipping is itself a
    # silent failure. Available transitively today; declared so it stays so.
    "pyyaml>=6.0",
    "ruff>=0.5",
    "pytest-cov>=5.0",
    "httpx>=0.24",
    "fastapi>=0.115",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
mcp = [
    # Same bound as the core dependency above, deliberately. See the comment
    # there: fastmcp 4.x removes an import three modules depend on.
    "fastmcp>=3.2,<4",
]
scientific = [
    "scikit-learn>=1.3",
    "scipy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["fantasy_author", "tinyassets", "domains"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Embeds JavaScript DOM-scanning strings (regexes, selectors) that can't
# be reflowed without breaking the JS. Plus a PowerShell one-liner in the
# module docstring that users copy-paste verbatim.
"scripts/claude_chat.py" = ["E501"]
# The sandboxed UI bootstrap is one fixed HTML/JS document served verbatim;
# reflowing its JavaScript to satisfy a Python line length changes the document.
"tinyassets/onboarding/ui_frame.py" = ["E501"]
"packaging/claude-plugin/plugins/tinyassets-universe-server/runtime/tinyassets/onboarding/ui_frame.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: stress/race tests; opt-in via `pytest -m slow`",
    "real_jail: needs a real bubblewrap jail; run by .github/workflows/linux-jail-proof.yml, which fails on any skip",
    "real_browser: needs a real Chromium; run by .github/workflows/real-browser-proof.yml, which fails on any skip",
]
